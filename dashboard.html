<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan's ACT Progress Dashboard</title>
<style>
  :root {
    --navy: #1F4E78; --navy-dark: #14344f; --green: #1a7f4e; --red: #b3261e;
    --bg: #f4f6f9; --card: #ffffff; --border: #d9e0e8; --text: #1c2733; --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; }
  header { padding: 20px 4px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.88rem; }
  #refreshBtn { background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

  #gate { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  #gate .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 10px rgba(20,52,79,0.08); }
  #gate h2 { margin: 0 0 12px; color: var(--navy-dark); font-size: 1.1rem; }
  #gate input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  #gate button { background: var(--navy); color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  #gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }

  #app { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 1.02rem; color: var(--navy-dark); }

  .filterRow { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filterRow button { background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-size: 0.82rem; cursor: pointer; }
  .filterRow button.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 120px; background: #fbfbfd; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .num { font-size: 1.6rem; font-weight: 700; color: var(--navy-dark); }
  .stat-box .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .name { flex: 0 0 42%; }
  .cat-row .bar-wrap { flex: 1; margin: 0 10px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-row .bar { height: 100%; }
  .cat-row .bar.weak { background: var(--red); }
  .cat-row .bar.mid { background: #d9a441; }
  .cat-row .bar.strong { background: var(--green); }
  .cat-row .pct { width: 70px; text-align: right; color: var(--muted); font-size: 0.82rem; }

  table.sessions { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.sessions th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.sessions td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
  table.sessions tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .pill.good { background: #eaf7ef; color: var(--green); }
  .pill.mid { background: #fdf4e3; color: #8a6300; }
  .pill.bad { background: #fbeceb; color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.92rem; }
  .errBox { background: #fbeceb; border: 1px solid #f0c6c3; color: var(--red); padding: 12px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 10px; }

  .missed-summary { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .missed-item { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .missed-head { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer; background: #fbfbfd; }
  .missed-head:hover { background: #f3f6fa; }
  .missed-head .chip { flex: 0 0 auto; background: #eaf0f7; color: var(--navy-dark); font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .missed-head .stem { flex: 1; font-size: 0.87rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .missed-head .meta { flex: 0 0 auto; font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
  .missed-head .caret { flex: 0 0 auto; color: var(--muted); font-size: 0.8rem; transition: transform 0.15s; }
  .missed-item.open .caret { transform: rotate(90deg); }
  .missed-body { display: none; padding: 4px 14px 16px; border-top: 1px solid var(--border); }
  .missed-item.open .missed-body { display: block; }
  .missed-passage { font-size: 0.95rem; line-height: 1.6; margin: 12px 0; }
  .missed-passage u { text-decoration: underline; text-decoration-color: var(--navy); text-decoration-thickness: 2px; }
  .missed-qstem { font-weight: 600; font-size: 0.9rem; margin-bottom: 10px; }
  .missed-choice { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 6px; font-size: 0.87rem; margin-bottom: 4px; background: #fff; border: 1px solid var(--border); }
  .missed-choice .ltr { font-weight: 700; color: var(--muted); }
  .missed-choice.her-pick { border-color: var(--red); background: #fbeceb; }
  .missed-choice.her-pick .ltr { color: var(--red); }
  .missed-choice.right-answer { border-color: var(--green); background: #eaf7ef; }
  .missed-choice.right-answer .ltr { color: var(--green); }
  .missed-choice .tag { margin-left: auto; font-size: 0.72rem; font-weight: 600; }
  .missed-choice.her-pick .tag { color: var(--red); }
  .missed-choice.right-answer .tag { color: var(--green); }
  .missed-explain { font-size: 0.87rem; line-height: 1.55; margin: 12px 0 8px; }
  .missed-trick { background: #fff; border-left: 3px solid var(--navy); border-radius: 6px; padding: 9px 12px; font-size: 0.85rem; line-height: 1.5; margin-bottom: 4px; }
  .missed-trick b { color: var(--navy-dark); }
  .showMoreBtn { display: block; width: 100%; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 9px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Jordan's Progress Dashboard</h2>
    <input id="pwInput" type="password" placeholder="Enter passcode" autocomplete="off">
    <button onclick="checkPasscode()">Enter</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <div>
      <h1>Jordan's ACT English Progress</h1>
      <p id="lastUpdated">Loading...</p>
    </div>
    <button id="refreshBtn" onclick="loadData()">↻ Refresh</button>
  </header>

  <div id="content">
    <div class="loading">Loading progress data…</div>
  </div>
</div>

<script>
const PASSCODE = "JORDANPROGRESS26";
const FIREBASE_CONFIG = {"apiKey": "AIzaSyAUJp7K6uChE69XE0W7rWs2l8EPtzi036A", "authDomain": "jordan-act-drills.firebaseapp.com", "projectId": "jordan-act-drills", "storageBucket": "jordan-act-drills.firebasestorage.app", "messagingSenderId": "1016838779694", "appId": "1:1016838779694:web:929aaef91b54315bca80bf"};
const FIREBASE_CONFIGURED = true;
const ATTEMPTS_COLLECTION = "attempts";
const CONCEPT_ORDER = ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation", "Style & Tone", "Word Choice & Precision", "Concision & Redundancy", "Organization & Development", "Transitions"];
const ALL_QUESTIONS = [{"id": "NB-GU-1", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The array of radio telescopes scattered across the desert <u>collect</u> faint signals from distant galaxies every night.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "collects"}, {"letter": "C", "text": "are collecting"}, {"letter": "D", "text": "collecting"}], "correctLetter": "B", "explanation": "The true subject of the verb is 'array' (singular); the phrase 'of radio telescopes' and the participial phrase 'scattered across the desert' sit between the subject and verb and don't affect agreement. A singular subject needs the singular verb 'collects,' so (B) is correct. (A) 'collect' is the plural form and doesn't match the singular subject. (C) 'are collecting' pairs a plural helping verb with a singular subject. (D) 'collecting' has no finite verb, leaving the sentence without a main verb.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "NB-GU-2", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The list of team captains chosen for tonight's exhibition game <u>include</u> two seniors who have never missed a practice.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "includes"}, {"letter": "C", "text": "are including"}, {"letter": "D", "text": "including"}], "correctLetter": "B", "explanation": "The true subject is 'list' (singular); 'of team captains' is a prepositional phrase that doesn't affect agreement. The singular subject requires 'includes,' making (B) correct. (A) 'include' is plural and wrongly agrees with the nearby plural noun 'captains' instead of the true subject. (C) 'are including' uses a plural helping verb, which also doesn't match 'list.' (D) 'including' lacks a finite verb and creates a fragment.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "NB-GU-3", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "Each of the worker bees in the hive <u>perform</u> a specific task essential to the colony's survival.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "performs"}, {"letter": "C", "text": "are performing"}, {"letter": "D", "text": "performing"}], "correctLetter": "B", "explanation": "The subject is the singular indefinite pronoun 'Each,' not the plural 'worker bees' inside the prepositional phrase 'of the worker bees in the hive.' A singular subject takes 'performs,' so (B) is correct. (A) 'perform' is plural and incorrectly matches the nearby plural noun. (C) 'are performing' uses a plural helper, which doesn't agree with 'Each.' (D) 'performing' has no finite verb and creates a fragment.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "NB-GU-4", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The section of violinists rehearsed the difficult passage until <u>they</u> finally matched the tempo the conductor had set.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "he"}, {"letter": "D", "text": "we"}], "correctLetter": "B", "explanation": "The pronoun stands in for 'The section' (a singular collective noun acting as one unit), not the plural 'violinists' inside the prepositional phrase 'of violinists.' A singular antecedent needs 'it,' so (B) is correct. (A) 'they' wrongly agrees with the nearer plural noun instead of the true singular antecedent. (C) 'he' introduces a gendered pronoun with no matching antecedent. (D) 'we' is first person and has no basis in the sentence.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "NB-GU-5", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "Each of the biologists tagging the migrating geese recorded <u>their</u> individual wingspan measurements in a shared logbook back at camp.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "his or her"}, {"letter": "C", "text": "its"}, {"letter": "D", "text": "our"}], "correctLetter": "B", "explanation": "The pronoun refers back to 'Each,' the singular subject of the sentence, not the plural nouns 'biologists' or 'geese' that sit between the subject and the pronoun. A singular antecedent requires 'his or her,' so (B) is correct. (A) 'their' wrongly matches one of the nearby plural nouns rather than 'Each.' (C) 'its' is used for things, not people, and doesn't fit a person performing the recording. (D) 'our' is first person and has no antecedent in the sentence.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "NB-GU-6", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "Neither the mayor nor the council members could agree on how <u>he</u> should present the zoning proposal to the public.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "they"}, {"letter": "C", "text": "she"}, {"letter": "D", "text": "it"}], "correctLetter": "B", "explanation": "In a 'neither...nor' construction, the pronoun must agree with the nearer of the two antecedents, which is the plural 'the council members,' not the singular 'the mayor.' That requires 'they,' so (B) is correct. (A) 'he' wrongly agrees with the farther, singular antecedent instead of the nearer plural one. (C) 'she' has no antecedent of either gender established in the sentence. (D) 'it' doesn't fit a plural group of people.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "NB-GU-7", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The tournament came down to two finalists, and everyone agreed that <u>him</u> and his opponent had played the most thrilling match of the year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "himself"}, {"letter": "C", "text": "he"}, {"letter": "D", "text": "he's"}], "correctLetter": "C", "explanation": "The pronoun is part of the compound subject performing the action 'had played'; testing it alone ('he had played') confirms a subject pronoun is needed. That makes 'he' correct, so (C) is right. (A) 'him' is an object pronoun and can't serve as part of the subject. (B) 'himself' is reflexive and has no earlier 'he' in the clause to refer back to. (D) 'he's' is a contraction of 'he is,' which doesn't fit before 'had played.'", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "NB-GU-8", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "My brother and <u>myself</u> drove all the way to the coast without stopping, even though we'd been warned about the traffic.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "me"}, {"letter": "C", "text": "I"}, {"letter": "D", "text": "mine"}], "correctLetter": "C", "explanation": "The pronoun, along with 'My brother,' is the subject performing the action 'drove'; testing it alone ('I drove') confirms a subject pronoun is needed. That makes 'I' correct, so (C) is right. (A) 'myself' is reflexive and has no earlier 'I' in the sentence to reflect back to. (B) 'me' is an object pronoun and can't function as part of the subject. (D) 'mine' is possessive and cannot serve as a subject.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "NB-GU-9", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The gallery director praised the two curators <u>who</u> she had personally selected to restore the damaged Renaissance painting.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "whoever"}, {"letter": "C", "text": "whom"}, {"letter": "D", "text": "whomever"}], "correctLetter": "C", "explanation": "The pronoun stands for 'the two curators,' who receive the action in 'she had personally selected [them]'; testing it alone confirms an object pronoun is needed. That makes 'whom' correct, so (C) is right. (A) 'who' is a subject pronoun and can't serve as the object of 'had selected.' (B) 'whoever' is an indefinite relative pronoun, but the curators are specific, already-identified people. (D) 'whomever' is also indefinite and doesn't fit a specific, defined pair.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "NB-GU-10", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Geologists now believe the volcano <u>erupts</u> violently more than seventy times since it first formed roughly ten thousand years ago.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "erupted"}, {"letter": "C", "text": "has erupted"}, {"letter": "D", "text": "will erupt"}], "correctLetter": "C", "explanation": "The phrase 'since it first formed... ago' establishes a timeframe running from a past point up to now, which requires the present perfect 'has erupted.' That makes (C) correct. (A) 'erupts' is simple present and doesn't account for the span from the past to now. (B) 'erupted' is simple past, which doesn't pair with 'since' the way present perfect does. (D) 'will erupt' is future tense and doesn't fit a timeframe that has already been unfolding.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "NB-GU-11", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time she crossed the finish line, Elena <u>runs</u> over five hundred training miles in preparation for the marathon.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "will have run"}, {"letter": "C", "text": "had run"}, {"letter": "D", "text": "was running"}], "correctLetter": "C", "explanation": "'By the time she crossed the finish line' is a past-tense anchor marking one past event, and the training mileage was completed before that event, which requires the past perfect 'had run.' That makes (C) correct. (A) 'runs' is present tense and doesn't fit the past narrative. (B) 'will have run' is future perfect and wrongly places the training after the anchor event. (D) 'was running' suggests an ongoing action rather than one completed before the finish line was crossed.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "NB-GU-12", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Historians estimate that the Library of Alexandria <u>will house</u> hundreds of thousands of scrolls before it was destroyed.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "houses"}, {"letter": "C", "text": "housed"}, {"letter": "D", "text": "has housed"}], "correctLetter": "C", "explanation": "The clause 'before it was destroyed' anchors the sentence in the past, so the verb describing the library's contents must also be simple past: 'housed.' That makes (C) correct. (A) 'will house' is future tense and contradicts the past-tense anchor. (B) 'houses' is present tense and doesn't fit a library that no longer exists. (D) 'has housed' is present perfect, implying the action continues into the present, which contradicts 'was destroyed.'", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "NB-GU-13", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of the two peaks visible from the ranger station, Mount Adler is <u>most jagged</u>, its ridgeline broken into countless sharp spires.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "as jagged"}, {"letter": "C", "text": "jaggedest"}, {"letter": "D", "text": "more jagged"}], "correctLetter": "D", "explanation": "Only two peaks are being compared ('the two peaks'), so the comparative form is required: 'more jagged.' That makes (D) correct. (A) 'most jagged' is superlative, which is reserved for three or more items. (C) 'jaggedest' is not a standard comparative or superlative form. (B) 'as jagged' sets up an equal comparison, but the sentence structure calls for one peak being ranked above the other, not equal to it.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "NB-GU-14", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Among the three rivers that feed the delta, the Kessel is <u>longer</u>, stretching nearly four hundred miles before reaching the sea.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "as long"}, {"letter": "C", "text": "more longer"}, {"letter": "D", "text": "longest"}], "correctLetter": "D", "explanation": "Three rivers are being compared ('the three rivers'), so the superlative form is required: 'longest.' That makes (D) correct. (A) 'longer' is comparative, which applies only to exactly two items. (C) 'more longer' doubles up the comparative, combining 'more' with the '-er' ending. (B) 'as long' sets up an equal comparison rather than ranking the Kessel above the other two rivers, which the sentence requires.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "NB-GU-15", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "When comparing the two brands side by side, reviewers agreed that the newer model felt <u>more lighter</u> on the foot than its predecessor.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "light"}, {"letter": "C", "text": "lightest"}, {"letter": "D", "text": "lighter"}], "correctLetter": "D", "explanation": "Only two brands are being compared, so a single comparative form is needed: 'lighter.' That makes (D) correct. (A) 'more lighter' incorrectly combines 'more' with the '-er' ending, doubling the comparative. (C) 'lightest' is superlative, which doesn't fit a comparison between exactly two items. (B) 'light' drops the comparison entirely, which doesn't work with 'than its predecessor' later in the sentence.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "NB-GU-16", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The chemist remained dedicated <u>with</u> her research for over three decades, publishing findings well into her seventies.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "in"}, {"letter": "C", "text": "for"}, {"letter": "D", "text": "to"}], "correctLetter": "D", "explanation": "The idiomatic phrase is 'dedicated to,' not 'dedicated with,' so (D) is correct. (A) 'with' is the wrong preposition for this idiom. (C) 'for' doesn't pair with 'dedicated' in standard usage. (B) 'in' also doesn't fit the fixed expression.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "NB-GU-17", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "Restaurant owners must comply <u>to</u> the updated health regulations before the inspector's next visit.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "for"}, {"letter": "C", "text": "by"}, {"letter": "D", "text": "with"}], "correctLetter": "D", "explanation": "The idiomatic phrase is 'comply with,' not 'comply to,' so (D) is correct. (A) 'to' is the wrong preposition for this idiom. (C) 'by' doesn't pair with 'comply' in standard usage. (B) 'for' also doesn't fit the fixed expression.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "NB-GU-18", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The young gymnast proved herself capable <u>for</u> achieving a perfect score on the balance beam.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "with"}, {"letter": "C", "text": "to"}, {"letter": "D", "text": "of"}], "correctLetter": "D", "explanation": "The idiomatic phrase is 'capable of,' not 'capable for,' so (D) is correct. (A) 'for' is the wrong preposition for this idiom. (C) 'to' doesn't pair with 'capable' in standard usage. (B) 'with' also doesn't fit the fixed expression.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "NB-PU-1", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "Ice cores<u>, cylindrical samples of ancient ice,</u> preserve tiny air bubbles that reveal Earth's atmospheric history.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; cylindrical samples of ancient ice;"}, {"letter": "C", "text": ", cylindrical samples of ancient ice"}, {"letter": "D", "text": "\u2014cylindrical samples of ancient ice,"}], "correctLetter": "A", "explanation": "A is correct: the nonessential appositive \"cylindrical samples of ancient ice\" can be removed without breaking the sentence, so it needs a comma on both sides \u2014 the gate is opened and closed correctly. B is wrong because semicolons require independent clauses on both sides, and the appositive isn't one. C is wrong because it opens the gate but never closes it, leaving \"ice preserve\" run together with no signal that the aside has ended. D is wrong because it mismatches an opening dash with a closing comma \u2014 punctuation bookends must match.", "trick": "If you open a comma gate, you must close it."}, {"id": "NB-PU-2", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The Wright brothers<u> Orville and Wilbur</u> tested their glider designs on the windy dunes of Kitty Hawk before achieving powered flight in 1903.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", Orville and Wilbur,"}, {"letter": "C", "text": ", Orville and Wilbur"}, {"letter": "D", "text": "; Orville and Wilbur;"}], "correctLetter": "B", "explanation": "B is correct: \"Orville and Wilbur\" is a nonessential appositive renaming \"The Wright brothers\" and needs a comma before and after it. A is wrong because there is no punctuation at all setting off the appositive. C is wrong because it opens the gate but fails to close it before \"tested.\" D is wrong because semicolons join independent clauses, not appositives.", "trick": "If you open a comma gate, you must close it."}, {"id": "NB-PU-3", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "An octopus's skin<u>, controlled by thousands of pigment-filled cells,</u> can change color and texture in less than a second to match its surroundings.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", controlled by thousands of pigment-filled cells"}, {"letter": "C", "text": "; controlled by thousands of pigment-filled cells;"}, {"letter": "D", "text": " controlled by thousands of pigment-filled cells,"}], "correctLetter": "A", "explanation": "A is correct: the nonessential clause \"controlled by thousands of pigment-filled cells\" is already properly closed on both sides. B is wrong because it drops the closing comma, leaving the gate open before \"can.\" C is wrong because semicolons require independent clauses on both sides. D is wrong because it drops the opening comma, so the gate is only closed, never opened.", "trick": "If you open a comma gate, you must close it."}, {"id": "NB-PU-4", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The bakery's sourdough starter<u>, a bubbling mixture of flour and water that has been fed daily for six years</u> gives every loaf its distinctive tang.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " a bubbling mixture of flour and water that has been fed daily for six years,"}, {"letter": "C", "text": ", a bubbling mixture of flour and water that has been fed daily for six years,"}, {"letter": "D", "text": "; a bubbling mixture of flour and water that has been fed daily for six years;"}], "correctLetter": "C", "explanation": "C is correct: the nonessential appositive describing the starter needs a comma at both ends. A is wrong because it opens the gate but never closes it before \"gives.\" B is wrong because it has a closing comma but no opening comma. D is wrong because semicolons don't belong around a non-independent appositive.", "trick": "If you open a comma gate, you must close it."}, {"id": "NB-PU-5", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The community hospital recently completed <u>it's</u> renovation, adding a rooftop garden and an expanded pediatric wing.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "their"}, {"letter": "C", "text": "its'"}, {"letter": "D", "text": "its"}], "correctLetter": "D", "explanation": "D is correct: the renovation belongs to the hospital, so the plain possessive \"its\" (no apostrophe) is needed. A is wrong because \"it's\" means \"it is,\" and \"completed it is renovation\" makes no sense. C is wrong because \"its'\" is not a real English word. B is wrong because \"their\" doesn't agree with the singular \"hospital.\"", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "NB-PU-6", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "A cat relies on <u>its</u> whiskers to judge whether a gap is too narrow to fit through, since the highly sensitive hairs detect even slight changes in air current.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it's"}, {"letter": "C", "text": "its's"}, {"letter": "D", "text": "their"}], "correctLetter": "A", "explanation": "A is correct: the whiskers belong to the cat, a straightforward possessive, and \"its\" needs no apostrophe. B is wrong because \"it's\" means \"it is,\" and \"relies on it is whiskers\" is nonsensical. C is wrong because \"its's\" is not a word. D is wrong because \"their\" doesn't agree with the singular \"a cat.\"", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "NB-PU-7", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The software company announced that <u>its'</u> latest update would fix the login bug affecting thousands of users.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "their"}, {"letter": "C", "text": "it's"}, {"letter": "D", "text": "its"}], "correctLetter": "D", "explanation": "D is correct: the update belongs to the company, so the plain possessive \"its\" is needed. A is wrong because \"its'\" is not standard English. C is wrong because \"it's\" means \"it is,\" and \"that it is latest update\" is nonsensical. B is wrong because \"their\" doesn't agree with the singular \"the software company.\"", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "NB-PU-8", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "Before the season opener, the soccer team unveiled <u>they're</u> new uniforms, which featured a redesigned crest and brighter colors.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "their"}, {"letter": "C", "text": "there"}, {"letter": "D", "text": "it's"}], "correctLetter": "B", "explanation": "B is correct: the uniforms belong to the team, so the possessive \"their\" is needed. A is wrong because \"they're\" means \"they are,\" and \"unveiled they are new uniforms\" is nonsensical. C is wrong because \"there\" is a location word, not a possessive. D is wrong because \"it's\" means \"it is\" and also mismatches the plural \"team.\"", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "NB-PU-9", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The 2021 Fagradalsfjall eruption<u>\u2014which lasted six months, produced lava fountains, and drew thousands of visitors\u2014</u> reshaped the Icelandic landscape near Reykjavik.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", which lasted six months, produced lava fountains, and drew thousands of visitors,"}, {"letter": "C", "text": "\u2014which lasted six months, produced lava fountains, and drew thousands of visitors,"}, {"letter": "D", "text": ", which lasted six months, produced lava fountains, and drew thousands of visitors\u2014"}], "correctLetter": "A", "explanation": "A is correct: because the nonessential clause already contains its own internal commas (\"six months,\" \"lava fountains,\" and \"visitors\"), only matching dashes can clearly mark where the whole aside begins and ends without burying that boundary inside a string of list commas. B is wrong because replacing the dashes with commas creates an ambiguous pile-up of commas. C and D are wrong because they mismatch an opening dash with a closing comma or vice versa \u2014 punctuation bookends must match.", "trick": "Punctuation bookends must match."}, {"id": "NB-PU-10", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The museum's new exhibit<u>, featuring paintings, sketches, and personal letters from the artist's estate,</u> opened to record crowds last weekend.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "\u2014featuring paintings, sketches, and personal letters from the artist's estate,"}, {"letter": "C", "text": "\u2014featuring paintings, sketches, and personal letters from the artist's estate\u2014"}, {"letter": "D", "text": ", featuring paintings, sketches, and personal letters from the artist's estate\u2014"}], "correctLetter": "C", "explanation": "C is correct: because the aside itself contains a list with internal commas (\"paintings, sketches, and personal letters\"), the boundaries of the aside must be marked with matching dashes instead of commas to avoid ambiguity. A is wrong because commas around the whole phrase collide with the list's own commas. C and D are wrong because they mismatch a dash on one end with a comma on the other.", "trick": "Punctuation bookends must match."}, {"id": "NB-PU-11", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The marathon runner<u>\u2014a former college track star\u2014</u> trains nearly ninety miles per week, alternating between hill repeats and long recovery runs.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "\u2014a former college track star,"}, {"letter": "C", "text": ", a former college track star\u2014"}, {"letter": "D", "text": "\u2014a former college track star)"}], "correctLetter": "A", "explanation": "A is correct: \"a former college track star\" is a nonessential aside with no internal punctuation, and it is already set off by two matching dashes. B and C are wrong because they mismatch an opening dash with a closing comma or vice versa. D is wrong because a dash cannot pair with a closing parenthesis \u2014 bookends must match.", "trick": "Punctuation bookends must match."}, {"id": "NB-PU-12", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "British mathematician Alan Turing<u>\u2014working alongside a team at Bletchley Park,</u> developed a machine that dramatically sped up the process of breaking Enigma-encrypted messages.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " working alongside a team at Bletchley Park,"}, {"letter": "C", "text": "; working alongside a team at Bletchley Park,"}, {"letter": "D", "text": ", working alongside a team at Bletchley Park,"}], "correctLetter": "D", "explanation": "D is correct: \"working alongside a team at Bletchley Park\" is a nonessential aside with no internal commas, so a matching pair of commas correctly sets it off. A is wrong because it opens with a dash but closes with a comma \u2014 mismatched bookends. C is wrong because a semicolon requires an independent clause, but this phrase isn't one, and it still ends with a mismatched comma. B is wrong because it drops the opening punctuation entirely, so the gate is never opened.", "trick": "Punctuation bookends must match."}, {"id": "NB-PU-13", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Coral reefs cover less than one percent of the ocean floor<u>, they support</u> nearly a quarter of all known marine species.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " they support"}, {"letter": "C", "text": "; they support"}, {"letter": "D", "text": "; and they support"}], "correctLetter": "C", "explanation": "C is correct: both \"Coral reefs cover less than one percent of the ocean floor\" and \"they support nearly a quarter of all known marine species\" are independent clauses, so a semicolon is needed to join them. A is wrong because a comma alone cannot join two independent clauses (a comma splice). B is wrong because no punctuation at all creates a run-on sentence. D is wrong because pairing a semicolon with the coordinating conjunction \"and\" is non-standard.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "NB-PU-14", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "During the crash of 1929, panicked investors abandoned three major sectors of the market<u>, railroads, utilities, and manufacturing</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ": railroads, utilities, and manufacturing"}, {"letter": "C", "text": "; railroads, utilities, and manufacturing"}, {"letter": "D", "text": " of railroads, utilities, and manufacturing"}], "correctLetter": "B", "explanation": "B is correct: \"panicked investors abandoned three major sectors of the market\" is a complete independent clause, and a colon correctly introduces the list explaining which sectors. A is wrong because a plain comma before the list collides with the list's own internal commas, creating an ambiguous run of commas. C is wrong because a semicolon must be followed by another independent clause, not a list fragment. D is wrong because repeating \"of\" is redundant and ungrammatical after \"sectors of the market.\"", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "NB-PU-15", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Lithium-ion batteries power most electric vehicles today<u>, however solid-state batteries promise faster charging and greater range</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", however, solid-state batteries promise faster charging and greater range"}, {"letter": "C", "text": ": however, solid-state batteries promise faster charging and greater range"}, {"letter": "D", "text": "; however, solid-state batteries promise faster charging and greater range"}], "correctLetter": "D", "explanation": "D is correct: both halves are independent clauses joined by the conjunctive adverb \"however,\" which requires a semicolon before it and a comma after it. A is wrong because a comma alone cannot join two independent clauses (a comma splice). C is wrong because pairing a contrast word like \"however\" with a colon (which signals explanation, not contrast) is inconsistent. B is wrong because surrounding \"however\" with commas is still just a comma splice.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "NB-PU-16", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "Climbers attempting Denali <u>must,</u> carry enough supplies to survive sudden storms that can trap them at high camp for days.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "must;"}, {"letter": "C", "text": "must"}, {"letter": "D", "text": "must:"}], "correctLetter": "C", "explanation": "C is correct: \"must\" and \"carry\" form a single verb phrase (\"must carry\") that should never be split by punctuation. A is wrong because the comma unnecessarily separates the modal verb from its main verb. B is wrong because a semicolon can't sit inside a verb phrase, and \"carry enough supplies...\" isn't an independent clause. D is wrong because a colon has no job here either \u2014 nothing being introduced is a list or explanation following a complete clause.", "trick": "When in doubt, leave it out."}, {"id": "NB-PU-17", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The beekeeper checked each frame for signs of disease <u>before, harvesting</u> the season's first batch of honey.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "before harvesting"}, {"letter": "C", "text": "before; harvesting"}, {"letter": "D", "text": "before: harvesting"}], "correctLetter": "B", "explanation": "B is correct: \"before harvesting\" is a single prepositional phrase that needs no internal punctuation. A is wrong because the comma unnecessarily splits \"before\" from \"harvesting.\" C is wrong because a semicolon needs an independent clause on each side, but \"harvesting the season's first batch of honey\" isn't one. D is wrong because a colon has no explanatory or list-introducing job here.", "trick": "When in doubt, leave it out."}, {"id": "NB-PU-18", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "Shipwrights spent <u>three years, carefully</u> restoring the century-old schooner's rotted hull planks before returning it to the water.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "three years carefully,"}, {"letter": "C", "text": "three years; carefully"}, {"letter": "D", "text": "three years carefully"}], "correctLetter": "D", "explanation": "D is correct: \"carefully restoring\" is a single adverb-verb unit that should not be split from \"three years\" by any punctuation. A is wrong because the comma unnecessarily separates \"three years\" from the phrase describing how the restoration was done. C is wrong because a semicolon needs an independent clause on both sides, but neither side qualifies. B is wrong because the comma is just relocated, still unnecessarily splitting \"carefully\" from \"restoring.\"", "trick": "When in doubt, leave it out."}, {"id": "NB-SS-1", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Mount St. Helens erupted violently in 1980<u>, it flattened</u> hundreds of square miles of forest within minutes.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it flattened"}, {"letter": "C", "text": "; it flattened"}, {"letter": "D", "text": ", and flattening"}], "correctLetter": "C", "explanation": "C is correct: both \"Mount St. Helens erupted violently in 1980\" and \"it flattened hundreds of square miles of forest within minutes\" are complete sentences, so a semicolon legally joins them. A is wrong because a comma alone cannot join two independent clauses (comma splice). B removes all punctuation, creating a run-on. D pairs \"and\" with the participle \"flattening\" instead of a full verb, leaving the second clause without a proper subject-verb pairing (\"it flattened\" is needed, not \"and flattening\").", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "NB-SS-2", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The chef spent eighteen months perfecting every recipe on the menu<u>, she still felt nervous</u> before opening night.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; she still felt nervous"}, {"letter": "C", "text": "she still felt nervous"}, {"letter": "D", "text": ", however she still felt nervous"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins the two independent clauses \"The chef spent eighteen months perfecting every recipe on the menu\" and \"she still felt nervous before opening night.\" A is a comma splice. C removes the punctuation entirely, creating a run-on. D is also a comma splice, because \"however\" is a conjunctive adverb, not a coordinating conjunction, and cannot be preceded by only a comma when joining two full sentences.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "NB-SS-3", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Caravaggio revolutionized the use of light and shadow in painting<u>, his technique became known as chiaroscuro</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "his technique became known as chiaroscuro"}, {"letter": "C", "text": "; and his technique became known as chiaroscuro"}, {"letter": "D", "text": ", and his technique became known as chiaroscuro"}], "correctLetter": "D", "explanation": "D is correct: a comma plus the coordinating conjunction \"and\" properly joins the two independent clauses. A is a comma splice (comma with no conjunction). B removes all punctuation, creating a run-on. C incorrectly pairs a semicolon with \"and\"; a semicolon should join clauses on its own, and adding a coordinating conjunction after it is nonstandard.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "NB-SS-4", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Beekeepers must inspect their hives regularly<u>, mites can otherwise spread quickly</u> throughout the colony.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "because mites can otherwise spread quickly"}, {"letter": "C", "text": ", and mites otherwise spreading quickly"}, {"letter": "D", "text": "mites can otherwise spread quickly"}], "correctLetter": "B", "explanation": "B is correct: the subordinating conjunction \"because\" turns the second clause into a dependent clause explaining why hives must be inspected, legally attaching it to the main clause without a comma splice. A is a comma splice (comma alone joining two independent clauses). C pairs \"and\" with the participle \"spreading\" instead of a full verb, leaving no legitimate second independent clause. D removes the punctuation, creating a run-on.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "NB-SS-5", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The anglerfish survives in total darkness far beneath the ocean's surface. <u>Using a glowing lure that dangles from its head to attract unsuspecting prey.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "A glowing lure that dangles from its head to attract unsuspecting prey."}, {"letter": "C", "text": "It uses a glowing lure that dangles from its head to attract unsuspecting prey."}, {"letter": "D", "text": "Which uses a glowing lure that dangles from its head to attract unsuspecting prey."}], "correctLetter": "C", "explanation": "C is correct: adding the subject \"It\" and the main verb \"uses\" turns the fragment into a complete sentence. A is a fragment because \"Using...\" is a participial phrase with no subject or main verb that can stand alone. B is just a noun phrase with a relative clause attached, still missing a main verb for the sentence as a whole. D begins with the relative pronoun \"Which,\" which needs an independent clause to attach to and cannot stand alone.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "NB-SS-6", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "Inca engineers built suspension bridges made entirely of twisted grass-fiber rope, spanning deep canyons with no metal or nails of any kind. <u>A design so resilient that some replica bridges are still rebuilt by hand every year.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "So resilient a design that some replica bridges are still rebuilt by hand every year."}, {"letter": "C", "text": "Being a design so resilient that some replica bridges are still rebuilt by hand every year."}, {"letter": "D", "text": "It was a design so resilient that some replica bridges are still rebuilt by hand every year."}], "correctLetter": "D", "explanation": "D is correct: adding the subject \"It\" and the verb \"was\" completes the sentence with a proper independent clause. A is a fragment: \"A design...\" is only a noun phrase with a subordinate \"that\" clause attached, no main verb. B inverts the phrasing but still never supplies a subject and verb for a standalone sentence. C uses the gerund \"Being,\" which creates a participial phrase, not a complete sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "NB-SS-7", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Improvising a solo that had never been played before and would never be played the same way again.</u> The saxophonist closed his eyes and let the melody unfold.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "He improvised a solo that had never been played before and would never be played the same way again."}, {"letter": "C", "text": "A solo that had never been played before and would never be played the same way again."}, {"letter": "D", "text": "Having improvised a solo that had never been played before and would never be played the same way again."}], "correctLetter": "B", "explanation": "B is correct: supplying the subject \"He\" and the finite verb \"improvised\" makes this a complete, independent sentence. A is a fragment because \"Improvising...\" is a participial phrase with no subject or main verb. C is just a noun phrase with a relative clause, still lacking a main verb. D uses \"Having improvised,\" a participial phrase that likewise cannot stand alone as a sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "NB-SS-8", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "Technicians mounted the panels at a precise angle to maximize sunlight exposure. <u>Which required careful calculations based on the building's latitude.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Requiring careful calculations based on the building's latitude."}, {"letter": "C", "text": "A process that required careful calculations based on the building's latitude."}, {"letter": "D", "text": "This required careful calculations based on the building's latitude."}], "correctLetter": "D", "explanation": "D is correct: replacing \"Which\" with the subject \"This\" gives the clause a subject and a working main verb, \"required,\" so it can stand alone. A is a fragment because a relative clause starting with \"Which\" needs an independent clause to attach to. B turns the verb into the participle \"Requiring,\" which cannot serve as a sentence's main verb. C is a noun phrase with a relative clause, still missing a standalone main verb.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "NB-SS-9", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Before their mission, astronauts spend months learning to operate the spacecraft, running emergency drills, and <u>they must study</u> the science experiments planned for orbit.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "to study"}, {"letter": "C", "text": "must study"}, {"letter": "D", "text": "studying"}], "correctLetter": "D", "explanation": "D is correct: the list already contains the -ing forms \"learning\" and \"running,\" so the third item must match with \"studying.\" A breaks the pattern by switching to a full subject-plus-verb clause, \"they must study.\" B switches to an infinitive, \"to study,\" which doesn't match the -ing items. C uses \"must study,\" a different verb form that also breaks the parallel list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "NB-SS-10", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "The recipe instructs the cook to whisk the eggs, fold in the flour, and <u>the butter should be melted</u> slowly over low heat.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "melt the butter"}, {"letter": "C", "text": "melting the butter"}, {"letter": "D", "text": "melted the butter"}], "correctLetter": "B", "explanation": "B is correct: the list shares the infinitive \"to,\" giving bare verb forms \"whisk,\" \"fold in,\" and \"melt,\" so \"melt the butter\" matches. A breaks the pattern with a passive clause, \"the butter should be melted.\" C shifts to the -ing form \"melting,\" which doesn't match \"whisk\" and \"fold in.\" D uses the past tense \"melted,\" which also breaks the parallel bare-verb list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "NB-SS-11", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "A strong chess player analyzes the board, anticipates the opponent's next move, and <u>calculating several moves ahead</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "to calculate several moves ahead"}, {"letter": "C", "text": "calculates several moves ahead"}, {"letter": "D", "text": "calculate several moves ahead"}], "correctLetter": "C", "explanation": "C is correct: the list uses third-person singular present verbs \"analyzes\" and \"anticipates,\" so the third item must match with \"calculates.\" A breaks the pattern with the -ing form \"calculating.\" B switches to the infinitive \"to calculate,\" which doesn't match. D drops the required \"-s,\" leaving a form that doesn't agree with the singular subject or match the other list items.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "NB-SS-12", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Volunteer firefighters are trained to control blazes, to rescue trapped residents, and <u>administering first aid</u> at the scene.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "administer first aid"}, {"letter": "C", "text": "administered first aid"}, {"letter": "D", "text": "to administer first aid"}], "correctLetter": "D", "explanation": "D is correct: the list repeats \"to\" before each verb (\"to control,\" \"to rescue\"), so the third item must match with \"to administer.\" A breaks the pattern with the -ing form \"administering.\" B drops the required \"to,\" which is inconsistent since the first two items each restate it. C uses the past tense \"administered,\" which also breaks the parallel infinitive list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "NB-SS-13", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Crouching silently behind a bush for nearly an hour, <u>the elusive snow leopard finally appeared before the photographer's lens</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the photographer finally spotted the elusive snow leopard"}, {"letter": "C", "text": "the photographer's lens finally captured the elusive snow leopard"}, {"letter": "D", "text": "an elusive snow leopard was finally seen by the photographer"}], "correctLetter": "B", "explanation": "B is correct: the introductory phrase describes someone crouching behind a bush, and \"the photographer\" placed right after the comma is logically the one doing that crouching. A is wrong because it makes the snow leopard, not the photographer, the one crouching \u2014 a dangling modifier. C makes \"the photographer's lens\" the subject right after the comma, and a lens cannot crouch. D places \"an elusive snow leopard\" right after the comma, again making the leopard the one crouching.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "NB-SS-14", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Sifting carefully through layers of ancient sediment, <u>several pottery shards were discovered by the archaeologist</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "several pottery shards caught the archaeologist's attention"}, {"letter": "C", "text": "the archaeologist discovered several pottery shards"}, {"letter": "D", "text": "it was the archaeologist who discovered several pottery shards"}], "correctLetter": "C", "explanation": "C is correct: the introductory phrase describes someone sifting through sediment, and placing \"the archaeologist\" right after the comma correctly identifies who is doing the sifting. A makes \"several pottery shards\" the subject, but shards cannot sift through sediment. B likewise makes \"several pottery shards\" the subject right after the comma, the same dangling-modifier problem. D places \"it\" right after the comma rather than \"the archaeologist,\" so the modifier still doesn't attach to the person doing the sifting.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "NB-SS-15", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Attempting a difficult kickflip off the ramp, <u>the crowd cheered wildly for the skateboarder</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "cheers erupted from the crowd for the skateboarder"}, {"letter": "C", "text": "the ramp shook as the skateboarder landed"}, {"letter": "D", "text": "the skateboarder landed smoothly to the crowd's delight"}], "correctLetter": "D", "explanation": "D is correct: the introductory phrase describes someone attempting a kickflip, and \"the skateboarder\" placed right after the comma is logically the one attempting it. A makes \"the crowd\" the subject, but the crowd is not the one attempting the trick. B makes \"cheers\" the subject right after the comma, which also cannot attempt a kickflip. C places \"the ramp\" right after the comma, and a ramp cannot attempt a trick.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "NB-SS-16", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "Rising ocean temperatures stress coral polyps<u>, therefore</u> the corals expel the algae living in their tissues and turn white.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; therefore,"}, {"letter": "C", "text": ", because"}, {"letter": "D", "text": ", although"}], "correctLetter": "B", "explanation": "B is correct: \"therefore\" is a conjunctive adverb, not a coordinating or subordinating conjunction, so it needs a semicolon (not just a comma) before it to legally join two independent clauses, with a comma following it. A is wrong because a comma alone is too weak to join the two full sentences with \"therefore.\" C uses \"because,\" a true subordinating conjunction, but it reverses the logic \u2014 the temperature stress causes the algae expulsion, not the other way around. D uses \"although,\" which wrongly signals contrast where none exists between cause and effect.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "NB-SS-17", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>Mrs. Chen arrived in the country with only a few dollars, she</u> built a successful chain of bakeries within a decade.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Mrs. Chen arrived in the country with only a few dollars, then she"}, {"letter": "C", "text": "Although Mrs. Chen arrived in the country with only a few dollars, she"}, {"letter": "D", "text": "Because Mrs. Chen arrived in the country with only a few dollars she"}], "correctLetter": "C", "explanation": "C is correct: the subordinating conjunction \"Although\" turns the first clause into a dependent clause, legally attached to the independent clause \"she built a successful chain of bakeries\" with a comma. A is a comma splice, joining two independent clauses with only a comma. B is also a comma splice, because \"then\" is a transitional adverb, not strong enough to join two full sentences with just a comma. D omits the comma that must follow an introductory dependent clause, making the sentence run its clauses together incorrectly.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "NB-SS-18", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "Additive manufacturing produces prototypes far more quickly than traditional machining<u>, being that this speed has made</u> rapid prototyping standard practice in product design.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", this speed has made"}, {"letter": "C", "text": "because this speed has made"}, {"letter": "D", "text": "; this speed has made"}], "correctLetter": "D", "explanation": "D is correct: a semicolon properly joins the two independent clauses, \"Additive manufacturing produces prototypes far more quickly than traditional machining\" and \"this speed has made rapid prototyping standard practice in product design.\" A uses \"being that,\" a nonstandard phrase that is not a real conjunction and cannot legally join two full sentences. B is a comma splice, joining the two independent clauses with only a comma. C uses \"because,\" a true subordinating conjunction, but it reverses the logic, implying manufacturing is fast because prototyping became standard, rather than the reverse.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "NB-WC-1", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "As lava oozed down the mountainside over the course of several days, geologists tracked its <u>hasty</u> advance and mapped which villages lay in its path.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "impulsive"}, {"letter": "C", "text": "gradual"}, {"letter": "D", "text": "hurried"}], "correctLetter": "C", "explanation": "C is correct: \"gradual\" precisely matches the timeline already given (\"over the course of several days\") and describes physical movement accurately. A \"hasty\" implies rushed, careless movement, which directly contradicts the multi-day timeline. B \"impulsive\" describes rash decisions, not the literal speed of a physical flow, so it's the wrong domain entirely. D \"hurried\" carries the same contradiction as \"hasty\" \u2014 it implies intentional speed that a days-long lava flow doesn't have.", "trick": "Precise beats fancy."}, {"id": "NB-WC-2", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Arctic terns rely on an internal <u>hunch</u> of magnetic fields, a mechanism scientists have documented through repeated laboratory experiments, to guide their annual journey between the poles.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "notion"}, {"letter": "C", "text": "inkling"}, {"letter": "D", "text": "sense"}], "correctLetter": "D", "explanation": "D is correct: \"sense\" precisely names a documented biological sensory mechanism, matching the appositive \"a mechanism scientists have documented.\" A \"hunch\" implies an uncertain guess, which clashes with something that has been scientifically documented through experiments. B \"notion\" is a vague mental idea, not a sensory mechanism. C \"inkling\" likewise implies vague suspicion, not a proven biological ability.", "trick": "Precise beats fancy."}, {"id": "NB-WC-3", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Sugar makers run flexible tubing downhill through the maple stand so that gravity alone could <u>shove</u> sap from each tap to the collection tank without the need for pumps.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "hurl"}, {"letter": "C", "text": "fling"}, {"letter": "D", "text": "carry"}], "correctLetter": "D", "explanation": "D is correct: \"carry\" precisely describes the gentle, steady movement of sap down a gradual downhill run of tubing. A \"shove\" implies a sudden forceful push, which doesn't fit a slow gravity-fed flow. B \"hurl\" and C \"fling\" both imply violent, fast, forceful motion \u2014 completely mismatched with sap trickling downhill through tubing.", "trick": "Precise beats fancy."}, {"id": "NB-WC-4", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "A skilled chess player will often <u>waste</u> a pawn early in the game, not because the move is careless, but because doing so deliberately opens lines of attack worth far more than the piece itself.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "misplace"}, {"letter": "C", "text": "sacrifice"}, {"letter": "D", "text": "squander"}], "correctLetter": "C", "explanation": "C is correct: \"sacrifice\" is the precise chess term for deliberately giving up material for positional advantage, and it doesn't contradict \"not because the move is careless.\" A \"waste\" inherently implies carelessness, directly contradicting the sentence's own claim that the move is not careless. B \"misplace\" implies losing track of something accidentally, which clashes with \"doing so deliberately.\" D \"squander\" also implies careless loss, creating the same contradiction as A.", "trick": "Precise beats fancy."}, {"id": "NB-WC-5", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "When worker bees detect a diseased larva inside the hive, they <u>throw out</u> the infected larva to protect the rest of the colony from disease.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "banish"}, {"letter": "C", "text": "evict"}, {"letter": "D", "text": "expel"}], "correctLetter": "D", "explanation": "D is correct: \"expel\" is the precise, literal biological term for forcibly removing something from a colony or organism. A \"throw out\" is a vague, casual phrasal verb unsuited to describing this biological behavior. B \"banish\" figuratively implies intent and formal authority, personifying the bees inappropriately. C \"evict\" imports a legal/tenancy concept that doesn't literally apply to a biological removal.", "trick": "Precise beats fancy."}, {"id": "NB-WC-6", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "A healthy sourdough starter will <u>explode</u> with bubbles a few hours after each feeding, a sign that the wild yeast inside is actively fermenting the flour.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "erupt"}, {"letter": "C", "text": "swell"}, {"letter": "D", "text": "detonate"}], "correctLetter": "C", "explanation": "C is correct: \"swell\" precisely and literally describes a starter rising and bubbling from fermentation. A \"explode\" is an exaggerated, imprecise description of a slow rising process. B \"erupt\" is similarly overdramatic and violent for a gentle fermentation bubble-up. D \"detonate\" is absurdly violent and belongs to the domain of explosives, not baking.", "trick": "Precise beats fancy."}, {"id": "NB-WC-7", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Engineers <u>overhauled</u> the angle of each solar panel by only two degrees, a minor change that increased the array's total energy output by nearly eight percent.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "revolutionized"}, {"letter": "C", "text": "adjusted"}, {"letter": "D", "text": "transformed"}], "correctLetter": "C", "explanation": "C is correct: \"adjusted\" precisely matches the sentence's own description of the change as \"a minor change.\" A \"overhauled\" implies a complete rebuild, directly contradicting \"only two degrees\" and \"minor change.\" B \"revolutionized\" is an oddly dramatic word to pair with an angle and contradicts the stated minor scale of the change. D \"transformed\" likewise implies a major change that the sentence explicitly rules out.", "trick": "Precise beats fancy."}, {"id": "NB-WC-8", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "During the solo, the saxophonist <u>invented</u> a melody that departed from the written sheet music but still resolved neatly into the song's original key.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "fabricated"}, {"letter": "C", "text": "concocted"}, {"letter": "D", "text": "improvised"}], "correctLetter": "D", "explanation": "D is correct: \"improvised\" is the precise musical term for spontaneous, real-time composition, matching \"departed from the written sheet music.\" A \"invented\" is vague and generic, failing to capture the real-time musical process being described. B \"fabricated\" carries a connotation of dishonest invention, wrong for describing music. C \"concocted\" suggests scheming or mixing ingredients, an imprecise fit for musical performance.", "trick": "Precise beats fancy."}, {"id": "NB-WC-9", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Her coach advised her to <u>restrain</u> her pace for the first ten miles, saving her energy for a strong final sprint.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "moderate"}, {"letter": "C", "text": "suppress"}, {"letter": "D", "text": "repress"}], "correctLetter": "B", "explanation": "B is correct: \"moderate\" precisely captures keeping a pace at a reasonable, controlled level. A \"restrain\" connotes forcefully holding back a person or animal, a mismatched connotation for pacing oneself. C \"suppress\" implies stopping something down completely, which is too strong and the wrong sense for pace. D \"repress\" is specifically a psychological term for holding down emotions or memories, a wrong domain here entirely.", "trick": "Precise beats fancy."}, {"id": "NB-ST-1", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Johannes Gutenberg's introduction of movable type in the fifteenth century fundamentally transformed the dissemination of knowledge across Europe. Prior to this innovation, texts were painstakingly copied by hand, a process that <u>was a total pain and took forever</u>, restricting literacy to a privileged few.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "was super time-consuming and kind of a drag"}, {"letter": "C", "text": "was slow and labor-intensive"}, {"letter": "D", "text": "took absolutely forever and was a huge hassle"}], "correctLetter": "C", "explanation": "C is correct: \"was slow and labor-intensive\" matches the formal, academic register established by \"fundamentally transformed the dissemination of knowledge\" and \"painstakingly copied by hand.\" A \"was a total pain and took forever\" is jarringly casual slang against that formal baseline. B \"was super time-consuming and kind of a drag\" is equally casual. D \"took absolutely forever and was a huge hassle\" is likewise informal and clashes with the essay's register.", "trick": "Match the essay's volume."}, {"id": "NB-ST-2", "concept": "Style & Tone", "subtyp
