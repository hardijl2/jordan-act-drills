<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan's ACT Progress Dashboard</title>
<style>
  :root {
    --navy: #1F4E78; --navy-dark: #14344f; --green: #1a7f4e; --red: #b3261e;
    --bg: #f4f6f9; --card: #ffffff; --border: #d9e0e8; --text: #1c2733; --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; }
  header { padding: 20px 4px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.88rem; }
  #refreshBtn { background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

  #gate { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  #gate .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 10px rgba(20,52,79,0.08); }
  #gate h2 { margin: 0 0 12px; color: var(--navy-dark); font-size: 1.1rem; }
  #gate input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  #gate button { background: var(--navy); color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  #gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }

  #app { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 1.02rem; color: var(--navy-dark); }

  .filterRow { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filterRow button { background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-size: 0.82rem; cursor: pointer; }
  .filterRow button.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 120px; background: #fbfbfd; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .num { font-size: 1.6rem; font-weight: 700; color: var(--navy-dark); }
  .stat-box .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .name { flex: 0 0 42%; }
  .cat-row .bar-wrap { flex: 1; margin: 0 10px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-row .bar { height: 100%; }
  .cat-row .bar.weak { background: var(--red); }
  .cat-row .bar.mid { background: #d9a441; }
  .cat-row .bar.strong { background: var(--green); }
  .cat-row .pct { width: 70px; text-align: right; color: var(--muted); font-size: 0.82rem; }

  table.sessions { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.sessions th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.sessions td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
  table.sessions tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .pill.good { background: #eaf7ef; color: var(--green); }
  .pill.mid { background: #fdf4e3; color: #8a6300; }
  .pill.bad { background: #fbeceb; color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.92rem; }
  .errBox { background: #fbeceb; border: 1px solid #f0c6c3; color: var(--red); padding: 12px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 10px; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Jordan's Progress Dashboard</h2>
    <input id="pwInput" type="password" placeholder="Enter passcode" autocomplete="off">
    <button onclick="checkPasscode()">Enter</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <div>
      <h1>Jordan's ACT English Progress</h1>
      <p id="lastUpdated">Loading...</p>
    </div>
    <button id="refreshBtn" onclick="loadData()">↻ Refresh</button>
  </header>

  <div id="content">
    <div class="loading">Loading progress data…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const PASSCODE = "JORDANPROGRESS26";
const FIREBASE_CONFIG = {"apiKey": "AIzaSyAUJp7K6uChE69XE0W7rWs2l8EPtzi036A", "authDomain": "jordan-act-drills.firebaseapp.com", "projectId": "jordan-act-drills", "storageBucket": "jordan-act-drills.firebasestorage.app", "messagingSenderId": "1016838779694", "appId": "1:1016838779694:web:929aaef91b54315bca80bf"};
const FIREBASE_CONFIGURED = true;
const ATTEMPTS_COLLECTION = "attempts";
const CONCEPT_ORDER = ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation", "Style & Tone", "Word Choice & Precision", "Concision & Redundancy", "Organization & Development", "Transitions"];

let db = null;
let allAttempts = [];
let currentFilter = 'all'; // all | 7 | 30

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initFirebaseAndLoad();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function initFirebaseAndLoad() {
  if (!FIREBASE_CONFIGURED) {
    document.getElementById('content').innerHTML = `<div class="errBox">
      This dashboard isn't connected to a Firebase project yet. Once the drills app's Firebase
      config is filled in and this file is rebuilt, results will show up here automatically.
    </div>`;
    document.getElementById('lastUpdated').textContent = 'Not connected';
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch (e) {
    showError('Could not connect to Firebase: ' + e.message);
    return;
  }
  loadData();
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="errBox">${escapeHtml(msg)}</div>`;
  document.getElementById('lastUpdated').textContent = 'Error loading data';
}

function loadData() {
  if (!db) return;
  document.getElementById('content').innerHTML = '<div class="loading">Loading progress data…</div>';
  db.collection(ATTEMPTS_COLLECTION).orderBy('ts', 'asc').get().then(snap => {
    allAttempts = [];
    snap.forEach(doc => {
      const d = doc.data();
      allAttempts.push({
        ts: d.ts && d.ts.toDate ? d.ts.toDate() : null,
        sessionId: d.sessionId || 'unknown',
        questionId: d.questionId,
        concept: d.concept,
        subtype: d.subtype,
        correct: !!d.correct,
      });
    });
    document.getElementById('lastUpdated').textContent = `Last updated ${new Date().toLocaleString()} · ${allAttempts.length} total answers logged`;
    renderAll();
  }).catch(e => {
    showError('Could not load data from Firestore: ' + e.message + ' (check that Firestore rules allow read access, and that the project is set up correctly).');
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function setFilter(f) {
  currentFilter = f;
  renderAll();
}

function filteredAttempts() {
  if (currentFilter === 'all') return allAttempts;
  const days = currentFilter === '7' ? 7 : 30;
  const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);
  return allAttempts.filter(a => a.ts && a.ts >= cutoff);
}

function barClass(pct) {
  if (pct < 70) return 'weak';
  if (pct < 85) return 'mid';
  return 'strong';
}
function pillClass(pct) {
  if (pct < 70) return 'bad';
  if (pct < 85) return 'mid';
  return 'good';
}

function renderAll() {
  const data = filteredAttempts();
  const container = document.getElementById('content');

  if (allAttempts.length === 0) {
    container.innerHTML = `<div class="card"><div class="empty">No practice sessions logged yet. Once Jordan answers questions in the drills app, they'll show up here.</div></div>`;
    return;
  }

  const total = data.length;
  const correct = data.filter(a => a.correct).length;
  const overallPct = total ? Math.round((correct/total)*100) : 0;
  const sessionIds = new Set(data.map(a => a.sessionId));

  const byConcept = {};
  data.forEach(a => {
    byConcept[a.concept] = byConcept[a.concept] || { n: 0, c: 0 };
    byConcept[a.concept].n++;
    if (a.correct) byConcept[a.concept].c++;
  });
  const conceptRows = CONCEPT_ORDER
    .filter(c => byConcept[c])
    .map(c => ({ concept: c, ...byConcept[c], pct: Math.round((byConcept[c].c/byConcept[c].n)*100) }))
    .sort((a,b) => a.pct - b.pct);

  const bySession = {};
  data.forEach(a => {
    bySession[a.sessionId] = bySession[a.sessionId] || { n: 0, c: 0, first: a.ts, last: a.ts };
    bySession[a.sessionId].n++;
    if (a.correct) bySession[a.sessionId].c++;
    if (a.ts && (!bySession[a.sessionId].first || a.ts < bySession[a.sessionId].first)) bySession[a.sessionId].first = a.ts;
    if (a.ts && (!bySession[a.sessionId].last || a.ts > bySession[a.sessionId].last)) bySession[a.sessionId].last = a.ts;
  });
  const sessionRows = Object.entries(bySession)
    .map(([id, s]) => ({ id, ...s, pct: Math.round((s.c/s.n)*100) }))
    .sort((a,b) => (b.first || 0) - (a.first || 0))
    .slice(0, 15);

  container.innerHTML = `
    <div class="filterRow">
      <button class="${currentFilter==='all'?'active':''}" onclick="setFilter('all')">All Time</button>
      <button class="${currentFilter==='30'?'active':''}" onclick="setFilter('30')">Last 30 Days</button>
      <button class="${currentFilter==='7'?'active':''}" onclick="setFilter('7')">Last 7 Days</button>
    </div>

    <div class="card">
      <div class="stat-row">
        <div class="stat-box"><div class="num">${overallPct}%</div><div class="lbl">Overall Accuracy</div></div>
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">Questions Answered</div></div>
        <div class="stat-box"><div class="num">${sessionIds.size}</div><div class="lbl">Sessions</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Accuracy by Concept</h2>
      ${conceptRows.map(r => `
        <div class="cat-row">
          <span class="name">${escapeHtml(r.concept)}</span>
          <div class="bar-wrap"><div class="bar ${barClass(r.pct)}" style="width:${r.pct}%"></div></div>
          <span class="pct">${r.c}/${r.n} (${r.pct}%)</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Recent Sessions</h2>
      <table class="sessions">
        <thead><tr><th>Date</th><th>Questions</th><th>Score</th></tr></thead>
        <tbody>
          ${sessionRows.map(s => `
            <tr>
              <td>${s.first ? s.first.toLocaleDateString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—'}</td>
              <td>${s.n}</td>
              <td><span class="pill ${pillClass(s.pct)}">${s.c}/${s.n} · ${s.pct}%</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
</script>
</body>
</html>
