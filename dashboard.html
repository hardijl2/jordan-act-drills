e": "Style & Tone Consistency", "passage": "Okay, so learning to stand up on a snowboard is honestly the hardest part of the whole sport for most beginners. You strap in, shift your weight forward, and just hope you don't <u>sustain a contusion upon impact with the packed snow</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "incur a substantial contusion resultant from snow impact"}, {"letter": "C", "text": "sustain injuries of a contusive nature"}, {"letter": "D", "text": "end up bruised from the fall"}], "correctLetter": "D", "explanation": "D is correct: \"end up bruised from the fall\" matches the relaxed, conversational tone set by \"Okay, so\" and \"honestly.\" A \"sustain a contusion upon impact with the packed snow\" is clinical medical jargon that clashes with that casual voice. B \"incur a substantial contusion resultant from snow impact\" is even more stiffly formal. C \"sustain injuries of a contusive nature\" is similarly overwrought and out of place in a casual blog post.", "trick": "Match the essay's volume."}, {"id": "NB-ST-3", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Effective climate policy requires coordinated international action, as unilateral efforts by individual nations remain <u>pretty much a drop in the bucket</u> compared to the scale of global emissions.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "largely inadequate"}, {"letter": "C", "text": "kind of a joke"}, {"letter": "D", "text": "no big deal"}], "correctLetter": "B", "explanation": "B is correct: \"largely inadequate\" matches the formal policy-analysis register of \"requires coordinated international action\" and \"scale of global emissions.\" A \"pretty much a drop in the bucket\" is a casual idiom that clashes with that formal voice. C \"kind of a joke\" is slangy and dismissive in a way that doesn't fit a formal essay. D \"no big deal\" is both too casual and logically backwards, since it suggests the efforts are unimportant rather than insufficient.", "trick": "Match the essay's volume."}, {"id": "NB-ST-4", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Speedrunners spend hundreds of hours grinding the same level over and over, all to shave a few seconds off their time. It's honestly kind of nuts, but the community's dedication to <u>the meticulous optimization of frame-perfect input sequences</u> is what makes it so much fun to watch.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the systematic maximization of temporal efficiency parameters"}, {"letter": "C", "text": "nailing every move at exactly the right moment"}, {"letter": "D", "text": "the rigorous refinement of chronometric performance metrics"}], "correctLetter": "C", "explanation": "C is correct: \"nailing every move at exactly the right moment\" fits the casual, enthusiastic voice of \"honestly kind of nuts.\" A \"the meticulous optimization of frame-perfect input sequences\" is dense academic jargon that clashes with that casual tone. B \"the systematic maximization of temporal efficiency parameters\" is even more stiffly technical. D \"the rigorous refinement of chronometric performance metrics\" is similarly overly formal and out of place.", "trick": "Match the essay's volume."}, {"id": "NB-ST-5", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Renaissance painters such as Leonardo da Vinci pioneered the technique of sfumato, a method of blending colors so subtly that <u>you can't even tell where one shade stops and the next one starts, which is pretty wild</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it's basically impossible to spot the line between colors, which is awesome"}, {"letter": "C", "text": "you literally cannot tell the shades apart, which is super cool"}, {"letter": "D", "text": "no visible transition exists between one shade and the next"}], "correctLetter": "D", "explanation": "D is correct: \"no visible transition exists between one shade and the next\" matches the formal art-historical register of \"pioneered the technique.\" A \"you can't even tell where one shade stops and the next one starts, which is pretty wild\" is conversational and clashes with that formal voice. B and C are similarly casual, complete with slangy tags like \"which is awesome\" and \"which is super cool\" that don't belong in a formal essay.", "trick": "Match the essay's volume."}, {"id": "NB-ST-6", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Every summer, my dad and I strip down his old ten-speed and repaint it in the garage, and honestly, the best part isn't even riding it afterward \u2014 it's <u>the tactile gratification derived from applying fresh paint to the refurbished frame</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the feeling of rolling fresh paint onto the frame"}, {"letter": "C", "text": "the sensory satisfaction generated by the application of paint to the restored frame"}, {"letter": "D", "text": "the tactile pleasure experienced during the paint application process"}], "correctLetter": "B", "explanation": "B is correct: \"the feeling of rolling fresh paint onto the frame\" matches the relaxed, personal tone of \"honestly, the best part isn't even riding it.\" A \"the tactile gratification derived from applying fresh paint to the refurbished frame\" is stiffly clinical and clashes with that casual voice. C \"the sensory satisfaction generated by the application of paint to the restored frame\" is similarly overwrought. D \"the tactile pleasure experienced during the paint application process\" is likewise too formal for the essay's breezy register.", "trick": "Match the essay's volume."}, {"id": "NB-ST-7", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Market volatility often reflects investor psychology as much as it does underlying economic fundamentals; a single rumor can send prices <u>totally freaking out</u> within minutes.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "into a total freakout"}, {"letter": "C", "text": "into sharp fluctuation"}, {"letter": "D", "text": "basically haywire"}], "correctLetter": "C", "explanation": "C is correct: \"into sharp fluctuation\" matches the analytical, formal register of \"reflects investor psychology\" and \"underlying economic fundamentals.\" A \"totally freaking out\" is slang that clashes with that formal voice. B \"into a total freakout\" is a slightly reworded but equally casual version of the same slang. D \"basically haywire\" is likewise informal and out of place in a formal analysis.", "trick": "Match the essay's volume."}, {"id": "NB-ST-8", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "We didn't really have a plan for the road trip \u2014 we just picked a direction and drove. By the third day, <u>we had ascertained that spontaneity yields more memorable experiences than meticulous itineraries</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "we had come to empirically recognize that unplanned travel optimizes memorability"}, {"letter": "C", "text": "we had deduced that spontaneous travel is superior to rigidly scheduled itineraries"}, {"letter": "D", "text": "we'd figured out that just winging it makes for way better memories than planning everything out"}], "correctLetter": "D", "explanation": "D is correct: \"we'd figured out that just winging it makes for way better memories than planning everything out\" matches the loose, casual voice of \"we didn't really have a plan... we just picked a direction and drove.\" A \"we had ascertained that spontaneity yields more memorable experiences than meticulous itineraries\" is stiffly formal and clashes with that voice. B \"we had come to empirically recognize that unplanned travel optimizes memorability\" is even more academic. C \"we had deduced that spontaneous travel is superior to rigidly scheduled itineraries\" is similarly too formal.", "trick": "Match the essay's volume."}, {"id": "NB-ST-9", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Recent research indicates that bumblebees can learn to solve simple puzzles by observing other bees, a finding that <u>totally blows the whole idea of insect intelligence out of the water</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "significantly challenges conventional assumptions about insect intelligence"}, {"letter": "C", "text": "pretty much wrecks everything scientists thought they knew about bug smarts"}, {"letter": "D", "text": "basically flips insect intelligence on its head, no big surprise"}], "correctLetter": "B", "explanation": "B is correct: \"significantly challenges conventional assumptions about insect intelligence\" matches the formal, scientific register of \"Recent research indicates.\" A \"totally blows the whole idea of insect intelligence out of the water\" is casual slang that clashes with that formal voice. C \"pretty much wrecks everything scientists thought they knew about bug smarts\" is similarly informal. D \"basically flips insect intelligence on its head, no big surprise\" is likewise too casual, and also self-contradictory in tone.", "trick": "Match the essay's volume."}, {"id": "NB-CR-1", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "A photographer widens the aperture to let in more light, and this <u>wider opening that allows additional light to enter the lens</u> is especially useful in dim rooms.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "increase in the size of the lens opening that lets in more light"}, {"letter": "C", "text": "adjustment"}, {"letter": "D", "text": "widening of the aperture that permits more light to pass through"}], "correctLetter": "C", "explanation": "C is correct: \"adjustment\" refers back to the idea without repeating it, since the sentence already explained that the aperture is widened to let in more light. A \"wider opening that allows additional light to enter the lens\" restates that exact idea a second time. B \"increase in the size of the lens opening that lets in more light\" is the same redundant restatement in different words. D \"widening of the aperture that permits more light to pass through\" repeats both \"aperture\" and \"more light\" from earlier in the sentence.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-2", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The Great Pyramid was built using an estimated 2.3 million limestone blocks, and this <u>enormous quantity of nearly two and a half million individual stone blocks</u> took decades to quarry and transport.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "vast collection of millions of heavy limestone blocks"}, {"letter": "C", "text": "huge number of roughly 2.3 million stones"}, {"letter": "D", "text": "staggering total"}], "correctLetter": "D", "explanation": "D is correct: \"staggering total\" refers back to the figure just given without repeating it, since the sentence already stated \"2.3 million limestone blocks.\" A \"enormous quantity of nearly two and a half million individual stone blocks\" restates that exact number and material a second time. B \"vast collection of millions of heavy limestone blocks\" repeats \"limestone blocks\" and the scale already given. C \"huge number of roughly 2.3 million stones\" repeats the exact figure again.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-3", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Guitar strings lose brightness slightly every time they're played, and this <u>gradual dulling of tone that happens a little more with each time the strings are played</u> is why guitarists replace their strings every few months.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "gradual dulling"}, {"letter": "C", "text": "slow, steady loss of tonal brightness that occurs with each and every time the strings are played"}, {"letter": "D", "text": "incremental reduction in how bright the strings sound each time they're played"}], "correctLetter": "B", "explanation": "B is correct: \"gradual dulling\" names the idea once, concisely, without repeating the mechanism already described (\"lose brightness slightly every time they're played\"). A adds a full restatement of \"happens a little more with each time the strings are played,\" repeating what \"every time\" already established. C \"slow, steady loss of tonal brightness that occurs with each and every time the strings are played\" repeats the idea again. D \"incremental reduction in how bright the strings sound each time they're played\" is the same redundant restatement in different words.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-4", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "A quadruple axel requires four and a half rotations in the air, and this <u>jump that involves the skater spinning around four and a half times before landing</u> has been completed by only a handful of skaters worldwide.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "aerial rotation of four and a half full turns performed before the skater lands"}, {"letter": "C", "text": "feat"}, {"letter": "D", "text": "maneuver requiring the skater to complete four full rotations plus a half turn in midair"}], "correctLetter": "C", "explanation": "C is correct: \"feat\" refers back to the jump without repeating the rotation count already given (\"four and a half rotations in the air\"). A \"jump that involves the skater spinning around four and a half times before landing\" restates that exact detail. B \"aerial rotation of four and a half full turns performed before the skater lands\" repeats the same rotation count again. D \"maneuver requiring the skater to complete four full rotations plus a half turn in midair\" is the same redundant restatement broken into different words.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-5", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "A single hectare of Amazon rainforest can contain over 200 tree species, and this <u>remarkably high number of more than two hundred different kinds of trees in just one hectare</u> dwarfs that of most temperate forests.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "surprisingly large variety of over two hundred distinct tree species packed into a single hectare"}, {"letter": "C", "text": "astonishingly high count of more than 200 separate tree types in that same hectare"}, {"letter": "D", "text": "remarkable figure"}], "correctLetter": "D", "explanation": "D is correct: \"remarkable figure\" refers back to the statistic without repeating it, since the sentence already gave \"over 200 tree species\" in \"a single hectare.\" A \"remarkably high number of more than two hundred different kinds of trees in just one hectare\" restates both the count and the area again. B \"surprisingly large variety of over two hundred distinct tree species packed into a single hectare\" repeats the same two details. C \"astonishingly high count of more than 200 separate tree types in that same hectare\" is the same redundant restatement once more.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-6", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The restorer replaced the clock's worn mainspring with a hand-forged replacement, and this <u>new mainspring that was custom-made by hand to replace the old, worn-out one</u> restored the clock's original ticking rhythm.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "repair"}, {"letter": "C", "text": "hand-forged mainspring that replaced the previous worn and deteriorated one"}, {"letter": "D", "text": "custom replacement part that had been made by hand to replace the damaged original"}], "correctLetter": "B", "explanation": "B is correct: \"repair\" sums up the action concisely without repeating what the first clause already stated (that a hand-forged replacement mainspring replaced the worn one). A \"new mainspring that was custom-made by hand to replace the old, worn-out one\" restates the exact same details a second time. C \"hand-forged mainspring that replaced the previous worn and deteriorated one\" repeats \"hand-forged\" and the worn/replaced idea again. D \"custom replacement part that had been made by hand to replace the damaged original\" is the same redundant restatement in different words.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-7", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The International Space Station orbits Earth roughly every 90 minutes, and this <u>fact that the station circles the planet approximately every ninety minutes</u> means the crew sees sixteen sunrises a day.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "extremely quick circling of the Earth that occurs about once every 90 minutes"}, {"letter": "C", "text": "rapid orbit"}, {"letter": "D", "text": "brief orbital period during which the station circles the globe every ninety minutes or so"}], "correctLetter": "C", "explanation": "C is correct: \"rapid orbit\" refers back to the idea concisely without repeating the exact figure already given (\"orbits Earth roughly every 90 minutes\"). A \"fact that the station circles the planet approximately every ninety minutes\" restates that exact timing again. B \"extremely quick circling of the Earth that occurs about once every 90 minutes\" repeats the same figure once more. D \"brief orbital period during which the station circles the globe every ninety minutes or so\" is the same redundant restatement in different words.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-8", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Installing a rain barrel under a downspout captures nearly a third of a household's outdoor water use, and this <u>significant reduction of about thirty percent in the amount of tap water a household draws for the yard</u> also lowers the monthly utility bill.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "notable decrease of nearly a third in overall outdoor tap-water use"}, {"letter": "C", "text": "considerable drop of about 30 percent in the tap water a household draws for the yard"}, {"letter": "D", "text": "practice"}], "correctLetter": "D", "explanation": "D is correct: \"practice\" refers back to rain-barrel installation concisely without repeating the percentage already given (\"captures nearly a third of a household's outdoor water use\"). A \"significant reduction of about thirty percent in the amount of tap water a household draws for the yard\" restates that exact figure again. B \"notable decrease of nearly a third in overall outdoor tap-water use\" repeats the same percentage once more. C \"considerable drop of about 30 percent in the tap water a household draws for the yard\" is the same redundant restatement in different words.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-CR-9", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Suspension bridges use massive cables anchored at each end to support the roadway's weight, and this <u>method of using huge cables fixed at both ends to hold up the weight of the road</u> allows the bridge to span far longer distances than a simple beam bridge could.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "design"}, {"letter": "C", "text": "system of enormous cables secured at either end that bear the load of the roadway"}, {"letter": "D", "text": "approach of anchoring massive cables at both ends to support the road's weight"}], "correctLetter": "B", "explanation": "B is correct: \"design\" refers back to the idea concisely without repeating what the first clause already stated (massive cables anchored at each end supporting the roadway's weight). A \"method of using huge cables fixed at both ends to hold up the weight of the road\" restates all of those exact details again. C \"system of enormous cables secured at either end that bear the load of the roadway\" repeats the same details in different words. D \"approach of anchoring massive cables at both ends to support the road's weight\" is nearly a word-for-word restatement of the earlier clause.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "NB-TR-1", "concept": "Transitions", "subtype": "Transitions", "passage": "When a scout bee finds a rich source of nectar, she returns to the hive and performs a rapid, figure-eight dance. <u>As a result</u>, other worker bees are able to determine the food's exact direction and distance from the hive.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "However"}, {"letter": "C", "text": "For example"}, {"letter": "D", "text": "In the meantime"}], "correctLetter": "A", "explanation": "A is correct: the dance directly causes the other bees to learn the food's location, a clear cause-and-effect relationship that 'as a result' captures. B is wrong because there is no contrast between the two sentences; the second follows logically from the first. C is wrong because the second sentence is not an example of the dance, it is the direct outcome of it. D is wrong because 'in the meantime' implies two unrelated events happening simultaneously, but here the second event is caused by the first, not merely parallel to it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-2", "concept": "Transitions", "subtype": "Transitions", "passage": "Roman aqueducts relied on nothing more than gravity to move water across dozens of miles, using a precisely calculated downward slope. <u>Similarly</u>, modern water systems often depend on electric pumps to push water uphill and through pressurized pipes.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In contrast"}, {"letter": "C", "text": "Consequently"}, {"letter": "D", "text": "Additionally"}], "correctLetter": "B", "explanation": "B is correct: gravity-only Roman aqueducts and pump-dependent modern systems are being contrasted, so 'in contrast' fits. A is wrong because 'similarly' claims the two systems work the same way, when the passage describes opposite mechanisms. C is wrong because there is no cause-and-effect link between ancient aqueduct design and modern pump technology. D is wrong because 'additionally' implies the second sentence simply adds another example of the same method, but it describes a different, contrasting method.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-3", "concept": "Transitions", "subtype": "Transitions", "passage": "Extracting lithium and cobalt from the earth is both environmentally damaging and expensive. <u>Meanwhile</u>, several companies have begun developing processes to recover these metals from used electric-vehicle batteries instead of mining new ore.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore"}, {"letter": "C", "text": "Nonetheless"}, {"letter": "D", "text": "For instance"}], "correctLetter": "B", "explanation": "B is correct: the high cost and environmental damage of mining directly motivate companies to develop recycling processes instead, a cause-and-effect relationship that 'therefore' signals. A is wrong because 'meanwhile' suggests two unrelated things happening on a shared timeline, not one causing the other. C is wrong because 'nonetheless' signals a concession or contrast, but recycling is a logical response to the problem, not a surprising exception to it. D is wrong because recycling is not an example of extraction being costly, it is a solution developed because of that cost.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-4", "concept": "Transitions", "subtype": "Transitions", "passage": "Van Gogh painted Starry Night from memory while staying at an asylum in Saint-R\u00e9my, relying on turbulent, swirling brushstrokes to convey emotion rather than realism. <u>In addition</u>, he used thick layers of paint, a technique called impasto, to give the sky a physical, sculptural texture.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "As a result"}, {"letter": "C", "text": "On the other hand"}, {"letter": "D", "text": "In summary"}], "correctLetter": "A", "explanation": "A is correct: the second sentence adds another supporting detail about Van Gogh's painting technique, so the additive 'in addition' is appropriate. B is wrong because using impasto is not a consequence of painting from memory; the two are simply two separate techniques he used. C is wrong because no contrast is being drawn between the two sentences. D is wrong because 'in summary' signals a wrap-up of prior points, but this sentence introduces new information rather than concluding the discussion.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-5", "concept": "Transitions", "subtype": "Transitions", "passage": "For months, marathon runners steadily increase their weekly mileage to build endurance. <u>Likewise</u>, in the final two weeks before race day, they sharply reduce their mileage in a practice known as tapering.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "As a result"}, {"letter": "C", "text": "In addition"}, {"letter": "D", "text": "However"}], "correctLetter": "D", "explanation": "D is correct: the runners' training reverses direction, from steadily increasing mileage to sharply reducing it, which is a contrast that 'however' correctly signals. A is wrong because 'likewise' claims the two practices are similar, but they are opposites. B is wrong because tapering is not a result of increasing mileage; it is a deliberate, opposite strategy timed before the race. C is wrong because 'in addition' implies the second practice simply continues or supplements the first, when it actually reverses it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-6", "concept": "Transitions", "subtype": "Transitions", "passage": "An octopus's skin contains specialized cells called chromatophores that can expand or contract within a fraction of a second. <u>In contrast</u>, the animal can shift its skin color to match its surroundings almost instantly.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Consequently"}, {"letter": "C", "text": "Nevertheless"}, {"letter": "D", "text": "For example"}], "correctLetter": "B", "explanation": "B is correct: the rapid expansion and contraction of chromatophores is what causes the octopus's near-instant color change, a cause-and-effect relationship that 'consequently' captures. A is wrong because there is no contrast here; the second sentence describes the direct effect of the first. C is wrong because 'nevertheless' signals a concession or surprising exception, but the color change is the expected result of the chromatophore action, not an exception to it. D is wrong because the color-shifting ability is not an example of the chromatophores' action, it is the direct result of it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-7", "concept": "Transitions", "subtype": "Transitions", "passage": "Today, a single printing press can produce thousands of copies of a book in a single day. <u>Previously</u>, monks copied every book by hand, a process that could take months or even years.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Consequently"}, {"letter": "C", "text": "In fact"}, {"letter": "D", "text": "Similarly"}], "correctLetter": "A", "explanation": "A is correct: the passage contrasts the modern printing press with the earlier, slower era of hand-copying, and 'previously' correctly signals that chronological shift. B is wrong because hand-copying is not a consequence of fast modern printing; it came before printing presses existed. C is wrong because 'in fact' is used to reinforce or intensify a point already made, not to introduce a contrasting earlier era. D is wrong because 'similarly' claims the two processes resemble each other, when they are actually opposite in speed and method.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-8", "concept": "Transitions", "subtype": "Transitions", "passage": "Many city apartment dwellers lack backyards where they could traditionally compost food scraps. <u>Nevertheless</u>, a growing number of buildings now install rooftop composting bins that residents share.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "For example"}, {"letter": "C", "text": "Similarly"}, {"letter": "D", "text": "As a result"}], "correctLetter": "A", "explanation": "A is correct: despite the obstacle of lacking a backyard, city dwellers have still found a way to compost, and 'nevertheless' correctly signals that concession. B is wrong because the rooftop bins are not an example of lacking a backyard, they are a response to that limitation. C is wrong because 'similarly' implies rooftop composting resembles traditional backyard composting in circumstance, but the whole point is that apartment dwellers lack that option. D is wrong because rooftop composting is not a direct result of lacking a backyard; it is a workaround developed despite that obstacle.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "NB-TR-9", "concept": "Transitions", "subtype": "Transitions", "passage": "Beaver dams slow the flow of forest streams, creating shallow ponds and saturated wetlands nearby. <u>As a result</u>, these wetlands support far more species of birds, amphibians, and insects than the surrounding dry forest does.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "For example"}, {"letter": "C", "text": "Nonetheless"}, {"letter": "D", "text": "In the meantime"}], "correctLetter": "A", "explanation": "A is correct: the wetlands created by beaver dams directly cause the increase in supported species, a cause-and-effect relationship that 'as a result' captures. B is wrong because the increased biodiversity is not an example of dam-building, it is the outcome enabled by it. C is wrong because 'nonetheless' signals a concession or surprising exception, but greater biodiversity is the expected consequence of new wetland habitat, not an exception to it. D is wrong because 'in the meantime' implies two unrelated events happening simultaneously, but here the wetlands' effect on species is a direct consequence of the dam, not merely parallel to it.", "trick": "Name the relationship first, then pick the olar system, mentioning both Saturn and Jupiter, so this rationale is factually inaccurate.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "NB-OD-3", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "In 1941, Swiss engineer George de Mestral returned from a hike and noticed burrs from burdock plants clinging stubbornly to his clothes and his dog's fur. Curious, he examined the burrs under a microscope and discovered tiny hooks that snagged on the loops of fabric and fur. Over the next several years, he experimented with fabrics to replicate this hook-and-loop mechanism artificially. By 1955, he had patented the invention that would become known as Velcro.", "question": "Should the writer add the following sentence after the third sentence: 'Burdock is a biennial plant that also produces large, edible roots used in some traditional cuisines.'?", "choices": [{"letter": "A", "text": "Yes, because it adds interesting detail about the plant that inspired the invention."}, {"letter": "B", "text": "Yes, because readers need to know all properties of burdock to understand Velcro."}, {"letter": "C", "text": "No, because the paragraph traces the invention process of Velcro, not the culinary uses of burdock."}, {"letter": "D", "text": "No, because burdock roots are not actually edible."}], "correctLetter": "C", "explanation": "C is correct: the paragraph is specifically about de Mestral's process of inventing Velcro, and burdock's culinary uses do not advance that narrative, even though the claim is true. A is wrong because 'interesting' is not the standard; the detail must serve this paragraph's specific job, which it does not. B is wrong because it overstates the need for background, since understanding the invention does not require knowing burdock's culinary uses. D is wrong because burdock root is, in fact, edible, so this is not a valid reason to exclude the sentence.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "NB-OD-4", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Each fall, millions of monarch butterflies in eastern North America begin an extraordinary journey south to overwintering sites in the oyamel fir forests of central Mexico. No single monarch completes the entire round-trip migration; instead, it takes three or four generations to finish the full cycle. Scientists still debate exactly how monarchs navigate such vast distances, though many suspect they use a combination of the sun's position and an internal magnetic compass. Conservationists have planted milkweed corridors along the migration route to support the species, since milkweed is the only plant monarch caterpillars can eat.", "question": "Should the writer add the following sentence after the second sentence: 'Monarch butterflies have a wingspan of roughly three to four inches.'?", "choices": [{"letter": "A", "text": "Yes, because wingspan measurements help readers picture how small the butterflies are."}, {"letter": "B", "text": "Yes, because it directly supports the paragraph's discussion of the multigenerational migration."}, {"letter": "C", "text": "No, because the paragraph focuses on the migration's mechanics and conservation, not the butterfly's physical dimensions."}, {"letter": "D", "text": "No, because the sentence is factually inaccurate."}], "correctLetter": "C", "explanation": "C is correct: the paragraph's specific focus is how and why monarchs migrate across generations and how conservationists support them, and a wingspan measurement is a physical-description tangent that does not serve that focus, even though it is true. A is wrong because helping readers visualize size is not sufficient relevance to this paragraph's particular job. B is wrong because wingspan has no bearing on the multigenerational nature of the migratio e active starter is mixed with flour, water, and salt to form a shaggy dough, which rests for thirty minutes before kneading. [4] The dough is then shaped into a round loaf and placed in a floured basket to rest. [5] After a long, slow rise, the baker scores the top of the loaf and bakes it in a very hot, covered pot.", "question": "For the sake of the logic and coherence of this paragraph, Sentence 3 should be placed:", "choices": [{"letter": "A", "text": "where it is now."}, {"letter": "B", "text": "after Sentence 1, as the second sentence of the paragraph."}, {"letter": "C", "text": "after Sentence 5, as the last sentence of the paragraph."}, {"letter": "D", "text": "before Sentence 1."}], "correctLetter": "B", "explanation": "B is correct: Sentence 3 describes mixing the active starter into a shaggy dough, which must happen right after the starter is activated in Sentence 1 and before the kneading, shaping, and baking steps in Sentences 2, 4, and 5. Inserted there, the sequence reads: feed the starter, mix it into dough, knead to develop gluten, shape into a loaf, then bake. A is wrong because leaving it where it is places dough-mixing after kneading has already begun developing the gluten, which is out of order. C is wrong because mixing the dough obviously cannot happen after the loaf has already been baked. D is wrong because dough-mixing cannot happen before the starter has even been fed and activated.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "NB-OD-8", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "___________. Beyond lending books, many branches now offer free computer access, job-search workshops, and after-school tutoring for children whose families cannot afford private programs. During a recent citywide internet outage, several branches saw a surge in visitors who came solely to use library Wi-Fi to complete job applications and homework. Local branches also host citizenship classes and English-language courses for new immigrants. These expanded services reflect a broader shift in how communities use public libraries.", "question": "Which choice most effectively introduces the paragraph?", "choices": [{"letter": "A", "text": "Public libraries were first established in the United States in the nineteenth century."}, {"letter": "B", "text": "Modern public libraries have become far more than quiet places to borrow books."}, {"letter": "C", "text": "Many people enjoy reading fiction in their free time."}, {"letter": "D", "text": "This paragraph will discuss several government programs."}], "correctLetter": "B", "explanation": "B is correct: the paragraph's focus is on the expanded, non-book-lending services libraries now provide, and this sentence directly frames that shift. A is wrong because the historical founding date of libraries is off-topic for a paragraph about their modern expanded services. C is wrong because it discusses individual reading habits, which is unrelated to the specific library services described in the paragraph. D is wrong because it is vague, does not specifically introduce libraries, and mischaracterizes the topic as 'government programs' rather than library services.", "trick": "Ask 'what is this paragraph actually about?' before picking the opening or closing line."}, {"id": "NB-OD-9", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "The earliest bicycles, called velocipedes, had no pedals and were propelled by pushing one's feet against the ground. In 1861, the Michaux family in France added pedals directly to the front wheel, creating the first true pedal-driven bicycle. Later designs enlarged the front wheel dramatically to increase speed, producing the unstable 'penny-farthing.' The invention of the chain-driven 'safety bicycle' in the 1880s finally combined equal-sized wheels with practical gearing, making cycling safe and popular for the general public. ___________.", "question": "Which choice most effectively concludes the paragraph?", "choices": [{"letter": "A", "text": "Bicycles remain a popular mode of transportation in cities around the world today."}, {"letter": "B", "text": "This steady sequence of innovations transformed the bicycle from an unstable novelty into the practical, everyday machine we recognize today."}, {"letter": "C", "text": "Many professional cyclists now use bicycles made of carbon fiber."}, {"letter": "D", "text": "The Michaux family also manufactured other mechanical goods in France."}], "correctLetter": "B", "explanation": "B is correct: the paragraph traces a chronological sequence of design innovations leading to the modern bicycle, and this sentence wraps up that specific developmental arc. A is wrong because it is too broad and generic, failing to tie back to the specific sequence of innovations just described. C is wrong because it introduces new, unrelated information about modern materials rather than concluding the historical sequence. D is wrong because it is a tangential fact about the Michaux family's other products, unrelated to the paragraph's focus on bicycle design evolution.", "trick": "Ask 'what is this paragraph actually about?' before picking the opening or closing line."}, {"id": "NB-OD-10", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "___________. Traffic noise near highways has been shown to reduce the range at which songbirds can hear one another's mating calls, forcing some species to sing at higher pitches or abandon otherwise suitable habitat. Underwater, shipping noise interferes with whales' ability to use echolocation and long-distance calls to find food and mates. Even seemingly minor sources, like recreational boat engines, can disrupt fish spawning behavior in shallow coastal waters.", "question": "Which choice most effectively introduces the paragraph?", "choices": [{"letter": "A", "text": "Human-generated noise is increasingly recognized as a serious threat to wildlife across many habitats."}, {"letter": "B", "text": "Many animals communicate using sound in ways that scientists are still working to fully understand."}, {"letter": "C", "text": "National parks were created in part to preserve habitats from human development."}, {"letter": "D", "text": "Whales are among the largest animals to have ever lived on Earth."}], "correctLetter": "A", "explanation": "A is correct: the paragraph gives multiple specific examples of noise pollution disrupting wildlife across different habitats, and this sentence directly frames that overarching topic. B is wrong because it focuses on animal communication in general, not specifically on noise pollution as a threat. C is wrong because it discusses national parks and habitat preservation broadly, unrelated to the noise-specific examples that follow. D is wrong because it is an isolated fact about whale size, unrelated to the paragraph's focus on noise disruption.", "trick": "Ask 'what is this paragraph actually about?' before picking the opening or closing line."}];
const QUESTIONS_BY_ID = {};
ALL_QUESTIONS.forEach(q => { QUESTIONS_BY_ID[q.id] = q; });

let db = null;
let allAttempts = [];
let currentFilter = 'all'; // all | 7 | 30
const MISSED_SHOW_STEP = 20;
let missedShowCount = MISSED_SHOW_STEP;

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initFirebaseAndLoad();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function initFirebaseAndLoad() {
  if (!FIREBASE_CONFIGURED) {
    document.getElementById('content').innerHTML = `<div class="errBox">
      This dashboard isn't connected to a Firebase project yet. Once the drills app's Firebase
      config is filled in and this file is rebuilt, results will show up here automatically.
    </div>`;
    document.getElementById('lastUpdated').textContent = 'Not connected';
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch (e) {
    showError('Could not connect to Firebase: ' + e.message);
    return;
  }
  loadData();
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="errBox">${escapeHtml(msg)}</div>`;
  document.getElementById('lastUpdated').textContent = 'Error loading data';
}

function loadData() {
  if (!db) return;
  document.getElementById('content').innerHTML = '<div class="loading">Loading progress data…</div>';
  db.collection(ATTEMPTS_COLLECTION).orderBy('ts', 'asc').get().then(snap => {
    allAttempts = [];
    snap.forEach(doc => {
      const d = doc.data();
      allAttempts.push({
        ts: d.ts && d.ts.toDate ? d.ts.toDate() : null,
        sessionId: d.sessionId || 'unknown',
        questionId: d.questionId,
        concept: d.concept,
        subtype: d.subtype,
        chosenLetter: d.chosenLetter || null,
        correct: !!d.correct,
      });
    });
    document.getElementById('lastUpdated').textContent = `Last updated ${new Date().toLocaleString()} · ${allAttempts.length} total answers logged`;
    renderAll();
  }).catch(e => {
    showError('Could not load data from Firestore: ' + e.message + ' (check that Firestore rules allow read access, and that the project is set up correctly).');
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function setFilter(f) {
  currentFilter = f;
  missedShowCount = MISSED_SHOW_STEP;
  renderAll();
}

function toggleMissedItem(domId) {
  const el = document.getElementById(domId);
  if (el) el.classList.toggle('open');
}

function showMoreMissed() {
  missedShowCount += MISSED_SHOW_STEP;
  renderAll();
}

function filteredAttempts() {
  if (currentFilter === 'all') return allAttempts;
  const days = currentFilter === '7' ? 7 : 30;
  const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);
  return allAttempts.filter(a => a.ts && a.ts >= cutoff);
}

function barClass(pct) {
  if (pct < 70) return 'weak';
  if (pct < 85) return 'mid';
  return 'strong';
}
function pillClass(pct) {
  if (pct < 70) return 'bad';
  if (pct < 85) return 'mid';
  return 'good';
}

function renderMissedItem(m) {
  const q = m.q;
  const domId = 'missed-' + String(m.qid).replace(/[^a-zA-Z0-9_-]/g, '_');
  const dateStr = m.lastTs ? m.lastTs.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) : '—';
  const metaStr = `${dateStr}${m.count > 1 ? ' · missed ' + m.count + '×' : ''}`;

  if (!q) {
    // Question not found in the current bank (id mismatch, or bank changed since this was logged).
    return `
      <div class="missed-item" id="${domId}">
        <div class="missed-head">
          <span class="chip">${escapeHtml(m.concept || '—')}</span>
          <span class="stem">Question ${escapeHtml(m.qid)} (no longer in the current question bank)</span>
          <span class="meta">${metaStr}</span>
        </div>
      </div>
    `;
  }

  const stemPreview = q.question.length > 70 ? q.question.slice(0, 70) + '…' : q.question;
  const choicesHtml = q.choices.map(c => {
    const isHerPick = c.letter === m.lastChosenLetter;
    const isRight = c.letter === q.correctLetter;
    const cls = isRight ? 'right-answer' : (isHerPick ? 'her-pick' : '');
    const tag = isRight ? 'Correct answer' : (isHerPick ? 'Her answer' : '');
    return `
      <div class="missed-choice ${cls}">
        <span class="ltr">${c.letter}</span><span>${escapeHtml(c.text)}</span>
        ${tag ? `<span class="tag">${tag}</span>` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="missed-item" id="${domId}">
      <div class="missed-head" onclick="toggleMissedItem('${domId}')">
        <span class="chip">${escapeHtml(q.concept)}</span>
        <span class="stem">${escapeHtml(stemPreview)}</span>
        <span class="meta">${metaStr}</span>
        <span class="caret">▶</span>
      </div>
      <div class="missed-body">
        <div class="missed-passage">${q.passage}</div>
        <div class="missed-qstem">${escapeHtml(q.question)}</div>
        ${choicesHtml}
        <div class="missed-explain">${escapeHtml(q.explanation)}</div>
        <div class="missed-trick"><b>Rule / Memory Trick:</b> ${escapeHtml(q.trick)}</div>
      </div>
    </div>
  `;
}

function renderAll() {
  const data = filteredAttempts();
  const container = document.getElementById('content');

  if (allAttempts.length === 0) {
    container.innerHTML = `<div class="card"><div class="empty">No practice sessions logged yet. Once Jordan answers questions in the drills app, they'll show up here.</div></div>`;
    return;
  }

  const total = data.length;
  const correct = data.filter(a => a.correct).length;
  const overallPct = total ? Math.round((correct/total)*100) : 0;
  const sessionIds = new Set(data.map(a => a.sessionId));

  const byConcept = {};
  data.forEach(a => {
    byConcept[a.concept] = byConcept[a.concept] || { n: 0, c: 0 };
    byConcept[a.concept].n++;
    if (a.correct) byConcept[a.concept].c++;
  });
  const conceptRows = CONCEPT_ORDER
    .filter(c => byConcept[c])
    .map(c => ({ concept: c, ...byConcept[c], pct: Math.round((byConcept[c].c/byConcept[c].n)*100) }))
    .sort((a,b) => a.pct - b.pct);

  const bySession = {};
  data.forEach(a => {
    bySession[a.sessionId] = bySession[a.sessionId] || { n: 0, c: 0, first: a.ts, last: a.ts };
    bySession[a.sessionId].n++;
    if (a.correct) bySession[a.sessionId].c++;
    if (a.ts && (!bySession[a.sessionId].first || a.ts < bySession[a.sessionId].first)) bySession[a.sessionId].first = a.ts;
    if (a.ts && (!bySession[a.sessionId].last || a.ts > bySession[a.sessionId].last)) bySession[a.sessionId].last = a.ts;
  });
  const sessionRows = Object.entries(bySession)
    .map(([id, s]) => ({ id, ...s, pct: Math.round((s.c/s.n)*100) }))
    .sort((a,b) => (b.first || 0) - (a.first || 0))
    .slice(0, 15);

  const missedByQuestion = {};
  data.filter(a => !a.correct).forEach(a => {
    const m = missedByQuestion[a.questionId] || { count: 0, lastTs: null, lastChosenLetter: null, concept: a.concept, subtype: a.subtype };
    m.count++;
    if (!m.lastTs || (a.ts && a.ts > m.lastTs)) {
      m.lastTs = a.ts;
      m.lastChosenLetter = a.chosenLetter;
      m.concept = a.concept;
      m.subtype = a.subtype;
    }
    missedByQuestion[a.questionId] = m;
  });
  const missedTotal = data.filter(a => !a.correct).length;
  const missedRows = Object.entries(missedByQuestion)
    .map(([qid, m]) => ({ qid, ...m, q: QUESTIONS_BY_ID[qid] || null }))
    .sort((a,b) => (b.lastTs || 0) - (a.lastTs || 0));
  if (missedShowCount > missedRows.length) missedShowCount = Math.max(MISSED_SHOW_STEP, missedRows.length);

  container.innerHTML = `
    <div class="filterRow">
      <button class="${currentFilter==='all'?'active':''}" onclick="setFilter('all')">All Time</button>
      <button class="${currentFilter==='30'?'active':''}" onclick="setFilter('30')">Last 30 Days</button>
      <button class="${currentFilter==='7'?'active':''}" onclick="setFilter('7')">Last 7 Days</button>
    </div>

    <div class="card">
      <div class="stat-row">
        <div class="stat-box"><div class="num">${overallPct}%</div><div class="lbl">Overall Accuracy</div></div>
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">Questions Answered</div></div>
        <div class="stat-box"><div class="num">${sessionIds.size}</div><div class="lbl">Sessions</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Accuracy by Concept</h2>
      ${conceptRows.map(r => `
        <div class="cat-row">
          <span class="name">${escapeHtml(r.concept)}</span>
          <div class="bar-wrap"><div class="bar ${barClass(r.pct)}" style="width:${r.pct}%"></div></div>
          <span class="pct">${r.c}/${r.n} (${r.pct}%)</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Recent Sessions</h2>
      <table class="sessions">
        <thead><tr><th>Date</th><th>Questions</th><th>Score</th></tr></thead>
        <tbody>
          ${sessionRows.map(s => `
            <tr>
              <td>${s.first ? s.first.toLocaleDateString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—'}</td>
              <td>${s.n}</td>
              <td><span class="pill ${pillClass(s.pct)}">${s.c}/${s.n} · ${s.pct}%</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Questions Missed</h2>
      ${missedRows.length === 0 ? `
        <div class="empty">No missed questions in this period — great job!</div>
      ` : `
        <div class="missed-summary">${missedRows.length} question${missedRows.length===1?'':'s'} missed (${missedTotal} incorrect answer${missedTotal===1?'':'s'}) in this period. Click a question to see the full passage, her answer, the correct answer, and the explanation.</div>
        ${missedRows.slice(0, missedShowCount).map(m => renderMissedItem(m)).join('')}
        ${missedRows.length > missedShowCount ? `<button class="showMoreBtn" onclick="showMoreMissed()">Show ${Math.min(MISSED_SHOW_STEP, missedRows.length - missedShowCount)} more (${missedRows.length - missedShowCount} remaining)</button>` : ''}
      `}
    </div>
  `;
}
</script>
</body>
</html>
