<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan's ACT English Drills</title>
<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #14344f;
    --green: #1a7f4e;
    --red: #b3261e;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d9e0e8;
    --text: #1c2733;
    --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  header { padding: 20px 4px 8px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }

  /* --- Gate --- */
  #gate { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  #gate .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 10px rgba(20,52,79,0.08); }
  #gate h2 { margin: 0 0 12px; color: var(--navy-dark); font-size: 1.15rem; }
  #gate input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  #gate button, .btn-primary { background: var(--navy); color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  #gate button:active, .btn-primary:active { background: var(--navy-dark); }
  #gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }

  /* --- Setup panel --- */
  #app { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--navy-dark); }
  .group-title { font-weight: 600; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .group-title:first-child { margin-top: 0; }
  label.chk { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 0.98rem; }
  label.chk:active { background: var(--bg); }
  label.chk input { width: 18px; height: 18px; accent-color: var(--navy); flex-shrink: 0; }
  label.chk .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
  .quick-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .quick-btns button { flex: 1; min-width: 110px; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 9px 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .quick-btns button:active { background: #dbe6f2; }
  .start-row { margin-top: 16px; }
  #startBtn { font-size: 1.05rem; padding: 14px; font-weight: 600; }
  #startBtn:disabled { background: #a9b7c4; cursor: not-allowed; }
  .selCount { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  /* --- Quiz --- */
  #quiz { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .topbar .tag { background: #eaf0f7; color: var(--navy-dark); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .score-panel { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
  .score-panel b { color: var(--navy-dark); }
  .passage { background: #fbfbfd; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 1rem; line-height: 1.6; margin-bottom: 14px; white-space: pre-wrap; }
  .passage u { text-decoration: underline; text-decoration-color: var(--navy); text-decoration-thickness: 2px; }
  .qstem { font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .choice { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; font-size: 0.97rem; cursor: pointer; line-height: 1.4; }
  .choice:active { background: var(--bg); }
  .choice .ltr { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--bg); color: var(--navy-dark); font-weight: 700; font-size: 0.8rem; margin-right: 10px; }
  .choice.correct { border-color: var(--green); background: #eaf7ef; }
  .choice.correct .ltr { background: var(--green); color: #fff; }
  .choice.incorrect { border-color: var(--red); background: #fbeceb; }
  .choice.incorrect .ltr { background: var(--red); color: #fff; }
  .choice.disabled { cursor: default; }
  .choice.dim { opacity: 0.55; }
  .feedback { margin-top: 14px; padding: 14px; border-radius: 10px; }
  .feedback.good { background: #eaf7ef; border: 1px solid #bfe3cc; }
  .feedback.bad { background: #fbeceb; border: 1px solid #f0c6c3; }
  .feedback .verdict { font-weight: 700; margin-bottom: 6px; }
  .feedback .verdict.good { color: var(--green); }
  .feedback .verdict.bad { color: var(--red); }
  .feedback .explain { font-size: 0.93rem; line-height: 1.5; margin-bottom: 10px; }
  .feedback .trick { background: #fff; border-left: 3px solid var(--navy); border-radius: 6px; padding: 10px 12px; font-size: 0.9rem; line-height: 1.5; }
  .feedback .trick b { color: var(--navy-dark); }
  #nextBtn { margin-top: 14px; }
  .concept-chip { display:inline-block; background:#eaf0f7; color:var(--navy-dark); font-size:0.72rem; font-weight:600; padding:3px 9px; border-radius:999px; margin-bottom:10px; }

  .footer-nav { display: flex; gap: 10px; margin-top: 4px; }
  .footer-nav button { flex: 1; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; }

  .banner { background: #fff7e0; border: 1px solid #f0dfa0; color: #7a5b00; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }

  /* --- Summary --- */
  #summary { display: none; }
  .summary-score { text-align: center; padding: 10px 0 18px; }
  .summary-score .big { font-size: 2.4rem; font-weight: 700; color: var(--navy-dark); }
  .summary-score .sub { color: var(--muted); font-size: 0.9rem; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .bar-wrap { flex: 1; margin: 0 10px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-row .bar { height: 100%; background: var(--navy); }
  .cat-row .pct { width: 46px; text-align: right; color: var(--muted); }

  @media (max-width: 400px) {
    .quick-btns button { min-width: 90px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Jordan's ACT English Drills</h2>
    <input id="pwInput" type="password" placeholder="Enter passcode" autocomplete="off">
    <button onclick="checkPasscode()">Enter</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <h1>Jordan's ACT English Drills</h1>
    <p>Pick the concepts to focus on, then start drilling. No repeats within a set.</p>
  </header>

  <div class="card" id="setup">
    <h2>Choose concepts</h2>
    <div class="quick-btns">
      <button onclick="selectPreset('weak')">Focus: Weak Areas</button>
      <button onclick="selectPreset('all')">Select All</button>
      <button onclick="selectPreset('none')">Clear All</button>
    </div>
    <div id="checkboxList"></div>
    <div class="selCount" id="selCount"></div>
    <div class="start-row">
      <button id="startBtn" class="btn-primary" onclick="startQuiz()" disabled>Start Drilling</button>
    </div>
  </div>

  <div id="quiz">
    <div class="topbar">
      <span class="tag" id="progressTag"></span>
      <div class="score-panel">
        <span>Session: <b id="scoreText">0/0</b></span>
      </div>
    </div>
    <div class="card">
      <div id="qBody"></div>
    </div>
    <div class="footer-nav">
      <button onclick="endSession()">End &amp; See Summary</button>
      <button onclick="backToSetup()">Change Concepts</button>
    </div>
  </div>

  <div id="summary">
    <div class="card">
      <h2>Session Summary</h2>
      <div class="summary-score">
        <div class="big" id="sumBig">0%</div>
        <div class="sub" id="sumSub">0 of 0 correct</div>
      </div>
      <div id="sumCats"></div>
    </div>
    <div class="footer-nav">
      <button onclick="backToSetup()">Choose New Concepts</button>
      <button onclick="restartSameFilters()">Drill Again (Same Concepts)</button>
    </div>
  </div>
</div>

<script>
const PASSCODE = "ACTJORDAN26";
const ALL_QUESTIONS = [{"id": "GU-SVA-1", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The migration patterns of the monarch butterfly, tracked by volunteers across three countries, <u>remains</u> one of the most studied phenomena in entomology.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "remain"}, {"letter": "C", "text": "is remaining"}, {"letter": "D", "text": "was remaining"}], "correctLetter": "B", "explanation": "B is correct: the subject of the verb is the plural noun \u201cpatterns,\u201d not the singular \u201cmonarch butterfly\u201d sitting closer to the verb \u2014 a plural subject needs the plural verb \u201cremain.\u201d A is singular. C and D are also singular and add an illogical progressive tense.", "trick": "Find the TRUE subject of the verb, crossing out any prepositional phrase or descriptive clause sitting between the subject and the verb. Trick: \"Cross out the middleman \u2014 words between subject and verb don't count for agreement.\""}, {"id": "GU-SVA-2", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The head chef, along with her three sous chefs, <u>have developed</u> a tasting menu that changes weekly.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "has developed"}, {"letter": "C", "text": "develop"}, {"letter": "D", "text": "developing"}], "correctLetter": "B", "explanation": "B is correct: the true subject is the singular \u201cchef\u201d \u2014 the phrase \u201calong with her three sous chefs\u201d is a parenthetical aside and doesn't make the subject plural. A and C use plural verb forms. D creates a fragment.", "trick": "Find the TRUE subject of the verb, crossing out any prepositional phrase or descriptive clause sitting between the subject and the verb. Trick: \"Cross out the middleman \u2014 words between subject and verb don't count for agreement.\""}, {"id": "GU-SVA-3", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "Each of the reef's coral colonies <u>contain</u> thousands of tiny, genetically identical polyps.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "contains"}, {"letter": "C", "text": "containing"}, {"letter": "D", "text": "have contained, and"}], "correctLetter": "B", "explanation": "B is correct: the subject is the singular pronoun \u201cEach,\u201d not the plural \u201ccolonies\u201d in the prepositional phrase between subject and verb. A uses a plural verb. C creates a fragment. D is needlessly wordy and grammatically broken.", "trick": "Find the TRUE subject of the verb, crossing out any prepositional phrase or descriptive clause sitting between the subject and the verb. Trick: \"Cross out the middleman \u2014 words between subject and verb don't count for agreement.\""}, {"id": "GU-PAA-1", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "A honeybee colony can contain up to 60,000 individual bees, but <u>they</u> function as a single, coordinated organism.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "their"}, {"letter": "D", "text": "its"}], "correctLetter": "B", "explanation": "B is correct: \u201ccolony\u201d is a singular collective noun, so it needs the singular subject pronoun \u201cit.\u201d A is plural. C and D are possessive-case pronouns, the wrong case for this spot in the sentence.", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "GU-PAA-2", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The wolf pack claims a territory of up to fifty square miles and defends <u>their</u> boundaries against rival packs.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "it's"}, {"letter": "D", "text": "the pack's own"}], "correctLetter": "B", "explanation": "B is correct: \u201cpack\u201d is singular, so it needs the singular possessive \u201cits.\u201d A is plural. C (\u201cit is\u201d) doesn't fit as a possessive. D is redundant, since \u201cthe pack\u201d is already the subject of the sentence.", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "GU-PAA-3", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The committee reviewed each application carefully, and <u>they</u> ultimately selected the ten strongest finalists.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "it's"}, {"letter": "D", "text": "its"}], "correctLetter": "B", "explanation": "B is correct: \u201ccommittee\u201d is a singular collective noun, so the pronoun referring to it must be singular \u2014 \u201cit.\u201d A is plural. C is a contraction of \u201cit is,\u201d not a subject pronoun for this spot. D is possessive, the wrong case.", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "GU-PC-1", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The award for the season's best design was given to both the lead engineer and <u>she</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "her"}, {"letter": "C", "text": "herself"}, {"letter": "D", "text": "hers"}], "correctLetter": "B", "explanation": "B is correct: the pronoun is the object of the preposition \u201cto,\u201d so it needs the object case \u201cher.\u201d A uses the subject case incorrectly. C (reflexive) has no action to reflect back onto. D (possessive) doesn't fit the sentence's meaning.", "trick": "Use subject pronouns (I/he/she/they/who) when the pronoun performs the action, and object pronouns (me/him/her/them/whom) when it receives the action. Trick: \"Say it out loud in the simplest form \u2014 your ear usually knows.\""}, {"id": "GU-VT-1", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time the expedition reached the summit, three climbers already <u>turn back</u> due to altitude sickness.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "turned back"}, {"letter": "C", "text": "had turned back"}, {"letter": "D", "text": "have turned back"}], "correctLetter": "C", "explanation": "C is correct: the past perfect \u201chad turned back\u201d correctly shows that the climbers turning back happened before the expedition's later action of reaching the summit \u2014 an earlier event within the past. A and B don't establish that sequence. D uses present perfect, the wrong timeframe.", "trick": "Keep verb tense consistent with the timeline the sentence has already established. Trick: \"Find the anchor verb nearby and match its timeframe.\""}, {"id": "GU-VT-2", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Conservators examining the manuscript concluded that centuries of humidity <u>has warped</u> its wooden covers long before the book reached the museum.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "warp"}, {"letter": "C", "text": "had warped"}, {"letter": "D", "text": "will warp"}], "correctLetter": "C", "explanation": "C is correct: the warping happened before the book reached the museum \u2014 an earlier past event relative to another past event \u2014 which calls for the past perfect \u201chad warped.\u201d A is present tense. B is present tense as well. D is future tense, which contradicts the sentence's timeline entirely.", "trick": "Keep verb tense consistent with the timeline the sentence has already established. Trick: \"Find the anchor verb nearby and match its timeframe.\""}, {"id": "GU-CS-1", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of the Amazon and the Nile, the Nile is traditionally considered the <u>longest</u> river in the world, though satellite measurements have challenged that ranking.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "longer"}, {"letter": "C", "text": "more long"}, {"letter": "D", "text": "most long"}], "correctLetter": "B", "explanation": "B is correct: the sentence compares exactly two rivers, which calls for the comparative form \u201clonger,\u201d not the superlative \u201clongest.\u201d C and D are also incorrect, nonstandard comparative forms.", "trick": "Use the comparative form (-er / more) for exactly two things, superlative (-est / most) for three or more. Trick: \"Two things = -er, three-plus things = -est.\""}, {"id": "PU-CNI-1", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The novel, which took the author nearly a decade to <u>write</u> became an instant bestseller upon its release.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "write,"}, {"letter": "C", "text": "write;"}, {"letter": "D", "text": "write, and"}], "correctLetter": "B", "explanation": "B is correct: the nonessential clause \u201cwhich took the author nearly a decade to write\u201d was opened with a comma after \u201cnovel\u201d and must be closed with a comma too. A leaves it unclosed. C uses a semicolon, which requires an independent clause before it. D adds an illogical conjunction.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "PU-CNI-2", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "Rosalind <u>Franklin</u> whose X-ray images were critical to discovering DNA's structure, rarely received credit during her lifetime.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Franklin,"}, {"letter": "C", "text": "Franklin;"}, {"letter": "D", "text": "Franklin -"}], "correctLetter": "B", "explanation": "B is correct: the nonessential clause \u201cwhose X-ray images were critical to discovering DNA's structure\u201d needs a comma on both sides; the closing comma is already there, so the opening comma after \u201cFranklin\u201d is required. A leaves it unopened. C and D use punctuation that doesn't pair with the closing comma.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "PU-CNI-3", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The bridge, completed in <u>1937 remains</u> one of the most photographed structures in the country.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "1937, remains"}, {"letter": "C", "text": "1937; remains"}, {"letter": "D", "text": "1937 remains,"}], "correctLetter": "B", "explanation": "B is correct: the nonessential phrase \u201ccompleted in 1937\u201d must be closed with a comma before \u201cremains,\u201d matching the comma that opened it after \u201cbridge.\u201d A leaves it unclosed. C and D place the punctuation in the wrong spot.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "PU-AP-1", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The sanctuary carefully tracks each elephant's diet, since <u>it's</u> nutritional needs shift dramatically with age.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "its'"}, {"letter": "D", "text": "their"}], "correctLetter": "B", "explanation": "B is correct: the sentence needs the possessive \u201cits\u201d (no apostrophe). A is the contraction \u201cit is,\u201d which doesn't make sense here. C is not a standard word. D is plural and doesn't agree with the singular \u201celephant.\u201d", "trick": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural. Trick: \"Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "PU-AP-2", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The mechanic replaced the <u>engines</u> original carburetor with a modern replica.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "engine's"}, {"letter": "C", "text": "engines'"}, {"letter": "D", "text": "engine's'"}], "correctLetter": "B", "explanation": "B is correct: the sentence needs the singular possessive \u201cengine's.\u201d A has no apostrophe at all. C is the plural possessive, but there's only one engine. D is not a standard form.", "trick": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural. Trick: \"Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "PU-DP-1", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The sculpture\u2014assembled from over a thousand recycled bicycle <u>parts,</u> took the artist nearly two years to complete.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "parts\u2014"}, {"letter": "C", "text": "parts;"}, {"letter": "D", "text": "parts"}], "correctLetter": "B", "explanation": "B is correct: the phrase was opened with a dash after \u201csculpture\u201d and must be closed with a matching dash, not a comma. A mismatches the punctuation. C and D also fail to match the opening dash.", "trick": "Punctuation marks that set off a nonessential phrase must match on both ends \u2014 two dashes, two commas, or two parentheses, never mixed. Trick: \"Punctuation bookends must match.\""}, {"id": "PU-DP-2", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The tournament's youngest competitor, a twelve-year-old from <u>Ohio\u2014</u>stunned the reigning champion in just twenty-two moves.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Ohio,"}, {"letter": "C", "text": "Ohio;"}, {"letter": "D", "text": "Ohio"}], "correctLetter": "B", "explanation": "B is correct: the nonessential phrase \u201ca twelve-year-old from Ohio\u201d was opened with a comma after \u201ccompetitor\u201d and must be closed with a comma, not a dash. A mismatches the punctuation. C and D also fail to match.", "trick": "Punctuation marks that set off a nonessential phrase must match on both ends \u2014 two dashes, two commas, or two parentheses, never mixed. Trick: \"Punctuation bookends must match.\""}, {"id": "PU-CS-1", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Elite marathoners follow a strict pre-race <u>routine; carbohydrate</u> loading, controlled hydration, and a full night's rest.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "routine, carbohydrate"}, {"letter": "C", "text": "routine: carbohydrate"}, {"letter": "D", "text": "routine carbohydrate"}], "correctLetter": "C", "explanation": "C is correct: a colon correctly introduces a list after a complete independent clause (\u201cElite marathoners follow a strict pre-race routine\u201d). A's semicolon requires an independent clause after it, which this isn't. B's comma can't properly introduce a list this way. D is missing punctuation entirely.", "trick": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence. Trick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "PU-CS-2", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Kilauea has erupted almost continuously since <u>1983, it</u> remains one of the most active volcanoes on Earth.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "1983; it"}, {"letter": "C", "text": "1983, and, it"}, {"letter": "D", "text": "1983 it"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins two independent clauses without a conjunction. A is a comma splice. C has an unnecessary extra comma around \u201cand.\u201d D fuses the clauses with no punctuation at all.", "trick": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence. Trick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "PU-UP-1", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The chef <u>seasons, the</u> fish with a blend of citrus zest and fresh herbs before searing it.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "seasons the"}, {"letter": "C", "text": "seasons; the"}, {"letter": "D", "text": "seasons: the"}], "correctLetter": "B", "explanation": "B is correct: no punctuation is needed between the verb \u201cseasons\u201d and its direct object \u201cthe fish.\u201d A inserts an unnecessary comma. C and D insert punctuation marks that have no grammatical job here.", "trick": "Don't add punctuation just because you'd pause there when speaking \u2014 every mark needs a grammatical job. Trick: \"When in doubt, leave it out.\""}, {"id": "SS-RO-1", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The old lighthouse keeper refused to leave during the <u>storm, he</u> had weathered forty years of Atlantic gales without incident.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "storm; he"}, {"letter": "C", "text": "storm, and, he"}, {"letter": "D", "text": "storm he"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins the two independent clauses. A is a comma splice. C has an unneeded extra comma around \u201cand.\u201d D fuses the clauses together with no punctuation, creating a run-on.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "SS-RO-2", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The two founders met in a college dorm <u>room, within</u> five years their company was worth over a billion dollars.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "room. Within"}, {"letter": "C", "text": "room, and, within"}, {"letter": "D", "text": "room within"}], "correctLetter": "B", "explanation": "B is correct: ending the first independent clause with a period creates two clean, complete sentences. A is a comma splice. C has an unneeded extra comma around \u201cand.\u201d D fuses the clauses with no punctuation, creating a run-on.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "SS-RO-3", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The canal was celebrated as a marvel of <u>engineering, soon</u> it could no longer handle the volume of modern shipping traffic.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "engineering, but soon"}, {"letter": "C", "text": "engineering soon"}, {"letter": "D", "text": "engineering; and soon"}], "correctLetter": "B", "explanation": "B is correct: \u201csoon\u201d is just an adverb and can't join two independent clauses by itself, but adding the coordinating conjunction \u201cbut\u201d after the comma legally joins them. A is a comma splice. C fuses the clauses with no punctuation. D pairs a semicolon with a conjunction, which is not a standard construction \u2014 a semicolon replaces the comma+conjunction, it doesn't combine with one.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "SS-SF-1", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Working entirely in black and white.</u> The photographer captured the raw emotion of the protest march.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Working entirely in black and white,"}, {"letter": "C", "text": "She worked entirely in black and white,"}, {"letter": "D", "text": "Worked entirely in black and white"}], "correctLetter": "B", "explanation": "B is correct: attaching the introductory participial phrase to the main clause with a comma fixes the fragment. A stands alone as an incomplete sentence. C creates a new comma splice (two independent clauses joined by only a comma). D is still missing a subject and remains a fragment.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "SS-SF-2", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Which analyzes seismic data from over two hundred monitoring stations across the Pacific Rim.</u> The research team can often predict eruptions weeks in advance.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "By analyzing seismic data from over two hundred monitoring stations across the Pacific Rim,"}, {"letter": "C", "text": "Analyzes seismic data from over two hundred monitoring stations across the Pacific Rim,"}, {"letter": "D", "text": "It analyzing seismic data from over two hundred monitoring stations across the Pacific Rim,"}], "correctLetter": "B", "explanation": "B is correct: turning the fragment into an introductory phrase (\u201cBy analyzing...\u201d) correctly attaches it to the main clause \u201cthe research team can often predict eruptions.\u201d A is a fragment on its own (a relative clause with no independent clause to attach to). C is also a fragment, missing a subject. D pairs \u201cIt\u201d with a bare -ing verb, which still doesn't form a complete, correctly attached clause.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "SS-SF-3", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Featuring native plants, walking trails, and a redesigned amphitheater.</u> The renovated park reopened to the public last spring.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Featuring native plants, walking trails, and a redesigned amphitheater,"}, {"letter": "C", "text": "It featured native plants, walking trails, and a redesigned amphitheater,"}, {"letter": "D", "text": "Feature native plants, walking trails, and a redesigned amphitheater"}], "correctLetter": "B", "explanation": "B is correct: attaching the participial phrase with a comma to the main clause fixes the fragment. A stands alone as an incomplete sentence. C creates a comma splice (two independent clauses joined only by a comma). D is not a complete, correctly formed clause either.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "SS-PS-1", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Her training regimen includes swimming at dawn, biking at noon, and <u>to run</u> in the evening.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "running"}, {"letter": "C", "text": "she runs"}, {"letter": "D", "text": "the running of"}], "correctLetter": "B", "explanation": "B is correct: the list already uses the -ing form twice (\u201cswimming,\u201d \u201cbiking\u201d), so the third item must match with \u201crunning.\u201d A breaks the pattern with an infinitive. C breaks it with a full clause. D breaks it with an awkward noun phrase.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "SS-PS-2", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "A strong leader listens carefully, communicates clearly, and <u>shows that they make decisive decisions</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "decides decisively"}, {"letter": "C", "text": "is decisive with decisions"}, {"letter": "D", "text": "making decisions in a decisive way"}], "correctLetter": "B", "explanation": "B is correct: the list uses simple present-tense verbs (\u201clistens,\u201d \u201ccommunicates\u201d), so the third item should match with \u201cdecides decisively.\u201d A breaks the parallel pattern with a wordy clause. C breaks it with a linking-verb construction. D breaks it with a gerund phrase.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "SS-MP-1", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Buried beneath layers of volcanic ash, <u>scientists discovered the remarkably preserved fossil</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the remarkably preserved fossil was discovered by scientists"}, {"letter": "C", "text": "scientists, discovering the remarkably preserved fossil,"}, {"letter": "D", "text": "it was a remarkable discovery for scientists"}], "correctLetter": "B", "explanation": "B is correct: the introductory phrase \u201cBuried beneath layers of volcanic ash\u201d logically describes the fossil, not the scientists \u2014 rephrasing in the passive voice puts \u201cthe fossil\u201d immediately after the modifier, where it belongs. A illogically implies the scientists were buried in ash. C still puts \u201cscientists\u201d right after the modifier. D never brings the fossil close to the modifier at all.", "trick": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing \u2014 otherwise it \"dangles\" and attaches to the wrong thing. Trick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "SS-MP-2", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "After spending three months carving a single instrument, <u>the violin's rich tone amazed the luthier's customers</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the luthier amazed customers with the violin's rich tone"}, {"letter": "C", "text": "customers were amazed, the luthier's violin had a rich tone"}, {"letter": "D", "text": "amazing customers was the violin's rich tone"}], "correctLetter": "B", "explanation": "B is correct: the introductory phrase \u201cAfter spending three months carving a single instrument\u201d logically describes the luthier, who did the carving \u2014 B correctly places \u201cthe luthier\u201d immediately after the modifier. A illogically implies the violin's tone did the carving. C creates a comma splice and still doesn't fix the modifier. D remains awkward and doesn't resolve who the modifier describes.", "trick": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing \u2014 otherwise it \"dangles\" and attaches to the wrong thing. Trick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "WC-1", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The new telescope can <u>see</u> galaxies that are over 13 billion light-years away.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "detect"}, {"letter": "C", "text": "spot"}, {"letter": "D", "text": "peek at"}], "correctLetter": "B", "explanation": "B is correct: \u201cdetect\u201d precisely describes how a telescope registers extremely faint, distant light using instruments, fitting the essay's technical register. A, C, and D all imply casual, direct human seeing, which doesn't accurately describe the process.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "WC-2", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Sea otters use rocks to <u>break</u> open shellfish, a rare example of tool use among marine mammals.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "crack"}, {"letter": "C", "text": "split"}, {"letter": "D", "text": "smash"}], "correctLetter": "B", "explanation": "B is correct: \u201ccrack\u201d precisely captures the controlled, repeated tapping otters use to open shells without destroying the contents. A is too vague. C wrongly implies the shell divides evenly in two. D wrongly implies excessive, destructive force.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "WC-3", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Conservators used a soft brush to <u>get rid of</u> centuries of grime from the mural's surface.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "remove"}, {"letter": "C", "text": "eliminate"}, {"letter": "D", "text": "erase"}], "correctLetter": "B", "explanation": "B is correct: \u201cremove\u201d is the precise, standard term for physically taking grime off a surface. A is too casual for the passage's technical register. C is too abstract for a physical substance. D implies rubbing away marks like pencil, not grime.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "WC-4", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Engineers designed the suspension cables to <u>handle</u> the immense weight of daily traffic.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "bear"}, {"letter": "C", "text": "hold"}, {"letter": "D", "text": "deal with"}], "correctLetter": "B", "explanation": "B is correct: \u201cbear\u201d is the precise engineering term for a structure supporting sustained weight. A and D are vague and casual. C doesn't capture the sustained structural function being described.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "WC-5", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Meteorologists use satellite data to <u>figure out</u> a storm's likely path.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "determine"}, {"letter": "C", "text": "guess"}, {"letter": "D", "text": "work out"}], "correctLetter": "B", "explanation": "B is correct: \u201cdetermine\u201d precisely conveys a data-driven, technical prediction process appropriate to meteorology. A and D are too casual. C wrongly implies the process lacks a scientific basis.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "WC-6", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The glacier <u>goes</u> forward roughly two feet per day, a pace too slow to observe directly.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "advances"}, {"letter": "C", "text": "walks"}, {"letter": "D", "text": "travels"}], "correctLetter": "B", "explanation": "B is correct: \u201cadvances\u201d precisely describes a glacier's slow, continuous forward movement in scientific writing. A is vague. C inappropriately personifies the glacier. D suggests a journey with a destination, which doesn't fit.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "ST-1", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The judge's ruling <u>totally changed the game for</u> how future cases involving digital privacy would be decided.", "question": "Which choice most effectively maintains the essay's formal, analytical tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "fundamentally reshaped"}, {"letter": "C", "text": "flipped the script on"}, {"letter": "D", "text": "shook things up for"}], "correctLetter": "B", "explanation": "B is correct: \u201cfundamentally reshaped\u201d matches the essay's formal, analytical register. A, C, and D are all casual, slangy phrases that clash with that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "ST-2", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Rising ocean temperatures have <u>wreaked absolute havoc on</u> coral reef ecosystems worldwide.", "question": "Which choice most effectively maintains the essay's measured, scientific tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "severely damaged"}, {"letter": "C", "text": "totally wrecked"}, {"letter": "D", "text": "been a nightmare for"}], "correctLetter": "B", "explanation": "B is correct: \u201cseverely damaged\u201d is precise and measured, matching a scientific register. A, C, and D are all overly dramatic or informal for that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "ST-3", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "After years of failed prototypes, the inventor finally <u>struck gold</u> with a design that worked.", "question": "Which choice most effectively maintains the essay's plain, unadorned tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "succeeded"}, {"letter": "C", "text": "hit the jackpot"}, {"letter": "D", "text": "found the magic formula"}], "correctLetter": "B", "explanation": "B is correct: \u201csucceeded\u201d is plain and direct, matching the essay's unadorned style. A, C, and D are all colorful idioms or clich\u00e9s out of step with that plain style.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "ST-4", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The economist's report <u>lays out</u> the data in a clear, methodical way, avoiding jargon whenever possible.", "question": "Which choice most effectively maintains the essay's plain, professional tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "throws down"}, {"letter": "C", "text": "spills out"}, {"letter": "D", "text": "dishes out"}], "correctLetter": "A", "explanation": "A is correct: \u201clays out\u201d is clear and appropriately plain, matching the report's straightforward, professional register. B, C, and D are all needlessly casual or idiomatic and clash with that register.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "ST-5", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The poet's early work <u>shows</u> a deep attentiveness to the natural world.", "question": "Which choice most effectively maintains the essay's restrained, literary tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "flaunts"}, {"letter": "C", "text": "is bursting with"}, {"letter": "D", "text": "positively overflows with"}], "correctLetter": "A", "explanation": "A is correct: \u201cshows\u201d is clear and fitting for the essay's more restrained tone. B, C, and D are all overwrought or melodramatic phrases that clash with that register.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "CR-1", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The wildfire spread <u>quickly and rapidly</u> across the dry hillside.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "quickly"}, {"letter": "C", "text": "in a quick and rapid way"}, {"letter": "D", "text": "rapidly and with speed"}], "correctLetter": "B", "explanation": "B is correct: \u201cquickly\u201d and \u201crapidly\u201d mean the same thing, so only one is needed. A, C, and D all repeat the same idea using extra words.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "CR-2", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The exhibit <u>combines together</u> historical artifacts with interactive digital displays.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "combines"}, {"letter": "C", "text": "combines and joins together"}, {"letter": "D", "text": "brings together and combines"}], "correctLetter": "B", "explanation": "B is correct: \u201ccombines\u201d already means \u201cbrings together,\u201d so \u201ctogether\u201d is redundant. A, C, and D all repeat the same idea unnecessarily.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "CR-3", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "This was <u>the first time that scientists had ever observed</u> the rare behavior.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the first time scientists observed"}, {"letter": "C", "text": "the first time that scientists had ever, at any point, observed"}, {"letter": "D", "text": "the very first initial time scientists observed"}], "correctLetter": "B", "explanation": "B is correct: \u201cever\u201d is redundant with \u201cfirst time,\u201d and \u201cthat\u201d can be dropped without losing clarity. A, C, and D all keep or add unnecessary repetition.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "CR-4", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The new assembly line <u>reduced production time down by</u> nearly 30 percent.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "reduced production time by"}, {"letter": "C", "text": "reduced down production time by"}, {"letter": "D", "text": "reduced and brought down production time by"}], "correctLetter": "B", "explanation": "B is correct: \u201creduced\u201d already means to bring down, so \u201cdown\u201d is redundant. A, C, and D all repeat that idea unnecessarily.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "CR-5", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Researchers <u>repeat the same experiment over and over again multiple times</u> to confirm their results.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "repeat the experiment multiple times"}, {"letter": "C", "text": "repeat the same experiment repeatedly, over and over"}, {"letter": "D", "text": "do the experiment again and again, multiple times over"}], "correctLetter": "B", "explanation": "B is correct: it eliminates the redundant repetition of \u201csame,\u201d \u201cover and over again,\u201d and \u201cmultiple times\u201d \u2014 all expressing the same idea. A, C, and D all keep multiple redundant phrases.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "TR-1", "concept": "Transitions", "subtype": "Transitions", "passage": "Habitat loss pushed the species to the brink of extinction by the 1980s. <u>However</u>, a captive breeding program has since helped the population recover significantly.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "For example,"}, {"letter": "C", "text": "Similarly,"}, {"letter": "D", "text": "As a result,"}], "correctLetter": "A", "explanation": "A is correct: \u201cHowever\u201d correctly signals the contrast between the earlier decline and the later recovery. B, C, and D don't fit that contrasting relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "TR-2", "concept": "Transitions", "subtype": "Transitions", "passage": "The city expanded its subway system in 2015. <u>Consequently</u>, daily ridership increased by nearly 40 percent within two years.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Meanwhile,"}, {"letter": "C", "text": "In contrast,"}, {"letter": "D", "text": "Nevertheless,"}], "correctLetter": "A", "explanation": "A is correct: \u201cConsequently\u201d correctly signals the cause-effect relationship between the expansion and the ridership increase. B, C, and D don't fit a cause-effect relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "TR-3", "concept": "Transitions", "subtype": "Transitions", "passage": "The team relied on satellite imagery to map deforestation. <u>In addition</u>, they conducted ground surveys to verify the satellite data.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Instead,"}, {"letter": "C", "text": "On the other hand,"}, {"letter": "D", "text": "Otherwise,"}], "correctLetter": "A", "explanation": "A is correct: \u201cIn addition\u201d correctly signals that the ground surveys were a second, complementary method \u2014 not a replacement or contrast. B, C, and D wrongly imply a contrast or substitution.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "TR-4", "concept": "Transitions", "subtype": "Transitions", "passage": "The musician spent a decade composing classical symphonies. <u>Then</u>, seemingly overnight, she released an album of electronic dance music.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Similarly,"}, {"letter": "C", "text": "For instance,"}, {"letter": "D", "text": "Because of this,"}], "correctLetter": "A", "explanation": "A is correct: \u201cThen\u201d correctly signals the surprising shift in time. B wrongly implies similarity. C wrongly implies an example. D wrongly implies the earlier fact caused the later one.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "TR-5", "concept": "Transitions", "subtype": "Transitions", "passage": "Most local bookstores closed during the economic downturn. <u>Likewise</u>, one small shop on Main Street tripled its sales that same year.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In fact,"}, {"letter": "C", "text": "Surprisingly,"}, {"letter": "D", "text": "Similarly,"}], "correctLetter": "C", "explanation": "C is correct: \u201cSurprisingly\u201d correctly signals the unexpected contrast \u2014 most stores closed, but this one thrived. A doesn't clearly signal that contrast. B and D wrongly imply the shop's outcome matched the general trend, when it's actually the opposite.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "OR-REL-1", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "This paragraph focuses specifically on the chef's mentorship program: \u201cThe chef's mentorship program has trained over two hundred young cooks from underserved neighborhoods since it launched in 2016.\u201d The writer is considering adding here: \u201cThe chef's restaurant was awarded three Michelin stars in 2019.\u201d", "question": "Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because it shows the chef's culinary skill is widely recognized."}, {"letter": "B", "text": "Yes, because it explains why so many young cooks want to join her mentorship program."}, {"letter": "C", "text": "No, because this paragraph focuses specifically on the mentorship program, not the chef's personal culinary accolades."}, {"letter": "D", "text": "No, because Michelin stars are not a meaningful measure of a restaurant's quality."}], "correctLetter": "C", "explanation": "C is correct: it gives the accurate reason not to add the sentence \u2014 this paragraph is specifically about the mentorship program, and the Michelin-star detail doesn't relate to that particular focus. A and B both argue for adding it based on reasoning that doesn't fit this paragraph's specific job. D gives an inaccurate reason (Michelin stars are a widely recognized measure).", "trick": "Check whether the sentence directly supports the specific topic of THAT paragraph \u2014 not just the essay's general subject. Trick: \"True isn't enough \u2014 it has to be relevant to this paragraph's specific job.\""}, {"id": "OR-REL-2", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "This paragraph focuses specifically on the bike-share program's environmental impact: \u201cSince launching, the program has eliminated an estimated two million car trips, reducing the city's carbon emissions noticeably.\u201d The writer is considering adding here: \u201cThe bikes themselves are manufactured at a factory in another state.\u201d", "question": "Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because it gives helpful background on where the bikes come from."}, {"letter": "B", "text": "Yes, because it shows the program's economic impact on manufacturing jobs."}, {"letter": "C", "text": "No, because this paragraph focuses on the program's environmental impact, and the bikes' manufacturing origin doesn't relate to that."}, {"letter": "D", "text": "No, because most readers already know where bicycles are manufactured."}], "correctLetter": "C", "explanation": "C is correct: this paragraph's specific focus is environmental impact, and the manufacturing detail doesn't support that focus. A and B argue for adding it for reasons unrelated to this paragraph's job. D gives an unsupported, irrelevant reason.", "trick": "Check whether the sentence directly supports the specific topic of THAT paragraph \u2014 not just the essay's general subject. Trick: \"True isn't enough \u2014 it has to be relevant to this paragraph's specific job.\""}, {"id": "OR-REL-3", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "This paragraph focuses specifically on migration timing data: \u201cThe tags recorded that the whales began their northward migration nearly three weeks earlier than in previous decades.\u201d The writer is considering adding here: \u201cWhales are the largest animals to have ever lived on Earth.\u201d", "question": "Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because it helps readers understand why whales are difficult to study."}, {"letter": "B", "text": "Yes, because it emphasizes the significance of the biologist's findings."}, {"letter": "C", "text": "No, because this fact about whales' size doesn't relate to this paragraph's focus on migration timing data."}, {"letter": "D", "text": "No, because the claim about whale size hasn't been proven true."}], "correctLetter": "C", "explanation": "C is correct: this paragraph is specifically about migration timing, and the size fact doesn't support that focus, however true or interesting it is. A and B argue for adding it based on reasoning unrelated to this paragraph's specific job. D gives an inaccurate reason (the size claim is true).", "trick": "Check whether the sentence directly supports the specific topic of THAT paragraph \u2014 not just the essay's general subject. Trick: \"True isn't enough \u2014 it has to be relevant to this paragraph's specific job.\""}, {"id": "OR-PL-1", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "[1] Fermentation has been used to preserve food for thousands of years. [2] The process relies on bacteria or yeast to convert sugars into acids, alcohol, or gases. [3] Sauerkraut, kimchi, and yogurt are all common examples of fermented foods.", "question": "The writer wants to add this sentence: \u201cThis transformation not only preserves the food but often enhances its flavor and nutritional value.\u201d Where would it most logically be placed?", "choices": [{"letter": "A", "text": "Before Sentence 1"}, {"letter": "B", "text": "After Sentence 1"}, {"letter": "C", "text": "After Sentence 2"}, {"letter": "D", "text": "After Sentence 3"}], "correctLetter": "C", "explanation": "Placing it after Sentence 2 is correct: the new sentence's \u201cThis transformation\u201d clearly refers back to the conversion process just described in Sentence 2, before the paragraph moves on to specific examples in Sentence 3. Any other placement breaks that logical link.", "trick": "Trace the order the paragraph is already using, and place the new sentence where it keeps that order intact. Trick: \"Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?\""}, {"id": "OR-PL-2", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "[1] City officials first proposed redesigning the neglected downtown park in 2018. [2] Community meetings over the following year shaped the final design. [3] Construction began in early 2020 and finished eighteen months later.", "question": "The writer wants to add this sentence: \u201cSome residents worried the new design would eliminate the park's historic fountain.\u201d Where would it most logically be placed?", "choices": [{"letter": "A", "text": "Before Sentence 1"}, {"letter": "B", "text": "After Sentence 1"}, {"letter": "C", "text": "After Sentence 2"}, {"letter": "D", "text": "After Sentence 3"}], "correctLetter": "B", "explanation": "Placing it after Sentence 1 is correct: residents' concerns about the design would logically arise right after the redesign was proposed, and before the community meetings (Sentence 2) that addressed and shaped the design. Any other placement breaks the paragraph's chronological order.", "trick": "Trace the order the paragraph is already using, and place the new sentence where it keeps that order intact. Trick: \"Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?\""}, {"id": "OR-PL-3", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "[1] Dr. Chen began cataloguing basic information about each shark she tagged. [2] She recorded each animal's length, estimated age, and general health. [3] Over time, her database grew to include thousands of individual sharks.", "question": "The writer wants to add this sentence: \u201cThis included details as simple as scars or fin markings that could help identify the animal later.\u201d Where would it most logically be placed?", "choices": [{"letter": "A", "text": "Before Sentence 1"}, {"letter": "B", "text": "After Sentence 1"}, {"letter": "C", "text": "After Sentence 2"}, {"letter": "D", "text": "After Sentence 3"}], "correctLetter": "C", "explanation": "Placing it after Sentence 2 is correct: the new sentence continues the list of \u201cbasic information\u201d recorded, begun in Sentence 2, before the paragraph shifts to discussing the database's growth in Sentence 3. Any other placement breaks that logical flow.", "trick": "Trace the order the paragraph is already using, and place the new sentence where it keeps that order intact. Trick: \"Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?\""}, {"id": "OR-IC-1", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "This essay's overall focus is how rooftop beekeeping is transforming urban food systems. This paragraph specifically discusses the benefits: pollination, honey production, and community education.", "question": "Which sentence would most effectively introduce this paragraph?", "choices": [{"letter": "A", "text": "Rooftop beekeeping has quietly become one of the most effective tools for revitalizing urban food systems."}, {"letter": "B", "text": "Bees have existed on Earth for tens of millions of years."}, {"letter": "C", "text": "Not everyone finds the buzzing of a beehive relaxing."}, {"letter": "D", "text": "New York City legalized beekeeping in 2010."}], "correctLetter": "A", "explanation": "The first choice is correct: it directly introduces the paragraph's actual focus \u2014 rooftop beekeeping's role in urban food systems \u2014 before the paragraph details specific benefits. The other choices are all true but unrelated to that specific focus.", "trick": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus. Trick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}, {"id": "OR-IC-2", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "This is the closing paragraph of an essay about a small-town newspaper's history, focused on its uncertain future in the digital age.", "question": "Which sentence would most effectively conclude the essay?", "choices": [{"letter": "A", "text": "The newspaper's fate remains uncertain, but its century of community reporting has already left a permanent mark on the town's history."}, {"letter": "B", "text": "Newspapers were once the primary way small towns received local news."}, {"letter": "C", "text": "The editor plans to retire within the next five years."}, {"letter": "D", "text": "Digital subscriptions have become common among younger readers."}], "correctLetter": "A", "explanation": "The first choice is correct: it ties together the essay's central themes \u2014 the uncertain future and the historical significance \u2014 for a strong, unifying conclusion. The other choices introduce narrow details that don't draw the essay's threads together.", "trick": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus. Trick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}];

const CONCEPT_GROUPS = [
  { group: "Conventions of Standard English (weakest area)", concepts: ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"] },
  { group: "Knowledge of Language", concepts: ["Word Choice & Precision", "Style & Tone", "Concision & Redundancy"] },
  { group: "Production of Writing", concepts: ["Organization & Development", "Transitions"] },
];
const WEAK_CONCEPTS = ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"];

let selectedConcepts = new Set(WEAK_CONCEPTS);
let pool = [];        // shuffled queue of question objects for current session
let usedIds = [];      // ids shown this session (for summary + avoiding immediate repeats)
let current = null;
let answered = false;
let sessionLog = [];   // {concept, correct}
let reshuffleCount = 0;

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderCheckboxes();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function countFor(concept) {
  return ALL_QUESTIONS.filter(q => q.concept === concept).length;
}

function renderCheckboxes() {
  const container = document.getElementById('checkboxList');
  container.innerHTML = '';
  CONCEPT_GROUPS.forEach(g => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.group;
    container.appendChild(title);
    g.concepts.forEach(c => {
      const label = document.createElement('label');
      label.className = 'chk';
      const checked = selectedConcepts.has(c) ? 'checked' : '';
      label.innerHTML = `<input type="checkbox" data-concept="${c}" ${checked}> ${c} <span class="count">${countFor(c)} q</span>`;
      label.querySelector('input').addEventListener('change', onCheckboxChange);
      container.appendChild(label);
    });
  });
  updateSelCount();
}

function onCheckboxChange(e) {
  const c = e.target.getAttribute('data-concept');
  if (e.target.checked) selectedConcepts.add(c); else selectedConcepts.delete(c);
  updateSelCount();
}

function selectPreset(kind) {
  if (kind === 'weak') selectedConcepts = new Set(WEAK_CONCEPTS);
  if (kind === 'all') selectedConcepts = new Set(CONCEPT_GROUPS.flatMap(g => g.concepts));
  if (kind === 'none') selectedConcepts = new Set();
  renderCheckboxes();
}

function updateSelCount() {
  const total = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept)).length;
  document.getElementById('selCount').textContent = selectedConcepts.size === 0
    ? 'Select at least one concept to begin.'
    : `${total} question${total===1?'':'s'} available in the selected concepts.`;
  document.getElementById('startBtn').disabled = total === 0;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool() {
  const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
  pool = shuffle(filtered);
}

function startQuiz() {
  buildPool();
  usedIds = [];
  sessionLog = [];
  reshuffleCount = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextQuestion();
}

function restartSameFilters() {
  document.getElementById('summary').style.display = 'none';
  startQuiz();
}

function backToSetup() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderCheckboxes();
}

function nextQuestion() {
  let banner = '';
  if (pool.length === 0) {
    const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
    pool = shuffle(filtered);
    reshuffleCount++;
    banner = `<div class="banner">You've been through every question in this set — reshuffling and starting again from the top.</div>`;
  }
  current = pool.pop();
  usedIds.push(current.id);
  answered = false;
  renderQuestion(banner);
  updateTopbar();
}

function updateTopbar() {
  document.getElementById('progressTag').textContent = `Question ${usedIds.length}${reshuffleCount>0 ? ' (round ' + (reshuffleCount+1) + ')' : ''}`;
  const correct = sessionLog.filter(s => s.correct).length;
  document.getElementById('scoreText').textContent = `${correct}/${sessionLog.length}`;
}

function renderQuestion(bannerHtml) {
  const q = current;
  const choicesHtml = q.choices.map(c => `
    <button class="choice" data-letter="${c.letter}" onclick="selectChoice('${c.letter}')">
      <span class="ltr">${c.letter}</span>${escapeHtml(c.text)}
    </button>
  `).join('');
  document.getElementById('qBody').innerHTML = `
    ${bannerHtml || ''}
    <div class="concept-chip">${q.concept} · ${q.subtype}</div>
    <div class="passage">${q.passage}</div>
    <div class="qstem">${escapeHtml(q.question)}</div>
    <div id="choicesArea">${choicesHtml}</div>
    <div id="feedbackArea"></div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectChoice(letter) {
  if (answered) return;
  answered = true;
  const q = current;
  const isCorrect = letter === q.correctLetter;
  sessionLog.push({ concept: q.concept, correct: isCorrect });

  document.querySelectorAll('#choicesArea .choice').forEach(btn => {
    btn.classList.add('disabled');
    btn.onclick = null;
    const l = btn.getAttribute('data-letter');
    if (l === q.correctLetter) btn.classList.add('correct');
    else if (l === letter) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="verdict ${isCorrect ? 'good' : 'bad'}">${isCorrect ? 'Correct!' : 'Not quite — correct answer: ' + q.correctLetter}</div>
      <div class="explain">${escapeHtml(q.explanation)}</div>
      <div class="trick"><b>Rule / Memory Trick:</b> ${escapeHtml(q.trick)}</div>
    </div>
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
  `;
  updateTopbar();
}

function endSession() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  renderSummary();
}

function renderSummary() {
  const total = sessionLog.length;
  const correct = sessionLog.filter(s => s.correct).length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  document.getElementById('sumBig').textContent = total ? pct + '%' : '—';
  document.getElementById('sumSub').textContent = `${correct} of ${total} correct this session`;

  const byConcept = {};
  sessionLog.forEach(s => {
    byConcept[s.concept] = byConcept[s.concept] || { n: 0, c: 0 };
    byConcept[s.concept].n++;
    if (s.correct) byConcept[s.concept].c++;
  });
  const rows = Object.keys(byConcept).sort((a,b) => (byConcept[a].c/byConcept[a].n) - (byConcept[b].c/byConcept[b].n));
  const container = document.getElementById('sumCats');
  if (rows.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;">No questions answered yet.</p>';
    return;
  }
  container.innerHTML = rows.map(c => {
    const { n, c: correctN } = byConcept[c];
    const p = Math.round((correctN/n)*100);
    return `<div class="cat-row">
      <span>${c}</span>
      <div class="bar-wrap"><div class="bar" style="width:${p}%"></div></div>
      <span class="pct">${correctN}/${n}</span>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
