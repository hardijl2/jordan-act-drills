ect caused by the typical years of study, since the prodigy skipped that step. D is wrong because 'in any event' is vague filler that ignores the clear exception being described.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-10", "concept": "Transitions", "subtype": "Transitions", "passage": "Modern kilns use computerized temperature sensors to guarantee an even, predictable firing every time. <u>Likewise</u>, traditional wood-fired kilns produce unpredictable variations in color and texture from one piece to the next.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In contrast"}, {"letter": "C", "text": "Consequently"}, {"letter": "D", "text": "Regardless"}], "correctLetter": "B", "explanation": "Predictable, even firing versus unpredictable variation are opposite outcomes, a contrast that 'in contrast' correctly signals. A is wrong because the two kiln types are not alike, they produce opposite results. C is wrong because the wood-fired kiln's variability was not caused by the modern kiln's precision. D is wrong because 'regardless' is a vague dismissive phrase that fails to name the clear opposition between predictable and unpredictable results.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-11", "concept": "Transitions", "subtype": "Transitions", "passage": "Meteorologists forecast a mild, dry hurricane season based on cooler-than-average ocean temperatures in early spring. <u>As a result</u>, the region experienced one of its most active and destructive storm seasons on record.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Similarly"}, {"letter": "C", "text": "However"}, {"letter": "D", "text": "In any event"}], "correctLetter": "C", "explanation": "The mild forecast is directly contradicted by the unusually active storm season that actually occurred, a contrast that 'however' correctly signals. A is wrong because the destructive season was not an effect caused by the mild forecast, it defied it. B is wrong because a mild forecast and a destructive season are opposite outcomes, not similar ones. D is wrong because 'in any event' is vague filler that ignores the surprising reversal of the forecast.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-12", "concept": "Transitions", "subtype": "Transitions", "passage": "Linguists warn that most of the world's languages will vanish within a century. <u>Additionally</u>, a small Indigenous community in the Amazon has seen a resurgence of fluent young speakers thanks to a new immersion school.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore"}, {"letter": "C", "text": "Either way"}, {"letter": "D", "text": "However"}], "correctLetter": "D", "explanation": "The Amazon community's language resurgence is an exception to the general trend of languages vanishing, a contrast that 'however' correctly signals. A is wrong because 'additionally' would wrongly suggest the resurgence supports the warning rather than pushing against it. B is wrong because the resurgence was not an effect caused by linguists' warning. C is wrong because 'either way' is vague filler that ignores the clear exception to the broader trend.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-13", "concept": "Transitions", "subtype": "Transitions", "passage": "Airlines assumed rising fuel prices would force them to cut routes and shrink fleets this year. <u>However</u>, most major carriers expanded their international routes and posted record profits.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore"}, {"letter": "C", "text": "Similarly"}, {"letter": "D", "text": "In any event"}], "correctLetter": "A", "explanation": "The carriers' expansion and record profits directly contradict the assumption that rising fuel costs would force cutbacks, a contrast that 'however' correctly signals. B is wrong because the expansion was not a logical effect of the fuel-price assumption, it defied it. C is wrong because the actual outcome is the opposite of what was assumed, not similar to it. D is wrong because 'in any event' is vague filler that ignores the clear reversal of the assumption.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-14", "concept": "Transitions", "subtype": "Transitions", "passage": "Vintners in cooler climates predicted their grapes would ripen too late for a full harvest this year. <u>For example</u>, an unusually warm September pushed the harvest to completion three weeks ahead of schedule.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "However"}, {"letter": "C", "text": "Furthermore"}, {"letter": "D", "text": "In any event"}], "correctLetter": "B", "explanation": "The early harvest directly contradicts the vintners' prediction of a too-late ripening, a contrast that 'however' correctly signals. A is wrong because the early harvest does not illustrate the prediction, it disproves it. C is wrong because 'furthermore' would wrongly suggest the early harvest supports the prediction rather than reversing it. D is wrong because 'in any event' is vague filler that ignores the clear reversal of the forecast.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-15", "concept": "Transitions", "subtype": "Transitions", "passage": "A fire tore through the factory's main assembly line late Tuesday night, destroying critical machinery beyond repair. <u>Meanwhile</u>, the company halted all production for the rest of the month.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In contrast"}, {"letter": "C", "text": "Consequently"}, {"letter": "D", "text": "For example"}], "correctLetter": "C", "explanation": "The destroyed machinery directly caused the production halt, a cause-and-effect relationship that 'consequently' correctly signals. A is wrong because 'meanwhile' implies an unrelated event happening at the same time, not a caused result. B is wrong because there is no contradiction between the fire and the halt, one straightforwardly caused the other. D is wrong because halting production is not an example of the fire, it is the fire's direct consequence.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-16", "concept": "Transitions", "subtype": "Transitions", "passage": "Decades of clear-cutting stripped away the hillside's tree cover and root systems. <u>However</u>, the exposed soil washed away in the very next heavy rainstorm.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In addition"}, {"letter": "C", "text": "Meanwhile"}, {"letter": "D", "text": "Consequently"}], "correctLetter": "D", "explanation": "The stripped root systems directly caused the soil to wash away, a cause-and-effect relationship that 'consequently' correctly signals. A is wrong because 'however' falsely implies a contradiction, but the erosion is a straightforward result of the clear-cutting, not a contrast to it. B is wrong because the erosion is not a separate additional point, it is caused by the tree removal. C is wrong because 'meanwhile' implies an unrelated simultaneous event rather than a direct result.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-17", "concept": "Transitions", "subtype": "Transitions", "passage": "The museum's new dinosaur hall features a fully articulated Tyrannosaurus skeleton cast from original fossils. <u>Moreover</u>, it includes interactive touchscreens that let visitors digitally reconstruct extinct ecosystems.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "However"}, {"letter": "C", "text": "As a result"}, {"letter": "D", "text": "Meanwhile"}], "correctLetter": "A", "explanation": "The touchscreens are a second feature of the same exhibit alongside the skeleton, an additive relationship that 'moreover' correctly signals. B is wrong because there is no contradiction between the two features, both simply describe the same exhibit. C is wrong because the touchscreens were not caused by the skeleton display, both are independent features. D is wrong because 'meanwhile' implies an unrelated event happening at the same time, not another feature of the same hall.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-18", "concept": "Transitions", "subtype": "Transitions", "passage": "New solar panel coatings reduce glare and reflect less heat back into the atmosphere. <u>As a result</u>, the same coatings cut manufacturing costs by nearly fifteen percent.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In addition"}, {"letter": "C", "text": "Meanwhile"}, {"letter": "D", "text": "However"}], "correctLetter": "B", "explanation": "The cost savings are a separate benefit of the coatings, not caused by the glare reduction, so 'in addition' correctly signals this additive relationship. A is wrong because the cost cut was not an effect caused by reduced glare, it is an independent advantage of the same coatings. C is wrong because 'meanwhile' implies an unrelated simultaneous event, but this benefit belongs to the very same coatings just discussed. D is wrong because there is no contradiction between the two benefits.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-19", "concept": "Transitions", "subtype": "Transitions", "passage": "Bakers first let the dough rise for two hours at room temperature. <u>However</u>, they punch it down and shape it into loaves before a second, shorter rise.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Consequently"}, {"letter": "C", "text": "Afterward"}, {"letter": "D", "text": "In addition"}], "correctLetter": "C", "explanation": "Punching down and shaping the dough is simply the next scheduled step after the first rise, a sequential relationship that 'afterward' correctly signals. A is wrong because there is no contrast between two consecutive steps in the same process. B is wrong because punching down the dough was not an automatic effect of the rise, it was simply the following step. D is wrong because shaping the loaves is not a separate additional point, it is the next stage in the same procedure.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-20", "concept": "Transitions", "subtype": "Transitions", "passage": "Mission control spent the descent's infamous \"seven minutes of terror\" unable to intervene, since radio signals took eleven minutes to reach Mars, meaning every landing maneuver had already happened, for better or worse, before controllers even knew the descent had begun.<br><br><u>In contrast</u>, engineers began transmitting the rover's first diagnostic checks and receiving photos within minutes of confirming a safe touchdown.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore"}, {"letter": "C", "text": "Similarly"}, {"letter": "D", "text": "Soon after"}], "correctLetter": "D", "explanation": "Transmitting diagnostics and photos is simply the next stage that followed confirmation of a safe landing, a sequential relationship that 'soon after' correctly signals. A is wrong because there is no opposition between the descent phase and the phase that followed it, both are steps in the same mission timeline. B is wrong because the diagnostic transmissions were not an automatic effect of the communication delay, they were simply the next scheduled step. C is wrong because the two phases are not being compared as alike, one simply follows the other in time.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-21", "concept": "Transitions", "subtype": "Transitions", "passage": "Critics correctly note that electric vehicles still cost more upfront than comparable gas-powered cars. <u>Nonetheless</u>, lower fuel and maintenance costs typically make electric vehicles cheaper to own within five years.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In addition"}, {"letter": "C", "text": "Therefore"}, {"letter": "D", "text": "For example"}], "correctLetter": "A", "explanation": "The sentence concedes the valid criticism about upfront cost before pivoting to explain why electric vehicles are still cheaper overall, a concession relationship that 'nonetheless' correctly signals. B is wrong because 'in addition' would wrongly suggest the lower long-term cost is one more criticism, when it actually offsets the criticism just conceded. C is wrong because the long-term savings were not caused by the higher upfront cost. D is wrong because the long-term savings do not illustrate the upfront cost, they counterbalance it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-22", "concept": "Transitions", "subtype": "Transitions", "passage": "The diet plan does eliminate entire food groups, a restriction most nutritionists caution against. <u>For example</u>, thousands of participants have safely maintained the diet for over a decade with no reported deficiencies.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Nevertheless"}, {"letter": "C", "text": "Furthermore"}, {"letter": "D", "text": "Consequently"}], "correctLetter": "B", "explanation": "The sentence concedes the valid nutritionist concern before pivoting to note that, despite it, participants have fared safely long-term, a concession relationship that 'nevertheless' correctly signals. A is wrong because the participants' safe track record does not illustrate the food-group restriction, it counters the concern about it. C is wrong because 'furthermore' would wrongly suggest the safety record adds to the nutritionists' caution rather than pushing against it. D is wrong because the safe track record was not an effect caused by eliminating food groups.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-23", "concept": "Transitions", "subtype": "Transitions", "passage": "Several small nations have made remarkable progress toward full reliance on renewable energy. <u>However</u>, Iceland now generates nearly one hundred percent of its electricity from geothermal and hydropower sources.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "As a result"}, {"letter": "C", "text": "For instance"}, {"letter": "D", "text": "Meanwhile"}], "correctLetter": "C", "explanation": "Iceland's near-total renewable electricity is a specific instance of the general progress described, exactly the relationship 'for instance' signals. A is wrong because there is no contradiction between the general trend and Iceland's case, Iceland exemplifies it. B is wrong because Iceland's generation was not caused by other nations' progress, it is one example among them. D is wrong because 'meanwhile' implies an unrelated event happening at the same time, but Iceland is itself one of the small nations already being discussed.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-24", "concept": "Transitions", "subtype": "Transitions", "passage": "Citizen-science projects have allowed amateur volunteers to contribute meaningfully to fields once reserved for credentialed researchers, from tracking bird migrations to classifying distant galaxies from home computers.<br><br><u>Meanwhile</u>, one retired schoolteacher in Ohio used a public astronomy database to help identify a previously unknown exoplanet, a discovery later confirmed by professional astronomers.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Consequently"}, {"letter": "C", "text": "In contrast"}, {"letter": "D", "text": "For instance"}], "correctLetter": "D", "explanation": "The retired schoolteacher's discovery is a specific instance of the general trend of amateur contributions described in the first paragraph, exactly the relationship 'for instance' signals. A is wrong because 'meanwhile' implies an unrelated event happening at the same time, but the discovery is a direct illustration of the trend just described. B is wrong because the discovery was not simply an effect caused by citizen-science projects existing, it is one concrete example of them. C is wrong because there is no contradiction between the general trend and this specific case, the case supports and illustrates it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "REL-1", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "When male fireflies want to attract a mate, they flash a rhythmic pattern of light from an organ in their abdomen. Each firefly species has its own distinct flash pattern \u2014 some blink in short bursts, others glow in long pulses \u2014 which allows females to recognize males of their own species in the dark. When a female spots a pattern she recognizes, she answers with her own flash at a precise time delay, starting a call-and-response exchange between the two insects. This exchange can repeat several times before the male finally approaches.", "question": "The writer is considering adding the following sentence to the paragraph: 'Firefly larvae, sometimes called glowworms, are also bioluminescent and feed on snails and slugs.' Should the writer add this sentence?", "choices": [{"letter": "A", "text": "No, because the paragraph is specifically about how flash patterns are used to find a mate, not about larval feeding habits."}, {"letter": "B", "text": "Yes, because it provides interesting background information about fireflies."}, {"letter": "C", "text": "Yes, because it explains why fireflies evolved bioluminescence."}, {"letter": "D", "text": "No, because readers already know fireflies glow."}], "correctLetter": "A", "explanation": "Every sentence in this paragraph builds toward one job: explaining how flash patterns let fireflies find and identify a mate. A fact about larval feeding habits, while true and firefly-related, does nothing to advance that explanation, so it does not belong here. Choice C wrongly implies the sentence connects to the flash pattern's purpose, but nothing about larval diet explains why adults flash to attract mates. Choice B mistakes general interest for relevance, and D's reasoning about reader knowledge is irrelevant to whether the sentence fits this paragraph's specific job. A is correct because it identifies the actual mismatch between the sentence's topic and the paragraph's focus.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-2", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Anansi the spider is among the most enduring characters in West African oral tradition, a trickster whose cunning allows him to outwit far larger and more powerful animals. In one popular tale, Anansi convinces Tiger to be tied up like a horse, and in another he cheats Python into being captured by pretending to measure his length with a stick. These stories were carried across the Atlantic during the transatlantic slave trade and took root in Caribbean and Southern U.S. folklore, where Anansi became known as 'Aunt Nancy' or 'Br'er Anansi.' Tellers used the tales to model the survival skill of wit triumphing over brute strength.", "question": "The writer is considering adding the following sentence to the paragraph: 'Spiders build webs using silk produced from specialized glands called spinnerets.' Should the writer add this sentence?", "choices": [{"letter": "A", "text": "Yes, because it adds a scientifically interesting fact about spiders."}, {"letter": "B", "text": "Yes, because it helps readers picture what Anansi looks like."}, {"letter": "C", "text": "No, because most readers already know how spiders make webs."}, {"letter": "D", "text": "No, because the paragraph's job is to explain Anansi's role as a cultural trickster figure, not to explain spider biology."}], "correctLetter": "D", "explanation": "The paragraph traces Anansi's function as a folkloric trickster and how his stories migrated and survived culturally; nothing in it concerns real spider anatomy. A fact about spinnerets, though accurate, answers a biology question the paragraph never raises. Choice B is wrong because the tales treat Anansi as a personified character, not a literal spider whose silk-production needs illustrating. Choice A confuses general interest with paragraph relevance, and C's reasoning about reader knowledge doesn't address whether the sentence fits the paragraph's actual topic. D correctly names the specific mismatch.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-3", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Before digging a rain garden, choose a low-lying spot in the yard that is at least ten feet from the house's foundation so pooling water cannot seep into the basement. Once the site passes a simple drainage test, dig a shallow basin shaped like a wide bowl, sloping the sides gently so runoff can flow in easily. Fill the basin with a mix of compost and sand to improve drainage, then plant deep-rooted native species like swamp milkweed and blue flag iris, which tolerate both flooding and drought. Mulch around the new plants to retain moisture and suppress weeds while the roots establish themselves.", "question": "The writer is considering adding the following sentence after the first sentence: 'Test the soil's drainage by digging a one-foot hole, filling it with water, and checking whether it empties within twenty-four hours.' Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "No, because the paragraph never discusses soil testing anywhere else."}, {"letter": "B", "text": "Yes, because it supplies the specific drainage test that the very next sentence assumes has already happened."}, {"letter": "C", "text": "Yes, because it mentions water, which fits a paragraph about rain gardens."}, {"letter": "D", "text": "No, because compost and sand are better drainage indicators than a hole test."}], "correctLetter": "B", "explanation": "The second sentence begins 'Once the site passes a simple drainage test,' but without the candidate sentence, no drainage test has actually been described anywhere in the paragraph, leaving that phrase dangling. Adding the candidate sentence fills exactly that gap, supplying the missing step the next sentence depends on. Choice C offers only a superficial topical link (both mention water) rather than a structural need. Choice A is factually true but irrelevant to the real issue, since relevance here is about filling a specific logical gap, not prior mentions; D misjudges technique quality rather than addressing the paragraph's actual need. B is correct because it identifies the genuine bridging function the sentence serves.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-4", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Marie Tussaud learned the art of wax modeling as a teenager, apprenticed to a Swiss physician named Philippe Curtius who ran a popular wax exhibition in Paris. When the French Revolution erupted, Tussaud was forced to prove her loyalty to the new regime by making death masks of guillotined aristocrats, sometimes retrieving the severed heads herself from baskets beneath the blade. She later inherited Curtius's collection and, fearing for her life amid the ongoing political turmoil, fled France in 1802 with her wax figures packed into trunks. She spent the next three decades touring Britain and Ireland with her exhibition before finally settling it permanently in London in 1835.", "question": "The writer is considering adding the following sentence to the end of the paragraph: 'Today, Madame Tussauds wax museums operate in more than twenty cities worldwide, from Las Vegas to Tokyo.' Should the writer add this sentence?", "choices": [{"letter": "A", "text": "Yes, because it shows the long-term success of the business she founded."}, {"letter": "B", "text": "No, because the paragraph focuses on Tussaud's own life and the founding of her original exhibition, not on the modern global franchise."}, {"letter": "C", "text": "Yes, because readers are curious about wax museums today."}, {"letter": "D", "text": "No, because most readers have never heard of Madame Tussauds museums."}], "correctLetter": "B", "explanation": "Every sentence in the paragraph narrates events from Tussaud's own lifetime: her apprenticeship, the Revolution, her flight from France, and her eventual settling in London. A sentence about twenty-first-century franchise locations jumps outside that biographical scope into corporate history that the paragraph never otherwise addresses. Choice A and C both treat 'interesting' or 'related to the topic broadly' as sufficient, but the paragraph's specific job is narrating her life, not the brand's later expansion. D's reasoning about reader familiarity is beside the point. B correctly identifies the scope mismatch.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-5", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "A team of volunteer engineers designs low-cost prosthetic hands using 3D printers, cutting the cost of a functional prosthetic from thousands of dollars to under fifty. Each hand is printed in pieces from durable plastic filament, then assembled with elastic cord that tightens the fingers when the wearer bends their wrist, requiring no batteries or motors. Because the design files are open-source, volunteers anywhere in the world can download and print a hand, then ship it to a child who has outgrown an earlier model. The organization has distributed more than 10,000 free prosthetic hands to children in over eighty countries since it began.", "question": "The writer is considering adding the following sentence to the beginning of the paragraph: '3D printers were first invented in the 1980s by an engineer named Chuck Hull.' Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "No, because the paragraph's focus is the specific volunteer prosthetic-hand project, not the general history of 3D-printing technology."}, {"letter": "B", "text": "Yes, because it explains the history of the technology being discussed."}, {"letter": "C", "text": "Yes, because 3D printers are mentioned in the paragraph's first sentence."}, {"letter": "D", "text": "No, because Chuck Hull is not a well-known historical figure."}], "correctLetter": "A", "explanation": "The paragraph is tightly focused on one volunteer project: how it designs, assembles, and distributes low-cost prosthetic hands. A sentence about who invented 3D printing decades earlier belongs to a different, broader history of the technology, not to this project's specific story. Choice C mistakes a shared keyword ('3D printers') for genuine topical relevance. Choice B assumes background history is automatically useful, but the paragraph never needs that context to make its point. D's reasoning about Hull's fame doesn't address whether the sentence fits the paragraph's job. A correctly names the scope mismatch.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-6", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Each fall, millions of monarch butterflies leave their breeding grounds across the United States and Canada and fly as far as 3,000 miles to overwintering sites in the oyamel fir forests of central Mexico. No single butterfly completes the entire round trip; the individuals that arrive in Mexico are the great-great-grandchildren of the ones that left the previous spring. Once spring arrives, the wintering monarchs mate and begin flying north, laying eggs on milkweed plants along the way before dying, leaving the next generation to continue the journey. Scientists still debate exactly how each new generation knows the route to a place it has never been.", "question": "The writer is considering adding the following sentence to the end of the paragraph: 'This means that a monarch's ability to navigate the migration route must be inherited rather than learned from experience.' Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "No, because the paragraph is about migration distance, not about butterfly genetics."}, {"letter": "B", "text": "No, because it merely repeats information already stated in the second sentence."}, {"letter": "C", "text": "Yes, because it draws the direct conclusion suggested by the paragraph's central fact that no single butterfly ever completes the full round trip."}, {"letter": "D", "text": "Yes, because it mentions 'monarch,' matching the paragraph's overall topic."}], "correctLetter": "C", "explanation": "The paragraph builds toward a genuine puzzle: no single butterfly makes the whole round trip, yet each new generation somehow knows the route, a fact the final sentence explicitly calls a scientific debate. The candidate sentence draws the logical inference that bridges those two ideas, making it a natural and needed capstone rather than filler. Choice B is wrong because the sentence is a new inference, not a restatement of the multi-generational fact. Choice A mischaracterizes the paragraph's actual focus, which is the generational relay of migratory knowledge, not mere distance. D relies on superficial keyword overlap rather than logical function. C is correct because it identifies the sentence's true bridging role.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-7", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Johannes Gutenberg introduced movable metal type to Europe around 1440, adapting technology used earlier in East Asia to a screw-style wine press he modified into a printing press. Before his invention, books were copied by hand, a process so slow that a single monk might spend a year producing one Bible. Gutenberg's press could produce hundreds of identical pages in the time it once took to copy a single page by hand, and his workshop in Mainz printed roughly 180 copies of his famous 42-line Bible. Within fifty years, printing presses had spread to more than 200 European cities, dramatically increasing the availability of books and literacy rates across the continent.", "question": "The writer is considering adding the following sentence to the beginning of the paragraph: 'Gutenberg was born in Mainz, Germany, sometime between 1394 and 1400.' Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because it establishes when and where Gutenberg was born before discussing his invention."}, {"letter": "B", "text": "Yes, because Mainz is mentioned later in the paragraph, so the birthplace detail connects to it."}, {"letter": "C", "text": "No, because the paragraph already states Gutenberg introduced movable type in 1440, making a birth date redundant."}, {"letter": "D", "text": "No, because the paragraph's specific focus is the impact and mechanics of the printing press, not a biographical timeline of Gutenberg's life."}], "correctLetter": "D", "explanation": "Every sentence in this paragraph explains what the press did and how quickly it spread, not who Gutenberg was as a person. A birth-date sentence introduces personal biography that has no bearing on the press's mechanics or impact, the paragraph's actual job. Choice B mistakes a shared place name (Mainz) for genuine logical connection. Choice A assumes any biographical fact belongs at the start of a paragraph about an invention, which isn't true here. C's redundancy argument is a coincidental fact, not the real reason the sentence fails. D correctly identifies the paragraph's true focus and the sentence's mismatch with it.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "REL-8", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "A sourdough starter is a living culture of wild yeast and bacteria that must be fed regularly to stay active. Each day, discard about half of the starter and stir in equal parts fresh flour and water, then let the mixture sit at room temperature. Within six to twelve hours, a healthy starter should double in size and develop a domed, bubbly surface before slowly collapsing again. If a starter has not been fed in over a week, a layer of dark liquid called 'hooch' may form on top, signaling that the yeast is hungry and needs an extra feeding before it is used to bake.", "question": "The writer is considering adding the following sentence after the second sentence: 'Discarding half the starter each day keeps the ratio of flour to microorganisms balanced, preventing the culture from becoming too acidic to rise properly.' Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because sourdough bread is a popular baking topic."}, {"letter": "B", "text": "Yes, because it explains the specific reason behind the discarding step the paragraph just described, deepening its how-to explanation."}, {"letter": "C", "text": "No, because the paragraph is about feeding schedules, not acidity levels."}, {"letter": "D", "text": "No, because discarding starter wastes food and should not be recommended."}], "correctLetter": "B", "explanation": "The paragraph is a how-to guide for maintaining a starter, and the candidate sentence directly explains why the discarding step it just described matters, deepening the reader's understanding of that specific instruction. Choice A relies only on general topical popularity, not on how the sentence functions within this paragraph. Choice C wrongly claims acidity is off-topic, when in fact the sentence connects acidity directly to the feeding process the paragraph is explaining. D introduces an opinion about food waste that has nothing to do with whether the sentence belongs here. B correctly identifies the sentence's genuine explanatory function.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "SEQ-1", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "The magnetic compass, one of the most important navigational tools in history, did not begin as a device for sailors at all. [1] By the 11th century, Chinese scholars had discovered that a needle stroked with a lodestone would consistently point north-south, and they mounted the needle on a small floating device for more reliable readings. [2] Early Chinese diviners used lodestone, a naturally magnetized mineral, arranged on bronze plates as part of fortune-telling boards centuries before anyone thought to use it for travel. [3] It was not until the 12th century that sailors began carrying magnetized needles aboard ships, finally putting the compass to its now-familiar use in navigation.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "1, 2, 3"}, {"letter": "B", "text": "2, 1, 3"}, {"letter": "C", "text": "2, 3, 1"}, {"letter": "D", "text": "3, 2, 1"}], "correctLetter": "B", "explanation": "The paragraph traces a strict chronology: lodestone fortune-telling boards existed before anyone used the mineral for travel [2], then 11th-century scholars refined it into a floating needle for reliable readings [1], and only in the 12th century did sailors finally adopt it for navigation [3]. Order A (1,2,3) is broken because 1's 11th-century readings are followed by 2's 'centuries before anyone thought of travel,' which reads as an illogical jump backward in time. Order C (2,3,1) places 12th-century sailors before the 11th-century scholarly refinement, reversing the timeline. Order D (3,2,1) opens with 'It was not until the 12th century,' a phrase that requires prior context establishing an earlier starting point, which doesn't exist if it comes first. Only 2, 1, 3 preserves the paragraph's clear earliest-to-latest chronological structure.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-2", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Octopuses are famous for their ability to vanish into their surroundings within a fraction of a second. [1] Because the octopus cannot see color the way humans do, scientists believe it may rely on specialized light-sensing cells in its skin to detect the color of nearby surfaces. [2] Beneath the skin lie thousands of pigment-filled sacs called chromatophores, which the octopus can expand or contract using tiny muscles to instantly change color and pattern. [3] Even more remarkable, some species can also alter the texture of their skin, raising small bumps called papillae to mimic the rough surface of coral or rock.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "2, 3, 1"}, {"letter": "B", "text": "3, 2, 1"}, {"letter": "C", "text": "NO CHANGE"}, {"letter": "D", "text": "2, 1, 3"}], "correctLetter": "D", "explanation": "The paragraph must first establish the basic color-changing mechanism [2, chromatophores] before it can raise the puzzle of how a colorblind animal chooses the right color [1, light-sensing cells] and then escalate to an additional ability [3, 'even more remarkable... texture']. Order C (1,2,3) opens with 'Because the octopus cannot see color...,' a causal clause that references the animal's color-changing ability before that ability (the chromatophores in sentence 2) has even been established \u2014 a dangling reference. Order A (2,3,1) places the texture escalation before the color-detection puzzle, so 1's reference back to color choice feels like a backward step after the texture claim. Order B (3,2,1) opens with 'Even more remarkable,' a phrase that requires a preceding claim to escalate from, which doesn't exist if it's first. Only 2, 1, 3 builds coherently from basic mechanism to puzzle to escalation.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-3", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Making a soy wax candle at home requires only a few basic supplies and about an hour of hands-on time. [1] Once melted, the wax should be cooled to about 130\u00b0F before you stir in fragrance oil, since adding scent to overly hot wax can cause it to evaporate before the candle even sets. [2] Begin by melting soy wax flakes in a double boiler, stirring occasionally until the wax reaches a uniform liquid consistency. [3] After the scented wax is poured into a container with a pre-set wick and allowed to cool overnight, trim the wick to a quarter inch before lighting the finished candle.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "1, 2, 3"}, {"letter": "B", "text": "3, 2, 1"}, {"letter": "C", "text": "2, 1, 3"}, {"letter": "D", "text": "2, 3, 1"}], "correctLetter": "C", "explanation": "The process must follow the actual order of candle-making: melt the wax [2], cool it and stir in fragrance [1], then pour, cool, and trim the wick [3]. Order A (1,2,3) opens with 'Once melted, the wax should be cooled,' which presupposes melting already happened, but nothing before it in the paragraph describes melting \u2014 a dangling reference. Order D (2,3,1) has the wax being 'poured' and already 'scented' in sentence 3 before fragrance is ever added in sentence 1, which is impossible. Order B (3,2,1) opens with pouring 'scented wax,' but no scenting or melting has occurred yet. Only 2, 1, 3 matches the real sequence of melting, cooling and scenting, then pouring and finishing.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-4", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Ada Lovelace is often celebrated today as the world's first computer programmer, though the machine she wrote for was never actually built in her lifetime. [1] Lovelace's notes included an algorithm intended to calculate Bernoulli numbers, a sequence of complex rational numbers, which historians consider the first published computer program. [2] In 1843, she was asked to translate an Italian article describing Charles Babbage's proposed Analytical Engine, a mechanical device designed to perform general-purpose calculations. [3] While translating, Lovelace added her own extensive notes to the article, nearly three times longer than the original text, that expanded on the machine's potential uses far beyond simple arithmetic.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "1, 2, 3"}, {"letter": "B", "text": "2, 1, 3"}, {"letter": "C", "text": "3, 1, 2"}, {"letter": "D", "text": "2, 3, 1"}], "correctLetter": "D", "explanation": "The events must unfold in their actual order: Lovelace is asked to translate the article about the Analytical Engine [2], while translating she adds her own extensive notes [3], and those notes specifically included the Bernoulli algorithm [1]. Order A (1,2,3) opens by referencing 'Lovelace's notes' before any notes have been introduced, a dangling reference. Order B (2,1,3) jumps to the algorithm detail in 1 before establishing that she added notes at all in 3. Order C (3,1,2) opens with 'While translating,' which requires the translation assignment to already be established, but it hasn't been if 2 comes last. Only 2, 3, 1 builds coherently from assignment to note-taking to the specific algorithmic content of those notes.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-5", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "On August 24 in the year 79 CE, the residents of Pompeii experienced what began as an unremarkable morning near the base of Mount Vesuvius. [1] Ash and pumice rained down on the city for nearly eighteen hours, collapsing roofs and forcing many residents to flee toward the coast. [2] By early afternoon, the mountain erupted with a violent explosion, sending a column of ash and gas nearly twenty miles into the sky. [3] Those who remained were killed the following morning when a fast-moving cloud of superheated gas, called a pyroclastic surge, swept through the city and buried it in volcanic debris.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "2, 1, 3"}, {"letter": "B", "text": "NO CHANGE"}, {"letter": "C", "text": "2, 3, 1"}, {"letter": "D", "text": "3, 2, 1"}], "correctLetter": "A", "explanation": "The timeline runs from eruption to aftermath: the mountain erupts in early afternoon [2], ash rains down for eighteen hours and residents flee [1], and finally those who remained are killed the next morning [3]. Order B (1,2,3) opens with ash raining down without any eruption yet described, leaving no cause for the ash. Order C (2,3,1) has 'those who remained' being killed before the eighteen hours of ash and fleeing in 1 are ever mentioned, skipping ahead illogically. Order D (3,2,1) opens with 'those who remained,' a phrase with no antecedent explaining who fled or why. Only 2, 1, 3 preserves the correct chronological cause-and-effect chain.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-6", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Coral reefs depend on a delicate biological partnership to produce their brilliant colors. [1] When ocean temperatures rise even slightly above normal for an extended period, the stressed coral expels these algae, leaving behind a stark white skeleton in a process known as bleaching. [2] Microscopic algae called zooxanthellae live inside coral tissue, performing photosynthesis and sharing nutrients with their coral hosts in exchange for shelter. [3] Without the algae's nutrients, bleached coral can survive for a few weeks, but if warm conditions persist, the coral eventually starves and dies.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "1, 2, 3"}, {"letter": "B", "text": "2, 1, 3"}, {"letter": "C", "text": "2, 3, 1"}, {"letter": "D", "text": "3, 2, 1"}], "correctLetter": "B", "explanation": "The intro sentence mentions only a vague 'partnership,' so sentence 2 must come first to actually name the algae (zooxanthellae) that '1' later refers to as 'these algae.' Order A (1,2,3) opens with 'these algae,' which has no antecedent since no algae have been named yet \u2014 a dangling reference. Order C (2,3,1) has sentence 3 describing 'bleached coral' and lost nutrients before bleaching has been described in 1, jumping ahead illogically. Order D (3,2,1) opens with 'bleached coral,' referencing an event that hasn't happened yet. Only 2, 1, 3 introduces the algae, then shows the stress response that expels them, then explains the consequence of that loss.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-7", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Building a bicycle wheel from scratch is a meditative, precise process that experienced mechanics can complete in under an hour. [1] Once all the spokes are loosely threaded into the rim in the correct crossing pattern, the wheel builder begins tightening each nipple a quarter turn at a time, working around the wheel repeatedly to bring it into round. [2] The builder begins by threading half of the spokes through the hub's holes and into every fourth hole of the rim, leaving the alternating holes empty for now. [3] After the wheel is roughly true, it is placed on a truing stand, where a mechanic checks it for side-to-side wobble and adjusts individual spokes until the rim spins perfectly straight.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "2, 3, 1"}, {"letter": "B", "text": "3, 2, 1"}, {"letter": "C", "text": "2, 1, 3"}, {"letter": "D", "text": "NO CHANGE"}], "correctLetter": "C", "explanation": "The process must follow the physical assembly order: spokes are first partially threaded [2], then, once fully threaded, tightened into round [1], and finally trued on a stand [3]. Order D (1,2,3) opens with 'Once all the spokes are loosely threaded,' but no spokes have been threaded yet at that point, a dangling reference. Order A (2,3,1) has the wheel being placed on a truing stand as 'roughly true' before any tightening in 1 has occurred, skipping a necessary step. Order B (3,2,1) opens with the truing step, referencing a wheel that hasn't even been assembled yet. Only 2, 1, 3 follows the correct build sequence from partial threading to tightening to truing.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-8", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "On the morning of December 17, 1903, near Kitty Hawk, North Carolina, Orville and Wilbur Wright prepared to test their latest flying machine after years of failed gliders and wind tunnel experiments. [1] Orville lay flat on the lower wing, started the engine, and released the restraining wire, sending the fragile aircraft bouncing down a wooden launch rail into a cold, gusting headwind. [2] The flight lasted just twelve seconds and covered only 120 feet, shorter than the wingspan of some modern jetliners, but it was the first sustained, controlled flight of a powered aircraft. [3] Five witnesses from the nearby lifesaving station watched as the machine lifted off the rail and climbed unsteadily into the air before touching back down on the sand.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "1, 2, 3"}, {"letter": "B", "text": "1, 3, 2"}, {"letter": "C", "text": "3, 1, 2"}, {"letter": "D", "text": "2, 1, 3"}], "correctLetter": "B", "explanation": "The engine start and release [1] must come first to put the aircraft on the rail; the witnesses' account of it lifting off and landing [3] naturally follows since it requires the aircraft already moving down the rail; and the summary statement of duration and historical significance [2] works only as a closing statement, since it speaks of the flight as already complete. Order A (1,2,3) has the summary in 2 appearing before the actual liftoff is narrated in 3, an achronological jump. Order C (3,1,2) opens with witnesses watching the machine 'lift off the rail,' but nothing has established the aircraft being on the rail yet. Order D (2,1,3) opens with a summary of a flight that hasn't been narrated at all. Only 1, 3, 2 narrates the launch, then the flight itself, then closes with the summary.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-9", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "Cheesemaking begins with a seemingly simple transformation: turning liquid milk into a semisolid curd. [1] Once the curd has fully formed, the cheesemaker cuts it into small cubes, releasing liquid whey and allowing the curds to shrink and firm up further. [2] Bacterial cultures are added to warm milk, where they consume the milk sugar lactose and produce lactic acid, gradually lowering the milk's pH. [3] As the acidity rises, an enzyme called rennet is stirred in, causing the proteins in the milk to bond together and trap fat and water in a wobbly gel.", "question": "Which sequence of sentences makes this paragraph most logical?", "choices": [{"letter": "A", "text": "2, 3, 1"}, {"letter": "B", "text": "3, 2, 1"}, {"letter": "C", "text": "2, 1, 3"}, {"letter": "D", "text": "NO CHANGE"}], "correctLetter": "A", "explanation": "The chemistry must happen in order: bacteria are added and lower the pH [2], as acidity rises rennet is added to form the curd gel [3], and once that curd is fully formed it is cut into cubes [1]. Order D (1,2,3) opens with 'Once the curd has fully formed,' but nothing has formed any curd yet. Order C (2,1,3) has the cheesemaker cutting a fully-formed curd in 1 before rennet has even been added in 3 to actually form it. Order B (3,2,1) opens with 'As the acidity rises,' a phrase with no antecedent since no acid-producing process has been described. Only 2, 3, 1 follows the real biochemical sequence from culture to coagulation to cutting.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-10", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "<p><strong>Paragraph 1:</strong> According to legend, tea was discovered in 2737 BCE when leaves from a wild tea tree drifted into a pot of water the Chinese emperor Shennong was boiling, infusing it with a fragrant flavor he found delightful. For centuries afterward, tea remained primarily a Chinese medicinal drink, prized by scholars and monks.</p><p><strong>Paragraph 2:</strong> Today, tea is the second most consumed beverage in the world after water, with more than two billion cups drunk daily across nearly every country on Earth. From sweetened iced tea in the American South to salty butter tea in Tibet, the drink has been adapted to fit local tastes.</p><p><strong>Paragraph 3:</strong> Buddhist monks carried tea from China to Japan in the ninth century, where it gradually evolved into a highly ritualized practice. By the sixteenth century, Japanese tea masters had formalized this into the elaborate tea ceremony.</p><p><strong>Paragraph 4:</strong> Dutch traders brought tea to Europe in the early seventeenth century, and the British East India Company later built an enormous trade empire around it, cultivating vast tea plantations in colonial India. By the eighteenth century, tea was a fixture of daily British life.</p>", "question": "For the sake of logic and cohesion, Paragraph 2 should be placed:", "choices": [{"letter": "A", "text": "after Paragraph 4."}, {"letter": "B", "text": "before Paragraph 1."}, {"letter": "C", "text": "after Paragraph 1."}, {"letter": "D", "text": "after Paragraph 3."}], "correctLetter": "A", "explanation": "Paragraphs 1, 3, and 4 trace tea's spread in strict chronological order: its origin in China (Paragraph 1), its ninth-century arrival in Japan and the tea ceremony (Paragraph 3), and its seventeenth-century arrival in Europe (Paragraph 4). Paragraph 2, which describes tea's status 'today,' breaks that historical chain wherever it interrupts it; its current placement after Paragraph 1 severs the direct link between China's origin story and tea reaching Japan 'from China' in Paragraph 3. Placing it before Paragraph 1 (B) is illogical since it needs the origin story to precede it, and placing it after Paragraph 3 (D) breaks the equally direct chronological link to Paragraph 4's European trade narrative. Only placing Paragraph 2 after Paragraph 4 (A) lets the full historical chain run uninterrupted before the essay closes with a modern-day summary.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-11", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "<p><strong>Paragraph 1:</strong> Before any hardware arrives, a solar installer conducts a site assessment, examining the home's roof angle, shading, and structural integrity to determine how many panels it can safely support, along with an analysis of the household's past electricity bills to size the system appropriately.</p><p><strong>Paragraph 2:</strong> With permits approved, a crew installs mounting brackets directly into the roof's rafters, then attaches the panels to the brackets and wires them together in a string, connecting it to an inverter that will convert direct current into usable alternating current.</p><p><strong>Paragraph 3:</strong> Once the system is designed, the installer submits permit applications to the local building department and, in most cases, to the utility company for an interconnection agreement, a process that can take weeks or months.</p><p><strong>Paragraph 4:</strong> After installation, a local inspector examines the wiring and mounting to confirm the system meets code, and once it passes, the utility company grants permission to operate, allowing the homeowner to finally switch the system on.</p>", "question": "For the sake of logic and cohesion, Paragraph 3 should be placed:", "choices": [{"letter": "A", "text": "before Paragraph 1."}, {"letter": "B", "text": "after Paragraph 1."}, {"letter": "C", "text": "after Paragraph 2."}, {"letter": "D", "text": "after Paragraph 4."}], "correctLetter": "B", "explanation": "Paragraph 3 opens with 'Once the system is designed,' which requires the site assessment and system design described in Paragraph 1 to come first, ruling out placing it before Paragraph 1 (A). Paragraph 2 opens with 'With permits approved,' meaning the permitting process in Paragraph 3 must be completed before Paragraph 2's installation begins; leaving Paragraph 3 after Paragraph 2 (C) would mean Paragraph 2 references approved permits that haven't been described yet. Placing Paragraph 3 after Paragraph 4 (D) is illogical because permits must be secured before construction, not after activation. Only placing Paragraph 3 directly after Paragraph 1 (B) satisfies both the 'once the system is designed' requirement and supplies the 'permits approved' condition that Paragraph 2 depends on.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-12", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "<p><strong>Paragraph 1:</strong> Frida Kahlo was eighteen years old and riding a bus through Mexico City in 1925 when the vehicle collided with a streetcar, leaving her with a broken spine, pelvis, and collarbone, injuries that would cause her chronic pain for the rest of her life.</p><p><strong>Paragraph 2:</strong> Kahlo is now recognized as one of the twentieth century's most important painters, and her intensely personal self-portraits, filled with symbolic imagery drawn from Mexican folk art and her own physical suffering, hang in major museums around the world.</p><p><strong>Paragraph 3:</strong> Confined to a body cast and unable to walk during her long recovery, Kahlo began painting self-portraits using a special easel her mother had built and a mirror mounted above her bed, transforming her isolation into the start of her artistic career.</p><p><strong>Paragraph 4:</strong> In 1929, Kahlo married the celebrated muralist Diego Rivera, and the couple's fame grew together as she began exhibiting her own paintings both in Mexico and internationally.</p>", "question": "For the sake of logic and cohesion, Paragraph 2 should be placed:", "choices": [{"letter": "A", "text": "before Paragraph 1."}, {"letter": "B", "text": "after Paragraph 3."}, {"letter": "C", "text": "after Paragraph 4."}, {"letter": "D", "text": "after Paragraph 1."}], "correctLetter": "C", "explanation": "Paragraphs 1, 3, and 4 form a direct chronological and causal chain: the bus accident and chronic injuries (Paragraph 1) lead into her bedridden recovery, when she begins painting (Paragraph 3), which leads into her marriage and growing exhibition career (Paragraph 4). Paragraph 2, which discusses her status as one of the century's most important painters 'now,' is a legacy statement that presupposes this whole arc has already happened, so it cannot come before Paragraph 1 (A). Its current position after Paragraph 1 (D) breaks the direct cause-and-effect link between the accident and her recovery-driven start as a painter, and placing it after Paragraph 3 (B) similarly interrupts the link between her painting's start and her subsequent marriage and international exhibiting. Only placing Paragraph 2 after Paragraph 4 (C) lets it function as the natural concluding, legacy-summarizing paragraph after the full chronological story is told.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-13", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "<p><strong>Paragraph 1:</strong> The water cycle begins when energy from the sun heats water in oceans, lakes, and rivers, causing it to evaporate into water vapor that rises into the atmosphere.</p><p><strong>Paragraph 2:</strong> When the water droplets in a cloud grow too heavy to remain suspended in the air, they fall back to Earth's surface as precipitation, in the form of rain, snow, sleet, or hail.</p><p><strong>Paragraph 3:</strong> As the rising water vapor reaches cooler air high in the atmosphere, it condenses around tiny particles of dust to form the water droplets that make up clouds.</p><p><strong>Paragraph 4:</strong> Once precipitation reaches the ground, it either soaks into the soil to become groundwater or flows across the surface as runoff into streams and rivers, which eventually carry it back to the ocean to begin the cycle anew.</p>", "question": "For the sake of logic and cohesion, Paragraph 2 should be placed:", "choices": [{"letter": "A", "text": "before Paragraph 1."}, {"letter": "B", "text": "after Paragraph 1."}, {"letter": "C", "text": "after Paragraph 4."}, {"letter": "D", "text": "after Paragraph 3."}], "correctLetter": "D", "explanation": "Paragraph 2 describes precipitation as caused by 'water droplets in a cloud' growing too heavy, but clouds and their water droplets are only introduced in Paragraph 3's description of condensation, meaning Paragraph 3 must come before Paragraph 2. Placing Paragraph 2 before Paragraph 1 (A) is impossible since water hasn't even evaporated yet, and no droplets exist. Its current position after Paragraph 1 (B) is broken because it references cloud droplets that haven't been described, since condensation (Paragraph 3) comes after it. Placing it after Paragraph 4 (C) reverses the entire cycle's logic, since runoff and return to the ocean must follow precipitation, not precede it. Only placing Paragraph 2 after Paragraph 3 (D) supplies the cloud droplets Paragraph 2 depends on before precipitation occurs, then flows correctly into Paragraph 4's runoff stage.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "SEQ-14", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "<p><strong>Paragraph 1:</strong> The Underground Railroad was not an actual railroad but a secret network of routes, safe houses, and sympathetic allies that helped enslaved people escape to free states and Canada in the decades before the Civil War.</p><p><strong>Paragraph 2:</strong> Harriet Tubman, herself a formerly enslaved woman, became the network's most famous conductor, making roughly thirteen dangerous trips back into the South and personally guiding approximately seventy enslaved people to freedom, a feat that earned her the nickname 'Moses.'</p><p><strong>Paragraph 3:</strong> Participants borrowed railroad terminology to describe their work in code: guides who led escapees were called 'conductors,' safe houses were 'stations,' and the people being guided to freedom were referred to as 'passengers' or 'cargo.'</p><p><strong>Paragraph 4:</strong> Historians estimate that the Underground Railroad helped somewhere between 30,000 and 100,000 enslaved people reach freedom, and its network of ordinary citizens defying an unjust law remains a powerful symbol of moral courage.</p>", "question": "For the sake of logic and cohesion, Paragraph 2 should be placed:", "choices": [{"letter": "A", "text": "after Paragraph 3."}, {"letter": "B", "text": "before Paragraph 1."}, {"letter": "C", "text": "after Paragraph 1."}, {"letter": "D", "text": "after Paragraph 4."}], "correctLetter": "A", "explanation": "Paragraph 2 calls Tubman the network's most famous 'conductor,' a term that is only defined as the code-word for a guide in Paragraph 3; the essay's general-to-specific structure requires the definition to precede the specific example that uses it. Placing Paragraph 2 before Paragraph 1 (B) is illogical because it refers to 'the network,' which is only introduced in Paragraph 1. Its current position after Paragraph 1 (C) interrupts the natural flow from the general definition (Paragraph 1) into the explanation of the network's coded terminology (Paragraph 3). Placing it after Paragraph 4 (D) is anticlimactic, putting a specific illustrative example after the essay's concluding legacy statement. Only placing Paragraph 2 after Paragraph 3 (A) follows the definition-then-mechanics-then-example-then-conclusion structure the essay is building.", "trick": "Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?"}, {"id": "ICP-1", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "[blank] The potter begins by centering a lump of clay on the spinning wheel, pressing it firmly with wet hands until it stops wobbling and moves as a single smooth mass. Next, the potter presses a thumb into the center of the clay to open it into a hollow form, then gradually pulls the walls upward and outward between the fingers to shape the vessel. Once the desired shape is achieved, a wire tool slides beneath the piece to separate it cleanly from the wheel before it is set aside to dry.", "question": "Which choice provides the most effective introduction to this paragraph?", "choices": [{"letter": "A", "text": "Throwing a pot on a wheel involves a repeatable sequence of steps that transforms a shapeless lump of clay into a finished vessel."}, {"letter": "B", "text": "Ceramics have been produced by human cultures for thousands of years."}, {"letter": "C", "text": "Glazes applied before a final firing give pottery its glossy, colored surface."}, {"letter": "D", "text": "A kiln must reach extremely high temperatures to properly fire clay."}], "correctLetter": "A", "explanation": "The paragraph's actual content is a step-by-step process for throwing a pot: centering, opening, pulling up the walls, and cutting the finished piece free. Choice A introduces exactly that process, framing what follows as a sequence of steps. Choice B is a true fact about ceramics history in general but says nothing about the wheel-throwing process the paragraph actually describes. Choices C and D both discuss later stages of pottery-making (glazing and firing) that never appear anywhere in this paragraph, making them mismatched to its specific content. A is correct because it matches what the paragraph is actually about.", "trick": "Ask 'what is this paragraph actually about?' before picking the opening or closing line."}, {"id": "ICP-2", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "At a modern recycling facility, collected materials first pass through a sorting line where powerful magnets pull out steel cans and eddy currents eject aluminum cans into a separate bin. Optical scanners then identify different types of plastic by the way they reflect infrared light, directing each type down its own chute. Paper and cardboard are separated out by screens that let flat, lightweight items fall through while heavier, rounder containers continue along the belt. [blank]", "question": "Which choice provides the most effective conclusion to this paragraph?", "choices": [{"letter": "A", "text": "Recycling programs vary significantly from one city to another, causing confusion among residents."}, {"letter": "B", "text": "The first curbside recycling program in the United States began in the 1970s."}, {"letter": "C", "text": "Once sorted, each material is baled separately and shipped to manufacturers who will melt or pulp it down into new raw material."}, {"letter": "D", "text": "Reducing consumption is generally considered more environmentally effective than recycling."}], "correctLetter": "C", "explanation": "The paragraph describes, step by step, how materials get sorted at a facility; a strong conclusion should complete that process by explaining what happens once sorting is finished. Choice C does exactly that, describing the next and final step: baling and shipping the sorted materials to manufacturers. Choices A and D raise valid points about recycling generally, but neither follows from or completes the specific sorting process just described. Choice B is a historical fact unrelated to the facility process being detailed. C is correct because it is the direct next step in the sequence the paragraph has been building.", "trick": "Ask 'what is this paragraph actually about?' before picking the opening or closing line."}, {"id": "ICP-3", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "Rosalind Franklin was a British chemist whose X-ray diffraction images provided crucial evidence for the double-helix structure of DNA. Working at King's College London in the early 1950s, she used a technique called X-ray crystallography to photograph DNA fibers, producing an image known as Photo 51, which revealed the molecule's helical shape with striking clarity. Without her knowledge, a colleague showed Photo 51 to James Watson, who along with Francis Crick used it to help complete their own model of DNA's structure, for which they later won the Nobel Prize. Franklin died in 1958 at age 37, four years before the Nobel Prize was awarded, and by the rules of the prize, Nobel Prizes are not given posthumously, so she was never nominated for the honor her work helped make possible.", "question": "Suppose the writer's primary purpose had been to explain the specific scientific contribution Rosalind Franklin made to the discovery of DNA's structure. Would this essay accomplish that purpose?", "choices": [{"letter": "A", "text": "No, because the essay focuses only on the Nobel Prize controversy and never mentions her scientific work at all."}, {"letter": "B", "text": "No, because the essay is primarily about James Watson and Francis Crick's careers rather than Franklin's."}, {"letter": "C", "text": "Yes, because it lists the exact dates and locations of every experiment she conducted at King's College."}, {"letter": "D", "text": "Yes, because it describes the X-ray crystallography technique she used and explains how her Photo 51 image directly informed Watson and Crick's model."}], "correctLetter": "D", "explanation": "The essay explicitly names Franklin's technique (X-ray crystallography), her specific result (Photo 51), and how that image was used by Watson and Crick, which together do explain her specific scientific contribution. Choice A is factually wrong, since the essay clearly describes her scientific work before ever mentioning the Nobel Prize issue. Choice B is also inaccurate, as the essay is centered on Franklin throughout, mentioning Watson and Crick only in relati const CONCEPT_GROUPS = [
  { group: "Conventions of Standard English", concepts: ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"] },
  { group: "Knowledge of Language", concepts: ["Word Choice & Precision", "Style & Tone", "Concision & Redundancy"] },
  { group: "Production of Writing", concepts: ["Organization & Development", "Transitions"] },
];
const WEAK_CONCEPTS = ["Grammar & Usage", "Sentence Structure & Formation"];

let selectedConcepts = new Set(WEAK_CONCEPTS);
let pool = [];        // shuffled queue of question objects for current session
let usedIds = [];      // ids shown this session (for summary + avoiding immediate repeats)
let current = null;
let answered = false;
let sessionLog = [];   // {concept, correct}
let reshuffleCount = 0;

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderCheckboxes();
    setSyncStatusUI();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function countFor(concept) {
  return ALL_QUESTIONS.filter(q => q.concept === concept).length;
}

function renderCheckboxes() {
  const container = document.getElementById('checkboxList');
  container.innerHTML = '';
  CONCEPT_GROUPS.forEach(g => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.group;
    container.appendChild(title);
    g.concepts.forEach(c => {
      const label = document.createElement('label');
      label.className = 'chk';
      const checked = selectedConcepts.has(c) ? 'checked' : '';
      label.innerHTML = `<input type="checkbox" data-concept="${c}" ${checked}> ${c} <span class="count">${countFor(c)} q</span>`;
      label.querySelector('input').addEventListener('change', onCheckboxChange);
      container.appendChild(label);
    });
  });
  updateSelCount();
}

function onCheckboxChange(e) {
  const c = e.target.getAttribute('data-concept');
  if (e.target.checked) selectedConcepts.add(c); else selectedConcepts.delete(c);
  updateSelCount();
}

function selectPreset(kind) {
  if (kind === 'weak') selectedConcepts = new Set(WEAK_CONCEPTS);
  if (kind === 'all') selectedConcepts = new Set(CONCEPT_GROUPS.flatMap(g => g.concepts));
  if (kind === 'none') selectedConcepts = new Set();
  renderCheckboxes();
}

function updateSelCount() {
  const total = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept)).length;
  document.getElementById('selCount').textContent = selectedConcepts.size === 0
    ? 'Select at least one concept to begin.'
    : `${total} question${total===1?'':'s'} available in the selected concepts.`;
  document.getElementById('startBtn').disabled = total === 0;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool() {
  const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
  pool = shuffle(filtered);
}

function startQuiz() {
  buildPool();
  usedIds = [];
  sessionLog = [];
  reshuffleCount = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextQuestion();
}

function restartSameFilters() {
  document.getElementById('summary').style.display = 'none';
  startQuiz();
}

function backToSetup() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderCheckboxes();
}

function nextQuestion() {
  let banner = '';
  if (pool.length === 0) {
    const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
    pool = shuffle(filtered);
    reshuffleCount++;
    banner = `<div class="banner">You've been through every question in this set — reshuffling and starting again from the top.</div>`;
  }
  current = pool.pop();
  usedIds.push(current.id);
  answered = false;
  renderQuestion(banner);
  updateTopbar();
}

function updateTopbar() {
  document.getElementById('progressTag').textContent = `Question ${usedIds.length}${reshuffleCount>0 ? ' (round ' + (reshuffleCount+1) + ')' : ''}`;
  const correct = sessionLog.filter(s => s.correct).length;
  document.getElementById('scoreText').textContent = `${correct}/${sessionLog.length}`;
}

function renderQuestion(bannerHtml) {
  const q = current;
  const choicesHtml = q.choices.map(c => `
    <button class="choice" data-letter="${c.letter}" onclick="selectChoice('${c.letter}')">
      <span class="ltr">${c.letter}</span>${escapeHtml(c.text)}
    </button>
  `).join('');
  document.getElementById('qBody').innerHTML = `
    ${bannerHtml || ''}
    <div class="concept-chip">${q.concept} · ${q.subtype}</div>
    <div class="passage">${q.passage}</div>
    <div class="qstem">${escapeHtml(q.question)}</div>
    <div id="choicesArea">${choicesHtml}</div>
    <div id="feedbackArea"></div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectChoice(letter) {
  if (answered) return;
  answered = true;
  const q = current;
  const isCorrect = letter === q.correctLetter;
  sessionLog.push({ concept: q.concept, correct: isCorrect });
  logAttempt(q, letter, isCorrect);

  document.querySelectorAll('#choicesArea .choice').forEach(btn => {
    btn.classList.add('disabled');
    btn.onclick = null;
    const l = btn.getAttribute('data-letter');
    if (l === q.correctLetter) btn.classList.add('correct');
    else if (l === letter) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="verdict ${isCorrect ? 'good' : 'bad'}">${isCorrect ? 'Correct!' : 'Not quite — correct answer: ' + q.correctLetter}</div>
      <div class="explain">${escapeHtml(q.explanation)}</div>
      <div class="trick"><b>Rule / Memory Trick:</b> ${escapeHtml(q.trick)}</div>
    </div>
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
  `;
  updateTopbar();
}

function endSession() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  renderSummary();
}

function renderSummary() {
  const total = sessionLog.length;
  const correct = sessionLog.filter(s => s.correct).length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  document.getElementById('sumBig').textContent = total ? pct + '%' : '—';
  document.getElementById('sumSub').textContent = `${correct} of ${total} correct this session`;

  const byConcept = {};
  sessionLog.forEach(s => {
    byConcept[s.concept] = byConcept[s.concept] || { n: 0, c: 0 };
    byConcept[s.concept].n++;
    if (s.correct) byConcept[s.concept].c++;
  });
  const rows = Object.keys(byConcept).sort((a,b) => (byConcept[a].c/byConcept[a].n) - (byConcept[b].c/byConcept[b].n));
  const container = document.getElementById('sumCats');
  if (rows.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;">No questions answered yet.</p>';
    return;
  }
  container.innerHTML = rows.map(c => {
    const { n, c: correctN } = byConcept[c];
    const p = Math.round((correctN/n)*100);
    return `<div class="cat-row">
      <span>${c}</span>
      <div class="bar-wrap"><div class="bar" style="width:${p}%"></div></div>
      <span class="pct">${correctN}/${n}</span>
    </div>`;
  }).join('');
}
</script>
