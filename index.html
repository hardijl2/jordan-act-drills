: "B", "explanation": "B, \"Although,\" correctly signals the contrast between the lanes' success and their unexpected removal. A, \"Because,\" illogically implies the lanes were removed as a result of reducing congestion, which makes no sense. C, \"Since,\" carries the same causal meaning as \"because\" here and creates the same illogical result. D, \"As,\" likewise reads as causal in this context and produces the same illogical relationship.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-4", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "Even though the update fixed the original crash, <u>but</u> it still introduced a new bug.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "and"}, {"letter": "H", "text": "OMIT the underlined portion"}, {"letter": "J", "text": "or"}], "correctLetter": "H", "explanation": "H correctly omits the redundant connector, since \"Even though\" already subordinates the first clause and needs no second connector to join the two ideas. F pairs \"Even though\" with \"but,\" which is grammatically redundant. G pairs it with \"and,\" which is likewise a nonstandard, redundant combination. J pairs it with \"or,\" which is both redundant and logically nonsensical in context.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-5", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>Being that</u> the assembly line was halted for scheduled maintenance, workers used the downtime for equipment inspections.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Because"}, {"letter": "C", "text": "Being how"}, {"letter": "D", "text": "Seeing as how"}], "correctLetter": "B", "explanation": "B, \"Because,\" is the standard subordinating conjunction that correctly and formally introduces the reason clause. A, \"Being that,\" is a nonstandard, informal substitute not accepted in formal written English. C, \"Being how,\" is similarly nonstandard and ungrammatical. D, \"Seeing as how,\" is also an informal, nonstandard construction inappropriate for this register.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-6", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "The critics uniformly praised the novel's elegant, evocative prose<u>, they criticized its predictable plot</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": ", while they criticized its predictable plot"}, {"letter": "H", "text": ", they criticizing its predictable plot"}, {"letter": "J", "text": ", them criticizing its predictable plot"}], "correctLetter": "G", "explanation": "G correctly uses the subordinating conjunction \"while\" to demote the second clause and signal contrast, properly joined with a comma. F is a comma splice, joining two independent clauses with only a comma. H is ungrammatical because \"they criticizing\" has no finite verb. J is ungrammatical for the same reason and also uses the wrong pronoun case, \"them,\" in subject position.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-7", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "After a lengthy trial, the jury deliberated for three days, <u>and reaching</u> a unanimous verdict.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "and reached"}, {"letter": "C", "text": "then reaching"}, {"letter": "D", "text": "and having reached"}], "correctLetter": "B", "explanation": "B, \"and reached,\" gives the coordinating conjunction \"and\" a proper finite verb to join in a parallel compound predicate with \"deliberated.\" A is ungrammatical because \"reaching\" is not a finite verb and cannot pair with \"and\" this way. C, \"then reaching,\" still lacks a finite verb, so the clause remains broken. D, \"and having reached,\" improperly coordinates a finite clause with a non-finite participial phrase using \"and.\"", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-8", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "The startup quickly pivoted to a subscription-based pricing model<u>, meanwhile competitors slashed their own prices</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "; meanwhile, competitors slashed their own prices"}, {"letter": "H", "text": ", while meanwhile competitors slashed their own prices"}, {"letter": "J", "text": " meanwhile competitors slashed their own prices"}], "correctLetter": "G", "explanation": "G correctly uses a semicolon before the conjunctive adverb \"meanwhile,\" which is strong enough to join two independent clauses, followed by a comma. F is a comma splice, since \"meanwhile\" cannot join independent clauses with only a comma. H redundantly pairs the subordinating \"while\" with \"meanwhile,\" which is confusing and ungrammatical. J fuses the clauses with no punctuation at all, an even more blatant run-on.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "CNI-1", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The old windmill<u>, which has ground grain for local farmers for over a century still stands</u> watch over the valley.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " which has ground grain for local farmers for over a century, still stands"}, {"letter": "C", "text": ", which has ground grain for local farmers for over a century, still stands"}, {"letter": "D", "text": " which has ground grain for local farmers for over a century still stands"}], "correctLetter": "C", "explanation": "Choice C is correct because the nonessential clause \"which has ground grain for local farmers for over a century\" is enclosed by a comma on both sides, matching the opening comma with a closing one before \"still stands.\" Choice A (NO CHANGE) opens the comma gate but never closes it. Choice B closes the gate without ever opening it. Choice D omits punctuation entirely, but since \"the old windmill\" is already a specific, unique subject, the clause describing it is nonessential and must be set off.", "trick": "If you open a comma gate, you must close it."}, {"id": "CNI-2", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "Marie Curie<u>, the first person to win Nobel Prizes in two different sciences remains</u> an inspiration to researchers everywhere.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", the first person to win Nobel Prizes in two different sciences, remains"}, {"letter": "C", "text": " the first person to win Nobel Prizes in two different sciences, remains"}, {"letter": "D", "text": " the first person to win Nobel Prizes in two different sciences remains"}], "correctLetter": "B", "explanation": "Choice B is correct because it places a comma both before and after the nonessential appositive \"the first person to win Nobel Prizes in two different sciences,\" properly enclosing it. Choice A (NO CHANGE) opens the gate but fails to close it before \"remains.\" Choice C closes the gate without opening it. Choice D leaves out both commas, but because Marie Curie is a specific named individual, the appositive renaming her is inherently nonessential and must be set off.", "trick": "If you open a comma gate, you must close it."}, {"id": "CNI-3", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The axolotl<u> a salamander native only to a few lakes near Mexico City, can regenerate</u> entire limbs after injury.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", a salamander native only to a few lakes near Mexico City can regenerate"}, {"letter": "C", "text": " a salamander native only to a few lakes near Mexico City can regenerate"}, {"letter": "D", "text": ", a salamander native only to a few lakes near Mexico City, can regenerate"}], "correctLetter": "D", "explanation": "Choice D is correct because it encloses the nonessential appositive \"a salamander native only to a few lakes near Mexico City\" with a comma on both sides. Choice A (NO CHANGE) closes the gate but never opens it after \"axolotl.\" Choice B opens the gate but never closes it before \"can regenerate.\" Choice C omits both commas, but because \"the axolotl\" already names a specific, unique subject, the appositive describing it is nonessential and needs the comma pair.", "trick": "If you open a comma gate, you must close it."}, {"id": "APC-1", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The company reported that <u>it's</u> profits had doubled since the new product launched.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "its'"}, {"letter": "D", "text": "its's"}], "correctLetter": "B", "explanation": "Choice B, \"its,\" is correct because the sentence needs the possessive pronoun showing the company's profits, and swapping in the long form \"it is profits\" makes no sense. Choice A (NO CHANGE), \"it's,\" is the contraction for \"it is\" and fails that substitution test. Choice C, \"its',\" is not a standard English word. Choice D, \"its's,\" incorrectly doubles the possessive marking and is also not a real word.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "APC-2", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "My two younger <u>sisters</u> bicycles were both stolen from the garage last week.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sister's"}, {"letter": "C", "text": "sisters'"}, {"letter": "D", "text": "sisters's"}], "correctLetter": "C", "explanation": "Choice C, \"sisters',\" is correct because \"two younger sisters\" establishes two separate owners, and the plural possessive form shows that both sisters each own a bicycle. Choice A (NO CHANGE), \"sisters,\" is a plain plural with no apostrophe and shows no possession at all. Choice B, \"sister's,\" is singular possessive and wrongly implies only one sister. Choice D, \"sisters's,\" is nonstandard and incorrectly doubles the possessive marker.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "APC-3", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The librarians reorganized the <u>childrens</u> section to make picture books easier to find.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "childrens'"}, {"letter": "C", "text": "children's"}, {"letter": "D", "text": "children's's"}], "correctLetter": "C", "explanation": "Choice C, \"children's,\" is correct because \"children\" is already the irregular plural of \"child,\" so adding apostrophe-s correctly shows possession of the section. Choice A (NO CHANGE), \"childrens,\" is not a valid word since \"children\" cannot take an additional plural \"s.\" Choice B, \"childrens',\" apostrophizes that same invalid form rather than the correct plural \"children.\" Choice D, \"children's's,\" incorrectly doubles the possessive marker.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "DCP-1", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The recipe calls for three ingredients<u>\u2014flour, sugar, and butter\u2014</u>that most bakers already have on hand.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", flour, sugar, and butter,"}, {"letter": "C", "text": "\u2014flour, sugar, and butter,"}, {"letter": "D", "text": "\u2014flour, sugar, and butter)"}], "correctLetter": "A", "explanation": "Choice A (NO CHANGE) is correct because the interior list \"flour, sugar, and butter\" already contains commas, so matching dashes on both ends are needed to bookend the phrase clearly. Choice B uses commas on both sides, but since the interior phrase already has two commas, adding two more creates a confusing run of four commas that reads as one long list. Choice C mismatches a dash with a comma. Choice D mismatches a dash with a closing parenthesis.", "trick": "Punctuation bookends must match."}, {"id": "DCP-2", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The old clock in the hallway<u>\u2014a gift from my grandmother,</u> still keeps perfect time.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", a gift from my grandmother,"}, {"letter": "C", "text": "(a gift from my grandmother,"}, {"letter": "D", "text": ", a gift from my grandmother\u2014"}], "correctLetter": "B", "explanation": "Choice B is correct because the nonessential phrase \"a gift from my grandmother\" contains no internal commas, so a matching comma on each side clearly and sufficiently sets it off. Choice A (NO CHANGE) opens with a dash but closes with a comma, mismatching the bookends. Choice C opens with a parenthesis but closes with a comma. Choice D opens with a comma but closes with a dash.", "trick": "Punctuation bookends must match."}, {"id": "DCP-3", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The novel's ending<u>\u2014which surprised nearly every reader,</u> sparked heated debate online.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "\u2014which surprised nearly every reader\u2014"}, {"letter": "C", "text": ", which surprised nearly every reader\u2014"}, {"letter": "D", "text": "(which surprised nearly every reader\u2014"}], "correctLetter": "B", "explanation": "Choice B is correct because it encloses the nonessential clause \"which surprised nearly every reader\" with a dash on both ends, matching bookends. Choice A (NO CHANGE) opens with a dash but closes with a comma, an unmatched pairing. Choice C opens with a comma but closes with a dash. Choice D opens with a parenthesis but closes with a dash.", "trick": "Punctuation bookends must match."}, {"id": "CSU-1", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Rock climbing demands three essential qualities<u>:</u> strength, balance, and unwavering focus under pressure.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ";"}, {"letter": "C", "text": ","}, {"letter": "D", "text": "."}], "correctLetter": "A", "explanation": "Choice A (NO CHANGE) is correct because \"Rock climbing demands three essential qualities\" is a complete independent clause, and a colon properly introduces the list that follows. Choice B's semicolon is wrong because \"strength, balance, and unwavering focus under pressure\" is not itself an independent clause. Choice C's comma cannot grammatically introduce a list this way after a complete clause. Choice D's period creates a sentence fragment beginning with a lowercase word, which is both ungrammatical and improperly capitalized.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "CSU-2", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "The old bridge closed for unexpected repairs<u>,</u> local shop owners reported a surge in foot traffic downtown.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ":"}, {"letter": "C", "text": ";"}, {"letter": "D", "text": "."}], "correctLetter": "C", "explanation": "Choice C is correct because both \"The old bridge closed for unexpected repairs\" and \"local shop owners reported a surge in foot traffic downtown\" are complete independent clauses, and a semicolon properly links two closely related independent clauses of equal weight. Choice A (NO CHANGE) creates a comma splice, joining two independent clauses with only a comma. Choice B's colon is inappropriate because the second clause states a separate, related fact rather than explaining or defining the first. Choice D's period leaves \"local\" lowercase, making it an invalid start to a new sentence.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "CSU-3", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Digital photography changed one thing above all<u>:</u> it made experimentation nearly free for beginners.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ";"}, {"letter": "C", "text": ","}, {"letter": "D", "text": "."}], "correctLetter": "A", "explanation": "Choice A (NO CHANGE) is correct because \"Digital photography changed one thing above all\" is a complete independent clause, and the colon properly introduces the clause that names and explains that \"one thing.\" Choice B's semicolon is meant to link two equally weighted independent statements rather than one that specifically defines what the first clause names, so it is a weaker fit here. Choice C creates a comma splice between two independent clauses. Choice D's period leaves \"it\" lowercase, an invalid sentence start.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "UP-1", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The scientists who studied the coral reef<u>,</u> discovered unexpected signs of recovery.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ";"}, {"letter": "C", "text": ":"}, {"letter": "D", "text": "OMIT the underlined portion"}], "correctLetter": "D", "explanation": "Choice D is correct because no punctuation belongs between a subject (\"the scientists who studied the coral reef\") and its verb (\"discovered\"). Choice A (NO CHANGE) incorrectly inserts a comma between them. Choice B's semicolon is wrong because it would need an independent clause on each side, and \"discovered unexpected signs of recovery\" has no subject on its own. Choice C's colon is wrong for the same reason and because no list or explanation follows.", "trick": "When in doubt, leave it out."}, {"id": "UP-2", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The hikers reached the rocky summit and<u>,</u> watched the sunrise in complete silence.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "OMIT the underlined portion"}, {"letter": "C", "text": ";"}, {"letter": "D", "text": ":"}], "correctLetter": "B", "explanation": "Choice B is correct because no punctuation is needed between the conjunction \"and\" and the second verb \"watched\" in this simple compound predicate sharing the subject \"the hikers.\" Choice A (NO CHANGE) wrongly inserts a comma there. Choice C's semicolon would require an independent clause after it, but \"watched the sunrise in complete silence\" has no subject. Choice D's colon requires a complete independent clause immediately before it, but \"The hikers reached the rocky summit and\" is not complete.", "trick": "When in doubt, leave it out."}, {"id": "UP-3", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "Please submit the form<u>,</u> before the Friday deadline to avoid late fees.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ";"}, {"letter": "C", "text": ":"}, {"letter": "D", "text": "OMIT the underlined portion"}], "correctLetter": "D", "explanation": "Choice D is correct because the phrase \"before the Friday deadline to avoid late fees\" is essential information specifying when to submit the form and needs no punctuation before it. Choice A (NO CHANGE) wrongly separates the verb \"submit\" from this essential phrase with a comma. Choice B's semicolon is wrong because what follows is not an independent clause. Choice C's colon is wrong because \"Please submit the form\" is not being followed by a list or formal explanation, and the phrase is essential rather than a set-off appositive.", "trick": "When in doubt, leave it out."}, {"id": "UP-4", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "My brother<u>,</u> and I planned an exciting road trip across three states.", "question": "Which choice provides the most appropriate punctuation here?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ":"}, {"letter": "C", "text": "OMIT the underlined portion"}, {"letter": "D", "text": ";"}], "correctLetter": "C", "explanation": "Choice C is correct because no punctuation is needed within the simple two-item compound subject \"My brother and I.\" Choice A (NO CHANGE) wrongly inserts a comma before \"and.\" Choice B's colon is wrong because \"My brother\" alone is not a complete independent clause. Choice D's semicolon is wrong for the same reason, since neither side of it would form an independent clause on its own.", "trick": "When in doubt, leave it out."}, {"id": "WC-1", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The new stadium lighting appears to have a significant <u>affect</u> on the sleep patterns of nearby nesting birds.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "affects"}, {"letter": "C", "text": "affected"}, {"letter": "D", "text": "effect"}], "correctLetter": "D", "explanation": "\"Effect\" is the noun meaning \"a result or influence,\" which is what the sentence needs after \"a significant.\" \"Affect\" is used almost exclusively as a verb meaning \"to influence,\" so it cannot serve as the noun following \"a significant.\" \"Affects\" is a verb form that creates a subject-verb mismatch in the noun slot. \"Affected\" is a past-tense/adjective verb form and likewise cannot function as the required noun.", "trick": "Precise beats fancy."}, {"id": "WC-2", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "In her dissertation, the historian was careful to <u>site</u> every primary source she used from the archive.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sight"}, {"letter": "C", "text": "cite"}, {"letter": "D", "text": "cited"}], "correctLetter": "C", "explanation": "\"Cite\" means to quote or reference a source, exactly what a historian does with primary sources. \"Site\" refers to a physical location or means to position something in a location, not to reference a source. \"Sight\" refers to vision or something seen, unrelated to referencing sources. \"Cited\" is the past tense and doesn't fit after the infinitive marker \"to,\" which requires the base form.", "trick": "Precise beats fancy."}, {"id": "WC-3", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The interactive exhibit was designed to <u>peak</u> visitors' curiosity about deep-sea creatures.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "pique"}, {"letter": "C", "text": "peek"}, {"letter": "D", "text": "peaked"}], "correctLetter": "B", "explanation": "\"Pique,\" meaning to arouse or excite interest, is exactly what an engaging exhibit is meant to do. \"Peak\" means the highest point of something and doesn't work as a verb meaning \"to excite.\" \"Peek\" means a quick, often furtive look, unrelated to stirring interest. \"Peaked\" (past tense of \"peak\") refers to reaching a maximum, not sparking curiosity.", "trick": "Precise beats fancy."}, {"id": "WC-4", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Honesty is the core <u>principal</u> that guides every decision made at the family-owned bakery.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "principals"}, {"letter": "C", "text": "principled"}, {"letter": "D", "text": "principle"}], "correctLetter": "D", "explanation": "\"Principle\" is the noun meaning a fundamental truth or rule that guides behavior, exactly what \"honesty\" is described as here. \"Principal\" as a noun refers to a person in charge or a sum of money, neither of which fits \"the core ___ that guides every decision.\" \"Principals\" is the plural of that same wrong noun. \"Principled\" is an adjective meaning \"having good moral principles\" and cannot serve as the noun following \"the core.\"", "trick": "Precise beats fancy."}, {"id": "WC-5", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The sommelier recommended a crisp white wine to <u>compliment</u> the delicate flavor of the seared scallops.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "complimentary"}, {"letter": "C", "text": "complement"}, {"letter": "D", "text": "complements"}], "correctLetter": "C", "explanation": "\"Complement\" means to complete or enhance something, precisely what a well-paired wine does for a dish's flavor. \"Compliment\" means to praise or express admiration, which doesn't fit pairing food and wine. \"Complimentary\" is an adjective meaning either \"free of charge\" or \"expressing praise,\" not a verb that can follow \"to.\" \"Complements\" is the wrong verb form for the infinitive slot after \"to.\"", "trick": "Precise beats fancy."}, {"id": "WC-6", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The survey questions were carefully worded to <u>illicit</u> honest responses from participants without leading them.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "illicitly"}, {"letter": "C", "text": "elicited"}, {"letter": "D", "text": "elicit"}], "correctLetter": "D", "explanation": "\"Elicit\" means to draw out or evoke a response, fitting the goal of wording survey questions to obtain honest answers. \"Illicit\" is an adjective meaning illegal or forbidden and cannot function as a verb after \"to.\" \"Elicited\" is the past tense and doesn't fit the infinitive form required after \"to.\" \"Illicitly\" is an adverb meaning \"in an illegal manner,\" also the wrong part of speech.", "trick": "Precise beats fancy."}, {"id": "WC-7", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The bride ordered custom <u>stationary</u> with gold foil lettering for the wedding invitations.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "stationery"}, {"letter": "C", "text": "stationarily"}, {"letter": "D", "text": "stationed"}], "correctLetter": "B", "explanation": "\"Stationery\" is the noun referring to writing paper and related materials, exactly what would be custom-ordered with gold foil lettering for invitations. \"Stationary\" is an adjective meaning \"not moving\" and cannot serve as the noun object of \"ordered.\" \"Stationarily\" is an adverb form of that same wrong word. \"Stationed\" is the past tense of \"to station,\" meaning to assign to a post, unrelated to paper goods.", "trick": "Precise beats fancy."}, {"id": "WC-8", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The database stores customer records as <u>discreet</u> entries so that each transaction can be tracked separately.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "discreetly"}, {"letter": "C", "text": "discrete"}, {"letter": "D", "text": "discretion"}], "correctLetter": "C", "explanation": "\"Discrete\" means separate or individually distinct, which precisely describes database entries tracked independently. \"Discreet\" means careful or tactful, especially about revealing sensitive information, a quality of behavior rather than of separateness. \"Discreetly\" is the adverb form of that same wrong word. \"Discretion\" is a noun meaning good judgment or tact, which doesn't fit as an adjective modifying \"entries.\"", "trick": "Precise beats fancy."}, {"id": "WC-9", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "For three hundred pages, the killer's identity managed to <u>allude</u> even the most attentive readers.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "alluded"}, {"letter": "C", "text": "eluded"}, {"letter": "D", "text": "elude"}], "correctLetter": "D", "explanation": "\"Elude\" means to escape detection or evade, exactly what a killer's identity does when readers can't figure it out. \"Allude\" means to refer to something indirectly, not to escape notice. \"Alluded\" is the past tense of that wrong word and also fails to follow the infinitive \"to.\" \"Eluded\" is the correct word but the wrong tense, since \"to\" requires the base form.", "trick": "Precise beats fancy."}, {"id": "WC-10", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Because she was so <u>adverse</u> to needles, the nurse suggested an oral form of the vaccine instead.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "averse"}, {"letter": "C", "text": "adversely"}, {"letter": "D", "text": "adversity"}], "correctLetter": "B", "explanation": "\"Averse\" means strongly disliking or opposed to something, describing a person's attitude, and correctly pairs with \"to.\" \"Adverse\" means harmful or unfavorable and describes conditions or effects (like \"adverse weather\"), not a person's feelings. \"Adversely\" is an adverb meaning \"in a harmful way,\" the wrong part of speech here. \"Adversity\" is a noun meaning hardship or difficulty, unrelated to personal reluctance.", "trick": "Precise beats fancy."}, {"id": "WC-11", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "With landfall <u>eminent</u>, coastal residents rushed to board up their windows and stock up on supplies.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "eminently"}, {"letter": "C", "text": "imminent"}, {"letter": "D", "text": "imminently"}], "correctLetter": "C", "explanation": "\"Imminent\" means about to happen very soon, correctly describing a hurricane's approaching landfall. \"Eminent\" means distinguished or notable, describing a person's stature, not an approaching event. \"Eminently\" is an adverb meaning \"notably,\" derived from the wrong word. \"Imminently\" is an adverb form and cannot modify the noun \"landfall\" the way the needed adjective does.", "trick": "Precise beats fancy."}, {"id": "WC-12", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Lawmakers gathered inside the state <u>capitol</u> building to debate the new education funding bill.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "capital"}, {"letter": "C", "text": "capitals"}, {"letter": "D", "text": "capitalize"}], "correctLetter": "A", "explanation": "\"Capitol,\" with an o, correctly names the specific building where lawmakers meet to legislate, so NO CHANGE is correct. \"Capital\" refers to the city that serves as a seat of government or to wealth/money, not the building itself. \"Capitals\" incorrectly pluralizes the noun. \"Capitalize\" is a verb meaning to write in uppercase or to take advantage of something, unrelated to a legislative building.", "trick": "Precise beats fancy."}, {"id": "WC-13", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The trailhead turned out to be much <u>further</u> than the map indicated, adding two extra miles to the hike.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "furthermore"}, {"letter": "C", "text": "farther"}, {"letter": "D", "text": "farthest"}], "correctLetter": "C", "explanation": "\"Farther\" refers to measurable physical distance, matching the specified \"two extra miles.\" \"Further\" refers to figurative extent or degree, not literal distance. \"Furthermore\" is a transitional adverb meaning \"in addition\" and cannot fill the comparative adjective slot. \"Farthest\" is a superlative, but only two distances are being compared here (the map's stated distance and the actual distance), so the comparative form is needed instead.", "trick": "Precise beats fancy."}, {"id": "WC-14", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The construction site produced a <u>continuous</u> drone of noise that paused every few minutes as workers took breaks.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "continually"}, {"letter": "C", "text": "continuation"}, {"letter": "D", "text": "continual"}], "correctLetter": "D", "explanation": "\"Continual\" describes something that happens repeatedly with breaks in between, matching a noise that \"paused every few minutes.\" \"Continuous\" means uninterrupted, which directly contradicts the described pauses. \"Continually\" is an adverb and cannot modify the noun \"drone.\" \"Continuation\" is a noun meaning the act of continuing, which doesn't function as an adjective describing the drone.", "trick": "Precise beats fancy."}, {"id": "WC-15", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Watching her sister accept the award she had always dreamed of winning herself, she felt a sharp pang of <u>jealousy</u>.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "possessiveness"}, {"letter": "C", "text": "envy"}, {"letter": "D", "text": "suspicion"}], "correctLetter": "C", "explanation": "\"Envy\" precisely describes wanting something someone else has, matching the award she wanted for herself. \"Jealousy\" specifically involves fear of losing something one already possesses to a rival, but she never had the award to begin with. \"Possessiveness\" means an unwillingness to share something one owns, unrelated to wanting an unattained achievement. \"Suspicion\" means distrust of someone, unrelated to wanting an award.", "trick": "Precise beats fancy."}, {"id": "WC-16", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The new employee openly <u>flaunted</u> the office dress code, wearing sneakers and jeans to every meeting despite repeated warnings.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "flourished"}, {"letter": "C", "text": "floated"}, {"letter": "D", "text": "flouted"}], "correctLetter": "D", "explanation": "\"Flouted\" means to openly disregard or defy a rule, precisely fitting ignoring the dress code \"despite repeated warnings.\" \"Flaunted\" means to show off boastfully, describing pride in display rather than defiance of a rule. \"Flourished\" means to thrive or grow vigorously, unrelated to breaking a rule. \"Floated\" simply means to drift or hover, entirely unrelated to the context.", "trick": "Precise beats fancy."}, {"id": "WC-17", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "After the turbulent flight, several passengers felt <u>nauseous</u> and had to sit down until the dizziness passed.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "nauseated"}, {"letter": "C", "text": "nauseating"}, {"letter": "D", "text": "nauseatingly"}], "correctLetter": "B", "explanation": "\"Nauseated\" precisely describes the passengers' own physical sensation of feeling sick to their stomachs. \"Nauseous\" traditionally describes something that causes nausea in others (a nauseous odor), not the feeling of being sick oneself. \"Nauseating\" carries that same \"causing sickness\" meaning, describing a source of nausea rather than a person's condition. \"Nauseatingly\" is an adverb form of that same wrong meaning and cannot describe how the passengers felt.", "trick": "Precise beats fancy."}, {"id": "WC-18", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "A new documentary explores <u>historical</u> methods of shipbuilding used by various coastal cultures throughout the centuries.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "historic"}, {"letter": "C", "text": "historian's"}, {"letter": "D", "text": "historically"}], "correctLetter": "A", "explanation": "\"Historical\" correctly means \"relating to history in general,\" fitting shipbuilding methods used across many cultures and centuries, so NO CHANGE is correct. \"Historic\" means significant or remarkable within history, which overstates ordinary, everyday shipbuilding techniques. \"Historian's\" is a possessive noun meaning methods belonging to a historian, not methods from history. \"Historically\" is an adverb and cannot modify the noun \"methods\" the way the needed adjective does.", "trick": "Precise beats fancy."}, {"id": "WC-19", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Noticing the audience's stunned silence, the speaker <u>implied</u> that his controversial claim needed more support before the Q&A began.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "inferred"}, {"letter": "C", "text": "indicated"}, {"letter": "D", "text": "hinted"}], "correctLetter": "B", "explanation": "\"Inferred\" precisely describes drawing a conclusion from observed evidence, here the speaker reasoning from the audience's silence. \"Implied\" means to suggest something to others through speech or writing, but the speaker is drawing a conclusion, not suggesting one to an audience. \"Indicated\" means to point out or show something to others, the wrong direction of communication. \"Hinted\" similarly means to suggest something indirectly to others, not to reach a private conclusion from evidence.", "trick": "Precise beats fancy."}, {"id": "WC-20", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "She counted down the days, <u>anxious</u> to finally taste her grandmother's famous pie at the family reunion.", "question": "Which choice most precisely conveys the intended meaning in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "nervous"}, {"letter": "C", "text": "eager"}, {"letter": "D", "text": "apprehensive"}], "correctLetter": "C", "explanation": "\"Eager\" precisely conveys enthusiastic, positive anticipation, matching the joyful excitement of counting down to a beloved family recipe. \"Anxious\" specifically connotes worry or nervousness about an uncertain or potentially negative outcome, which doesn't fit an occasion of pure excitement. \"Nervous\" likewise implies apprehension or unease, not joyful anticipation. \"Apprehensive\" means fearful or dreading what's to come, the opposite of eager excitement for a treat.", "trick": "Precise beats fancy."}, {"id": "ST-1", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Beekeeping has become increasingly popular among city residents seeking a hobby that benefits the environment. A single hive can produce twenty pounds of honey each season. Managing a hive, however, <u>is no walk in the park</u> and requires weekly inspections.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "demands significant time and attention"}, {"letter": "C", "text": "constitutes an exceedingly onerous and burdensome endeavor"}, {"letter": "D", "text": "is a total drag, not gonna lie"}], "correctLetter": "B", "explanation": "The passage is a plain, informative essay that presents facts about beekeeping in a neutral, straightforward manner. Choice B matches this register with clear, unadorned wording. Choice A's casual idiom and Choice D's slangy aside are too informal for the essay's neutral tone, while Choice C's ornate, Latinate phrasing is far more elaborate than the plain style used elsewhere.", "trick": "Match the essay's volume."}, {"id": "ST-2", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The museum's new exhibit examines daily life in ancient Rome using artifacts recovered from Pompeii. Visitors can view preserved bread loaves, children's toys, and household tools. The curators <u>went all out</u> to arrange the objects like a typical Roman home.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "took great care"}, {"letter": "C", "text": "labored with unwavering meticulousness"}, {"letter": "D", "text": "totally went all in"}], "correctLetter": "B", "explanation": "The surrounding sentences describe the exhibit's contents in a measured, informative tone appropriate to a museum write-up. Choice B keeps that plain, professional register. Choice A's casual idiom and Choice D's slangy phrasing are too conversational for the descriptive tone, and Choice C's dramatic, overwrought phrasing sounds far more elaborate than the rest of the passage.", "trick": "Match the essay's volume."}, {"id": "ST-3", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "I picked up my dad's old guitar last summer just to mess around. Turns out I actually loved it, and I've practiced every day since. My fingers hurt for the first two weeks, but <u>I persevered through the discomfort with steadfast determination</u>.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "I just kept at it"}, {"letter": "C", "text": "I engaged in a rigorous regimen of perseverance"}, {"letter": "D", "text": "I overcame the affliction via sheer force of will"}], "correctLetter": "B", "explanation": "This is a casual, first-person narrative full of relaxed phrasing like 'mess around' and 'turns out.' Choice B fits that easygoing, conversational voice. Choice A is stiffly formal and out of place next to the casual opening, and Choices C and D pile on inflated, formal vocabulary ('rigorous regimen,' 'sheer force of will') that clashes badly with the breezy personal-essay tone.", "trick": "Match the essay's volume."}, {"id": "ST-4", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Coral reefs support about a quarter of all marine species despite covering less than one percent of the ocean floor. Rising temperatures cause coral polyps to expel the algae living in their tissues, a process called bleaching. Scientists <u>are freaking out about</u> how quickly reefs are dying.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "are increasingly alarmed by"}, {"letter": "C", "text": "are gripped by a profound and harrowing sense of trepidation regarding"}, {"letter": "D", "text": "are totally stressed out over"}], "correctLetter": "B", "explanation": "The passage uses precise, neutral scientific language ('coral polyps,' 'bleaching') to explain the reef ecosystem. Choice B keeps this measured, factual register. Choice A's slangy phrase and Choice D's casual wording are too informal for a science-based explanation, while Choice C's dramatic, ornate phrasing overshoots the plain, matter-of-fact style of the rest of the passage.", "trick": "Match the essay's volume."}, {"id": "ST-5", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Every Saturday morning, the town square fills with vendors selling fresh vegetables, homemade jam, and warm bread. Families wander between stalls, sampling cheese and chatting with local farmers. The market <u>has become a totally awesome hangout spot</u> for people of all ages.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "has become a popular gathering place"}, {"letter": "C", "text": "has blossomed into a veritable haven of communal conviviality"}, {"letter": "D", "text": "is basically the coolest place ever"}], "correctLetter": "B", "explanation": "The passage describes the market scene in simple, descriptive prose without slang or flourish. Choice B continues that plain, neutral tone. Choice A's slangy 'totally awesome' and Choice D's exaggerated casualness break from the measured description, while Choice C's flowery, formal vocabulary ('veritable haven of communal conviviality') is far more elaborate than the rest of the passage warrants.", "trick": "Match the essay's volume."}, {"id": "ST-6", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Launched in 1977, the Voyager 1 probe has traveled farther from Earth than any human-made object. It still transmits data from interstellar space using a radio signal so faint that receiving it requires enormous antennas. Engineers <u>are stoked</u> that the spacecraft still functions after nearly five decades.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "are gratified"}, {"letter": "C", "text": "are suffused with boundless wonderment"}, {"letter": "D", "text": "can't even believe"}], "correctLetter": "B", "explanation": "The passage explains Voyager 1's technical achievements in a factual, formal register suited to science writing. Choice B fits this tone with restrained, professional wording. Choice A's slang and Choice D's chatty phrasing are too casual for the technical context, while Choice C's grandiose, poetic phrasing is more elaborate than the plain, informative style used throughout.", "trick": "Match the essay's volume."}, {"id": "ST-7", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Legend credits the Earl of Sandwich with inventing the dish in 1762 so he could eat without leaving the card table. Whatever the truth, the sandwich caught on because it was simple, portable, and endlessly adaptable. Today it <u>constitutes a ubiquitous culinary staple across the entirety of Western civilization</u>.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "shows up on lunch tables everywhere"}, {"letter": "C", "text": "represents an omnipresent gastronomic institution"}, {"letter": "D", "text": "is basically everywhere, no cap"}], "correctLetter": "B", "explanation": "The passage tells this history in a breezy, conversational feature-writing style ('legend credits,' 'whatever the truth'), never turning academic or slangy. Choice B keeps that easy, plain phrasing. Choice A and Choice C both lurch into stiff, jargon-heavy academic language ('ubiquitous culinary staple,' 'gastronomic institution') that clashes with the light tone, while Choice D's internet slang is too casual even for this breezy essay.", "trick": "Match the essay's volume."}, {"id": "ST-8", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Integrating solar and wind power into the national grid requires new infrastructure capable of storing energy when production exceeds demand. Battery technology has improved significantly over the past decade, but costs remain a barrier for many utilities. Policymakers <u>need to get their act together and invest in grid modernization</u> soon.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "must act quickly to invest in grid modernization"}, {"letter": "C", "text": "must rouse themselves from their protracted torpor and champion grid modernization"}, {"letter": "D", "text": "really need to step up their game and invest in grid modernization"}], "correctLetter": "B", "explanation": "This policy-focused passage uses formal, technical language ('infrastructure,' 'utilities,' 'grid modernization') throughout. Choice B maintains that formal register with direct, professional phrasing. Choice A's colloquial idiom and Choice D's casual, slangy phrasing don't fit the policy-essay tone, and Choice C's melodramatic, archaic wording ('protracted torpor') is far more elaborate than the rest of the passage.", "trick": "Match the essay's volume."}, {"id": "ST-9", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "My grandmother has tended the same vegetable garden for over forty years. Every spring she plants tomatoes, beans, and squash in neat, careful rows. When I visit her each summer, I <u>partake in the verdant bounty of her horticultural labors by picking vegetables for dinner</u>.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "help her pick vegetables for dinner"}, {"letter": "C", "text": "revel in the abundant fruits of her agrarian toil by gathering vegetables for dinner"}, {"letter": "D", "text": "just grab whatever veggies I can find for dinner, ha"}], "correctLetter": "B", "explanation": "This warm but plainly written personal narrative describes the grandmother's garden in simple, direct sentences. Choice B continues that plain, sincere style. Choice A and Choice C both swing into ornate, poetic vocabulary ('verdant bounty,' 'agrarian toil') that is far more elaborate than the rest of the essay, while Choice D's flippant aside undercuts the warm, sincere tone with an out-of-place joke.", "trick": "Match the essay's volume."}, {"id": "ST-10", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Community volunteer programs rely on residents willing to donate their time to local causes. Whether it involves tutoring students or cleaning up parks, these efforts strengthen neighborhoods in ways government programs alone cannot. Anyone considering volunteering should <u>just go for it and see what happens</u>, since organizations are usually eager for new help.", "question": "Which choice best maintains the tone established in the rest of the passage?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "consider reaching out to a local organization"}, {"letter": "C", "text": "seize the opportunity to embark upon this noble endeavor without hesitation"}, {"letter": "D", "text": "just wing it and hope for the best, honestly"}], "correctLetter": "B", "explanation": "The passage discusses civic volunteering in a measured, informative tone typical of a formal essay. Choice B matches this with clear, professional phrasing. Choice A's breezy idiom and Choice D's casual aside are too informal for the essay's register, while Choice C's grandiose, sweeping language ('noble endeavor') is more elaborate than the plain, practical tone used elsewhere.", "trick": "Match the essay's volume."}, {"id": "CR-1", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Because heavy rain flooded much of the trail, organizers <u>ultimately decided, in the end, to cancel</u> the race.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "decided to cancel"}, {"letter": "C", "text": "ultimately decided to cancel, in the end,"}, {"letter": "D", "text": "made the ultimate decision, in the end, to cancel"}], "correctLetter": "B", "explanation": "The phrase needs only one expression of finality; \"ultimately\" and \"in the end\" both signal the same concluding decision, so B cuts the repeat while keeping the meaning intact. A keeps both \"ultimately\" and \"in the end,\" which say the same thing twice. C merely relocates \"in the end\" but keeps the identical redundancy, and D adds \"made the ultimate decision\" (echoing \"ultimately\"/\"decided\") while still keeping \"in the end,\" making it even wordier.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-2", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "After the library's yearlong renovation project was finally complete, <u>it</u> reopened to visitors this past spring.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the newly renovated library"}, {"letter": "C", "text": "the library, which had just undergone renovation,"}, {"letter": "D", "text": "the recently renovated building"}], "correctLetter": "A", "explanation": "The sentence already states the library's renovation was \"finally complete,\" so restating that the building was \"renovated\" is unnecessary; \"it\" clearly and concisely refers back to \"the library.\" B, C, and D all reintroduce the renovation fact that's already been established, and C additionally makes the sentence needlessly clunky with an inserted clause.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-3", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The recipe calls for exactly three cups of sugar<u>, a total amount of three cups,</u> to make the frosting set properly.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", a total of three cups,"}, {"letter": "C", "text": "OMIT the underlined portion"}, {"letter": "D", "text": ", which is three cups altogether,"}], "correctLetter": "C", "explanation": "The sentence already states the exact quantity, \"exactly three cups of sugar,\" so restating that amount again adds nothing. Omitting the underlined portion keeps the sentence's meaning fully intact while cutting the repeated quantity. A, B, and D all restate \"three cups\" in slightly different wordy phrasing without adding any new information.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-4", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Meteorologists predicted the hurricane would make landfall by Friday, and <u>it</u> arrived exactly on schedule that morning.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the predicted hurricane"}, {"letter": "C", "text": "the hurricane that had been predicted"}, {"letter": "D", "text": "the aforementioned storm that forecasters had predicted"}], "correctLetter": "A", "explanation": "The sentence already establishes that meteorologists \"predicted\" the hurricane's landfall, so restating that it was \"predicted\" or \"forecast\" is redundant; the pronoun \"it\" refers back concisely without repeating that fact. B, C, and D all needlessly restate the prediction already given, with D piling on extra redundant wording (\"aforementioned,\" \"forecasters had predicted\").", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-5", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "To fix a damaged solar panel, the astronaut <u>ventured outside the spacecraft in order to complete the repair</u> during a six-hour spacewalk.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "ventured outside the spacecraft"}, {"letter": "C", "text": "ventured outside the spacecraft so that the repair could be completed"}, {"letter": "D", "text": "ventured outside the spacecraft with the purpose of completing the repair"}], "correctLetter": "B", "explanation": "The sentence opens with \"To fix a damaged solar panel,\" which already tells readers why the astronaut went outside, so restating that purpose is unnecessary. B keeps only the necessary action, letting the opening phrase carry the purpose. A, C, and D each repeat the already-stated reason for the spacewalk in different wordy phrasing.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-6", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Maria Chen, the author of the bestselling novel, greeted fans at <u>the book signing event where she signed books</u> downtown.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the book signing"}, {"letter": "C", "text": "the event where books were signed by her"}, {"letter": "D", "text": "the signing event held for the signing of books"}], "correctLetter": "B", "explanation": "\"Book signing\" already conveys that she was there to sign books, so adding \"where she signed books\" restates the same action. B trims the phrase to its concise form. A keeps the redundant clause, C rewords the same redundant idea in passive voice, and D repeats \"signing\" twice while adding no new information.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-7", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The transit agency opened twelve new subway stations in June, and <u>ridership</u> climbed by nearly twenty percent within six months.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "ridership numbers"}, {"letter": "C", "text": "the number of people counted as ridership"}, {"letter": "D", "text": "ridership levels and figures"}], "correctLetter": "A", "explanation": "\"Ridership\" already refers to a count of riders, so adding \"numbers,\" restating it as \"the number of people counted as ridership,\" or pairing it with \"figures\" all repeat that same numerical idea built into the word itself. A states the concept once, concisely. B, C, and D each reintroduce the counting idea \"ridership\" already contains, with D doubling up two synonyms.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-8", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Conservationists are building new wildlife corridors to protect several endangered species, such as the snow leopard<u>, which is just one such example</u>.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "OMIT the underlined portion"}, {"letter": "C", "text": ", to name just one example of many"}, {"letter": "D", "text": ", as merely one example among several"}], "correctLetter": "B", "explanation": "\"Such as\" already signals that the snow leopard is just one example among several endangered species, so restating \"which is just one such example,\" \"to name just one example of many,\" or \"as merely one example among several\" all repeat that same signal. Omitting the phrase keeps the sentence's meaning intact while cutting the redundancy.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-9", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The new electric sedan costs more than its gasoline counterpart<u>, which makes it a more expensive option by comparison</u>, but it saves owners money on fuel over time.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "OMIT the underlined portion"}, {"letter": "C", "text": ", a comparatively pricier choice,"}, {"letter": "D", "text": ", making it the costlier option in comparison,"}], "correctLetter": "B", "explanation": "The sentence already establishes the price comparison through \"costs more than its gasoline counterpart,\" so restating that the sedan is \"more expensive,\" \"pricier,\" or \"the costlier option... in comparison\" repeats the same idea. Omitting the underlined portion removes that redundancy while keeping the sentence's meaning and grammar intact. A, C, and D each reword the already-established comparison rather than adding new information.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-10", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The volcano, dormant for nearly a century, erupted without warning last month, and <u>seismologists</u> are now closely monitoring its seismic activity.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "seismologists, the scientists who monitor seismic activity,"}, {"letter": "C", "text": "geologists who specialize in monitoring seismic activity"}, {"letter": "D", "text": "experts trained to monitor volcanic seismic activity"}], "correctLetter": "A", "explanation": "The sentence already states that \"seismologists... are now closely monitoring its seismic activity,\" so any choice that redefines seismologists as people who \"monitor seismic activity\" merely repeats information the sentence already gives. A is correct because the plain noun avoids restating that job description. B, C, and D each add a definition or qualifier that duplicates the \"monitoring...seismic activity\" idea already expressed later in the sentence.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-11", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "During the symphony's finale, the brass section played <u>loudly and thunderously</u>, filling the concert hall with sound.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "thunderously"}, {"letter": "C", "text": "extremely loudly and with thunderous volume"}, {"letter": "D", "text": "thunderously loud"}], "correctLetter": "B", "explanation": "\"Thunderous\" already means extremely loud, so pairing it with \"loudly\" states the same idea twice within the underlined phrase itself. B keeps the single vivid word without the redundant pairing. A keeps both words, C spells out \"extremely loudly\" alongside \"thunderous volume,\" and D combines the adverb and adjective forms of the same idea \u2014 all three restate loudness that \"thunderously\" alone already conveys.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-12", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Because wildfire activity has increased sharply, air quality across the region <u>is worsening as a result of the additional smoke</u> at an alarming rate.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "is worsening"}, {"letter": "C", "text": "is worsening, which is a result of the smoke increase,"}, {"letter": "D", "text": "is worsening because there is more smoke in the air"}], "correctLetter": "B", "explanation": "The opening clause, \"Because wildfire activity has increased sharply,\" already establishes the cause, so restating \"as a result of the additional smoke\" repeats that same cause. B is correct because it states the effect once without re-explaining why it's happening.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-13", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The robotics competition was held at the downtown convention center, and <u>there</u>, students from twelve schools showcased their inventions.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "at that very same convention center"}, {"letter": "C", "text": "at the location where the competition was held"}, {"letter": "D", "text": "at the aforementioned downtown venue"}], "correctLetter": "A", "explanation": "The sentence already names the location as \"the downtown convention center,\" so restating it as \"that very same convention center,\" \"the location where the competition was held,\" or \"the aforementioned downtown venue\" merely repeats the place already identified. A's simple \"there\" concisely refers back without restating the venue, while B, C, and D each reintroduce it.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "CR-14", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The utility company built a new solar farm, and it also plans <u>to additionally add</u> battery storage units next year.", "question": "Which choice is most concise while maintaining the meaning of the sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "to add"}, {"letter": "C", "text": "to also add, in addition,"}, {"letter": "D", "text": "to add, additionally,"}], "correctLetter": "B", "explanation": "The sentence already says the company \"also plans\" to expand, so \"additionally add\" restates that same addition idea within the verb itself. B keeps just \"to add,\" letting the already-present \"also\" carry the meaning. A keeps the redundant \"additionally,\" C piles on both \"also\" and \"in addition\" on top of the sentence's existing \"also,\" and D tacks on a needless \"additionally\" as well.", "trick": "If you can delete it and the sentence still says the exact same thing, delete it."}, {"id": "TR-1", "concept": "Transitions", "subtype": "Transitions", "passage": "The nutrition label promised the granola bar was low in sugar. <u>However</u>, it contained nearly twenty grams of added sugar per serving.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Furthermore"}, {"letter": "C", "text": "As a result"}, {"letter": "D", "text": "In any event"}], "correctLetter": "A", "explanation": "The label's claim directly contradicts the bar's actual sugar content, a genuine contrast that 'however' correctly signals. B is wrong because 'furthermore' would wrongly suggest the sugar content adds support to the label's claim rather than contradicting it. C is wrong because the sugar content was not caused by the label's promise. D is wrong because 'in any event' is a vague filler that ignores the direct contradiction between claim and reality.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-2", "concept": "Transitions", "subtype": "Transitions", "passage": "Engineers determined the bridge's original design could not safely support modern truck loads. <u>Moreover</u>, the state chose to reinforce the historic structure instead of demolishing it.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Nevertheless"}, {"letter": "C", "text": "For example"}, {"letter": "D", "text": "In any event"}], "correctLetter": "B", "explanation": "Given the design was found inadequate, the expected move would be demolition, so choosing to reinforce it anyway is a contrast that 'nevertheless' correctly signals. A is wrong because 'moreover' implies the state's decision simply piles on more support for the finding, not a surprising deviation from it. C is wrong because the state's decision is not an example of anything stated in the first sentence. D is wrong because 'in any event' is vague and fails to capture that the state acted against expectation.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-3", "concept": "Transitions", "subtype": "Transitions", "passage": "Coaches warned that increasing weekly mileage too quickly leads to injury. <u>As a result</u>, one elite runner ran back-to-back marathons with no rest and finished uninjured.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Moreover"}, {"letter": "C", "text": "Yet"}, {"letter": "D", "text": "For example"}], "correctLetter": "C", "explanation": "The runner's injury-free feat is an exception to the coaches' warning, a contrast that 'yet' correctly signals. A is wrong because the runner's feat was not an effect caused by the warning. B is wrong because 'moreover' would wrongly suggest the runner's case supports the warning rather than defying it. D is wrong because 'for example' would misleadingly present the runner as illustrating the warning, when the case actually contradicts it.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-4", "concept": "Transitions", "subtype": "Transitions", "passage": "Rising ocean temperatures have bleached and killed vast stretches of the Great Barrier Reef. <u>In addition</u>, a small colony near Lizard Island has remained vibrant and healthy despite the heat.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Consequently"}, {"letter": "C", "text": "In any event"}, {"letter": "D", "text": "By contrast"}], "correctLetter": "D", "explanation": "The healthy Lizard Island colony is an exception to the widespread bleaching, a contrast that 'by contrast' correctly signals. A is wrong because a second bleached area would be an addition, but this colony is the opposite: unharmed. B is wrong because the colony's health was not an effect of the reef-wide bleaching. C is wrong because 'in any event' is vague filler that ignores the clear opposition between the two situations.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-5", "concept": "Transitions", "subtype": "Transitions", "passage": "Traditional perfumers extract floral scents through a slow, labor-intensive process called enfleurage. <u>However</u>, modern perfumers can synthesize identical scent molecules in a lab within hours.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Similarly"}, {"letter": "C", "text": "Consequently"}, {"letter": "D", "text": "Either way"}], "correctLetter": "A", "explanation": "A slow, labor-intensive traditional method versus a fast lab synthesis is a clear contrast, which 'however' correctly signals. B is wrong because the two methods are opposites in speed and effort, not similar. C is wrong because lab synthesis was not caused by the traditional process. D is wrong because 'either way' is a vague phrase that glosses over the sharp contrast in method and speed.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-6", "concept": "Transitions", "subtype": "Transitions", "passage": "Experts predicted the harsh winter would wipe out most local honeybee colonies. <u>Consequently</u>, nearly every hive in the county survived and produced a record honey yield come spring.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "However"}, {"letter": "C", "text": "Furthermore"}, {"letter": "D", "text": "In any event"}], "correctLetter": "B", "explanation": "The hives' survival and record yield directly contradict the experts' dire prediction, a contrast that 'however' correctly signals. A is wrong because the survival was not a caused effect of the prediction. C is wrong because 'furthermore' would wrongly suggest the outcome supports the prediction rather than defying it. D is wrong because 'in any event' is vague filler that ignores the surprising reversal of the forecast.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-7", "concept": "Transitions", "subtype": "Transitions", "passage": "City planners spent months preparing for backlash, anticipating that merchants along the avenue would fight the new protected bike lanes as a threat to parking and foot traffic. Officials drafted contingency plans and scheduled extra public hearings to manage the expected uproar.<br><br><u>Moreover</u>, business owners embraced the project almost unanimously, reporting that the calmer street brought in more walk-in customers than the traffic ever had.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "As a result"}, {"letter": "C", "text": "However"}, {"letter": "D", "text": "In any event"}], "correctLetter": "C", "explanation": "The merchants' actual embrace of the bike lanes directly contradicts the backlash officials had prepared for, a contrast that 'however' correctly signals. A is wrong because 'moreover' would wrongly suggest the second paragraph simply adds to the expected-backlash narrative rather than reversing it. B is wrong because the merchants' support was not an effect caused by the city's preparations for opposition. D is wrong because 'in any event' is vague filler that ignores the clear reversal of expectations.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-8", "concept": "Transitions", "subtype": "Transitions", "passage": "Executives at the startup were confident that their new budget smartphone would outsell every competitor in its price range within the first quarter, having modeled demand on aggressive pre-order numbers and glowing tech-blog previews.<br><br><u>Furthermore</u>, sales collapsed within weeks of launch, as reviewers discovered a critical flaw in the phone's battery that had gone unnoticed during testing.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore"}, {"letter": "C", "text": "Either way"}, {"letter": "D", "text": "However"}], "correctLetter": "D", "explanation": "The executives' confident sales projection is directly contradicted by the actual collapse in sales, a contrast that 'however' correctly signals. A is wrong because 'furthermore' would wrongly suggest the second paragraph continues supporting the confident projection rather than undercutting it. B is wrong because the sales collapse was not a logical effect of the executives' confidence, it resulted from the battery flaw. C is wrong because 'either way' is vague filler that ignores the sharp reversal between expectation and outcome.", "trick": "Name the relationship first, then pick the word that matches it."}, {"id": "TR-9", "concept": "Transitions", "subtype": "Transitions", "passage": "Grandmasters typically spend years memorizing thousands of opening sequences before facing serious competition. <u>Yet</u>, one prodigy skipped formal opening study entirely and still reached grandmaster level by age fourteen.", "question": "Which choice provides the most logical transition?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Additionally"}, {"letter": "C", "text": "As a result"}, {"letter": "D", "text": "In any event"}], "correctLetter": "A", "explanation": "The prodigy's shortcut to grandmaster status is an exception to the typical years-long path, a contrast that 'yet' correctly signals. B is wrong because 'additionally' would wrongly suggest the prodigy's case supports the typical pattern rather than defying it. C is wrong because reaching grandmaster level was not an eff
