<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan's ACT English Drills</title>
<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #14344f;
    --green: #1a7f4e;
    --red: #b3261e;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d9e0e8;
    --text: #1c2733;
    --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  .syncStatus { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 4px 0 0; }
  .syncStatus.ok { color: var(--green); }
  .syncStatus.bad { color: var(--red); }
  header { padding: 20px 4px 8px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }

  /* --- Gate --- */
  #gate { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  #gate .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 10px rgba(20,52,79,0.08); }
  #gate h2 { margin: 0 0 12px; color: var(--navy-dark); font-size: 1.15rem; }
  #gate input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  #gate button, .btn-primary { background: var(--navy); color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  #gate button:active, .btn-primary:active { background: var(--navy-dark); }
  #gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }

  /* --- Setup panel --- */
  #app { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--navy-dark); }
  .group-title { font-weight: 600; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .group-title:first-child { margin-top: 0; }
  label.chk { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 0.98rem; }
  label.chk:active { background: var(--bg); }
  label.chk input { width: 18px; height: 18px; accent-color: var(--navy); flex-shrink: 0; }
  label.chk .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
  .quick-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .quick-btns button { flex: 1; min-width: 110px; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 9px 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .quick-btns button:active { background: #dbe6f2; }
  .start-row { margin-top: 16px; }
  #startBtn { font-size: 1.05rem; padding: 14px; font-weight: 600; }
  #startBtn:disabled { background: #a9b7c4; cursor: not-allowed; }
  .selCount { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  /* --- Quiz --- */
  #quiz { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .topbar .tag { background: #eaf0f7; color: var(--navy-dark); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .score-panel { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
  .score-panel b { color: var(--navy-dark); }
  .passage { background: #fbfbfd; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 1rem; line-height: 1.6; margin-bottom: 14px; white-space: pre-wrap; }
  .passage u { text-decoration: underline; text-decoration-color: var(--navy); text-decoration-thickness: 2px; }
  .qstem { font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .choice { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; font-size: 0.97rem; cursor: pointer; line-height: 1.4; }
  .choice:active { background: var(--bg); }
  .choice .ltr { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--bg); color: var(--navy-dark); font-weight: 700; font-size: 0.8rem; margin-right: 10px; }
  .choice.correct { border-color: var(--green); background: #eaf7ef; }
  .choice.correct .ltr { background: var(--green); color: #fff; }
  .choice.incorrect { border-color: var(--red); background: #fbeceb; }
  .choice.incorrect .ltr { background: var(--red); color: #fff; }
  .choice.disabled { cursor: default; }
  .choice.dim { opacity: 0.55; }
  .feedback { margin-top: 14px; padding: 14px; border-radius: 10px; }
  .feedback.good { background: #eaf7ef; border: 1px solid #bfe3cc; }
  .feedback.bad { background: #fbeceb; border: 1px solid #f0c6c3; }
  .feedback .verdict { font-weight: 700; margin-bottom: 6px; }
  .feedback .verdict.good { color: var(--green); }
  .feedback .verdict.bad { color: var(--red); }
  .feedback .explain { font-size: 0.93rem; line-height: 1.5; margin-bottom: 10px; }
  .feedback .trick { background: #fff; border-left: 3px solid var(--navy); border-radius: 6px; padding: 10px 12px; font-size: 0.9rem; line-height: 1.5; }
  .feedback .trick b { color: var(--navy-dark); }
  #nextBtn { margin-top: 14px; }
  .concept-chip { display:inline-block; background:#eaf0f7; color:var(--navy-dark); font-size:0.72rem; font-weight:600; padding:3px 9px; border-radius:999px; margin-bottom:10px; }

  .footer-nav { display: flex; gap: 10px; margin-top: 4px; }
  .footer-nav button { flex: 1; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; }

  .banner { background: #fff7e0; border: 1px solid #f0dfa0; color: #7a5b00; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }

  /* --- Summary --- */
  #summary { display: none; }
  .summary-score { text-align: center; padding: 10px 0 18px; }
  .summary-score .big { font-size: 2.4rem; font-weight: 700; color: var(--navy-dark); }
  .summary-score .sub { color: var(--muted); font-size: 0.9rem; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .bar-wrap { flex: 1; margin: 0 10px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-row .bar { height: 100%; background: var(--navy); }
  .cat-row .pct { width: 46px; text-align: right; color: var(--muted); }

  @media (max-width: 400px) {
    .quick-btns button { min-width: 90px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Jordan's ACT English Drills</h2>
    <input id="pwInput" type="password" placeholder="Enter passcode" autocomplete="off">
    <button onclick="checkPasscode()">Enter</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <h1>Jordan's ACT English Drills</h1>
    <p>Pick the concepts to focus on, then start drilling. No repeats within a set.</p>
  </header>

  <div class="card" id="setup">
    <h2>Choose concepts</h2>
    <div class="quick-btns">
      <button onclick="selectPreset('weak')">Focus: Weak Areas</button>
      <button onclick="selectPreset('all')">Select All</button>
      <button onclick="selectPreset('none')">Clear All</button>
    </div>
    <div id="checkboxList"></div>
    <div class="selCount" id="selCount"></div>
    <div class="start-row">
      <button id="startBtn" class="btn-primary" onclick="startQuiz()" disabled>Start Drilling</button>
    </div>
  </div>

  <div id="quiz">
    <div class="topbar">
      <span class="tag" id="progressTag"></span>
      <div class="score-panel">
        <span>Session: <b id="scoreText">0/0</b></span>
      </div>
    </div>
    <div class="card">
      <div id="qBody"></div>
    </div>
    <div class="footer-nav">
      <button onclick="endSession()">End &amp; See Summary</button>
      <button onclick="backToSetup()">Change Concepts</button>
    </div>
  </div>

  <div id="summary">
    <div class="card">
      <h2>Session Summary</h2>
      <div class="summary-score">
        <div class="big" id="sumBig">0%</div>
        <div class="sub" id="sumSub">0 of 0 correct</div>
      </div>
      <div id="sumCats"></div>
    </div>
    <div class="footer-nav">
      <button onclick="backToSetup()">Choose New Concepts</button>
      <button onclick="restartSameFilters()">Drill Again (Same Concepts)</button>
    </div>
  </div>
  <div class="syncStatus" id="syncStatus"></div>
</div>

<!-- Firebase (compat SDK) — used only to log answered questions for the parent dashboard.
     If FIREBASE_CONFIG below still has placeholder values, sync is silently disabled and the
     app works exactly as before (nothing here can break the quiz itself). -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {"apiKey": "AIzaSyAUJp7K6uChE69XE0W7rWs2l8EPtzi036A", "authDomain": "jordan-act-drills.firebaseapp.com", "projectId": "jordan-act-drills", "storageBucket": "jordan-act-drills.firebasestorage.app", "messagingSenderId": "1016838779694", "appId": "1:1016838779694:web:929aaef91b54315bca80bf"};
const FIREBASE_CONFIGURED = true;
const ATTEMPTS_COLLECTION = "attempts";

let db = null;
let syncOk = false;
if (FIREBASE_CONFIGURED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    syncOk = true;
  } catch (e) {
    console.warn('Firebase init failed, continuing offline:', e);
    syncOk = false;
  }
}

function setSyncStatusUI() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (!FIREBASE_CONFIGURED) {
    el.textContent = '';
    return;
  }
  el.textContent = syncOk ? '● Progress syncing to dashboard' : '○ Progress not syncing (offline or not set up)';
  el.className = 'syncStatus ' + (syncOk ? 'ok' : 'bad');
}

// A random id shared by every attempt logged during this one sitting, so the
// dashboard can group answers back into sessions.
const SESSION_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('s_' + Date.now() + '_' + Math.random().toString(36).slice(2));

// Logs a full snapshot of the question (not just its id) alongside the
// attempt, so the dashboard's "Questions Missed" detail view keeps working
// for this attempt even after a future question-bank refresh replaces or
// removes this exact question. Firestore Security Rules (firestore.rules)
// require these fields to be present on every new attempt doc.
function logAttempt(q, chosenLetter, isCorrect) {
  if (!syncOk || !db) return;
  db.collection(ATTEMPTS_COLLECTION).add({
    ts: firebase.firestore.FieldValue.serverTimestamp(),
    sessionId: SESSION_ID,
    questionId: q.id,
    concept: q.concept,
    subtype: q.subtype,
    chosenLetter: chosenLetter,
    correct: !!isCorrect,
    passage: q.passage,
    question: q.question,
    choices: q.choices,
    correctLetter: q.correctLetter,
    explanation: q.explanation,
    trick: q.trick,
  }).catch(e => {
    console.warn('Attempt logging failed (continuing offline):', e);
    syncOk = false;
    setSyncStatusUI();
  });
}

mmatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "demands"}, {"letter": "C", "text": "have demanded"}, {"letter": "D", "text": "demanding"}], "correctLetter": "B", "explanation": "The gerund phrase \"Negotiating trade agreements among dozens of competing nations\" is a singular subject, so \"demands\" is correct. A) \"demand\" wrongly agrees with the plural \"nations\" right before it, and C) \"have demanded\" makes the same error. D) \"demanding\" is a participle, not a finite verb, so the sentence would lack a main verb.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-12", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "Writing computer code without any accompanying comments or documentation <u>create</u> serious problems for future programmers.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "creates"}, {"letter": "C", "text": "have created"}, {"letter": "D", "text": "creating"}], "correctLetter": "B", "explanation": "The gerund phrase \"Writing computer code without any accompanying comments or documentation\" is a singular subject, so \"creates\" is correct. A) \"create\" wrongly agrees with the plural \"comments\" nearby, and C) \"have created\" repeats that mistake. D) \"creating\" is not a finite verb and leaves the sentence without one.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-13", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The reinforced barricades, the underground tunnels, and the new suspension bridge <u>protects</u> the coastal town from the worst storm surges.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "protect"}, {"letter": "C", "text": "has protected"}, {"letter": "D", "text": "protecting"}], "correctLetter": "B", "explanation": "Three items joined by \"and\" \u2014 barricades, tunnels, and bridge \u2014 form a compound subject that is always plural, so \"protect\" is required. A) \"protects\" and C) \"has protected\" both wrongly agree with the singular \"bridge\" that happens to sit closest to the verb. D) \"protecting\" is a participle and cannot serve as the sentence's main verb.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-14", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The violinist, the cellist, and the pianist <u>rehearses</u> together every evening before the concert tour begins.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "has rehearsed"}, {"letter": "C", "text": "rehearse"}, {"letter": "D", "text": "rehearsing"}], "correctLetter": "C", "explanation": "The subject is three performers joined by \"and\" \u2014 violinist, cellist, and pianist \u2014 which is always plural, so \"rehearse\" is correct. A) \"rehearses\" and B) \"has rehearsed\" both wrongly agree with the singular \"pianist\" closest to the verb. D) \"rehearsing\" is not a finite verb and leaves the clause without one.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-15", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The treaty, the military alliance, and the fragile ceasefire <u>was</u> negotiated over several tense months by diplomats from both nations.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "were"}, {"letter": "C", "text": "has been"}, {"letter": "D", "text": "being"}], "correctLetter": "B", "explanation": "Three items joined by \"and\" \u2014 the treaty, the alliance, and the ceasefire \u2014 make a plural compound subject, so \"were\" is needed. A) \"was\" and C) \"has been\" both wrongly agree with the singular \"ceasefire\" nearest the verb. D) \"being\" has no auxiliary and cannot function as a finite verb, leaving the sentence incomplete.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-16", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The roots, the stems, and the broad waxy leaves of the desert succulent <u>stores</u> water during the long dry season.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "store"}, {"letter": "C", "text": "has stored"}, {"letter": "D", "text": "storing"}], "correctLetter": "B", "explanation": "The subject is the compound \"roots, stems, and leaves\" joined by \"and,\" which is always plural, so \"store\" is required. A) \"stores\" and C) \"has stored\" both wrongly agree with the singular \"succulent\" tucked into the phrase right before the verb. D) \"storing\" is a participle and cannot be the sentence's main verb.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-17", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The CEO, the board of directors, and the company's largest shareholder <u>disagrees</u> about the timing of the merger.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "has disagreed"}, {"letter": "C", "text": "disagreeing"}, {"letter": "D", "text": "disagree"}], "correctLetter": "D", "explanation": "Three parties joined by \"and\" \u2014 the CEO, the board, and the shareholder \u2014 form a plural compound subject, so \"disagree\" is correct. A) \"disagrees\" and B) \"has disagreed\" both wrongly agree with the singular \"shareholder\" closest to the verb. C) \"disagreeing\" is not a finite verb, so the sentence would lack one.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-18", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The head coach, the assistant coaches, and the team's star quarterback <u>reviews</u> game film together after every practice.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "review"}, {"letter": "C", "text": "has reviewed"}, {"letter": "D", "text": "reviewing"}], "correctLetter": "B", "explanation": "The subject is three parties joined by \"and\" \u2014 the coach, the assistant coaches, and the quarterback \u2014 which is always plural, so \"review\" is needed. A) \"reviews\" and C) \"has reviewed\" both wrongly agree with the singular \"quarterback\" nearest the verb. D) \"reviewing\" is a participle and cannot serve as the main verb.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-19", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The intertwined networks of fungal threads that <u>colonizes tree roots and helps</u> the forest exchange nutrients underground stretch for miles across old-growth soil.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "colonizes tree roots and help"}, {"letter": "C", "text": "colonize tree roots and helps"}, {"letter": "D", "text": "colonize tree roots and help"}], "correctLetter": "D", "explanation": "Two agreement calls are required here: the relative clause's own subject, the plural \"threads,\" needs plural verbs (\"colonize\" and \"help\"), while the sentence's main verb \"stretch\" (fixed, outside the underline) correctly agrees with the plural \"networks.\" A) uses singular forms for both relative-clause verbs, wrongly treating \"threads\" as singular. B) fixes only the second verb, leaving \"colonizes\" mismatched. C) fixes only the first verb, leaving \"helps\" mismatched. Only D) makes both relative-clause verbs plural to match \"threads.\"", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-20", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The array of radio telescopes that <u>detects faint signals and records</u> data from distant star clusters spans several continents.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "detects faint signals and record"}, {"letter": "C", "text": "detect faint signals and record"}, {"letter": "D", "text": "detect faint signals and records"}], "correctLetter": "C", "explanation": "This sentence needs two correct calls: the relative clause's own subject, the plural \"telescopes,\" requires plural verbs (\"detect\" and \"record\"), while the main verb \"spans\" (fixed, outside the underline) correctly agrees with the singular \"array.\" A) makes both relative-clause verbs singular, wrongly matching \"array\" instead of \"telescopes.\" B) leaves \"detects\" singular while fixing only \"record.\" D) fixes \"detect\" but leaves \"records\" singular. Only C) makes both relative-clause verbs plural to match \"telescopes.\"", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-21", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The collection of handwritten letters that <u>reveals new details and challenges</u> old assumptions about the author's early life resides in a university archive.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "reveals new details and challenge"}, {"letter": "C", "text": "reveal new details and challenge"}, {"letter": "D", "text": "reveal new details and challenges"}], "correctLetter": "C", "explanation": "Two agreement calls apply: the relative clause's own subject, the plural \"letters,\" needs plural verbs (\"reveal\" and \"challenge\"), while the main verb \"resides\" (fixed, outside the underline) correctly agrees with the singular \"collection.\" A) makes both relative-clause verbs singular, wrongly matching \"collection.\" B) leaves \"reveals\" singular while fixing only \"challenge.\" D) fixes \"reveal\" but leaves \"challenges\" singular. Only C) makes both relative-clause verbs plural to match \"letters.\"", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-22", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The research team behind several award-winning ocean studies <u>are</u> publishing its findings on coral bleaching next month.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "is"}, {"letter": "C", "text": "have been"}, {"letter": "D", "text": "were"}], "correctLetter": "B", "explanation": "\"Team\" is a collective noun that acts as a single unit here (confirmed by the singular pronoun \"its\"), so it takes the singular \"is.\" A) \"are\" wrongly agrees with the plural \"studies\" tucked into the intervening phrase. C) \"have been\" and D) \"were\" are both plural forms that make the same mistake.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-23", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "The number of endangered species listed on the reserve's annual survey <u>have grown</u> steadily over the past decade.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "were grown"}, {"letter": "C", "text": "has grown"}, {"letter": "D", "text": "are growing"}], "correctLetter": "C", "explanation": "\"The number of\" is treated as a singular subject on the ACT, so it takes \"has grown.\" A) \"have grown\" wrongly agrees with the plural \"species\" sitting right before the verb. B) \"were grown\" incorrectly shifts to a passive construction that doesn't fit the intended meaning and is still plural. D) \"are growing\" is also plural and mismatches the singular subject.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "SVA-24", "concept": "Grammar & Usage", "subtype": "Subject-Verb Agreement", "passage": "Each of the veteran firefighters assigned to the rescue mission <u>carry</u> specialized breathing equipment into the burning structure.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "carries"}, {"letter": "C", "text": "have carried"}, {"letter": "D", "text": "were carrying"}], "correctLetter": "B", "explanation": "The indefinite pronoun \"Each\" is always singular, regardless of the plural \"firefighters\" that follows it in the prepositional phrase, so \"carries\" is correct. A) \"carry\" wrongly agrees with the nearby plural \"firefighters.\" C) \"have carried\" and D) \"were carrying\" are both plural forms that make the same mistake.", "trick": "Cross out the middleman \u2014 words between subject and verb don't count for agreement."}, {"id": "PAA-1", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The city council approved the new recycling program after <u>they</u> reviewed the budget projections for the coming year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "he"}, {"letter": "D", "text": "we"}], "correctLetter": "B", "explanation": "B is correct: 'city council' is a singular collective noun, so it takes the singular pronoun 'it.' A 'they' wrongly treats the council as plural. C 'he' has no personal antecedent anywhere in the sentence. D 'we' has no first-person antecedent established.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "PAA-2", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "Each of the software engineers tested <u>their</u> own code before submitting it for review.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "our"}, {"letter": "D", "text": "his or her"}], "correctLetter": "D", "explanation": "D is correct: the antecedent is 'Each,' a singular indefinite pronoun, so the singular 'his or her' is required. A 'their' is plural and doesn't match the singular antecedent. B 'its' is used for objects, not people. C 'our' shifts to first person with no basis in the sentence.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "PAA-3", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The museum returned the antique clocks to the storage room, restoring <u>it</u> to ticking accuracy before the exhibit reopened.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "them"}, {"letter": "C", "text": "him"}, {"letter": "D", "text": "myself"}], "correctLetter": "B", "explanation": "B is correct: the pronoun stands in for the plural 'clocks' (the things being restored to ticking accuracy), not the nearer singular noun 'room.' A 'it' wrongly matches the closer noun 'room,' which cannot be restored to 'ticking accuracy.' C 'him' has no personal antecedent. D 'myself' is a reflexive pronoun with no matching 'I' subject in the sentence.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "PAA-4", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "Grandma Ruth spent the afternoon baking cookies for the school fundraiser, and <u>he</u> decorated every single one with colorful icing.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "she"}, {"letter": "C", "text": "it"}, {"letter": "D", "text": "they"}], "correctLetter": "B", "explanation": "B is correct: the antecedent is 'Grandma Ruth,' a singular female noun, so 'she' is needed. A 'he' has the wrong gender. C 'it' cannot refer to a person. D 'they' has no plural antecedent to attach to, since 'cookies' cannot decorate themselves.", "trick": "Find the noun the pronoun is standing in for, not just whichever noun is closest."}, {"id": "PC-1", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "Between you and <u>I</u>, the surprise party plans should stay a secret until Friday.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "me"}, {"letter": "C", "text": "myself"}, {"letter": "D", "text": "we"}], "correctLetter": "B", "explanation": "B is correct: the pronoun is the object of the preposition 'between,' so the object case 'me' is required ('between you and me'). A 'I' is subject case, wrong after a preposition. C 'myself' is reflexive and has no 'I' in the same clause for it to refer back to. D 'we' is subject case and also wrong after a preposition.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "PC-2", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "<u>Her and me</u> volunteered to organize the school's annual fundraiser this spring.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "She and I"}, {"letter": "C", "text": "Her and I"}, {"letter": "D", "text": "She and me"}], "correctLetter": "B", "explanation": "B is correct: the compound pronoun is the subject performing the action 'volunteered,' so both pronouns need subject case, 'She and I.' A 'Her and me' uses object case for both, which is wrong for a subject. C 'Her and I' incorrectly keeps 'Her' in object case. D 'She and me' incorrectly keeps 'me' in object case.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "PC-3", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "<u>Who</u> did the awards committee select for the scholarship this year?", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Whom"}, {"letter": "C", "text": "Whomever"}, {"letter": "D", "text": "Whoever"}], "correctLetter": "B", "explanation": "B is correct: the pronoun receives the action of 'select' (the committee selected whom), so the object case 'Whom' is required. A 'Who' is subject case, wrong for the object of the verb. C 'Whomever' doesn't fit a direct question, which needs a single interrogative pronoun, not a free-relative form. D 'Whoever' is both the wrong case and the wrong construction for this direct question.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "PC-4", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The teacher gave <u>she and I</u> extra time to finish the exam because the fire alarm had interrupted the test.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "her and me"}, {"letter": "C", "text": "her and I"}, {"letter": "D", "text": "she and me"}], "correctLetter": "B", "explanation": "B is correct: the compound pronoun is the indirect object of 'gave,' so both pronouns need object case, 'her and me.' A 'she and I' uses subject case for both, which is wrong for an object. C 'her and I' incorrectly keeps 'I' in subject case. D 'she and me' incorrectly keeps 'she' in subject case.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "VTF-1", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time the repair crew arrived, Diego <u>fixes</u> the leaking pipe under the kitchen sink himself.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "had fixed"}, {"letter": "C", "text": "will fix"}, {"letter": "D", "text": "is fixing"}], "correctLetter": "B", "explanation": "B is correct: 'arrived' establishes a past timeframe, and Diego's fix happened before that, so the past perfect 'had fixed' is needed. A 'fixes' is present tense, inconsistent with the past timeline. C 'will fix' is future tense, contradicting the already-past 'arrived.' D 'is fixing' is present progressive, also inconsistent with the past timeline.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "VTF-2", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Yesterday afternoon, the storm knocked out power across town and <u>damages</u> several old oak trees along Main Street.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "damaged"}, {"letter": "C", "text": "will damage"}, {"letter": "D", "text": "has damaged"}], "correctLetter": "B", "explanation": "B is correct: it must match the simple past tense already set by 'knocked' and 'Yesterday afternoon.' A 'damages' is present tense, inconsistent with the past narrative. C 'will damage' is future tense and contradicts 'Yesterday.' D 'has damaged' is present perfect, which doesn't match the simple past action 'knocked' in the same clause.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "VTF-3", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Next month, the observatory will unveil its new telescope, and astronomers <u>studied</u> distant galaxies with far greater clarity.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "will study"}, {"letter": "C", "text": "have studied"}, {"letter": "D", "text": "were studying"}], "correctLetter": "B", "explanation": "B is correct: 'will unveil' sets a future timeframe ('Next month'), so the second verb must also be future, 'will study.' A 'studied' is past tense, contradicting the future context. C 'have studied' is present perfect, implying the action already happened. D 'were studying' is past progressive, also inconsistent with the future timeline.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "VTF-4", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By next spring, the construction crew will have <u>build</u> three new bridges across the river.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "built"}, {"letter": "C", "text": "builded"}, {"letter": "D", "text": "building"}], "correctLetter": "B", "explanation": "B is correct: the helping verb 'have' requires the past participle form, 'built.' A 'build' is the bare present form, which cannot follow 'have.' C 'builded' is not a valid form of the irregular verb 'build.' D 'building' is a gerund/present participle, which does not fit after 'will have.'", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "CSF-1", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of the two hiking trails near the cabin, the northern route is <u>most</u> difficult because of its steep, rocky terrain.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "more"}, {"letter": "C", "text": "difficultest"}, {"letter": "D", "text": "much difficult"}], "correctLetter": "B", "explanation": "B is correct: only two trails are being compared, so the comparative 'more' is required. A 'most' is superlative, appropriate only for three or more items. C 'difficultest' is not a real word. D 'much difficult' is missing the necessary degree word 'more' and is ungrammatical.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "CSF-2", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Among the four finalists in the bake-off, Priya's chocolate torte was judged the <u>more</u> delicious of all the entries.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "most"}, {"letter": "C", "text": "deliciousest"}, {"letter": "D", "text": "much delicious"}], "correctLetter": "B", "explanation": "B is correct: four finalists are being compared ('of all the entries'), so the superlative 'most' is required. A 'more' is comparative, appropriate only for exactly two items, and clashes with the idiom 'the ___ of all.' C 'deliciousest' is not a real word. D 'much delicious' lacks a proper degree word and is ungrammatical.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "CSF-3", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Between the two job candidates, Elena performed <u>best</u> in the technical interview portion.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "better"}, {"letter": "C", "text": "more better"}, {"letter": "D", "text": "gooder"}], "correctLetter": "B", "explanation": "B is correct: only two candidates are being compared, so the comparative 'better' is required. A 'best' is superlative, appropriate only for three or more. C 'more better' is a redundant double comparative and ungrammatical. D 'gooder' is not a standard English word.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "CSF-4", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of all the routes the delivery drivers tested this month, the coastal highway proved <u>worse</u> for on-time arrivals.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "worst"}, {"letter": "C", "text": "more worse"}, {"letter": "D", "text": "baddest"}], "correctLetter": "B", "explanation": "B is correct: 'all the routes' signals three or more items being compared, so the superlative 'worst' is required. A 'worse' is comparative, appropriate only for exactly two items. C 'more worse' is a redundant double comparative and ungrammatical. D 'baddest' is not standard English.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "PIU-1", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The new water filtration system is <u>capable to remove</u> over ninety-nine percent of harmful bacteria.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "capable of removing"}, {"letter": "C", "text": "capable for removing"}, {"letter": "D", "text": "capable in removing"}], "correctLetter": "B", "explanation": "B is correct: the fixed idiom is 'capable of' followed by a gerund, 'capable of removing.' A 'capable to remove' pairs the wrong preposition with an infinitive, which is not idiomatic. C 'capable for removing' uses a preposition that never pairs with 'capable.' D 'capable in removing' also uses a non-idiomatic preposition.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "PIU-2", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The revised marketing strategy is significantly different <u>than</u> the one the company used last year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "from"}, {"letter": "C", "text": "of"}, {"letter": "D", "text": "with"}], "correctLetter": "B", "explanation": "B is correct: the standard idiom is 'different from.' A 'different than' is a common but nonstandard pairing that formal grammar rejects. C 'different of' is not an idiomatic pairing. D 'different with' is not an idiomatic pairing either.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "PIU-3", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "As the volunteer coordinator, Devon is responsible <u>of</u> ensuring that every shift is fully staffed before the event begins.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "for"}, {"letter": "C", "text": "with"}, {"letter": "D", "text": "to"}], "correctLetter": "B", "explanation": "B is correct: the fixed idiom is 'responsible for' when followed by the duty or task. A 'responsible of' is not an idiomatic pairing. C 'responsible with' is not an idiomatic pairing. D 'responsible to' is used only before a person or authority one reports to, not before a gerund phrase like 'ensuring,' so it doesn't fit here.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "PIU-4", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "All employees must comply <u>to</u> the updated safety regulations before returning to the factory floor.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "with"}, {"letter": "C", "text": "for"}, {"letter": "D", "text": "on"}], "correctLetter": "B", "explanation": "B is correct: the fixed idiom is 'comply with.' A 'comply to' is a common error but not the standard pairing. C 'comply for' is not an idiomatic pairing. D 'comply on' is not an idiomatic pairing.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "ROC-1", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The beekeeper checked each hive carefully<u>, she was looking for signs of disease</u> before winter set in.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", however she was looking for signs of disease"}, {"letter": "C", "text": "; she was looking for signs of disease"}, {"letter": "D", "text": " she was looking for signs of disease"}], "correctLetter": "C", "explanation": "C correctly joins the two independent clauses with a semicolon. A is a comma splice\u2014two complete sentences fused by only a comma. B is also a comma splice, since \"however\" is a conjunctive adverb, not a coordinating conjunction, and needs a semicolon before it rather than just a comma. D fuses the clauses with no punctuation at all, an even more blatant run-on.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-2", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The glassblower shaped the molten glass with practiced ease<u>, her apprentice watched every motion closely</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": " her apprentice watched every motion closely"}, {"letter": "H", "text": ", therefore her apprentice watched every motion closely"}, {"letter": "J", "text": ". Her apprentice watched every motion closely"}], "correctLetter": "J", "explanation": "J correctly separates the two independent clauses into two sentences with a period. F comma-splices them. G fuses them with no punctuation whatsoever. H is still a comma splice because \"therefore\" is a conjunctive adverb that needs a semicolon or period before it, not just a comma.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-3", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The fire lookout ranger scanned the horizon every hour<u>, the smoke had to be reported before it spread</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " the smoke had to be reported before it spread"}, {"letter": "C", "text": ", for the smoke had to be reported before it spread"}, {"letter": "D", "text": ", nevertheless the smoke had to be reported before it spread"}], "correctLetter": "C", "explanation": "C correctly uses the coordinating conjunction \"for\" (meaning \"because\") after a comma to logically and grammatically join the two independent clauses. A is a comma splice. B fuses the clauses with no punctuation at all. D is still a comma splice, since \"nevertheless\" is a conjunctive adverb requiring a semicolon, and it also illogically signals contrast where none exists.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-4", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Volunteers spent all morning weeding the community garden<u>, the tomatoes still needed staking before the afternoon rain</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": " the tomatoes still needed staking before the afternoon rain"}, {"letter": "H", "text": ", moreover the tomatoes still needed staking before the afternoon rain"}, {"letter": "J", "text": "; the tomatoes still needed staking before the afternoon rain"}], "correctLetter": "J", "explanation": "J correctly joins the two independent clauses with a semicolon. F is a comma splice. G fuses the clauses with no punctuation at all. H is still a comma splice because \"moreover\" is a conjunctive adverb that needs a semicolon before it, not a comma.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-5", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The subway musician quickly packed up his violin case<u>, the last train was about to arrive</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " the last train was about to arrive"}, {"letter": "C", "text": ", still the last train was about to arrive"}, {"letter": "D", "text": " because the last train was about to arrive"}], "correctLetter": "D", "explanation": "D correctly uses the subordinating conjunction \"because\" to turn the second clause into a dependent clause, logically explaining why he packed up. A is a comma splice. B fuses the clauses with no punctuation at all. C is still a comma splice, since \"still\" functions here as a conjunctive adverb requiring stronger punctuation, and it also illogically implies contrast.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-6", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The weather balloon rose steadily into the storm clouds<u>, the tracking signal suddenly went silent</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": " the tracking signal suddenly went silent"}, {"letter": "H", "text": ", but the tracking signal suddenly went silent"}, {"letter": "J", "text": ", also the tracking signal suddenly went silent"}], "correctLetter": "H", "explanation": "H correctly uses a comma plus the coordinating conjunction \"but\" to join the two independent clauses while signaling the logical contrast. F is a comma splice. G fuses the clauses with no punctuation at all. J is still a comma splice because \"also\" is not a coordinating conjunction and cannot join two independent clauses after only a comma.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "ROC-7", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The food truck owner ran out of tortillas by noon<u>, she had to close early for the day</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " she had to close early for the day"}, {"letter": "C", "text": ", thus she had to close early for the day"}, {"letter": "D", "text": ", so she had to close early for the day"}], "correctLetter": "D", "explanation": "D correctly uses a comma plus the coordinating conjunction \"so\" to join the two independent clauses and show cause and effect. A is a comma splice. B fuses the clauses with no punctuation at all. C is still a comma splice, since \"thus\" is a conjunctive adverb that requires a semicolon before it, not a comma.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "SF-1", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Rain pouring steadily against the windshield all afternoon.</u> The driver pulled over to wait it out.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Rain, pouring steadily against the windshield all afternoon."}, {"letter": "C", "text": "Rain poured steadily against the windshield all afternoon."}, {"letter": "D", "text": "With rain pouring steadily against the windshield all afternoon."}], "correctLetter": "C", "explanation": "C supplies a finite main verb, \"poured,\" making the clause a complete sentence with a subject and working verb. A is a fragment because \"pouring\" is a participle, not a finite verb, so there is no working verb. B adds a comma but still has no finite verb, so it remains a fragment. D adds the preposition \"With,\" which only turns the clause into a longer prepositional phrase, still lacking a subject-verb pair that can stand alone.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "SF-2", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The chess tournament's final round began at noon<u>. Which lasted nearly six hours before a champion was crowned</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": ". Having lasted nearly six hours before a champion was crowned"}, {"letter": "H", "text": ", which lasted nearly six hours before a champion was crowned"}, {"letter": "J", "text": ". Lasting nearly six hours before a champion was crowned"}], "correctLetter": "H", "explanation": "H removes the period and attaches the relative clause with a comma to the preceding independent clause, correctly making \"which\" refer back to \"round.\" F is a fragment because \"Which\" begins a relative clause with no independent clause of its own. G is a fragment, since \"Having lasted\" is a participial phrase with no finite main verb. J is likewise a fragment, as \"Lasting\" is a participle, not a working verb.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "SF-3", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The food critic sampled twelve dishes in one evening<u>. To determine which restaurant deserved the award</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ". Determining which restaurant deserved the award"}, {"letter": "C", "text": " to determine which restaurant deserved the award"}, {"letter": "D", "text": ". In order to determine which restaurant deserved the award"}], "correctLetter": "C", "explanation": "C removes the period and attaches the infinitive phrase directly to the preceding independent clause, forming one complete sentence. A is a fragment because an infinitive phrase (\"To determine...\") cannot stand alone as a sentence. B is also a fragment, since \"Determining\" is a gerund phrase with no finite verb. D remains a fragment for the same reason as A, just with an added introductory phrase.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "SF-4", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Orbiting the Earth every ninety minutes without pause.</u> The satellite collects data on ocean temperatures.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "Orbiting the Earth, every ninety minutes without pause."}, {"letter": "H", "text": "It orbits the Earth every ninety minutes without pause."}, {"letter": "J", "text": "By orbiting the Earth every ninety minutes without pause."}], "correctLetter": "H", "explanation": "H supplies a subject, \"It,\" and a finite verb, \"orbits,\" forming a complete sentence. F is a fragment because \"Orbiting\" is a participle with no subject or finite verb. G merely adds a comma, which does not fix the missing subject-verb pair. J adds the preposition \"By,\" which only creates a longer prepositional phrase, still without a subject and working verb.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "SF-5", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "Dr. Alvarez first discovered pottery shards at the site in 1994<u>. Who went on to spend three decades excavating it</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", who went on to spend three decades excavating it"}, {"letter": "C", "text": ". Going on to spend three decades excavating it"}, {"letter": "D", "text": ". Having gone on to spend three decades excavating it"}], "correctLetter": "B", "explanation": "B removes the period and joins the relative clause with a comma to the preceding independent clause, correctly attaching \"who\" to Dr. Alvarez, the only person mentioned. A is a fragment because \"Who\" begins a relative clause with no independent clause of its own. C is a fragment, since \"Going on\" is a participle with no finite verb. D is likewise a fragment, as \"Having gone on\" is a participial phrase, not a working main verb.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "SF-6", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Playing without sheet music for the entire set.</u> The jazz trio improvised every song from memory.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "To play without sheet music for the entire set."}, {"letter": "H", "text": "The trio played without sheet music for the entire set."}, {"letter": "J", "text": "Without sheet music for the entire set, playing."}], "correctLetter": "H", "explanation": "H supplies a subject, \"The trio,\" and a finite verb, \"played,\" forming a complete sentence. F is a fragment because \"Playing\" is a participle with no subject or finite verb. G is also a fragment, since an infinitive phrase cannot stand alone as a sentence. J rearranges the words but still has no subject and working verb, so it remains a fragment.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "PS-1", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Every morning before dawn, the triathlete swims two miles, bikes twenty miles, and <u>ran</u> six miles.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "running"}, {"letter": "C", "text": "runs"}, {"letter": "D", "text": "to run"}], "correctLetter": "C", "explanation": "C, \"runs,\" matches the present-tense, third-person-singular form of \"swims\" and \"bikes,\" keeping the series parallel. A, \"ran,\" breaks the pattern with a past-tense verb. B, \"running,\" is a gerund that doesn't match the plain verb forms. D, \"to run,\" is an infinitive that also breaks the established pattern.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-2", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "The conservators spent the exhibit's final week cleaning artifacts, cataloging finds, and <u>to restore</u> ancient manuscripts.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "restored"}, {"letter": "H", "text": "restoring"}, {"letter": "J", "text": "they restored"}], "correctLetter": "H", "explanation": "H, \"restoring,\" matches the -ing gerund form of \"cleaning\" and \"cataloging,\" keeping the series parallel. F, \"to restore,\" is an infinitive that breaks the pattern. G, \"restored,\" is a past-tense verb that doesn't match the gerunds. J, \"they restored,\" inserts a whole clause, which is not parallel to the other two gerund phrases at all.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-3", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Everyone at the company agrees that a good mentor is patient, insightful, and <u>encourages others readily</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "encouraging"}, {"letter": "C", "text": "encouragement to others"}, {"letter": "D", "text": "one who encourages"}], "correctLetter": "B", "explanation": "B, \"encouraging,\" is an adjective that matches \"patient\" and \"insightful,\" keeping the description parallel. A supplies a verb phrase, \"encourages others readily,\" which doesn't match the adjective pattern. C substitutes a noun phrase, breaking parallelism. D substitutes a noun clause, which also fails to match the adjective series.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-4", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "The recipe instructs cooks to preheat the oven, to whisk the eggs, and <u>folding in the flour</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "to fold in the flour"}, {"letter": "H", "text": "fold in the flour"}, {"letter": "J", "text": "they fold in the flour"}], "correctLetter": "G", "explanation": "G, \"to fold in the flour,\" matches the infinitive \"to\" form already repeated in \"to preheat\" and \"to whisk,\" keeping the series parallel. F, \"folding,\" is a gerund that breaks the established infinitive pattern. H drops the \"to\" that the first two items explicitly use, breaking the pattern the sentence has set up. J inserts a full clause, which doesn't match the infinitive phrases at all.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-5", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "The river is known for its powerful rapids, its diverse wildlife, and <u>how scenic it is</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its scenic beauty"}, {"letter": "C", "text": "being scenic"}, {"letter": "D", "text": "scenically"}], "correctLetter": "B", "explanation": "B, \"its scenic beauty,\" matches the \"its + adjective + noun\" pattern of \"its powerful rapids\" and \"its diverse wildlife,\" keeping the series parallel. A substitutes a full clause, which breaks the noun-phrase pattern. C, \"being scenic,\" is a gerund phrase that doesn't match. D, \"scenically,\" is an adverb, which is grammatically incompatible with the noun-phrase list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-6", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Each day, the zookeeper prepares diet plans, monitors animal health, and <u>educating visitors</u> about conservation.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "educates visitors"}, {"letter": "H", "text": "to educate visitors"}, {"letter": "J", "text": "education for visitors"}], "correctLetter": "G", "explanation": "G, \"educates visitors,\" matches the present-tense, third-person-singular form of \"prepares\" and \"monitors,\" keeping the series parallel. F, \"educating,\" is a gerund that breaks the pattern. H, \"to educate,\" is an infinitive that also doesn't match. J substitutes a noun phrase, which is grammatically incompatible with the verb series.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "PS-7", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "In retirement, she spends her time reading novels, gardening in the backyard, and <u>she volunteers at the animal shelter</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "volunteering at the animal shelter"}, {"letter": "C", "text": "to volunteer at the animal shelter"}, {"letter": "D", "text": "volunteers at the animal shelter"}], "correctLetter": "B", "explanation": "B, \"volunteering,\" matches the -ing gerund form of \"reading\" and \"gardening,\" keeping the series parallel. A inserts a full clause, \"she volunteers,\" which breaks the pattern. C, \"to volunteer,\" is an infinitive that doesn't match the gerunds. D, \"volunteers,\" is a plain verb form that also fails to match.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "MP-1", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "A meticulous collector of antique clocks, <u>the garage</u> spent countless weekends restoring gears, springs, and broken timepieces.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Mr. Alvarez"}, {"letter": "C", "text": "Mr. Alvarez's garage"}, {"letter": "D", "text": "the timepieces"}], "correctLetter": "B", "explanation": "B, \"Mr. Alvarez,\" correctly places the person described by \"a meticulous collector\" right after the comma. A is wrong because a garage cannot be a collector or spend weekends restoring anything. C is a possession trap: the garage still isn't the collector, even when it's described as belonging to Mr. Alvarez. D is wrong because the timepieces are what get restored, not the collector doing the restoring.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-2", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "A pioneer in the study of black holes, <u>her research funding</u> spent decades analyzing gravitational wave data.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the astrophysicist"}, {"letter": "H", "text": "the astrophysicist's research funding"}, {"letter": "J", "text": "the observatory's telescope"}], "correctLetter": "G", "explanation": "G, \"the astrophysicist,\" correctly places the person described as \"a pioneer\" right after the comma. F is wrong because funding is inanimate and cannot be a pioneer or spend decades analyzing anything. H is a possession trap: the funding still isn't the pioneer, even when tied to the astrophysicist. J is wrong because equipment, not a telescope, is described as \"a pioneer\" in this sentence, and a telescope doesn't itself spend decades analyzing data.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-3", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Built in 1920 using local granite quarried nearby, <u>tourists now visit the lighthouse</u> every summer.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the lighthouse now draws tourists"}, {"letter": "C", "text": "the lighthouse's popularity now draws tourists"}, {"letter": "D", "text": "tourism now thrives near the lighthouse"}], "correctLetter": "B", "explanation": "B correctly places \"the lighthouse\" right after the comma, since it is the structure that was built in 1920. A is wrong because tourists weren't built in 1920. C is a possession trap: the lighthouse's popularity, an abstract idea, wasn't built in 1920 either. D is wrong because \"tourism,\" an abstract activity, also wasn't built in 1920.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-4", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Having spent years researching coral reefs, <u>a groundbreaking paper</u> earned international recognition throughout the scientific community.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the marine biologist"}, {"letter": "H", "text": "the marine biologist's paper"}, {"letter": "J", "text": "the research team's funding"}], "correctLetter": "G", "explanation": "G, \"the marine biologist,\" correctly places the person who spent years researching right after the comma. F is wrong because a paper cannot spend years researching anything\u2014it is the product of research, not the researcher. H is a possession trap: the paper still isn't the one who researched, even when tied to the biologist. J is wrong because funding also cannot conduct years of research.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-5", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "As a first-time marathon runner, <u>the finish line</u> struggled to keep a steady pace during the last mile.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Priya"}, {"letter": "C", "text": "Priya's confidence"}, {"letter": "D", "text": "the crowd"}], "correctLetter": "B", "explanation": "B, \"Priya,\" correctly places the person described as a first-time marathon runner right after the comma. A is wrong because a finish line cannot be a runner or struggle to keep a pace. C is a possession trap: confidence is abstract and cannot physically run or keep a pace. D is wrong because the crowd of spectators, not the runner herself, is an unrelated noun in this context.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-6", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Exhausted after the twelve-hour overnight shift, <u>the hospital hallway</u> could barely keep her eyes open.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the nurse"}, {"letter": "H", "text": "the nurse's patience"}, {"letter": "J", "text": "the waiting room"}], "correctLetter": "G", "explanation": "G, \"the nurse,\" correctly places the exhausted person right after the comma, matching the pronoun \"her\" that follows. F is wrong because a hallway is inanimate and has no eyes to keep open. H is a possession trap: patience is abstract and cannot physically grow tired or keep eyes open. J is wrong because a waiting room, like the hallway, is an inanimate, unrelated noun.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-7", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "A rare species found only in the rainforests of Madagascar, <u>deforestation</u> is now critically endangered.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the aye-aye"}, {"letter": "C", "text": "the aye-aye's habitat"}, {"letter": "D", "text": "the local government"}], "correctLetter": "B", "explanation": "B, \"the aye-aye,\" correctly places the species right after the comma. A is wrong because deforestation is a process, not a species, and cannot itself be endangered in this sense. C is a possession trap: the habitat is a place, not the species itself, so it isn't \"a rare species.\" D is wrong because a government is an unrelated noun that is not a species at all.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-8", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Renowned throughout the valley for its volcanic soil, <u>the winemaker</u> produces some of the region's finest wines.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the vineyard"}, {"letter": "H", "text": "the vineyard's soil"}, {"letter": "J", "text": "the harvest"}], "correctLetter": "G", "explanation": "G, \"the vineyard,\" correctly places the land right after the comma, since land, not a person, has volcanic soil (note the pronoun \"its,\" which cannot refer to a person). F is wrong because a winemaker is a person and would be described with \"his\" or \"her,\" not \"its.\" H is a possession trap: the vineyard's soil can't logically be renowned for its own soil. J is wrong because a harvest is an unrelated noun that isn't renowned for soil.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-9", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "A self-taught programmer, <u>the app</u> spent her spare time coding late into the night after her day job.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Maya"}, {"letter": "C", "text": "Maya's laptop"}, {"letter": "D", "text": "the coding bootcamp"}], "correctLetter": "B", "explanation": "B, \"Maya,\" correctly places the self-taught programmer right after the comma, matching the pronoun \"her\" that follows. A is wrong because an app cannot be a programmer or spend spare time coding. C is a possession trap: a laptop is inanimate and cannot spend its own spare time coding. D is wrong because a bootcamp directly contradicts \"self-taught\" and is not a person at all.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-10", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Weakened by decades of relentless erosion, <u>engineers</u> could no longer bear the weight of daily traffic.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the ancient stone bridge"}, {"letter": "H", "text": "the bridge's original blueprints"}, {"letter": "J", "text": "the local traffic"}], "correctLetter": "G", "explanation": "G, \"the ancient stone bridge,\" correctly places the structure weakened by erosion right after the comma. F is wrong because engineers are people, not a structure, and cannot literally bear the weight of traffic. H is a possession trap: paper blueprints cannot be weakened by erosion or bear physical weight. J is wrong because the traffic itself is what needs support, not the thing doing the supporting.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-11", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "An award-winning documentary filmmaker, <u>the film festival</u> was invited to screen her latest project at the ceremony.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Elena"}, {"letter": "C", "text": "Elena's crew"}, {"letter": "D", "text": "the audience"}], "correctLetter": "B", "explanation": "B, \"Elena,\" correctly places the filmmaker right after the comma, matching the pronoun \"her\" that follows. A is wrong because a festival is an organization, not a filmmaker. C is a possession trap: a crew collectively is not the singular award-winning filmmaker described. D is wrong because an audience watches films rather than being the filmmaker invited to screen one.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "MP-12", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Struggling to meet the tight deadline, <u>the newsroom's printer</u> decided to cut two stories from the front page.", "question": "Which choice makes the underlined portion most logical?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "the editor"}, {"letter": "H", "text": "the editor's desk calendar"}, {"letter": "J", "text": "the printing schedule"}], "correctLetter": "G", "explanation": "G, \"the editor,\" correctly places the person struggling with the deadline right after the comma, since only a person can decide to cut stories. F is wrong because a printer is a machine and cannot struggle with a deadline or decide anything. H is a possession trap: a desk calendar is inanimate and cannot decide anything. J is wrong because a schedule, also inanimate, cannot make decisions either.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "SCS-1", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "Although the community pool's hours were extended for the entire summer, <u>but</u> attendance still declined.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "yet"}, {"letter": "C", "text": "so"}, {"letter": "D", "text": "OMIT the underlined portion"}], "correctLetter": "D", "explanation": "D correctly omits the redundant connector, since the subordinating conjunction \"Although\" already establishes the contrast on its own and needs no second connector to \"legally\" join the clauses. A pairs \"Although\" with \"but,\" which is grammatically redundant since one clause is already subordinate. B has the same redundancy problem with \"yet.\" C pairs \"Although\" with \"so,\" which is both redundant and logically confusing, since \"so\" signals a conclusion that doesn't fit here.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-2", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "The experiment produced inconsistent results<u>, however the researchers refined their methodology</u> for the next trial.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "F", "text": "NO CHANGE"}, {"letter": "G", "text": "; however, the researchers refined their methodology"}, {"letter": "H", "text": ", and however the researchers refined their methodology"}, {"letter": "J", "text": ", because however the researchers refined their methodology"}], "correctLetter": "G", "explanation": "G correctly uses a semicolon before the conjunctive adverb \"however,\" which is strong enough to join two independent clauses, followed by a comma. F is a comma splice, since \"however\" cannot join independent clauses with only a comma. H redundantly pairs the coordinating conjunction \"and\" with \"however,\" which is nonstandard. J pairs the subordinating \"because\" with \"however,\" creating a nonsensical, contradictory connector combination.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "SCS-3", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>Because</u> the new bike lanes reduced congestion, city planners removed several of them the following year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Although"}, {"letter": "C", "text": "Since"}, {"letter": "D", "text": "As"}], "correctLetter"
