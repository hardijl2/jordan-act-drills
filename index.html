elize.\" Where would it most logically be placed?", "choices": [{"letter": "A", "text": "Before Sentence 1"}, {"letter": "B", "text": "After Sentence 1"}, {"letter": "C", "text": "After Sentence 2"}, {"letter": "D", "text": "After Sentence 3"}], "correctLetter": "C", "explanation": "Placing it after Sentence 2 is correct: the new sentence's \"This color change\" clearly refers back to the green-to-yellow-to-brown shift just described in Sentence 2, before the paragraph moves on to the further color change and cooling in Sentence 3. Any other placement breaks that logical link.", "trick": "Trace the order the paragraph is already using, and place the new sentence where it keeps that order intact. Trick: \"Read the sentence before and after your candidate spot \u2014 does the new sentence bridge them logically?\""}, {"id": "B2-PL-2", "concept": "Organization & Development", "subtype": "Sentence/Paragraph Placement & Sequence", "passage": "[1] Investigators first noticed the painting was missing during a routine gallery walkthrough. [2] Security footage from the previous night showed a maintenance door propped open for nearly twenty minutes. [3] Detectives later traced the door's access code to a contractor who had worked in the gallery the week before.", "question": "The writer wants to add this sentence: \"That gap in the footage became the investigation's first real lead.\" Where would it most logically be placed?", "choices": [{"letter": "A", "text": "Before Sentence 1"}, {"letter": "B", "text": "After Sentence 1"}, {"letter": "C", "text": "After Sentence 2"}, {"letter": "D", "text": "After Sentence 3"}], "correctLetter": "C", "explanation": "Placing it after Sentence 2 is correct: the new sentence's \"that gap\" clearly refers back to the twenty-minute window described in Sentence 2, before the paragraph moves on to how detectives pursued that lead in Sentence 3. Any other placement breaks that logical link.", "trick": "Trace the order the paragraph is already usi ils that don't draw the essay's threads together.", "trick": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus. Trick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}, {"id": "B2-IC-4", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "This is the closing paragraph of an essay about a translator's decade-long effort to render an ancient epic poem into modern English, focused on the translation's lasting impact on how the poem is read today.", "question": "Which sentence would most effectively conclude the essay?", "choices": [{"letter": "A", "text": "A decade of careful, often uncertain work has given the poem a new generation of readers who might never have found it otherwise."}, {"letter": "B", "text": "Epic poems were traditionally passed down through oral performance."}, {"letter": "C", "text": "The translator studied classical languages in graduate school."}, {"letter": "D", "text": "Translation projects can take anywhere from months to decades to complete."}], "correctLetter": "A", "explanation": "The first choice is correct: it ties together the essay's central threads -- the decade of work and its lasting impact -- for a strong, unifying conclusion. The other choices introduce narrow details that don't draw the essay's threads together.", "trick": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus. Trick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}, {"id": "B2-IC-5", "concept": "Organization & Development", "subtype": "Introductions, Conclusions & Purpose", "passage": "This essay's overall focus is a rural hospital's adoption of telemedicine to reach patients in remote areas. This paragraph specifically discusses the technical hurdles of maintaining a reliable video connection in areas with limited internet infrastructure.", "question": "Which sentence would most effectively introduce this paragraph?", "choices": [{"letter": "A", "text": "A stable connection, it turned out, was one of the hardest problems the program had to solve."}, {"letter": "B", "text": "Telemedicine has become increasingly common at hospitals nationwide."}, {"letter": "C", "text": "The hospital was founded nearly a century ago."}, {"letter": "D", "text": "Rural areas often have fewer specialists available in person."}], "correctLetter": "A", "explanation": "The first choice is correct: it directly introduces the paragraph's actual focus -- the connectivity hurdles -- before the paragraph details them. The other choices are all plausible facts but unrelated to that specific focus.", "trick": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus. Trick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}];

const CONCEPT_GROUPS = [
  { group: "Conventions of Standard English (weakest area)", concepts: ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"] },
  { group: "Knowledge of Language", concepts: ["Word Choice & Precision", "Style & Tone", "Concision & Redundancy"] },
  { group: "Production of Writing", concepts: ["Organization & Development", "Transitions"] },
];
const WEAK_CONCEPTS = ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"];

let selectedConcepts = new Set(WEAK_CONCEPTS);
let pool = [];        // shuffled queue of question objects for current session
let usedIds = [];      // ids shown this session (for summary + avoiding immediate repeats)
let current = null;
let answered = false;
let sessionLog = [];   // {concept, correct}
let reshuffleCount = 0;

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderCheckboxes();
    setSyncStatusUI();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function countFor(concept) {
  return ALL_QUESTIONS.filter(q => q.concept === concept).length;
}

function renderCheckboxes() {
  const container = document.getElementById('checkboxList');
  container.innerHTML = '';
  CONCEPT_GROUPS.forEach(g => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.group;
    container.appendChild(title);
    g.concepts.forEach(c => {
      const label = document.createElement('label');
      label.className = 'chk';
      const checked = selectedConcepts.has(c) ? 'checked' : '';
      label.innerHTML = `<input type="checkbox" data-concept="${c}" ${checked}> ${c} <span class="count">${countFor(c)} q</span>`;
      label.querySelector('input').addEventListener('change', onCheckboxChange);
      container.appendChild(label);
    });
  });
  updateSelCount();
}

function onCheckboxChange(e) {
  const c = e.target.getAttribute('data-concept');
  if (e.target.checked) selectedConcepts.add(c); else selectedConcepts.delete(c);
  updateSelCount();
}

function selectPreset(kind) {
  if (kind === 'weak') selectedConcepts = new Set(WEAK_CONCEPTS);
  if (kind === 'all') selectedConcepts = new Set(CONCEPT_GROUPS.flatMap(g => g.concepts));
  if (kind === 'none') selectedConcepts = new Set();
  renderCheckboxes();
}

function updateSelCount() {
  const total = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept)).length;
  document.getElementById('selCount').textContent = selectedConcepts.size === 0
    ? 'Select at least one concept to begin.'
    : `${total} question${total===1?'':'s'} available in the selected concepts.`;
  document.getElementById('startBtn').disabled = total === 0;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool() {
  const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
  pool = shuffle(filtered);
}

function startQuiz() {
  buildPool();
  usedIds = [];
  sessionLog = [];
  reshuffleCount = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextQuestion();
}

function restartSameFilters() {
  document.getElementById('summary').style.display = 'none';
  startQuiz();
}

function backToSetup() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderCheckboxes();
}

function nextQuestion() {
  let banner = '';
  if (pool.length === 0) {
    const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
    pool = shuffle(filtered);
    reshuffleCount++;
    banner = `<div class="banner">You've been through every question in this set — reshuffling and starting again from the top.</div>`;
  }
  current = pool.pop();
  usedIds.push(current.id);
  answered = false;
  renderQuestion(banner);
  updateTopbar();
}

function updateTopbar() {
  document.getElementById('progressTag').textContent = `Question ${usedIds.length}${reshuffleCount>0 ? ' (round ' + (reshuffleCount+1) + ')' : ''}`;
  const correct = sessionLog.filter(s => s.correct).length;
  document.getElementById('scoreText').textContent = `${correct}/${sessionLog.length}`;
}

function renderQuestion(bannerHtml) {
  const q = current;
  const choicesHtml = q.choices.map(c => `
    <button class="choice" data-letter="${c.letter}" onclick="selectChoice('${c.letter}')">
      <span class="ltr">${c.letter}</span>${escapeHtml(c.text)}
    </button>
  `).join('');
  document.getElementById('qBody').innerHTML = `
    ${bannerHtml || ''}
    <div class="concept-chip">${q.concept} · ${q.subtype}</div>
    <div class="passage">${q.passage}</div>
    <div class="qstem">${escapeHtml(q.question)}</div>
    <div id="choicesArea">${choicesHtml}</div>
    <div id="feedbackArea"></div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectChoice(letter) {
  if (answered) return;
  answered = true;
  const q = current;
  const isCorrect = letter === q.correctLetter;
  sessionLog.push({ concept: q.concept, correct: isCorrect });
  logAttempt(q, letter, isCorrect);

  document.querySelectorAll('#choicesArea .choice').forEach(btn => {
    btn.classList.add('disabled');
    btn.onclick = null;
    const l = btn.getAttribute('data-letter');
    if (l === q.correctLetter) btn.classList.add('correct');
    else if (l === letter) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="verdict ${isCorrect ? 'good' : 'bad'}">${isCorrect ? 'Correct!' : 'Not quite — correct answer: ' + q.correctLetter}</div>
      <div class="explain">${escapeHtml(q.explanation)}</div>
      <div class="trick"><b>Rule / Memory Trick:</b> ${escapeHtml(q.trick)}</div>
    </div>
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
  `;
  updateTopbar();
}

function endSession() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  renderSummary();
}

function renderSummary() {
  const total = sessionLog.length;
  const correct = sessionLog.filter(s => s.correct).length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  document.getElementById('sumBig').textContent = total ? pct + '%' : '—';
  document.getElementById('sumSub').textContent = `${correct} of ${total} correct this session`;

  const byConcept = {};
  sessionLog.forEach(s => {
    byConcept[s.concept] = byConcept[s.concept] || { n: 0, c: 0 };
    byConcept[s.concept].n++;
    if (s.correct) byConcept[s.concept].c++;
  });
  const rows = Object.keys(byConcept).sort((a,b) => (byConcept[a].c/byConcept[a].n) - (byConcept[b].c/byConcept[b].n));
  const container = document.getElementById('sumCats');
  if (rows.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;">No questions answered yet.</p>';
    return;
  }
  container.innerHTML = rows.map(c => {
    const { n, c: correctN } = byConcept[c];
    const p = Math.round((correctN/n)*100);
    return `<div class="cat-row">
      <span>${c}</span>
      <div class="bar-wrap"><div class="bar" style="width:${p}%"></div></div>
      <span class="pct">${correctN}/${n}</span>
    </div>`;
  }).join('');
}
</script>

</html>
