ng night.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "his or her"}, {"letter": "D", "text": "one's"}], "correctLetter": "B", "explanation": "B is correct: \"troupe\" is a singular collective noun (already matched by the singular verb \"rehearses\"), so it needs the singular possessive \"its.\" A is plural and inconsistent with \"rehearses.\" C wrongly implies a single person rather than a group. D doesn't sensibly refer back to \"troupe.\"", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "B2-PAA-2", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "The data center recently upgraded <u>their</u> cooling systems, reducing energy consumption significantly.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its"}, {"letter": "C", "text": "them"}, {"letter": "D", "text": "it's"}], "correctLetter": "B", "explanation": "B is correct: \"data center\" is a singular institution, so it needs the singular possessive \"its.\" A is plural. C is an object pronoun, not a possessive, and doesn't fit before \"cooling systems.\" D is the contraction of \"it is,\" not a possessive.", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "B2-PAA-3", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "When a herd of elephants senses danger, <u>they</u> often forms a protective circle around the youngest calves.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "them"}, {"letter": "D", "text": "these"}], "correctLetter": "B", "explanation": "B is correct: \"herd\" is singular, matching the singular verb \"forms\" later in the sentence, so the pronoun must also be singular: \"it.\" A is plural and disagrees with \"forms.\" C is an object pronoun and cannot serve as the subject of \"forms.\" D is plural and disagrees with \"forms.\"", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "B2-PAA-4", "concept": "Grammar & Usage", "subtype": "Pronoun-Antecedent Agreement", "passage": "After deliberating for nearly nine hours, the jury announced that <u>they had</u> reached a unanimous verdict.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it had"}, {"letter": "C", "text": "it has"}, {"letter": "D", "text": "they have"}], "correctLetter": "B", "explanation": "B is correct: \"jury\" is a singular collective noun, so it needs the singular pronoun \"it,\" and the past-tense frame (\"announced\") calls for the past perfect \"had reached.\" A is plural. C shifts to a tense that doesn't fit the past-tense sequence. D is both plural and mistensed.", "trick": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number. Trick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "B2-PC-1", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The prize for best short film was awarded to my sister and <u>I</u> after months of editing late into the night.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "me"}, {"letter": "C", "text": "myself"}, {"letter": "D", "text": "mine"}], "correctLetter": "B", "explanation": "B is correct: as the object of the preposition \"to,\" the pronoun needs the object case \"me.\" A is a subject pronoun used incorrectly as an object. C is a reflexive pronoun with nothing earlier in the clause for it to reflect. D is a possessive pronoun that doesn't fit this slot.", "trick": "Use subject pronouns (I/he/she/they/who) when the pronoun performs the action, and object pronouns (me/him/her/them/whom) when it receives the action. Trick: \"Say it out loud in the simplest form \u2014 your ear usually knows.\""}, {"id": "B2-PC-2", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "The committee gave the largest research grant to Professor Alvarez and <u>myself</u>, recognizing our joint proposal on renewable energy storage.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "me"}, {"letter": "C", "text": "I"}, {"letter": "D", "text": "us"}], "correctLetter": "B", "explanation": "B is correct: as part of the object of the preposition \"to,\" the pronoun needs the object case \"me.\" A is reflexive with no earlier \"I\" in the clause to license it. C is a subject pronoun used incorrectly as an object. D wrongly implies a separate group rather than the single person the sentence means.", "trick": "Use subject pronouns (I/he/she/they/who) when the pronoun performs the action, and object pronouns (me/him/her/them/whom) when it receives the action. Trick: \"Say it out loud in the simplest form \u2014 your ear usually knows.\""}, {"id": "B2-VT-1", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time the divers reached the wreck's lower deck, marine growth <u>covers</u> nearly every surface for over a century.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "had covered"}, {"letter": "C", "text": "has covered"}, {"letter": "D", "text": "will cover"}], "correctLetter": "B", "explanation": "B is correct: the past perfect \"had covered\" correctly signals that the coverage was already complete before the divers' past-tense action of reaching the deck. A is present tense and doesn't fit the past narrative. C is present perfect, which doesn't sequence correctly with the earlier past action. D is future tense and contradicts the past-tense frame.", "trick": "Keep verb tense consistent with the timeline the sentence has already established. Trick: \"Find the anchor verb nearby and match its timeframe.\""}, {"id": "B2-VT-2", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Astronomers <u>will observe</u> the supernova's afterglow for several months before it faded from view entirely.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "observed"}, {"letter": "C", "text": "observe"}, {"letter": "D", "text": "will have observed"}], "correctLetter": "B", "explanation": "B is correct: the simple past \"observed\" matches the past-tense clause \"before it faded from view entirely.\" A is future tense and contradicts that past-tense clause. C is present tense and also contradicts it. D is future perfect, which likewise conflicts with the past-tense \"faded.\"", "trick": "Keep verb tense consistent with the timeline the sentence has already established. Trick: \"Find the anchor verb nearby and match its timeframe.\""}, {"id": "B2-VT-3", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "The young violinist <u>practices</u> the concerto's most difficult passage every day last summer, determined to master it before the competition.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "practiced"}, {"letter": "C", "text": "will practice"}, {"letter": "D", "text": "is practicing"}], "correctLetter": "B", "explanation": "B is correct: the simple past \"practiced\" matches the past-time marker \"last summer.\" A is present tense and doesn't fit. C is future tense and contradicts \"last summer.\" D is present progressive, which also contradicts the past-time marker.", "trick": "Keep verb tense consistent with the timeline the sentence has already established. Trick: \"Find the anchor verb nearby and match its timeframe.\""}, {"id": "B2-CMP-1", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Mount Elbrus, at over 18,500 feet, is <u>more taller</u> than Mont Blanc, which peaks at just under 15,800 feet.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "taller"}, {"letter": "C", "text": "the more tall"}, {"letter": "D", "text": "most tall"}], "correctLetter": "B", "explanation": "B is correct: \"taller\" is the standard comparative form for a two-item comparison. A doubles the comparative (\"more\" plus \"-er\"). C is an incomplete, nonstandard comparative construction. D is a superlative form, which is reserved for comparisons of three or more.", "trick": "Use the comparative form (-er / more) for exactly two things, superlative (-est / most) for three or more. Trick: \"Two things = -er, three-plus things = -est.\""}, {"id": "B2-CMP-2", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of the three desserts on the tasting menu, the chocolate torte was widely considered the <u>more delicious</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "most delicious"}, {"letter": "C", "text": "deliciousest"}, {"letter": "D", "text": "more delicious of them"}], "correctLetter": "B", "explanation": "B is correct: with three items being compared, the superlative \"most delicious\" is required. A is a comparative form, appropriate only for two items. C is a nonstandard word (\"-est\" isn't added to multisyllabic words like \"delicious\"). D keeps the comparative form, which still doesn't fit a three-item comparison.", "trick": "Use the comparative form (-er / more) for exactly two things, superlative (-est / most) for three or more. Trick: \"Two things = -er, three-plus things = -est.\""}, {"id": "B2-PREP-1", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "As team captain, Priya felt personally <u>responsible of</u> every decision the group made during the expedition.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "responsible for"}, {"letter": "C", "text": "responsible to"}, {"letter": "D", "text": "responsible with"}], "correctLetter": "B", "explanation": "B is correct: the standard idiom is \"responsible for\" a decision or outcome. A is not idiomatic. C changes the meaning to accountability owed to a person or body, which doesn't fit \"every decision.\" D is not idiomatic in this context.", "trick": "Some words pair with a specific, fixed preposition by convention. Trick: \"Read it aloud \u2014 the 'wrong' preposition usually sounds off.\""}, {"id": "B2-CNI-1", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The cartographer, who had spent thirty years mapping remote coastlines<u> was</u> awarded a lifetime achievement medal by the geographic society.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", was"}, {"letter": "C", "text": "; was"}, {"letter": "D", "text": "\u2014 was"}], "correctLetter": "B", "explanation": "B is correct: the nonessential clause \"who had spent thirty years mapping remote coastlines\" needs a comma on both sides, and the closing comma is currently missing. A leaves the clause unclosed. C uses a semicolon, which can't follow an incomplete clause like this. D pairs a dash with the opening comma, which is a mismatched combination.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "B2-CNI-2", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "Halley's Comet<u> which last appeared in Earth's night sky in 1986</u> will not be visible again until 2061.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", which last appeared in Earth's night sky in 1986,"}, {"letter": "C", "text": ", which last appeared in Earth's night sky in 1986"}, {"letter": "D", "text": "which last appeared in Earth's night sky in 1986,"}], "correctLetter": "B", "explanation": "B is correct: the nonessential clause needs a comma both before and after it. A has no commas at all. C has only the opening comma. D has only the closing comma.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "B2-CNI-3", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The Svalbard Global Seed Vault<u>, built into the side of a mountain in Norway</u> stores duplicate samples of seeds from gene banks worldwide.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", built into the side of a mountain in Norway,"}, {"letter": "C", "text": "built into the side of a mountain in Norway"}, {"letter": "D", "text": "built into the side of a mountain in Norway,"}], "correctLetter": "B", "explanation": "B is correct: the nonessential phrase needs a comma both before and after it. A has only the opening comma. C has neither comma. D has only the closing comma.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "B2-CNI-4", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "John Roebling<u> the original engineer of the Brooklyn Bridge,</u> died from an infection before construction was completed.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", the original engineer of the Brooklyn Bridge,"}, {"letter": "C", "text": ", the original engineer of the Brooklyn Bridge"}, {"letter": "D", "text": "the original engineer of the Brooklyn Bridge"}], "correctLetter": "B", "explanation": "B is correct: the nonessential appositive needs a comma both before and after it. A has only the closing comma. C has only the opening comma. D has neither comma.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "B2-CNI-5", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The Arctic tern<u>, which weighs less than four ounces</u> completes the longest migration of any animal on Earth.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", which weighs less than four ounces,"}, {"letter": "C", "text": "which weighs less than four ounces"}, {"letter": "D", "text": "which weighs less than four ounces,"}], "correctLetter": "B", "explanation": "B is correct: the nonessential clause needs a comma both before and after it. A has only the opening comma. C has neither comma. D has only the closing comma.", "trick": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all \u2014 never just one. Trick: \"If you open a comma gate, you must close it.\""}, {"id": "B2-APOS-1", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The violin <u>bows</u> horsehair needed to be replaced after decades of steady use.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "bow's"}, {"letter": "C", "text": "bows'"}, {"letter": "D", "text": "bow's's"}], "correctLetter": "B", "explanation": "B is correct: a single bow possesses the horsehair, so the singular possessive \"bow's\" is needed. A is a plain plural with no possession shown. C is a plural possessive, which doesn't match the singular \"bow\" in context. D is a nonstandard double possessive.", "trick": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural. Trick: \"Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "B2-APOS-2", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The <u>companys'</u> quarterly earnings report exceeded analysts' expectations for the third year in a row.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "company's"}, {"letter": "C", "text": "companies's"}, {"letter": "D", "text": "companies'"}], "correctLetter": "B", "explanation": "B is correct: the passage refers to one company's report, so the singular possessive \"company's\" is needed. A misspells the plural and mispositions the apostrophe. C is a nonstandard construction. D is a plural possessive, which doesn't match the singular context.", "trick": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural. Trick: \"Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "B2-APOS-3", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "Technicians carefully polished the <u>telescopes'</u> primary mirror to remove microscopic imperfections.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "telescope's"}, {"letter": "C", "text": "telescopes's"}, {"letter": "D", "text": "telescope"}], "correctLetter": "B", "explanation": "B is correct: the sentence refers to one telescope's mirror, so the singular possessive \"telescope's\" is needed. A is a plural possessive, mismatched with the singular context. C is a nonstandard construction. D drops the possessive entirely, leaving \"the telescope primary mirror,\" which is ungrammatical.", "trick": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural. Trick: \"Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "B2-DASH-1", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The mural<u>\u2014depicting founders, laborers, and merchants from the city's earliest days\u2014</u>took nearly two years to complete.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", depicting founders, laborers, and merchants from the city's earliest days,"}, {"letter": "C", "text": "\u2014depicting founders, laborers, and merchants from the city's earliest days,"}, {"letter": "D", "text": ", depicting founders, laborers, and merchants from the city's earliest days\u2014"}], "correctLetter": "A", "explanation": "NO CHANGE is correct: because the interrupting phrase itself contains commas (\"founders, laborers, and merchants\"), a matched pair of dashes is needed to set it off clearly -- using commas would blur the sentence's structure. B uses commas that would be confused with the internal list commas. C and D mismatch a dash with a comma.", "trick": "Punctuation marks that set off a nonessential phrase must match on both ends \u2014 two dashes, two commas, or two parentheses, never mixed. Trick: \"Punctuation bookends must match.\""}, {"id": "B2-DASH-2", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The champion's opening move<u>\u2014a rare, aggressive, and rarely attempted gambit\u2014</u>caught her opponent completely off guard.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", a rare, aggressive, and rarely attempted gambit,"}, {"letter": "C", "text": "\u2014a rare, aggressive, and rarely attempted gambit,"}, {"letter": "D", "text": ", a rare, aggressive, and rarely attempted gambit\u2014"}], "correctLetter": "A", "explanation": "NO CHANGE is correct: since the interrupting phrase already contains commas, a matched pair of dashes is needed to keep the sentence's structure clear. B's commas would be confused with the phrase's internal commas. C and D mismatch a dash with a comma.", "trick": "Punctuation marks that set off a nonessential phrase must match on both ends \u2014 two dashes, two commas, or two parentheses, never mixed. Trick: \"Punctuation bookends must match.\""}, {"id": "B2-DASH-3", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The beekeeper's protective suit<u>\u2014thick, white, and heavily padded\u2014</u>kept her safe from even the most defensive hives.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", thick, white, and heavily padded,"}, {"letter": "C", "text": "\u2014thick, white, and heavily padded,"}, {"letter": "D", "text": ", thick, white, and heavily padded\u2014"}], "correctLetter": "A", "explanation": "NO CHANGE is correct: because the interrupting phrase contains its own commas, a matched pair of dashes keeps the sentence's structure clear. B's commas would be confused with the phrase's internal commas. C and D mismatch a dash with a comma.", "trick": "Punctuation marks that set off a nonessential phrase must match on both ends \u2014 two dashes, two commas, or two parentheses, never mixed. Trick: \"Punctuation bookends must match.\""}, {"id": "B2-COLSEMI-1", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "The baker kneaded the dough by hand for twenty minutes<u>,</u> she covered it with a damp cloth and left it to rise.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ";"}, {"letter": "C", "text": ":"}, {"letter": "D", "text": ", then"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins these two related independent clauses. A creates a comma splice. C is incorrect because a colon requires the first clause to introduce or explain what follows, and simple sequential action doesn't fit that pattern. D still lacks a coordinating conjunction, so it remains a comma splice.", "trick": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence. Trick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "B2-COLSEMI-2", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Hydrologists monitor three key factors<u>,</u> water depth, flow velocity, and sediment concentration.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ":"}, {"letter": "C", "text": ";"}, {"letter": "D", "text": ", they are"}], "correctLetter": "B", "explanation": "B is correct: a colon properly introduces the list that follows a complete independent clause. A is just a comma, which doesn't properly introduce a list. C is incorrect because a semicolon isn't used to introduce a simple list. D creates a comma splice by adding a second independent clause.", "trick": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence. Trick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "B2-COLSEMI-3", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "The conservator's toolkit included several specialized instruments<u>,</u> fine-bristle brushes, cotton swabs, and a magnifying loupe.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ":"}, {"letter": "C", "text": "; and"}, {"letter": "D", "text": ";"}], "correctLetter": "B", "explanation": "B is correct: a colon properly introduces the list that follows a complete independent clause. A is just a comma, which doesn't properly introduce a list. C pairs a semicolon with \"and\" before a list that isn't an independent clause, which is nonstandard. D uses a semicolon before a simple list, which is also nonstandard.", "trick": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence. Trick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "B2-UNNEC-1", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The glassblower carefully<u>, shaped</u> the molten glass into a delicate vase.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "shaped"}, {"letter": "C", "text": "; shaped"}, {"letter": "D", "text": "\u2014 shaped"}], "correctLetter": "B", "explanation": "B is correct: no punctuation is needed between the adverb \"carefully\" and the verb it modifies. A wrongly inserts a comma there. C wrongly inserts a semicolon, which would leave \"shaped the molten glass into a delicate vase\" without a subject. D wrongly inserts an unnecessary dash.", "trick": "Don't add punctuation just because you'd pause there when speaking \u2014 every mark needs a grammatical job. Trick: \"When in doubt, leave it out.\""}, {"id": "B2-UNNEC-2", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The conductor raised her baton and<u>, signaled</u> the musicians to begin.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "signaled"}, {"letter": "C", "text": "; signaled"}, {"letter": "D", "text": "\u2014 signaled"}], "correctLetter": "B", "explanation": "B is correct: no punctuation belongs between the coordinating conjunction \"and\" and the verb it introduces. A wrongly inserts a comma there. C and D wrongly insert a semicolon or dash in the same spot.", "trick": "Don't add punctuation just because you'd pause there when speaking \u2014 every mark needs a grammatical job. Trick: \"When in doubt, leave it out.\""}, {"id": "B2-UNNEC-3", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The vintner tasted the wine and declared<u>, it</u> ready for bottling.", "question": "Which choice is most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it"}, {"letter": "C", "text": "; it"}, {"letter": "D", "text": "\u2014 it"}], "correctLetter": "B", "explanation": "B is correct: no punctuation is needed between the verb \"declared\" and its object \"it ready for bottling.\" A wrongly inserts a comma there. C wrongly inserts a semicolon, which would leave \"it ready for bottling\" as an incomplete clause. D wrongly inserts an unnecessary dash.", "trick": "Don't add punctuation just because you'd pause there when speaking \u2014 every mark needs a grammatical job. Trick: \"When in doubt, leave it out.\""}, {"id": "B2-RO-1", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The blacksmith pumped the bellows until the coals glowed white-hot<u>,</u> he began hammering the blade into shape.", "question": "Which choice most effectively corrects the underlined portion?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; then"}, {"letter": "C", "text": ", then"}, {"letter": "D", "text": "then"}], "correctLetter": "B", "explanation": "B is correct: a semicolon followed by the conjunctive adverb \"then\" properly joins the two independent clauses. A is a comma splice. C keeps the comma splice, since \"then\" is an adverb, not a coordinating conjunction. D fuses the clauses with no punctuation at all.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "B2-RO-2", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The cartoonist sketched a rough outline first<u>, she</u> added ink details after the pencil lines were approved.", "question": "Which choice most effectively corrects the underlined portion?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ". She"}, {"letter": "C", "text": ", then she"}, {"letter": "D", "text": "she"}], "correctLetter": "B", "explanation": "B is correct: ending the first independent clause with a period and capitalizing the next one fixes the run-on. A is a comma splice. C keeps the comma splice, since \"then\" doesn't function as a coordinating conjunction. D fuses the clauses with no punctuation at all.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "B2-RO-3", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The lock-and-dam system raises boats to the reservoir's higher water level<u>, it</u> lowers them back down on the return trip.", "question": "Which choice most effectively corrects the underlined portion?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ". It"}, {"letter": "C", "text": ", then it"}, {"letter": "D", "text": "it"}], "correctLetter": "B", "explanation": "B is correct: ending the first independent clause with a period and capitalizing the next one fixes the run-on. A is a comma splice. C keeps the comma splice, since \"then\" doesn't function as a coordinating conjunction. D fuses the clauses with no punctuation at all.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "B2-RO-4", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Keepers once tended the lighthouse's lamp by hand every night<u>, automated</u> systems now handle the job without any human involvement.", "question": "Which choice most effectively corrects the underlined portion?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ". Automated"}, {"letter": "C", "text": ", still automated"}, {"letter": "D", "text": "automated"}], "correctLetter": "B", "explanation": "B is correct: ending the first independent clause with a period and capitalizing the next one fixes the run-on. A is a comma splice. C keeps the comma splice, since \"still\" doesn't function as a coordinating conjunction. D fuses the clauses with no punctuation at all.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "B2-RO-5", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The potter loaded the kiln with dozens of glazed bowls<u>, the</u> firing process would take nearly eighteen hours to complete.", "question": "Which choice most effectively corrects the underlined portion?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ". The"}, {"letter": "C", "text": ", with the"}, {"letter": "D", "text": "the"}], "correctLetter": "B", "explanation": "B is correct: ending the first independent clause with a period and capitalizing the next one fixes the run-on. A is a comma splice. C is ungrammatical, since the preposition \"with\" can't be followed by a full clause like \"the firing process would take.\" D fuses the clauses with no punctuation at all.", "trick": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on/comma splice \u2014 fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...). Trick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "B2-FRAG-1", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>Standing beneath the glass atrium's soaring ceiling, sunlight scattering across the marble floor in bright fragments.</u> Visitors often pause there for several minutes just to look up.", "question": "Which choice results in the most effective sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Standing beneath the glass atrium's soaring ceiling, visitors watch sunlight scatter across the marble floor in bright fragments."}, {"letter": "C", "text": "Standing beneath the glass atrium's soaring ceiling, and sunlight scattering across the marble floor in bright fragments."}, {"letter": "D", "text": "Beneath the glass atrium's soaring ceiling, sunlight scattering across the marble floor in bright fragments."}], "correctLetter": "B", "explanation": "The second choice is correct: it supplies a real subject, \"visitors,\" and a finite verb, \"watch,\" fixing the fragment, and lets \"Standing\" logically modify the visitors who are actually standing there. NO CHANGE has no finite main verb (\"scattering\" is a participle). The third choice is still a fragment, since adding \"and\" doesn't create a finite verb. The fourth choice is also still a fragment for the same reason.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "B2-FRAG-2", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>The marathon course, winding through six historic neighborhoods before finishing at the harbor.</u>", "question": "Which choice results in the most effective sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The marathon course winds through six historic neighborhoods before finishing at the harbor."}, {"letter": "C", "text": "The marathon course, winding through six historic neighborhoods, before finishing at the harbor."}, {"letter": "D", "text": "Winding through six historic neighborhoods, the marathon course, before finishing at the harbor."}], "correctLetter": "B", "explanation": "The second choice is correct: it supplies the finite verb \"winds,\" turning the fragment into a complete sentence. NO CHANGE has no finite verb, only the participle \"winding.\" The third choice still lacks a finite verb. The fourth choice reorders the words but still never supplies a finite verb for \"course.\"", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "B2-FRAG-3", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>The submarine's sonar operator, listening intently for the faint echo of a distant vessel, straining to separate signal from ambient ocean noise.</u>", "question": "Which choice results in the most effective sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The submarine's sonar operator listened intently for the faint echo of a distant vessel, straining to separate signal from ambient ocean noise."}, {"letter": "C", "text": "The submarine's sonar operator, listening intently for the faint echo of a distant vessel and straining to separate signal from ambient ocean noise."}, {"letter": "D", "text": "Listening intently for the faint echo of a distant vessel, the submarine's sonar operator, straining to separate signal from ambient ocean noise."}], "correctLetter": "B", "explanation": "The second choice is correct: it supplies the finite verb \"listened,\" fixing the fragment, while \"straining\" remains a fine participial modifier. NO CHANGE has no finite verb -- both \"listening\" and \"straining\" are participles. The third choice still lacks a finite verb. The fourth choice reorders the words but still never supplies one.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "B2-FRAG-4", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>The chocolatier tempering the couverture slowly, watching the thermometer for the exact moment it reached working temperature.</u>", "question": "Which choice results in the most effective sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The chocolatier tempered the couverture slowly, watching the thermometer for the exact moment it reached working temperature."}, {"letter": "C", "text": "The chocolatier tempering the couverture slowly and watching the thermometer for the exact moment it reached working temperature."}, {"letter": "D", "text": "Tempering the couverture slowly, the chocolatier, watching the thermometer for the exact moment it reached working temperature."}], "correctLetter": "B", "explanation": "The second choice is correct: it supplies the finite verb \"tempered,\" fixing the fragment, while \"watching\" remains a fine participial modifier. NO CHANGE has no finite verb. The third choice still lacks one, since joining two participles with \"and\" doesn't create one. The fourth choice reorders the words but still never supplies one.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "B2-FRAG-5", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "<u>The vineyard's terraces, carved into the steep hillside over generations by hand.</u>", "question": "Which choice results in the most effective sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The vineyard's terraces were carved into the steep hillside over generations by hand."}, {"letter": "C", "text": "The vineyard's terraces, having been carved into the steep hillside over generations by hand."}, {"letter": "D", "text": "Carved into the steep hillside over generations by hand, the vineyard's terraces."}], "correctLetter": "B", "explanation": "The second choice is correct: it supplies the finite verb \"were carved,\" fixing the fragment. NO CHANGE has no finite verb. The third choice still lacks one, since \"having been carved\" is a participial phrase, not a finite predicate. The fourth choice reorders the words but still never supplies one.", "trick": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment. Trick: \"Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?\""}, {"id": "B2-PARA-1", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "During each expedition, the glacier researcher measures ice thickness, records temperature fluctuations, and <u>is taking</u> photographs of the calving front.", "question": "Which choice is most consistent with the sentence's parallel structure?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "takes"}, {"letter": "C", "text": "took"}, {"letter": "D", "text": "will take"}], "correctLetter": "B", "explanation": "B is correct: \"takes\" matches the present-tense form of \"measures\" and \"records\" in the parallel list. A breaks parallelism by shifting to the progressive form. C shifts to past tense, breaking the parallel present tense. D shifts to future tense, also breaking it.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "B2-PARA-2", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "A skilled tour guide must be knowledgeable, personable, and <u>someone who explains things patiently</u>.", "question": "Which choice is most consistent with the sentence's parallel structure?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "patient"}, {"letter": "C", "text": "explaining patiently"}, {"letter": "D", "text": "a patient explainer"}], "correctLetter": "B", "explanation": "B is correct: \"patient\" matches the adjective form of \"knowledgeable\" and \"personable\" in the parallel list. A breaks parallelism with a noun clause. C breaks it with a participial phrase. D breaks it with a noun phrase.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "B2-PARA-3", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "The woodworker sanded the tabletop, applied a coat of stain, and <u>then he sealed it</u> with a protective varnish.", "question": "Which choice is most consistent with the sentence's parallel structure?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sealed it"}, {"letter": "C", "text": "had sealed it"}, {"letter": "D", "text": "was sealing it"}], "correctLetter": "B", "explanation": "B is correct: \"sealed it\" matches the simple past form of \"sanded\" and \"applied\" in the parallel list, without needlessly restating the subject. A breaks parallelism by reintroducing \"he\" and adding \"then.\" C shifts to past perfect, breaking the parallel simple past. D shifts to past progressive, also breaking it.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "B2-PARA-4", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "In her pitch, the founder emphasized the product's affordability, its ease of use, and <u>how sustainable it was</u>.", "question": "Which choice is most consistent with the sentence's parallel structure?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "its sustainability"}, {"letter": "C", "text": "that it was sustainable"}, {"letter": "D", "text": "being sustainable"}], "correctLetter": "B", "explanation": "B is correct: \"its sustainability\" matches the noun-phrase pattern of \"affordability\" and \"its ease of use\" in the parallel list. A breaks parallelism with a full clause. C breaks it with another clause. D breaks it with a gerund phrase.", "trick": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.). Trick: \"List items should all wear the same outfit \u2014 same verb form straight down the list.\""}, {"id": "B2-MOD-1", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "<u>Excavating the shipwreck's cargo hold, dozens of intact ceramic jars were discovered by the archaeologists.</u>", "question": "Which choice results in the most logical sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Excavating the shipwreck's cargo hold, the archaeologists discovered dozens of intact ceramic jars."}, {"letter": "C", "text": "Dozens of intact ceramic jars, excavating the shipwreck's cargo hold, were discovered by the archaeologists."}, {"letter": "D", "text": "Excavating the shipwreck's cargo hold, the discovery of dozens of intact ceramic jars was made by the archaeologists."}], "correctLetter": "B", "explanation": "The second choice is correct: it places \"the archaeologists\" -- who are actually doing the excavating -- right after the opening modifier. NO CHANGE illogically suggests the jars were excavating. The third choice illogically attaches the modifier directly to the jars. The fourth choice illogically suggests \"the discovery\" was doing the excavating.", "trick": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing \u2014 otherwise it \"dangles\" and attaches to the wrong thing. Trick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "B2-MOD-2", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "<u>Wearing a full protective suit, the honeycomb frames were carefully removed by the beekeeper.</u>", "question": "Which choice results in the most logical sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Wearing a full protective suit, the beekeeper carefully removed the honeycomb frames."}, {"letter": "C", "text": "The honeycomb frames, wearing a full protective suit, were carefully removed by the beekeeper."}, {"letter": "D", "text": "Wearing a full protective suit, the removal of the honeycomb frames was done carefully by the beekeeper."}], "correctLetter": "B", "explanation": "The second choice is correct: it places \"the beekeeper\" -- who is actually wearing the suit -- right after the opening modifier. NO CHANGE illogically suggests the honeycomb frames were wearing a suit. The third choice illogically attaches the modifier directly to the frames. The fourth choice illogically suggests \"the removal\" was wearing the suit.", "trick": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing \u2014 otherwise it \"dangles\" and attaches to the wrong thing. Trick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "B2-MOD-3", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "<u>Disassembled piece by piece, the restorer carefully cleaned each gear of the antique clock.</u>", "question": "Which choice results in the most logical sentence?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Disassembled piece by piece, the antique clock was carefully cleaned gear by gear by the restorer."}, {"letter": "C", "text": "The restorer, disassembled piece by piece, carefully cleaned each gear of the antique clock."}, {"letter": "D", "text": "Disassembled piece by piece, the restorer's cleaning of each gear of the antique clock was thorough."}], "correctLetter": "B", "explanation": "The second choice is correct: it places \"the antique clock\" -- the thing that was actually disassembled -- right after the opening modifier. NO CHANGE illogically suggests the restorer was disassembled. The third choice makes that illogical claim even more directly. The fourth choice illogically suggests \"the restorer's cleaning\" was disassembled.", "trick": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing \u2014 otherwise it \"dangles\" and attaches to the wrong thing. Trick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "B2-WC-1", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The seismograph can <u>see</u> ground vibrations too subtle for people to feel.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "detect"}, {"letter": "C", "text": "spot"}, {"letter": "D", "text": "notice"}], "correctLetter": "B", "explanation": "\"detect\" precisely describes how an instrument registers subtle physical signals. A, C, and D all imply casual, direct human seeing or awareness, which doesn't fit an instrument.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-2", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The vintner <u>puts together</u> grapes from three different vineyards to create the estate's signature blend.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "blends"}, {"letter": "C", "text": "mixes"}, {"letter": "D", "text": "stirs"}], "correctLetter": "B", "explanation": "\"blends\" is the precise winemaking term for combining grape sources into a finished wine. A is vague. C is too generic for the specific winemaking process. D wrongly implies a simple mechanical stirring motion.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-3", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The perfumer carefully <u>picked</u> each note to create a scent that evolved over several hours.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "selected"}, {"letter": "C", "text": "grabbed"}, {"letter": "D", "text": "chose out"}], "correctLetter": "B", "explanation": "\"selected\" matches the deliberate, technical register of composing a fragrance. A is too casual. C wrongly implies careless haste. D is nonstandard phrasing.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-4", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Coopers <u>make</u> the wooden staves into the barrel's curved shape using steam and heat.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "bend"}, {"letter": "C", "text": "turn"}, {"letter": "D", "text": "form"}], "correctLetter": "B", "explanation": "\"bend\" precisely names the physical action of curving wood under steam and heat. A (\"make...into\") is vague about the actual technique. C wrongly suggests rotation rather than curvature. D is too generic for this specific coopering technique.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-5", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The cartographer used a fine pen to <u>put</u> the coastline's every inlet onto the vellum.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "trace"}, {"letter": "C", "text": "place"}, {"letter": "D", "text": "set"}], "correctLetter": "B", "explanation": "\"trace\" precisely describes following the coastline's contours with a pen. A, C, and D are all vague and don't capture the careful line-following action.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-6", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "At the foundry, molten bronze is <u>put</u> into a clay mold shaped like the finished bell.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "poured"}, {"letter": "C", "text": "dropped"}, {"letter": "D", "text": "placed"}], "correctLetter": "B", "explanation": "\"poured\" precisely describes how molten metal is introduced into a mold. A and D are too vague for a liquid. C wrongly implies a sudden release rather than a controlled flow.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-7", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The falconer <u>threw</u> her arm upward to release the bird toward the open field.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "raised"}, {"letter": "C", "text": "tossed"}, {"letter": "D", "text": "flung"}], "correctLetter": "B", "explanation": "\"raised\" precisely describes the controlled upward arm motion falconers use to launch a bird. A, C, and D all wrongly suggest the arm itself was hurled with force.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-8", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The etcher used acid to <u>get into</u> delicate patterns on the glass surface.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "carve"}, {"letter": "C", "text": "dig"}, {"letter": "D", "text": "cut out"}], "correctLetter": "B", "explanation": "\"carve\" precisely captures how acid selectively removes glass to create a pattern. A is vague and unclear. C wrongly suggests digging into a soft material. D wrongly implies removing whole shapes rather than fine surface patterns.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-9", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The engineer used specialized software to <u>take away</u> the background hiss from the old recording.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "filter out"}, {"letter": "C", "text": "pull off"}, {"letter": "D", "text": "clear away"}], "correctLetter": "B", "explanation": "\"filter out\" is the precise technical term for isolating and removing unwanted frequencies from audio. A, C, and D are all vague, non-technical phrasings that don't fit the engineering context.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-WC-10", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The gardener used sharp shears to <u>make</u> the hedge into the shape of a spiral.", "question": "Which choice is most precise in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sculpt"}, {"letter": "C", "text": "build"}, {"letter": "D", "text": "construct"}], "correctLetter": "B", "explanation": "\"sculpt\" precisely describes shaping living plant material into an artistic form. A, C, and D all suggest assembling something from separate parts, which doesn't fit trimming a single hedge into shape.", "trick": "Ask which word most precisely and literally matches the meaning in context \u2014 not which one sounds the most impressive. Trick: \"Precise beats fancy.\""}, {"id": "B2-ST-1", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The surgeon's technique for closing the incision was <u>super quick and clean</u>.", "question": "Which choice most effectively maintains the essay's formal, clinical tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "remarkably efficient and precise"}, {"letter": "C", "text": "crazy fast and tidy"}, {"letter": "D", "text": "done in the blink of an eye"}], "correctLetter": "B", "explanation": "\"remarkably efficient and precise\" matches a formal, clinical register. A, C, and D are all casual phrasings that clash with that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-2", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The diplomat's opening remarks <u>totally smoothed things over</u> between the two delegations.", "question": "Which choice most effectively maintains the essay's formal, analytical tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "eased tensions considerably"}, {"letter": "C", "text": "basically fixed everything"}, {"letter": "D", "text": "calmed everybody down"}], "correctLetter": "B", "explanation": "\"eased tensions considerably\" matches a formal, analytical register. A, C, and D are all casual phrasings out of step with that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-3", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The dish's flavor was <u>out of this world</u>, balancing acidity and richness in equal measure.", "question": "Which choice most effectively maintains the essay's measured, professional tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "exceptional"}, {"letter": "C", "text": "insanely good"}, {"letter": "D", "text": "off the charts"}], "correctLetter": "B", "explanation": "\"exceptional\" is precise and measured, matching a professional register. A, C, and D are all overly casual or hyperbolic for that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-4", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The report concluded that corrosion <u>totally trashed</u> the support beam's structural integrity.", "question": "Which choice most effectively maintains the essay's formal, technical tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "severely compromised"}, {"letter": "C", "text": "straight-up wrecked"}, {"letter": "D", "text": "did a number on"}], "correctLetter": "B", "explanation": "\"severely compromised\" matches the formal, technical register of an engineering report. A, C, and D are all casual phrasings that clash with that register.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-5", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The librarian <u>dug up</u> a first-edition copy that had been misfiled for decades.", "question": "Which choice most effectively maintains the essay's plain, professional tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "located"}, {"letter": "C", "text": "hunted down"}, {"letter": "D", "text": "tracked down finally"}], "correctLetter": "B", "explanation": "\"located\" is clear and appropriately plain, matching a professional register. A, C, and D are all needlessly informal or awkwardly phrased.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-6", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Her field notes <u>go into</u> the exact water temperature at each tagging site.", "question": "Which choice most effectively maintains the essay's precise, scientific tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "specify"}, {"letter": "C", "text": "get into"}, {"letter": "D", "text": "dive into"}], "correctLetter": "B", "explanation": "\"specify\" is precise and matches a scientific register. A, C, and D are all vague or casual phrasings that clash with that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-7", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The novelist's prose <u>packs a punch</u> even in its quietest, most restrained passages.", "question": "Which choice most effectively maintains the essay's restrained, literary tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "remains powerful"}, {"letter": "C", "text": "hits hard"}, {"letter": "D", "text": "really delivers"}], "correctLetter": "B", "explanation": "\"remains powerful\" fits the essay's more restrained, literary register. A, C, and D are all colloquial phrasings that clash with that tone.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-ST-8", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "The watchmaker <u>fiddled around with</u> each gear until the mechanism kept perfect time.", "question": "Which choice most effectively maintains the essay's plain, professional tone?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "adjusted"}, {"letter": "C", "text": "messed with"}, {"letter": "D", "text": "tinkered around with"}], "correctLetter": "B", "explanation": "\"adjusted\" is clear and appropriately plain, matching a professional register. A, C, and D are all needlessly casual phrasings that clash with that register.", "trick": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline. Trick: \"Match the essay's volume.\""}, {"id": "B2-CR-1", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "On clear nights far from city lights, the Milky Way <u>can actually be seen and viewed</u> stretching across the sky.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "can be seen"}, {"letter": "C", "text": "can actually be viewed and seen"}, {"letter": "D", "text": "can be seen and also viewed"}], "correctLetter": "B", "explanation": "\"can be seen\" says everything needed once. A, C, and D all repeat the same idea with \"seen\" and \"viewed\" together.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-2", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Before every dive, she <u>checks and inspects</u> each piece of equipment twice.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "checks"}, {"letter": "C", "text": "checks and looks over"}, {"letter": "D", "text": "inspects and checks over"}], "correctLetter": "B", "explanation": "\"checks\" alone conveys the full idea. A, C, and D all pair two words that mean essentially the same thing.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-3", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Coastal erosion has <u>slowly and gradually</u> reshaped the shoreline over the past fifty years.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "gradually"}, {"letter": "C", "text": "slowly and steadily over time"}, {"letter": "D", "text": "gradually and slowly"}], "correctLetter": "B", "explanation": "\"gradually\" alone conveys the idea. A, C, and D all repeat the same concept with more than one word.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-4", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "Having researched both sides of the resolution, the debate team held <u>a clear and obvious</u> advantage over their opponents.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "a clear"}, {"letter": "C", "text": "a clear, obvious, and evident"}, {"letter": "D", "text": "an obvious and clear"}], "correctLetter": "B", "explanation": "\"a clear\" alone conveys the idea. A, C, and D all pair or stack synonyms that repeat the same meaning.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-5", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The woodturner <u>shaped and formed</u> the bowl on the lathe in less than twenty minutes.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "shaped"}, {"letter": "C", "text": "shaped and molded into form"}, {"letter": "D", "text": "formed and shaped"}], "correctLetter": "B", "explanation": "\"shaped\" alone conveys the idea. A, C, and D all pair or stack words that mean essentially the same thing.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-6", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The translator <u>carefully considered and thought about</u> each word's connotation before choosing an English equivalent.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "carefully considered"}, {"letter": "C", "text": "thought about and considered carefully"}, {"letter": "D", "text": "carefully thought about and considered"}], "correctLetter": "B", "explanation": "\"carefully considered\" alone conveys the idea. A, C, and D all pair synonyms (\"considered\" and \"thought about\") that repeat the same meaning.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-7", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The archivist <u>scanned each and every single</u> photograph in the collection.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "scanned every"}, {"letter": "C", "text": "scanned each and every one of the"}, {"letter": "D", "text": "scanned every single each"}], "correctLetter": "B", "explanation": "\"scanned every\" says everything needed once. A stacks three overlapping words (\"each,\" \"every,\" \"single\"). C and D similarly repeat or garble the same idea.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-CR-8", "concept": "Concision & Redundancy", "subtype": "Concision & Redundancy", "passage": "The tailor <u>marked and indicated</u> the hem's new length before making the final cut.", "question": "Which choice is least redundant in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "marked"}, {"letter": "C", "text": "marked and noted down"}, {"letter": "D", "text": "indicated and marked out"}], "correctLetter": "B", "explanation": "\"marked\" alone conveys the idea. A, C, and D all pair words that mean essentially the same thing.", "trick": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence. Trick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "B2-TR-1", "concept": "Transitions", "subtype": "Transitions", "passage": "Engineers reinforced the bridge's support beams in 2019. <u>As a result,</u> the structure can now safely carry twice its original load capacity.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In contrast,"}, {"letter": "C", "text": "Similarly,"}, {"letter": "D", "text": "Meanwhile,"}], "correctLetter": "A", "explanation": "\"As a result\" correctly signals the cause-effect relationship between the reinforcement and the increased load capacity. B, C, and D don't fit a cause-effect relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-2", "concept": "Transitions", "subtype": "Transitions", "passage": "The farm switched to drip irrigation five years ago. <u>Since then,</u> water usage has dropped by nearly a third.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "On the other hand,"}, {"letter": "C", "text": "For example,"}, {"letter": "D", "text": "Similarly,"}], "correctLetter": "A", "explanation": "\"Since then\" correctly signals the change that followed the switch to drip irrigation over time. B, C, and D don't fit that relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-3", "concept": "Transitions", "subtype": "Transitions", "passage": "The hospital installed a new scheduling system last spring. <u>However,</u> patient wait times have barely changed.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore,"}, {"letter": "C", "text": "As a result,"}, {"letter": "D", "text": "Similarly,"}], "correctLetter": "A", "explanation": "\"However\" correctly signals the contrast between installing a new system and the lack of expected improvement. B, C, and D all wrongly imply a cause-effect relationship instead.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-4", "concept": "Transitions", "subtype": "Transitions", "passage": "The novelist spent a decade writing historical fiction. <u>In contrast,</u> her most recent book is a work of pure fantasy.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Therefore,"}, {"letter": "C", "text": "Consequently,"}, {"letter": "D", "text": "For example,"}], "correctLetter": "A", "explanation": "\"In contrast\" correctly signals the shift between the earlier genre and the recent one. B, C, and D all wrongly imply a cause-effect or example relationship instead.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-5", "concept": "Transitions", "subtype": "Transitions", "passage": "One town imposed strict water rationing during the drought. <u>As a result,</u> the neighboring town saw little change in its usage patterns.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "In contrast,"}, {"letter": "C", "text": "Consequently,"}, {"letter": "D", "text": "Therefore,"}], "correctLetter": "B", "explanation": "\"In contrast\" correctly signals the differing responses of the two separate towns to the same drought. NO CHANGE, C, and D all wrongly imply that one town's rationing caused the other town's usage pattern.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-6", "concept": "Transitions", "subtype": "Transitions", "passage": "The company's profits fell sharply last quarter. <u>Consequently,</u> management announced significant budget cuts.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "However,"}, {"letter": "C", "text": "In contrast,"}, {"letter": "D", "text": "Meanwhile,"}], "correctLetter": "A", "explanation": "\"Consequently\" correctly signals the cause-effect relationship between falling profits and the budget cuts. B, C, and D don't fit that relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-7", "concept": "Transitions", "subtype": "Transitions", "passage": "Rangers increased anti-poaching patrols across the reserve in 2021. <u>Despite this,</u> rhino poaching incidents have dropped by more than half.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "As a result,"}, {"letter": "C", "text": "In contrast,"}, {"letter": "D", "text": "On the other hand,"}], "correctLetter": "B", "explanation": "\"As a result\" correctly signals the cause-effect relationship between increased patrols and the drop in poaching. NO CHANGE, C, and D all wrongly imply an unexpected contrast, when the outcome is exactly what increased patrols would predict.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-TR-8", "concept": "Transitions", "subtype": "Transitions", "passage": "In-person library visits declined steadily for nearly a decade. <u>Recently, however,</u> they have begun to climb again as libraries add more community programming.", "question": "Which transition is most logical in context?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Similarly,"}, {"letter": "C", "text": "For instance,"}, {"letter": "D", "text": "As a result,"}], "correctLetter": "A", "explanation": "\"Recently, however\" correctly signals the contrast between the decade-long decline and the recent rebound. B, C, and D don't fit that contrasting relationship.", "trick": "Identify the actual logical relationship between the two ideas \u2014 contrast, cause/effect, addition, or sequence \u2014 before picking a transition word. Trick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "B2-REL-1", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "This paragraph focuses specifically on how the ceramicist selects clay for each project: \"She tests the clay's plasticity by hand, kneading small samples to judge how well they hold shape before committing to a full batch.\" The writer is considering adding here: \"The ceramicist's studio is located in a converted barn outside of town.\"", "question": "Should the writer add this sentence here?", "choices": [{"letter": "A", "text": "Yes, because it helps readers picture the ceramicist's work environment."}, {"letter": "B", "text": "Yes, because it explains why the ceramicist has access to good clay."}, {"letter": "C", "text":
