", "passage": "A typical class begins with slow breathing exercises, moves into a series of standing poses, and <u>class members are cooled down</u> with a final stretch.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "cools down"}, {"letter": "C", "text": "cooling down"}, {"letter": "D", "text": "to cool down"}], "correctLetter": "B", "explanation": "B is correct: the list already uses the third-person singular present verbs \"begins\" and \"moves,\" with \"a typical class\" as the consistent subject, so the third item must match with \"cools down.\" A breaks the pattern by switching to a passive clause with a different subject, \"class members are cooled down.\" C switches to the -ing form \"cooling,\" which doesn't match. D switches to the infinitive \"to cool,\" which also breaks the parallel list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "T3-SS-26", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Each day, the analyst monitors network traffic for anomalies, patches known vulnerabilities, and <u>writing incident reports</u> for the security team.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "to write incident reports"}, {"letter": "C", "text": "writes incident reports"}, {"letter": "D", "text": "wrote incident reports"}], "correctLetter": "C", "explanation": "C is correct: the list already uses the third-person singular present verbs \"monitors\" and \"patches,\" so the third item must match with \"writes.\" A breaks the pattern with the -ing form \"writing.\" B switches to the infinitive \"to write,\" which doesn't match. D uses the past tense \"wrote,\" which also breaks the parallel list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "T3-SS-27", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "A good tour guide keeps the group together, answers unexpected questions, and <u>make sure</u> everyone stays safe near the cliffs.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "making sure"}, {"letter": "C", "text": "to make sure"}, {"letter": "D", "text": "makes sure"}], "correctLetter": "D", "explanation": "D is correct: the list already uses the third-person singular present verbs \"keeps\" and \"answers,\" so the third item must match with \"makes sure.\" A drops the required \"-s,\" leaving a form that breaks the parallel list. B switches to the -ing form \"making,\" which doesn't match. C switches to the infinitive \"to make,\" which also breaks the pattern.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "T3-SS-28", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Scanning the pool constantly from the elevated chair, <u>the lifeguard noticed a swimmer struggling</u> in the deep end.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "a swimmer was noticed struggling by the lifeguard"}, {"letter": "C", "text": "the water revealed a swimmer struggling"}, {"letter": "D", "text": "a struggling swimmer was noticed"}], "correctLetter": "A", "explanation": "A is correct: the introductory phrase describes someone scanning the pool, and \"the lifeguard\" placed right after the comma is logically the one doing that scanning. B places \"a swimmer\" right after the comma, but the swimmer isn't the one scanning the pool. C makes \"the deep end\" the subject right after the comma, and the deep end cannot scan anything. D places \"a struggling swimmer\" right after the comma, again making the swimmer, not the lifeguard, the one scanning.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-29", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Working by feel alone in the dim basement, <u>the antique lock finally clicked open for the locksmith</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the locksmith finally felt the antique lock click open"}, {"letter": "C", "text": "the dim basement finally revealed the antique lock"}, {"letter": "D", "text": "the antique lock's mechanism finally gave way"}], "correctLetter": "B", "explanation": "B is correct: the introductory phrase describes someone working by feel, and \"the locksmith\" placed right after the comma is logically the one doing that work. A makes \"the antique lock\" the subject right after the comma, but a lock cannot work by feel. C makes \"the dim basement\" the subject, and a basement cannot work by feel. D places \"the antique lock's mechanism\" right after the comma, again making an object, not the locksmith, the one working.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-30", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Whistling a familiar signal across the open field, <u>the young hawk was called back by the falconer</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "a signal brought the young hawk back"}, {"letter": "C", "text": "the falconer called the young hawk back"}, {"letter": "D", "text": "the open field echoed with the falconer's whistle"}], "correctLetter": "C", "explanation": "C is correct: the introductory phrase describes someone whistling, and \"the falconer\" placed right after the comma is logically the one doing that whistling. A makes \"the young hawk\" the subject right after the comma, but the hawk is not the one whistling. B makes \"a signal\" the subject, and a signal cannot whistle. D places \"the open field\" right after the comma, and a field cannot whistle either.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-31", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Descending nearly a mile underground in a rickety elevator cage, <u>the tunnel walls pressed closer around the miner</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "a sense of dread grew in the miner"}, {"letter": "C", "text": "the elevator cage rattled loudly"}, {"letter": "D", "text": "the miner felt the tunnel walls pressing closer"}], "correctLetter": "D", "explanation": "D is correct: the introductory phrase describes someone descending in the cage, and \"the miner\" placed right after the comma is logically the one doing that descending. A makes \"the tunnel walls\" the subject right after the comma, but walls cannot descend in an elevator cage. B makes \"a sense of dread\" the subject, and a feeling cannot descend. C makes \"the elevator cage\" the subject, which is illogical since the cage cannot be descending inside itself.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-32", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Tossing five clubs in a steady rotation without dropping one, <u>the juggler grinned at the cheering crowd</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the crowd cheered at the juggler"}, {"letter": "C", "text": "five clubs spun through the air"}, {"letter": "D", "text": "a grin spread across the juggler's face"}], "correctLetter": "A", "explanation": "A is correct: the introductory phrase describes someone tossing clubs, and \"the juggler\" placed right after the comma is logically the one doing that tossing. B makes \"the crowd\" the subject right after the comma, but the crowd isn't tossing clubs. C makes \"five clubs\" the subject, but the clubs are being tossed, not doing the tossing. D places \"a grin\" right after the comma, and a grin cannot toss clubs.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-33", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Exploring the sunken shipwreck's dark corridors with only a flashlight, <u>a school of fish startled the diver</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the diver was startled by a school of fish"}, {"letter": "C", "text": "the flashlight beam startled a school of fish"}, {"letter": "D", "text": "the shipwreck's corridors startled the diver"}], "correctLetter": "B", "explanation": "B is correct: the introductory phrase describes someone exploring the corridors, and \"the diver\" placed right after the comma is logically the one doing that exploring. A places \"a school of fish\" right after the comma, but fish are not exploring the wreck with a flashlight. C makes \"the flashlight beam\" the subject, and a beam cannot explore corridors. D makes \"the shipwreck's corridors\" the subject, and corridors cannot explore themselves.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-34", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Carefully trimming each stem to the same length, <u>the wedding bouquet took shape in the florist's hands</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the flowers began to form a bouquet in the florist's hands"}, {"letter": "C", "text": "the florist assembled the wedding bouquet"}, {"letter": "D", "text": "the wedding table displayed the finished bouquet"}], "correctLetter": "C", "explanation": "C is correct: the introductory phrase describes someone trimming stems, and \"the florist\" placed right after the comma is logically the one doing that trimming. A makes \"the wedding bouquet\" the subject right after the comma, but a bouquet cannot trim its own stems. B places \"the flowers\" right after the comma, and flowers are being trimmed, not doing the trimming. D makes \"the wedding table\" the subject, and a table cannot trim stems.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-35", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Wearing a heavy protective mask and thick gloves, <u>the steel beams were joined together by the welder</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sparks flew from the torch"}, {"letter": "C", "text": "the bridge structure grew stronger each day"}, {"letter": "D", "text": "the welder joined the steel beams together"}], "correctLetter": "D", "explanation": "D is correct: the introductory phrase describes someone wearing protective gear, and \"the welder\" placed right after the comma is logically the one doing the wearing. A makes \"the steel beams\" the subject right after the comma, but beams cannot wear a mask and gloves. B makes \"sparks\" the subject, and sparks cannot wear protective gear. C makes \"the bridge structure\" the subject, and a structure cannot wear a mask and gloves either.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-36", "concept": "Sentence Structure & Formation", "subtype": "Modifier Placement", "passage": "Paddling hard against the incoming current, <u>the surfer finally reached the calm water past the break</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the calm water past the break finally appeared"}, {"letter": "C", "text": "the current finally eased near the break"}, {"letter": "D", "text": "a wave carried the surfer past the break"}], "correctLetter": "A", "explanation": "A is correct: the introductory phrase describes someone paddling against the current, and \"the surfer\" placed right after the comma is logically the one doing that paddling. B makes \"the calm water\" the subject right after the comma, but water cannot paddle. C makes \"the current\" the subject, and a current cannot paddle against itself. D places \"a wave\" right after the comma, but it was the surfer, not a wave, who was paddling.", "trick": "Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it."}, {"id": "T3-SS-37", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The city council debated the zoning law for three hours, it</u> ultimately passed by a single vote.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Although the city council debated the zoning law for three hours, it"}, {"letter": "C", "text": "The city council debating the zoning law for three hours, it"}, {"letter": "D", "text": "The city council's debate over the zoning law lasted three hours it"}], "correctLetter": "B", "explanation": "B is correct: the subordinating conjunction \"Although\" turns the first clause into a dependent clause, legally attached to the independent clause \"it ultimately passed by a single vote\" with a comma. A is a comma splice, joining two independent clauses with only a comma. C uses the participle \"debating\" instead of a finite verb, leaving \"The city council\" without a working main verb. D drops all punctuation between \"hours\" and \"it,\" creating a run-on.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-38", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The novelist revised the manuscript again, her editor</u> insisted the ending still felt rushed.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The novelist revised the manuscript again her editor"}, {"letter": "C", "text": "The novelist revised the manuscript again because her editor"}, {"letter": "D", "text": "The novelist revising the manuscript again, her editor"}], "correctLetter": "C", "explanation": "C is correct: the subordinating conjunction \"because\" turns the second clause into a dependent clause explaining why the novelist revised the manuscript, legally attaching it without a comma splice. A is a comma splice, joining two independent clauses with only a comma. B removes the punctuation entirely, creating a run-on. D uses the participle \"revising\" instead of a finite verb, leaving \"The novelist\" without a working main verb.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-39", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The pilot completed the pre-flight checklist, the tower</u> cleared the flight for takeoff.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The pilot completed the pre-flight checklist the tower"}, {"letter": "C", "text": "The pilot completing the pre-flight checklist, the tower"}, {"letter": "D", "text": "After the pilot completed the pre-flight checklist, the tower"}], "correctLetter": "D", "explanation": "D is correct: the subordinating conjunction \"After\" turns the first clause into a dependent clause showing sequence, legally attached to the independent clause \"the tower cleared the flight for takeoff\" with a comma. A is a comma splice, joining two independent clauses with only a comma. B removes the punctuation entirely, creating a run-on. C uses the participle \"completing\" instead of a finite verb, leaving \"The pilot\" without a working main verb.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-40", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>Because the entrepreneur had saved for nearly five years, she</u> was able to launch her startup without taking out a single loan.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The entrepreneur had saved for nearly five years, she"}, {"letter": "C", "text": "The entrepreneur saving for nearly five years, she"}, {"letter": "D", "text": "Although the entrepreneur had saved for nearly five years, she"}], "correctLetter": "A", "explanation": "A is correct: the subordinating conjunction \"Because\" turns the first clause into a dependent clause that correctly explains the cause of the loan-free launch, legally attached with a comma. B is a comma splice, joining two independent clauses with only a comma. C uses the participle \"saving\" instead of a finite verb, leaving \"The entrepreneur\" without a working main verb. D uses \"Although,\" which wrongly signals contrast, when saving money was actually the reason she avoided a loan, not an obstacle she overcame.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-41", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The marine biologist tagged over thirty sharks last season, each tag</u> transmits location data for up to two years.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The marine biologist tagged over thirty sharks last season; each tag"}, {"letter": "C", "text": "The marine biologist tagged over thirty sharks last season each tag"}, {"letter": "D", "text": "The marine biologist tagging over thirty sharks last season, each tag"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins the two independent clauses \"The marine biologist tagged over thirty sharks last season\" and \"each tag transmits location data for up to two years.\" A is a comma splice, joining two independent clauses with only a comma. C removes the punctuation entirely, creating a run-on. D uses the participle \"tagging\" instead of a finite verb, leaving \"The marine biologist\" without a working main verb.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-42", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The historian spent weeks in the archives, she</u> uncovered a letter that rewrote the town's founding story.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The historian spent weeks in the archives she"}, {"letter": "C", "text": "While the historian spent weeks in the archives, she"}, {"letter": "D", "text": "The historian spending weeks in the archives, she"}], "correctLetter": "C", "explanation": "C is correct: the subordinating conjunction \"While\" turns the first clause into a dependent clause showing the timeframe of the discovery, legally attached to the independent clause \"she uncovered a letter...\" with a comma. A is a comma splice, joining two independent clauses with only a comma. B removes the punctuation entirely, creating a run-on. D uses the participle \"spending\" instead of a finite verb, leaving \"The historian\" without a working main verb.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-43", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>The farmer rotates his crops every season, the soil</u> stays rich in nutrients year after year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The farmer rotates his crops every season the soil"}, {"letter": "C", "text": "The farmer rotating his crops every season, the soil"}, {"letter": "D", "text": "Because the farmer rotates his crops every season, the soil"}], "correctLetter": "D", "explanation": "D is correct: the subordinating conjunction \"Because\" turns the first clause into a dependent clause that correctly explains why the soil stays rich, legally attached with a comma. A is a comma splice, joining two independent clauses with only a comma. B removes the punctuation entirely, creating a run-on. C uses the participle \"rotating\" instead of a finite verb, leaving \"The farmer\" without a working main verb.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-SS-44", "concept": "Sentence Structure & Formation", "subtype": "Subordination & Clause Structure", "passage": "<u>Because the sculptor studied the marble block for days before making a single cut, she</u> avoided the hidden fracture that would have ruined the piece.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "The sculptor studied the marble block for days before making a single cut, she"}, {"letter": "C", "text": "The sculptor studying the marble block for days before making a single cut, she"}, {"letter": "D", "text": "Although the sculptor studied the marble block for days before making a single cut, she"}], "correctLetter": "A", "explanation": "A is correct: the subordinating conjunction \"Because\" turns the first clause into a dependent clause that correctly explains why she avoided the fracture, legally attached with a comma. B is a comma splice, joining two independent clauses with only a comma. C uses the participle \"studying\" instead of a finite verb, leaving \"The sculptor\" without a working main verb. D uses \"Although,\" which wrongly signals contrast, when studying carefully was actually the reason she avoided the fracture, not an obstacle she overcame.", "trick": "Ask what job the connector is doing: is it strong enough to legally join two full sentences?"}, {"id": "T3-WC-1", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Despite carrying passengers on more than 40 trips throughout the day, the express elevator maintained an <u>erratic</u> descent speed of exactly 4 meters per second on every single trip.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "consistent"}, {"letter": "C", "text": "brisk"}, {"letter": "D", "text": "monotonous"}], "correctLetter": "B", "explanation": "B is correct: \"consistent\" precisely matches the detail that the elevator moved at \"exactly 4 meters per second on every single trip,\" describing uniformity across repeated trips. A \"erratic\" means unpredictable and irregular, directly contradicting the fixed, unchanging speed described. C \"brisk\" describes how fast something moves, not whether that speed stays the same trip after trip \u2014 the sentence is making a claim about steadiness, not velocity, so \"brisk\" answers the wrong question. D \"monotonous\" describes something tedious or wearisome, a connotation of boredom that has nothing to do with a physical measurement of mechanical speed.", "trick": "Precise beats fancy."}, {"id": "T3-WC-2", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Satellite data revealed that the retreating glacier's volume had <u>plummeted</u> by just 2 percent over the past decade, a far slower rate of loss than scientists had feared.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "collapsed"}, {"letter": "C", "text": "diminished"}, {"letter": "D", "text": "eroded"}], "correctLetter": "C", "explanation": "C is correct: \"diminished\" is a neutral, precise term for a modest decrease and fits the stated \"just 2 percent...slower rate than feared.\" A \"plummeted\" describes a sudden, dramatic drop, which contradicts both the small 2 percent figure and the \"slower rate\" description. B \"collapsed\" implies a sudden structural failure or total breakdown, an alarmingly catastrophic image that doesn't match a gradual, modest 2 percent loss. D \"eroded\" is the wrong domain: erosion describes surface material being worn away by friction or water, not the overall volume of an ice mass shrinking through melt.", "trick": "Precise beats fancy."}, {"id": "T3-WC-3", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "With only three moves left before the tournament clock expired, the grandmaster made a <u>lackadaisical</u> decision to sacrifice her queen \u2014 a move she had calculated for the previous ten minutes.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "impulsive"}, {"letter": "C", "text": "reckless"}, {"letter": "D", "text": "deliberate"}], "correctLetter": "D", "explanation": "D is correct: \"deliberate\" precisely matches \"she had calculated for the previous ten minutes,\" indicating careful, intentional planning. A \"lackadaisical\" means careless or indifferent, the opposite of a move that was calculated in advance. B \"impulsive\" describes a snap decision made without forethought, directly contradicting the stated ten minutes of calculation. C \"reckless\" carries a connotation of careless risk-taking, which misrepresents a move that was the product of deliberate analysis rather than disregard for consequences.", "trick": "Precise beats fancy."}, {"id": "T3-WC-4", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Marine biologists recorded that the reef's coral had <u>abruptly</u> bleached over a period of eighteen months, as ocean temperatures near the reef crept upward by half a degree.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "gradually"}, {"letter": "C", "text": "instantly"}, {"letter": "D", "text": "randomly"}], "correctLetter": "B", "explanation": "B is correct: \"gradually\" matches both the eighteen-month timeframe and the slow half-degree temperature creep described in the sentence. A \"abruptly\" means suddenly, which contradicts a process that unfolded over a year and a half. C \"instantly\" is an even more extreme contradiction of the stated timeline, implying the bleaching happened all at once. D \"randomly\" describes an unpredictable pattern with no direction, but the sentence describes a steady, one-directional trend (temperatures \"crept upward\"), not chaotic variation.", "trick": "Precise beats fancy."}, {"id": "T3-WC-5", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The witness, who had rehearsed her testimony with the attorney for three days beforehand, answered each question in court with a <u>hesitant</u> tone that reflected her careful preparation.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "timid"}, {"letter": "C", "text": "assured"}, {"letter": "D", "text": "spontaneous"}], "correctLetter": "C", "explanation": "C is correct: \"assured\" precisely matches \"careful preparation\" and the three days of rehearsal, describing a confident delivery. A \"hesitant\" implies uncertainty and hedging, which contradicts a tone shaped by thorough preparation. B \"timid\" carries a connotation of fearfulness, an emotional state the sentence never establishes and that clashes with someone who has rehearsed extensively. D \"spontaneous\" means unplanned and improvised, the opposite of testimony that was rehearsed for three days.", "trick": "Precise beats fancy."}, {"id": "T3-WC-6", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "During the twenty-minute inflation, the hot air balloon's envelope <u>shrank</u> until it measured nearly triple the volume it had held at the outset.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "stagnated"}, {"letter": "C", "text": "collapsed"}, {"letter": "D", "text": "swelled"}], "correctLetter": "D", "explanation": "D is correct: \"swelled\" accurately describes an increase in volume, matching \"measured nearly triple the volume it had held at the outset.\" A \"shrank\" means to decrease in size, which directly contradicts the tripled volume that follows it. B \"stagnated\" means to stay the same or stop changing, which cannot be true of something that reached triple its original volume. C \"collapsed\" implies the envelope caved in or deflated, the opposite direction of the growth the sentence describes.", "trick": "Precise beats fancy."}, {"id": "T3-WC-7", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The orbiting telescope's sensors detected a <u>brilliant</u> flicker of light from the distant galaxy, a signal so weak that astronomers needed forty hours of exposure time to confirm it was real.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "faint"}, {"letter": "C", "text": "dazzling"}, {"letter": "D", "text": "sporadic"}], "correctLetter": "B", "explanation": "B is correct: \"faint\" precisely matches \"a signal so weak that astronomers needed forty hours of exposure time,\" describing a dim, hard-to-detect signal. A \"brilliant\" means intensely bright, the opposite of a signal so weak it took forty hours to confirm. C \"dazzling\" is a near-synonym of \"brilliant\" and carries the same contradiction \u2014 an overwhelmingly bright light wouldn't require such extended exposure time to detect. D \"sporadic\" describes how often something occurs, not how bright it is, so it fails to address the sentence's actual claim about the signal's weakness.", "trick": "Precise beats fancy."}, {"id": "T3-WC-8", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Working under a jeweler's loupe for six hours, the horologist made <u>careless</u> adjustments to each of the antique clock's 137 tiny gears.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "swift"}, {"letter": "C", "text": "meticulous"}, {"letter": "D", "text": "casual"}], "correctLetter": "C", "explanation": "C is correct: \"meticulous\" matches the six hours spent working under magnification on each of 137 individual gears, describing painstaking precision. A \"careless\" means lacking attention or caution, contradicting the extreme care implied by working under a loupe for six hours. B \"swift\" describes speed, but six hours spent on 137 tiny gears indicates a slow, careful pace, not quickness. D \"casual\" implies an offhand, unconcerned approach, which contradicts the intense focus required to adjust gears individually under magnification.", "trick": "Precise beats fancy."}, {"id": "T3-WC-9", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "For the memorial concert, the conductor set a <u>jaunty</u> tempo for the funeral march, matching the somber mood the composer's family had requested.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "brisk"}, {"letter": "C", "text": "playful"}, {"letter": "D", "text": "solemn"}], "correctLetter": "D", "explanation": "D is correct: \"solemn\" matches \"the somber mood the composer's family had requested,\" describing a serious, grave tempo appropriate to a funeral march. A \"jaunty\" means lively and cheerful, the opposite of the somber mood the sentence specifies. B \"brisk\" describes a quick, energetic pace, which clashes with the slow, weighty tempo a funeral march calls for. C \"playful\" carries a lighthearted, fun connotation entirely at odds with a memorial service's somber tone.", "trick": "Precise beats fancy."}, {"id": "T3-WC-10", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "After an unusually rainy spring produced record clover blooms, the apiary's hives yielded a <u>meager</u> harvest of 400 pounds of honey \u2014 twice what the beekeeper had collected the previous year.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "abundant"}, {"letter": "C", "text": "adequate"}, {"letter": "D", "text": "sparse"}], "correctLetter": "B", "explanation": "B is correct: \"abundant\" matches \"twice what the beekeeper had collected the previous year\" and the record clover blooms, describing a harvest larger than usual. A \"meager\" means scanty or insufficient, contradicting a harvest that doubled the prior year's total. C \"adequate\" undersells the result \u2014 the sentence describes a harvest that was double the norm, not merely sufficient. D \"sparse\" is a near-synonym of \"meager\" and carries the same contradiction with the stated doubling of the yield.", "trick": "Precise beats fancy."}, {"id": "T3-WC-11", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "As a whiteout obscured the trail markers, the climbers made a <u>reckless</u> descent, testing each foothold with an ice axe before shifting their weight.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "swift"}, {"letter": "C", "text": "cautious"}, {"letter": "D", "text": "impulsive"}], "correctLetter": "C", "explanation": "C is correct: \"cautious\" matches \"testing each foothold with an ice axe before shifting their weight,\" describing careful, deliberate movement. A \"reckless\" means careless of danger, the opposite of a descent where every foothold is tested before committing weight to it. B \"swift\" describes speed, but testing each foothold individually before shifting weight is a slow process, not a fast one. D \"impulsive\" implies acting on sudden urges without forethought, contradicting the deliberate, step-by-step testing the sentence describes.", "trick": "Precise beats fancy."}, {"id": "T3-WC-12", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Buoyed by three consecutive quarters of record earnings, shares of the tech company <u>plunged</u> throughout the trading session, ultimately closing at an all-time high.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "dipped"}, {"letter": "C", "text": "wavered"}, {"letter": "D", "text": "surged"}], "correctLetter": "D", "explanation": "D is correct: \"surged\" matches both \"record earnings\" and \"closing at an all-time high,\" describing a strong, sustained rise. A \"plunged\" means to drop sharply, the opposite direction of a stock that closed at an all-time high. B \"dipped\" is a milder version of the same contradiction \u2014 any decline, large or small, cannot end in a record-high close. C \"wavered\" implies indecisive back-and-forth movement, but a session that closes at an all-time high on record earnings reflects a clear, consistent climb, not uncertain fluctuation.", "trick": "Precise beats fancy."}, {"id": "T3-WC-13", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Over the course of eleven field seasons, the archaeologists took a <u>hasty</u> approach to excavating the tomb, brushing away soil one teaspoon at a time.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "painstaking"}, {"letter": "C", "text": "cursory"}, {"letter": "D", "text": "improvised"}], "correctLetter": "B", "explanation": "B is correct: \"painstaking\" matches both the eleven field seasons and the teaspoon-by-teaspoon method, describing extremely careful, methodical work. A \"hasty\" means rushed and quick, the opposite of a project spanning eleven seasons and measured in teaspoons. C \"cursory\" means superficial or hastily done, contradicting the extreme level of detail described. D \"improvised\" implies an unplanned, spontaneous method, contradicting the sustained, systematic process carried out across more than a decade of field seasons.", "trick": "Precise beats fancy."}, {"id": "T3-WC-14", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "As it moved over unusually warm Gulf waters, the storm <u>weakened</u> from a Category 2 to a Category 4 hurricane within eighteen hours.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "dissipated"}, {"letter": "C", "text": "intensified"}, {"letter": "D", "text": "stabilized"}], "correctLetter": "C", "explanation": "C is correct: \"intensified\" matches the jump \"from a Category 2 to a Category 4 hurricane,\" describing a storm gaining strength. A \"weakened\" means losing strength, the opposite of a storm that rose two full categories. B \"dissipated\" means the storm broke apart or died out, contradicting a storm that grew stronger and reached Category 4. D \"stabilized\" implies no change in strength, contradicting the clear jump in category the sentence describes.", "trick": "Precise beats fancy."}, {"id": "T3-WC-15", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Because the 400-year-old manuscript's pages had grown <u>sturdy</u> and prone to crumbling at the slightest touch, the conservator handled each leaf with cotton gloves and a soft-bristled brush.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "flexible"}, {"letter": "C", "text": "resilient"}, {"letter": "D", "text": "brittle"}], "correctLetter": "D", "explanation": "D is correct: \"brittle\" precisely matches \"prone to crumbling at the slightest touch,\" describing material that breaks apart easily. A \"sturdy\" means strong and durable, directly contradicting pages that crumble at the slightest touch. B \"flexible\" means able to bend without breaking, which also contradicts crumbling, since crumbling material typically cannot bend at all. C \"resilient\" means able to withstand damage and recover, the opposite quality of pages that crumble under the lightest touch.", "trick": "Precise beats fancy."}, {"id": "T3-WC-16", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The physical therapist diagnosed the typist's wrist pain as an <u>acute</u> injury, noting that the discomfort had been building gradually over eight months of repetitive keyboard use.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "chronic"}, {"letter": "C", "text": "temporary"}, {"letter": "D", "text": "minor"}], "correctLetter": "B", "explanation": "B is correct: \"chronic\" precisely describes an injury that \"had been building gradually over eight months,\" matching a long-developing condition rather than a sudden one. A \"acute\" describes a sudden-onset injury, contradicting a condition that built up gradually over eight months. C \"temporary\" implies the injury would resolve quickly on its own, which the sentence never establishes and which understates an eight-month-long developing condition. D \"minor\" addresses severity, not how the injury developed over time, so it fails to answer what the sentence is actually describing.", "trick": "Precise beats fancy."}, {"id": "T3-WC-17", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The critic praised the curry as remarkably <u>bland</u>, noting that a single bite delivered three distinct waves of chili heat.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "subtle"}, {"letter": "C", "text": "fiery"}, {"letter": "D", "text": "sweet"}], "correctLetter": "C", "explanation": "C is correct: \"fiery\" matches \"three distinct waves of chili heat,\" describing an intensely spicy dish. A \"bland\" means lacking flavor or spice, the opposite of a curry delivering multiple waves of chili heat. B \"subtle\" implies mild, understated flavor, contradicting the described intensity of three distinct heat waves. D \"sweet\" describes an entirely different flavor profile that has nothing to do with the chili heat the sentence specifies.", "trick": "Precise beats fancy."}, {"id": "T3-WC-18", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "The research submersible made a <u>shallow</u> dive, descending 3,800 meters to survey hydrothermal vents on the ocean floor.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "brief"}, {"letter": "C", "text": "gradual"}, {"letter": "D", "text": "deep"}], "correctLetter": "D", "explanation": "D is correct: \"deep\" precisely matches the stated descent of \"3,800 meters,\" an extreme depth. A \"shallow\" means not deep, directly contradicting a descent of 3,800 meters. B \"brief\" describes duration, not depth, so it fails to characterize how far down the submersible traveled. C \"gradual\" describes the rate of descent, not the final depth reached, so it likewise doesn't address the 3,800-meter figure the sentence provides.", "trick": "Precise beats fancy."}, {"id": "T3-WC-19", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Despite having carried loaded ox carts across the gorge for over 600 years without a single repair, the ancient stone bridge was judged by the young engineer to be <u>flimsy</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sturdy"}, {"letter": "C", "text": "elegant"}, {"letter": "D", "text": "temporary"}], "correctLetter": "B", "explanation": "B is correct: \"sturdy\" matches \"carried loaded ox carts...for over 600 years without a single repair,\" describing exceptional structural strength. A \"flimsy\" means weak and easily broken, contradicting a structure that has borne heavy loads for six centuries without repair. C \"elegant\" describes visual style, not structural strength, so it doesn't address the durability the sentence actually demonstrates. D \"temporary\" means short-lived or not meant to last, the opposite of a bridge that has stood and functioned for over 600 years.", "trick": "Precise beats fancy."}, {"id": "T3-WC-20", "concept": "Word Choice & Precision", "subtype": "Word Choice & Precision", "passage": "Because the wine had rested in oak barrels for only six weeks before bottling, connoisseurs immediately recognized its <u>aged</u> character.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "mellow"}, {"letter": "C", "text": "youthful"}, {"letter": "D", "text": "robust"}], "correctLetter": "C", "explanation": "C is correct: \"youthful\" matches \"rested in oak barrels for only six weeks,\" describing a wine that has not had much time to develop complexity. A \"aged\" implies long maturation, contradicting a wine that spent just six weeks in the barrel. B \"mellow\" describes the smoothness that typically comes from extended aging, a quality a six-week barrel rest would not have had time to produce. D \"robust\" describes body or intensity, not aging duration, so it fails to address the short six-week timeframe the sentence specifies.", "trick": "Precise beats fancy."}, {"id": "T3-ST-1", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Astronomers have identified thousands of exoplanets since the launch of the Kepler Space Telescope, each new discovery refining our understanding of planetary formation. Researchers analyzing the latest data set were <u>totally stoked to find such a wild result</u>, noting that the planet's atmosphere contained unexpected chemical signatures.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "genuinely surprised by such an unusual result"}, {"letter": "C", "text": "thrilled beyond all measure at the wondrous result"}, {"letter": "D", "text": "pretty psyched about such a crazy find"}], "correctLetter": "B", "explanation": "B is correct: \"genuinely surprised by such an unusual result\" matches the formal academic register established by \"Astronomers have identified thousands of exoplanets\" and \"refining our understanding of planetary formation.\" A \"totally stoked to find such a wild result\" is jarringly slangy. D \"pretty psyched about such a crazy find\" is equally casual slang. C \"thrilled beyond all measure at the wondrous result\" is overwrought, purple prose that is too elaborate for a plain research summary.", "trick": "Match the essay's volume."}, {"id": "T3-ST-2", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Man, learning to ollie is no joke \u2014 you basically have to snap the board just right or you'll totally eat it. Beginners often <u>sustain minor abrasions subsequent to loss of balance</u> before they get the hang of it.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "incur superficial dermal lacerations following equilibrium loss"}, {"letter": "C", "text": "scrape themselves up when they lose their balance"}, {"letter": "D", "text": "wipe out and get totally wrecked"}], "correctLetter": "C", "explanation": "C is correct: \"scrape themselves up when they lose their balance\" matches the casual, conversational tone set by \"Man,\" \"no joke,\" and \"totally eat it.\" A \"sustain minor abrasions subsequent to loss of balance\" is stiff, clinical medical phrasing. B is even more clinical and formal. D \"wipe out and get totally wrecked\" overshoots into exaggerated slang beyond the passage's plain casual voice.", "trick": "Match the essay's volume."}, {"id": "T3-ST-3", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Coral reefs support roughly a quarter of all marine species despite covering less than one percent of the ocean floor, making their conservation a global priority. Rising sea temperatures have <u>totally messed up</u> reef ecosystems in recent decades.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "thrown a massive wrench into"}, {"letter": "C", "text": "wreaked untold devastation upon"}, {"letter": "D", "text": "significantly disrupted"}], "correctLetter": "D", "explanation": "D is correct: \"significantly disrupted\" matches the formal tone established by \"a global priority\" and \"marine species.\" A \"totally messed up\" is casual slang. B \"thrown a massive wrench into\" is an equally informal idiom. C \"wreaked untold devastation upon\" is overwrought, overly dramatic language for a measured scientific claim.", "trick": "Match the essay's volume."}, {"id": "T3-ST-4", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Okay, so if you've never made sourdough before, just know it's basically a whole science experiment living on your counter. You have to <u>monitor the fermentation process with consistent temporal regularity</u> or the starter won't rise.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "check on it around the same time every day"}, {"letter": "C", "text": "conduct periodic observational assessments of its developmental progress"}, {"letter": "D", "text": "babysit that bubbly little guy like your life depends on it"}], "correctLetter": "B", "explanation": "B is correct: \"check on it around the same time every day\" matches the relaxed tone set by \"Okay, so\" and \"basically a whole science experiment.\" A \"monitor the fermentation process with consistent temporal regularity\" is stiff scientific jargon. C is even more clinical and formal. D \"babysit that bubbly little guy like your life depends on it\" is exaggerated, over-the-top phrasing beyond the passage's plain conversational voice.", "trick": "Match the essay's volume."}, {"id": "T3-ST-5", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Effective urban planning requires balancing housing density with adequate green space to maintain residents' quality of life. City officials who ignore this balance often end up with neighborhoods that <u>are a total nightmare to live in</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "are pretty much the worst places ever"}, {"letter": "C", "text": "fail to meet residents' basic needs"}, {"letter": "D", "text": "descend into an irredeemable urban blight"}], "correctLetter": "C", "explanation": "C is correct: \"fail to meet residents' basic needs\" matches the formal register set by \"Effective urban planning requires\" and \"adequate green space.\" A \"are a total nightmare to live in\" is casual slang. B \"are pretty much the worst places ever\" is equally casual. D \"descend into an irredeemable urban blight\" is overwrought and dramatically overstated for a measured planning discussion.", "trick": "Match the essay's volume."}, {"id": "T3-ST-6", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "So speedrunning is this whole subculture where people try to beat games as fast as humanly possible, glitches and all. Some runners <u>dedicate substantial temporal resources to the optimization of frame-perfect inputs</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "allocate considerable durations toward input refinement procedures"}, {"letter": "C", "text": "invest extensive hours in the calibration of precise timing sequences"}, {"letter": "D", "text": "spend hours nailing those frame-perfect inputs"}], "correctLetter": "D", "explanation": "D is correct: \"spend hours nailing those frame-perfect inputs\" matches the casual tone set by \"So speedrunning is this whole subculture\" and \"glitches and all.\" A \"dedicate substantial temporal resources to the optimization of frame-perfect inputs\" is dense academic jargon. B is similarly stilted and formal. C is likewise overly technical and clinical, clashing with the breezy introduction.", "trick": "Match the essay's volume."}, {"id": "T3-ST-7", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Excavations at Pompeii have yielded remarkably preserved artifacts due to the volcanic ash that entombed the city in 79 CE. Archaeologists studying the plaster casts of victims were <u>super freaked out by how real they looked</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "struck by how lifelike the casts appeared"}, {"letter": "C", "text": "plunged into an unshakable existential dread"}, {"letter": "D", "text": "kind of weirded out, not gonna lie"}], "correctLetter": "B", "explanation": "B is correct: \"struck by how lifelike the casts appeared\" matches the formal register of \"remarkably preserved artifacts\" and \"entombed the city.\" A \"super freaked out by how real they looked\" is casual slang. D \"kind of weirded out, not gonna lie\" is equally casual, with an added conversational aside. C \"plunged into an unshakable existential dread\" is overwrought, far too dramatic for a factual archaeological account.", "trick": "Match the essay's volume."}, {"id": "T3-ST-8", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Growing tomatoes in containers is honestly way easier than people think, even if you've got a black thumb like me. Just make sure the pot has holes so water can <u>undergo adequate drainage to prevent root saturation</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "properly effectuate the drainage of surplus moisture"}, {"letter": "C", "text": "actually drain out and not drown the roots"}, {"letter": "D", "text": "dramatically flee the soil before it turns into a swamp"}], "correctLetter": "C", "explanation": "C is correct: \"actually drain out and not drown the roots\" matches the casual, plainspoken tone set by \"honestly\" and \"even if you've got a black thumb like me.\" A \"undergo adequate drainage to prevent root saturation\" is stiff technical phrasing. B is even more formal and clinical. D \"dramatically flee the soil before it turns into a swamp\" is exaggerated, overwrought imagery that overshoots the passage's easygoing style.", "trick": "Match the essay's volume."}, {"id": "T3-ST-9", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Global supply chains have grown increasingly interconnected since the expansion of container shipping in the mid-twentieth century. A disruption at a single port can <u>throw a huge wrench into everything</u> downstream.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "totally mess with the whole system"}, {"letter": "C", "text": "unleash a catastrophic cascade of unprecedented ruin"}, {"letter": "D", "text": "cause significant delays"}], "correctLetter": "D", "explanation": "D is correct: \"cause significant delays\" matches the formal register established by \"increasingly interconnected\" and \"expansion of container shipping.\" A \"throw a huge wrench into everything\" is a casual idiom. B \"totally mess with the whole system\" is equally casual. C \"unleash a catastrophic cascade of unprecedented ruin\" is overwrought, far more dramatic than a factual account of logistics warrants.", "trick": "Match the essay's volume."}, {"id": "T3-ST-10", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "We packed way too much stuff for a three-day road trip, but honestly that's half the fun. By hour six, everyone in the car needed to <u>egress the vehicle and ambulate for a period of time</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "get out and stretch their legs"}, {"letter": "C", "text": "disembark the conveyance and engage in perambulation"}, {"letter": "D", "text": "exit the automobile in order to facilitate lower-limb circulation"}], "correctLetter": "B", "explanation": "B is correct: \"get out and stretch their legs\" matches the casual, breezy tone from \"way too much stuff\" and \"honestly.\" A \"egress the vehicle and ambulate for a period of time\" is stiff, clinical phrasing. C \"disembark the conveyance and engage in perambulation\" is even more absurdly formal. D is similarly stilted technical language, out of place in a casual travel story.", "trick": "Match the essay's volume."}, {"id": "T3-ST-11", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Neuroscientists have long debated how short-term memories are consolidated into long-term storage within the hippocampus. Sleep deprivation studies have <u>shown some pretty gnarly effects</u> on this process.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "revealed some wild and messed-up effects"}, {"letter": "C", "text": "revealed significant effects"}, {"letter": "D", "text": "unleashed a harrowing cascade of cognitive ruin"}], "correctLetter": "C", "explanation": "C is correct: \"revealed significant effects\" matches the academic tone from \"Neuroscientists have long debated\" and \"consolidated into long-term storage.\" A \"shown some pretty gnarly effects\" is slang. B \"revealed some wild and messed-up effects\" is equally slangy. D \"unleashed a harrowing cascade of cognitive ruin\" is overwrought, sensationalized language unfit for a scientific summary.", "trick": "Match the essay's volume."}, {"id": "T3-ST-12", "concept": "Style & Tone", "subtype": "Style & Tone Consistency", "passage": "Training a puppy is basically a marathon of treats, patience, and cleaning up accidents. When your dog finally sits on command, you should <u>administer positive reinforcement in the form of a food reward</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"} ding/Deleting Sentences", "passage": "In a traditional affinage cave, a fresh wheel of cheese begins its transformation into a fully aged product. Cave workers, known as affineurs, regularly turn each wheel by hand to ensure the rind develops evenly on all sides. The naturally humid, cool air of the cave encourages beneficial molds and bacteria to form a protective rind. Affineurs periodically tap each wheel and listen for subtle changes in sound that indicate how the interior is developing. After weeks or months, a wheel is only released for sale once an affineur tastes a small sample and judges it ready.", "question": "The writer is considering adding the following true sentence to the paragraph: 'Cheese has been produced by humans for thousands of years, with some archaeological evidence dating the practice back over 7,000 years.' Should the writer make this addition?", "choices": [{"letter": "A", "text": "Yes, because it shows how long humans have valued cheese as a food."}, {"letter": "B", "text": "No, because the paragraph describes the specific steps of aging a wheel of cheese in a cave, not the overall history of cheesemaking."}, {"letter": "C", "text": "Yes, because readers should understand the deep history behind any food-related process."}, {"letter": "D", "text": "No, because archaeologists have found no evidence that cheese production is an ancient practice."}], "correctLetter": "B", "explanation": "B is correct: the paragraph's specific job is walking through the affinage process step by step, and a fact about cheesemaking's ancient origins doesn't advance that description, even though it's true. A is wrong because showing cheese's long history isn't the paragraph's purpose, which is explaining how this wheel is aged. C is wrong because it overstates a rule that any process paragraph needs deep historical background. D is wrong because archaeological evidence for ancient cheesemaking does exist, so this factual claim is inaccurate.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "T3-OD-3", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Marine biologists working to restore damaged coral reefs begin by collecting small fragments from healthy coral colonies. These fragments are carefully attached to underwater frames, often called coral trees, where they can grow in a controlled nursery environment. Divers visit the nursery every few weeks to clean algae off the fragments and check for signs of disease. Once a fragment has grown large enough, divers transplant it directly onto a damaged section of the natural reef using marine epoxy. Researchers then monitor the transplanted coral for months to track its survival and growth.", "question": "The writer is considering adding the following true sentence to the paragraph: 'Coral reefs cover less than one percent of the ocean floor but support roughly a quarter of all marine species.' Should the writer make this addition?", "choices": [{"letter": "A", "text": "Yes, because it demonstrates why coral reefs are important to protect."}, {"letter": "B", "text": "Yes, because any statistic about coral reefs strengthens a paragraph about coral restoration."}, {"letter": "C", "text": "No, because the paragraph describes the specific steps restoration workers take to grow and transplant coral, not the broader ecological importance of reefs."}, {"letter": "D", "text": "No, because this statistic about marine biodiversity is inaccurate."}], "correctLetter": "C", "explanation": "C is correct: the paragraph's specific job is detailing the nursery-to-transplant restoration process, and a statistic about reefs' overall ecological footprint doesn't advance that process description, even though it's true. A is wrong because establishing general importance isn't this paragraph's job; it's explaining the restoration method. B is wrong because it states an overly broad, false rule that any coral statistic belongs here. D is wrong because the reef-biodiversity statistic is a commonly cited, accurate figure, so this factual claim is inaccurate.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "T3-OD-4", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "Engineers designing solar panels for compact satellites have turned to origami-inspired folding patterns to solve a persistent problem: how to pack a large panel into a small rocket fairing. Using a fold known as the Miura-ori pattern, engineers create a grid of parallelogram creases that allow the panel to collapse flat and unfold in a single smooth motion. Prototypes are tested by folding and unfolding them thousands of times to make sure the creases do not weaken or crack over time. Once unfolded in orbit, the array must lock rigidly into place so it does not vibrate and disrupt the satellite's other instruments.", "question": "The writer is considering adding the following true sentence to the paragraph: 'Origami, the traditional Japanese art of paper folding, dates back several centuries and includes thousands of distinct folding patterns.' Should the writer make this addition?", "choices": [{"letter": "A", "text": "Yes, because it explains the artistic tradition that inspired the engineering solution."}, {"letter": "B", "text": "Yes, because readers need general background on origami before they can understand any origami-inspired design."}, {"letter": "C", "text": "No, because Miura-ori folding is a Western invention unrelated to Japanese paper-folding traditions."}, {"letter": "D", "text": "No, because the paragraph focuses on the specific engineering process of folding and testing satellite solar panels, not the general history of origami as an art form."}], "correctLetter": "D", "explanation": "D is correct: the paragraph's specific job is explaining how engineers design, fold, and test satellite solar arrays, and a fact about origami's general history and variety doesn't advance that engineering description, even though it's true. A is wrong because explaining the artistic tradition isn't necessary to this paragraph's engineering focus. B is wrong because it overstates a rule that general background is always required. C is wrong because the Miura-ori pattern was developed by a Japanese scientist and is connected to paper-folding traditions, so this factual claim is inaccurate.", "trick": "True isn't enough \u2014 it has to be relevant to this paragraph's specific job."}, {"id": "T3-OD-5", "concept": "Organization & Development", "subtype": "Relevance: Adding/Deleting Sentences", "passage": "At the Elm Street community garden, each participating family is assigned a ten-by-ten-foot plot at the start of the growing season. A shared toolshed stocked with shovels, hoses, and wheelbarrows saves members from having to buy their own equipment. Every Saturday morning, volunteers take turns weeding the garden's common pathways and maintaining the compost bins. When plots produce more than a family can use, the extra vegetables are placed on a community table for anyone in the neighborhood to take.", "question": "The writer is considering adding the following true sentence to the paragraph: 'Gardening as a hobby has grown increasingly popular in recent years, with millions of households now maintaining some form of home garden.' Should the writer make this addition?", "choices": [{"letter": "A", "text": "No, because the paragraph describes how this specific community garden operates day to day, not the broader popularity of home gardening."}, {"letter": "B", "text": "Yes, because it shows that gardening is a widely shared interest."}, {"letter": "C", "text": "Yes, because background on gardening's popularity is necessary to understand any garden-related paragraph."}, {"letter": "D", "text": "No, because gardening has not actually grown in popularit const CONCEPT_GROUPS = [
  { group: "Conventions of Standard English", concepts: ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"] },
  { group: "Knowledge of Language", concepts: ["Word Choice & Precision", "Style & Tone", "Concision & Redundancy"] },
  { group: "Production of Writing", concepts: ["Organization & Development", "Transitions"] },
];
const WEAK_CONCEPTS = ["Grammar & Usage", "Punctuation", "Sentence Structure & Formation"];

let selectedConcepts = new Set(WEAK_CONCEPTS);
let pool = [];        // shuffled queue of question objects for current session
let usedIds = [];      // ids shown this session (for summary + avoiding immediate repeats)
let current = null;
let answered = false;
let sessionLog = [];   // {concept, correct}
let reshuffleCount = 0;

function checkPasscode() {
  const val = document.getElementById('pwInput').value.trim();
  if (val.toUpperCase() === PASSCODE) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderCheckboxes();
    setSyncStatusUI();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect passcode.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPasscode(); });

function countFor(concept) {
  return ALL_QUESTIONS.filter(q => q.concept === concept).length;
}

function renderCheckboxes() {
  const container = document.getElementById('checkboxList');
  container.innerHTML = '';
  CONCEPT_GROUPS.forEach(g => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.group;
    container.appendChild(title);
    g.concepts.forEach(c => {
      const label = document.createElement('label');
      label.className = 'chk';
      const checked = selectedConcepts.has(c) ? 'checked' : '';
      label.innerHTML = `<input type="checkbox" data-concept="${c}" ${checked}> ${c} <span class="count">${countFor(c)} q</span>`;
      label.querySelector('input').addEventListener('change', onCheckboxChange);
      container.appendChild(label);
    });
  });
  updateSelCount();
}

function onCheckboxChange(e) {
  const c = e.target.getAttribute('data-concept');
  if (e.target.checked) selectedConcepts.add(c); else selectedConcepts.delete(c);
  updateSelCount();
}

function selectPreset(kind) {
  if (kind === 'weak') selectedConcepts = new Set(WEAK_CONCEPTS);
  if (kind === 'all') selectedConcepts = new Set(CONCEPT_GROUPS.flatMap(g => g.concepts));
  if (kind === 'none') selectedConcepts = new Set();
  renderCheckboxes();
}

function updateSelCount() {
  const total = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept)).length;
  document.getElementById('selCount').textContent = selectedConcepts.size === 0
    ? 'Select at least one concept to begin.'
    : `${total} question${total===1?'':'s'} available in the selected concepts.`;
  document.getElementById('startBtn').disabled = total === 0;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool() {
  const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
  pool = shuffle(filtered);
}

function startQuiz() {
  buildPool();
  usedIds = [];
  sessionLog = [];
  reshuffleCount = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextQuestion();
}

function restartSameFilters() {
  document.getElementById('summary').style.display = 'none';
  startQuiz();
}

function backToSetup() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderCheckboxes();
}

function nextQuestion() {
  let banner = '';
  if (pool.length === 0) {
    const filtered = ALL_QUESTIONS.filter(q => selectedConcepts.has(q.concept));
    pool = shuffle(filtered);
    reshuffleCount++;
    banner = `<div class="banner">You've been through every question in this set — reshuffling and starting again from the top.</div>`;
  }
  current = pool.pop();
  usedIds.push(current.id);
  answered = false;
  renderQuestion(banner);
  updateTopbar();
}

function updateTopbar() {
  document.getElementById('progressTag').textContent = `Question ${usedIds.length}${reshuffleCount>0 ? ' (round ' + (reshuffleCount+1) + ')' : ''}`;
  const correct = sessionLog.filter(s => s.correct).length;
  document.getElementById('scoreText').textContent = `${correct}/${sessionLog.length}`;
}

function renderQuestion(bannerHtml) {
  const q = current;
  const choicesHtml = q.choices.map(c => `
    <button class="choice" data-letter="${c.letter}" onclick="selectChoice('${c.letter}')">
      <span class="ltr">${c.letter}</span>${escapeHtml(c.text)}
    </button>
  `).join('');
  document.getElementById('qBody').innerHTML = `
    ${bannerHtml || ''}
    <div class="concept-chip">${q.concept} · ${q.subtype}</div>
    <div class="passage">${q.passage}</div>
    <div class="qstem">${escapeHtml(q.question)}</div>
    <div id="choicesArea">${choicesHtml}</div>
    <div id="feedbackArea"></div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectChoice(letter) {
  if (answered) return;
  answered = true;
  const q = current;
  const isCorrect = letter === q.correctLetter;
  sessionLog.push({ concept: q.concept, correct: isCorrect });
  logAttempt(q, letter, isCorrect);

  document.querySelectorAll('#choicesArea .choice').forEach(btn => {
    btn.classList.add('disabled');
    btn.onclick = null;
    const l = btn.getAttribute('data-letter');
    if (l === q.correctLetter) btn.classList.add('correct');
    else if (l === letter) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="verdict ${isCorrect ? 'good' : 'bad'}">${isCorrect ? 'Correct!' : 'Not quite — correct answer: ' + q.correctLetter}</div>
      <div class="explain">${escapeHtml(q.explanation)}</div>
      <div class="trick"><b>Rule / Memory Trick:</b> ${escapeHtml(q.trick)}</div>
    </div>
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
  `;
  updateTopbar();
}

function endSession() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  renderSummary();
}

function renderSummary() {
  const total = sessionLog.length;
  const correct = sessionLog.filter(s => s.correct).length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  document.getElementById('sumBig').textContent = total ? pct + '%' : '—';
  document.getElementById('sumSub').textContent = `${correct} of ${total} correct this session`;

  const byConcept = {};
  sessionLog.forEach(s => {
    byConcept[s.concept] = byConcept[s.concept] || { n: 0, c: 0 };
    byConcept[s.concept].n++;
    if (s.correct) byConcept[s.concept].c++;
  });
  const rows = Object.keys(byConcept).sort((a,b) => (byConcept[a].c/byConcept[a].n) - (byConcept[b].c/byConcept[b].n));
  const container = document.getElementById('sumCats');
  if (rows.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;">No questions answered yet.</p>';
    return;
  }
  container.innerHTML = rows.map(c => {
    const { n, c: correctN } = byConcept[c];
    const p = Math.round((correctN/n)*100);
    return `<div class="cat-row">
      <span>${c}</span>
      <div class="bar-wrap"><div class="bar" style="width:${p}%"></div></div>
      <span class="pct">${correctN}/${n}</span>
    </div>`;
  }).join('');
}
</script>
