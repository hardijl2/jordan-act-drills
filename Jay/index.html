<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad's ACT English Drills</title>
<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #14344f;
    --green: #1a7f4e;
    --red: #b3261e;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d9e0e8;
    --text: #1c2733;
    --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  .syncStatus { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 4px 0 0; }
  .syncStatus.ok { color: var(--green); }
  .syncStatus.bad { color: var(--red); }
  header { padding: 20px 4px 8px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }

  /* --- Gate --- */
  #gate { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  #gate .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 10px rgba(20,52,79,0.08); }
  #gate h2 { margin: 0 0 12px; color: var(--navy-dark); font-size: 1.15rem; }
  #gate input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  #gate button, .btn-primary { background: var(--navy); color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  #gate button:active, .btn-primary:active { background: var(--navy-dark); }
  #gate .err { color: var(--red); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }

  /* --- Setup panel --- */
  #app { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--navy-dark); }
  .group-title { font-weight: 600; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .group-title:first-child { margin-top: 0; }
  label.chk { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 0.98rem; }
  label.chk:active { background: var(--bg); }
  label.chk input { width: 18px; height: 18px; accent-color: var(--navy); flex-shrink: 0; }
  label.chk .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
  .quick-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .quick-btns button { flex: 1; min-width: 110px; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 9px 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .quick-btns button:active { background: #dbe6f2; }
  .start-row { margin-top: 16px; }
  #startBtn { font-size: 1.05rem; padding: 14px; font-weight: 600; }
  #startBtn:disabled { background: #a9b7c4; cursor: not-allowed; }
  .selCount { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  /* --- Quiz --- */
  #quiz { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .topbar .tag { background: #eaf0f7; color: var(--navy-dark); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .score-panel { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
  .score-panel b { color: var(--navy-dark); }
  .passage { background: #fbfbfd; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 1rem; line-height: 1.6; margin-bottom: 14px; white-space: pre-wrap; }
  .passage u { text-decoration: underline; text-decoration-color: var(--navy); text-decoration-thickness: 2px; }
  .qstem { font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .choice { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; font-size: 0.97rem; cursor: pointer; line-height: 1.4; }
  .choice:active { background: var(--bg); }
  .choice .ltr { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--bg); color: var(--navy-dark); font-weight: 700; font-size: 0.8rem; margin-right: 10px; }
  .choice.correct { border-color: var(--green); background: #eaf7ef; }
  .choice.correct .ltr { background: var(--green); color: #fff; }
  .choice.incorrect { border-color: var(--red); background: #fbeceb; }
  .choice.incorrect .ltr { background: var(--red); color: #fff; }
  .choice.disabled { cursor: default; }
  .choice.dim { opacity: 0.55; }
  .feedback { margin-top: 14px; padding: 14px; border-radius: 10px; }
  .feedback.good { background: #eaf7ef; border: 1px solid #bfe3cc; }
  .feedback.bad { background: #fbeceb; border: 1px solid #f0c6c3; }
  .feedback .verdict { font-weight: 700; margin-bottom: 6px; }
  .feedback .verdict.good { color: var(--green); }
  .feedback .verdict.bad { color: var(--red); }
  .feedback .explain { font-size: 0.93rem; line-height: 1.5; margin-bottom: 10px; }
  .feedback .trick { background: #fff; border-left: 3px solid var(--navy); border-radius: 6px; padding: 10px 12px; font-size: 0.9rem; line-height: 1.5; }
  .feedback .trick b { color: var(--navy-dark); }
  #nextBtn { margin-top: 14px; }
  .concept-chip { display:inline-block; background:#eaf0f7; color:var(--navy-dark); font-size:0.72rem; font-weight:600; padding:3px 9px; border-radius:999px; margin-bottom:10px; }

  .footer-nav { display: flex; gap: 10px; margin-top: 4px; }
  .footer-nav button { flex: 1; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; }

  .banner { background: #fff7e0; border: 1px solid #f0dfa0; color: #7a5b00; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }

  /* --- Summary --- */
  #summary { display: none; }
  .summary-score { text-align: center; padding: 10px 0 18px; }
  .summary-score .big { font-size: 2.4rem; font-weight: 700; color: var(--navy-dark); }
  .summary-score .sub { color: var(--muted); font-size: 0.9rem; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .bar-wrap { flex: 1; margin: 0 10px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-row .bar { height: 100%; background: var(--navy); }
  .cat-row .pct { width: 46px; text-align: right; color: var(--muted); }

  @media (max-width: 400px) {
    .quick-btns button { min-width: 90px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Dad's ACT English Drills</h2>
    <input id="pwInput" type="password" placeholder="Enter passcode" autocomplete="off">
    <button onclick="checkPasscode()">Enter</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <h1>Dad's ACT English Drills</h1>
    <p>Pick the concepts to focus on, then start drilling. No repeats within a set.</p>
  </header>

  <div class="card" id="setup">
    <h2>Choose concepts</h2>
    <div class="quick-btns">
      <button onclick="selectPreset('weak')">Focus: Weak Areas</button>
      <button onclick="selectPreset('all')">Select All</button>
      <button onclick="selectPreset('none')">Clear All</button>
    </div>
    <div id="checkboxList"></div>
    <div class="selCount" id="selCount"></div>
    <div class="start-row">
      <button id="startBtn" class="btn-primary" onclick="startQuiz()" disabled>Start Drilling</button>
    </div>
  </div>

  <div id="quiz">
    <div class="topbar">
      <span class="tag" id="progressTag"></span>
      <div class="score-panel">
        <span>Session: <b id="scoreText">0/0</b></span>
      </div>
    </div>
    <div class="card">
      <div id="qBody"></div>
    </div>
    <div class="footer-nav">
      <button onclick="endSession()">End &amp; See Summary</button>
      <button onclick="backToSetup()">Change Concepts</button>
    </div>
  </div>

  <div id="summary">
    <div class="card">
      <h2>Session Summary</h2>
      <div class="summary-score">
        <div class="big" id="sumBig">0%</div>
        <div class="sub" id="sumSub">0 of 0 correct</div>
      </div>
      <div id="sumCats"></div>
    </div>
    <div class="footer-nav">
      <button onclick="backToSetup()">Choose New Concepts</button>
      <button onclick="restartSameFilters()">Drill Again (Same Concepts)</button>
    </div>
  </div>
  <div class="syncStatus" id="syncStatus"></div>
</div>

<!-- Firebase (compat SDK) — used only to log answered questions for the dashboard.
     If FIREBASE_CONFIG below still has placeholder values, sync is silently disabled and the
     app works exactly as before (nothing here can break the quiz itself). -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {"apiKey": "AIzaSyAUJp7K6uChE69XE0W7rWs2l8EPtzi036A", "authDomain": "jordan-act-drills.firebaseapp.com", "projectId": "jordan-act-drills", "storageBucket": "jordan-act-drills.firebasestorage.app", "messagingSenderId": "1016838779694", "appId": "1:1016838779694:web:929aaef91b54315bca80bf"};
const FIREBASE_CONFIGURED = true;
const ATTEMPTS_COLLECTION = "attempts_jay";

let db = null;
let syncOk = false;
if (FIREBASE_CONFIGURED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    syncOk = true;
  } catch (e) {
    console.warn('Firebase init failed, continuing offline:', e);
    syncOk = false;
  }
}

function setSyncStatusUI() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (!FIREBASE_CONFIGURED) {
    el.textContent = '';
    return;
  }
  el.textContent = syncOk ? '● Progress syncing to dashboard' : '○ Progress not syncing (offline or not set up)';
  el.className = 'syncStatus ' + (syncOk ? 'ok' : 'bad');
}

// A random id shared by every attempt logged during this one sitting, so the
// dashboard can group answers back into sessions.
const SESSION_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('s_' + Date.now() + '_' + Math.random().toString(36).slice(2));

// Logs a full snapshot of the question (not just its id) alongside the
// attempt, so the dashboard's "Questions Missed" detail view keeps working
// for this attempt even after a future question-bank refresh replaces or
// removes this exact question. Firestore Security Rules (firestore.rules)
// require these fields to be present on every new attempt doc.
function logAttempt(q, chosenLetter, isCorrect) {
  if (!syncOk || !db) return;
  db.collection(ATTEMPTS_COLLECTION).add({
    ts: firebase.firestore.FieldValue.serverTimestamp(),
    sessionId: SESSION_ID,
    questionId: q.id,
    concept: q.concept,
    subtype: q.subtype,
    chosenLetter: chosenLetter,
    correct: !!isCorrect,
    passage: q.passage,
    question: q.question,
    choices: q.choices,
    correctLetter: q.correctLetter,
    explanation: q.explanation,
    trick: q.trick,
  }).catch(e => {
    console.warn('Attempt logging failed (continuing offline):', e);
    syncOk = false;
    setSyncStatusUI();
  });
}

ctive the following Monday.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "me"}, {"letter": "C", "text": "myself"}, {"letter": "D", "text": "we"}], "correctLetter": "B", "explanation": "B is correct: the pronoun is the object of the preposition 'to,' so the object pronoun 'me' is needed. A 'I' is a subject pronoun and cannot serve as an object. C 'myself' is a reflexive pronoun with no matching 'I' in the clause for it to reflect back to. D 'we' is a subject pronoun and cannot serve as an object.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "T3-GU-14", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "Between you and <u>he</u>, the cooperative's new apiary produced twice as much honey as expected.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "himself"}, {"letter": "C", "text": "him"}, {"letter": "D", "text": "they"}], "correctLetter": "C", "explanation": "C is correct: the pronoun is the object of the preposition 'between,' so the object pronoun 'him' is needed. A 'he' is a subject pronoun and cannot serve as an object. B 'himself' is a reflexive pronoun with no matching subject for it to reflect back to. D 'they' is a subject pronoun and cannot serve as an object.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "T3-GU-15", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "<u>She</u> and her research partner tagged eleven sharks during the two-week expedition.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Her"}, {"letter": "C", "text": "Herself"}, {"letter": "D", "text": "Them"}], "correctLette back to. C 'I' is a subject pronoun and cannot serve as an object. D 'we' is a subject pronoun and cannot serve as an object.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "T3-GU-18", "concept": "Grammar & Usage", "subtype": "Pronoun Case", "passage": "<u>Us</u> residents attended the ribbon-cutting ceremony for the redesigned plaza last spring.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Ourselves"}, {"letter": "C", "text": "We"}, {"letter": "D", "text": "Them"}], "correctLetter": "C", "explanation": "C is correct: the pronoun is part of the subject performing the action 'attended,' so the subject pronoun 'We' is needed. A 'Us' is an object pronoun and cannot serve as a subject. B 'Ourselves' is a reflexive pronoun with no matching subject to reflect back to. D 'Them' is an object pronoun and also mismatched in person.", "trick": "Say it out loud in the simplest form \u2014 your ear usually knows."}, {"id": "T3-GU-19", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time the falcon returned to the glove, the trainer <u>had already reset</u> the perch for the next flight.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "already resets"}, {"letter": "C", "text": "will already reset"}, {"letter": "D", "text": "already resetting"}], "correctLetter": "A", "explanation": "A is correct: the anchor verb 'returned' establishes a past timeframe, and since the resetting happened even earlier, the past perfect 'had already reset' is already correct. B 'already resets' is present tense and doesn't fit the established past timeframe. C 'will already reset' is future tense and doesn't fit the established past timeframe. D 'already resetting' has no finite verb, leaving the clause without a main verb.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-20", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Every batch of ale ferments for two weeks before the brewery owner <u>bottled</u> it and ships it to local taverns.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "bottling"}, {"letter": "C", "text": "will bottle"}, {"letter": "D", "text": "bottles"}], "correctLetter": "D", "explanation": "D is correct: the anchor verbs 'ferments' and 'ships' establish a present, habitual timeframe, so the present-tense 'bottles' is needed to match. A 'bottled' is past tense and breaks the established present timeframe. B 'bottling' has no finite verb, leaving the clause without a main verb. C 'will bottle' is future tense and breaks the established present timeframe.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-21", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Last year, the curator <u>examines</u> the damaged canvas under ultraviolet light before beginning the restoration.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "examined"}, {"letter": "C", "text": "will examine"}, {"letter": "D", "text": "examining"}], "correctLetter": "B", "explanation": "B is correct: the anchor phrase 'Last year' establishes a past timeframe, so the past-tense 'examined' is needed. A 'examines' is present tense and doesn't fit the established past timeframe. C 'will examine' is future tense and doesn't fit the established past timeframe. D 'examining' has no finite verb, leaving the sentence without a main verb.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-22", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "By the time the sailors reach the Azores next month, they <u>traveled</u> nearly two thousand nautical miles alone.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "travel"}, {"letter": "C", "text": "will have traveled"}, {"letter": "D", "text": "having traveled"}], "correctLetter": "C", "explanation": "C is correct: the anchor phrase 'reach the Azores next month' establishes a future point in time, and since the traveling will be completed before that point, the future perfect 'will have traveled' is needed. A 'traveled' is simple past and doesn't fit the established future timeframe. B 'travel' is present tense and doesn't fit the established future timeframe. D 'having traveled' has no finite verb, leaving the clause without a main verb.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-23", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "Whenever the robotics team debugs a coding error, the practice robot always <u>stalls</u> momentarily before rebooting itself.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "stalled"}, {"letter": "C", "text": "will stall"}, {"letter": "D", "text": "stalling"}], "correctLetter": "A", "explanation": "A is correct: the anchor verb 'debugs' establishes a present, habitual timeframe, so the present-tense 'stalls' is already correct. B 'stalled' is past tense and breaks the established present, habitual timeframe. C 'will stall' is future tense and breaks the established present, habitual timeframe. D 'stalling' has no finite verb, leaving the clause without a main verb.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-24", "concept": "Grammar & Usage", "subtype": "Verb Tense & Form", "passage": "The winemakers had already picked the grapes by hand when the automated harvester <u>arrives</u> at the vineyard gate.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "will arrive"}, {"letter": "C", "text": "arriving"}, {"letter": "D", "text": "arrived"}], "correctLetter": "D", "explanation": "D is correct: the anchor verb phrase 'had already picked' establishes that the picking was already complete at a past point, so the simple past 'arrived' is needed to mark that later past event. A 'arrives' is present tense and doesn't fit the established past timeframe. B 'will arrive' is future tense and doesn't fit the established past timeframe. C 'arriving' has no finite verb, leaving the clause without a main verb.", "trick": "Find the anchor verb nearby and match its timeframe."}, {"id": "T3-GU-25", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of the two suspension cables tested, the northern one proved <u>most durable</u> under repeated stress simulations.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "more durable"}, {"letter": "C", "text": "durabler"}, {"letter": "D", "text": "durable"}], "correctLetter": "B", "explanation": "B is correct: only two cables are being compared, so the comparative 'more durable' is required. A 'most durable' is a superlative, which is reserved for three or more items. C 'durabler' is not a valid comparative form in English. D 'durable' lacks any comparative degree, leaving the two-cable comparison the sentence sets up incomplete.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-26", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Among the three calligraphy pens on her desk, the broad-nib one produced the <u>more elegant</u> lettering.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "elegantest"}, {"letter": "C", "text": "most elegant"}, {"letter": "D", "text": "elegant"}], "correctLetter": "C", "explanation": "C is correct: three pens are being compared, so the superlative 'most elegant' is required. A 'more elegant' is a comparative, which is reserved for exactly two items. B 'elegantest' is not a valid superlative form in English. D 'elegant' lacks any superlative degree, leaving the three-pen comparison the sentence sets up incomplete.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-27", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Between the two flooded passages, the western tunnel was <u>narrower</u> and far more difficult to navigate.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "narrowest"}, {"letter": "C", "text": "more narrower"}, {"letter": "D", "text": "narrow"}], "correctLetter": "A", "explanation": "A is correct: only two passages are being compared, so the comparative 'narrower' is already correct. B 'narrowest' is a superlative, which is reserved for three or more items. C 'more narrower' doubles up the comparative marker, which is not valid. D 'narrow' lacks any comparative degree, leaving the two-tunnel comparison the sentence sets up incomplete.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-28", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Of all the manuscripts in the archive, the medieval psalter is the <u>more fragile</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "fragiler"}, {"letter": "C", "text": "as fragile"}, {"letter": "D", "text": "most fragile"}], "correctLetter": "D", "explanation": "D is correct: 'all the manuscripts' means three or more items are being compared, so the superlative 'most fragile' is required. A 'more fragile' is a comparative, which is reserved for exactly two items. B 'fragiler' is not a valid form in English. C 'as fragile' sets up an incomplete 'as...as' comparison with nothing to complete it, leaving the phrase ungrammatical.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-29", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Comparing this season to last, the rowing team's finishing times were <u>most consistent</u> than ever before.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "more consistent"}, {"letter": "C", "text": "consistenter"}, {"letter": "D", "text": "consistent"}], "correctLetter": "B", "explanation": "B is correct: only two seasons are being compared, and the word 'than' requires a comparative form, so 'more consistent' is needed. A 'most consistent' is a superlative, and superlatives never pair with 'than.' C 'consistenter' is not a valid comparative form in English. D 'consistent' has no comparative marker at all, and a plain adjective cannot be followed by 'than.'", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-30", "concept": "Grammar & Usage", "subtype": "Comparative/Superlative Form", "passage": "Installers rated the three rooftop layouts, and the south-facing array captured the <u>more sunlight</u> of the group.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "sunlightest"}, {"letter": "C", "text": "most sunlight"}, {"letter": "D", "text": "sunlight"}], "correctLetter": "C", "explanation": "C is correct: three rooftop layouts are being compared, so the superlative 'most sunlight' is required. A 'more sunlight' is a comparative, which is reserved for exactly two items. B 'sunlightest' is not a valid form in English. D 'sunlight' lacks any superlative degree, leaving the three-way comparison the sentence sets up incomplete.", "trick": "Two things = -er, three-plus things = -est."}, {"id": "T3-GU-31", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The piano tuner is skilled <u>at</u> detecting even the smallest deviations in pitch.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "for"}, {"letter": "C", "text": "of"}, {"letter": "D", "text": "on"}], "correctLetter": "A", "explanation": "A is correct: the fixed idiom is 'skilled at,' so 'at' is already correct. B 'skilled for' is not standard English. C 'skilled of' is not standard English. D 'skilled on' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-GU-32", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The grower attributed the orchid's vivid blooms <u>with</u> the humid greenhouse conditions.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "for"}, {"letter": "C", "text": "of"}, {"letter": "D", "text": "to"}], "correctLetter": "D", "explanation": "D is correct: the fixed idiom is 'attribute X to Y,' so 'to' is needed. A 'attributed...with' is not standard English. B 'attributed...for' is not standard English. C 'attributed...of' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-GU-33", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The trainer insisted <u>in</u> reviewing the scent protocol before every deployment, no matter how experienced the team was.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "on"}, {"letter": "C", "text": "at"}, {"letter": "D", "text": "with"}], "correctLetter": "B", "explanation": "B is correct: the fixed idiom is 'insisted on,' so 'on' is needed. A 'insisted in' is not standard English. C 'insisted at' is not standard English. D 'insisted with' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-GU-34", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The muralist is known <u>as</u> her bold use of color and sweeping geometric patterns.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "with"}, {"letter": "C", "text": "for"}, {"letter": "D", "text": "about"}], "correctLetter": "C", "explanation": "C is correct: the fixed idiom for describing a reputation built on a quality or skill is 'known for,' so 'for' is needed. A 'known as' is used to rename or identify someone (e.g., 'known as an expert'), not to describe a technique, so it doesn't fit here. B 'known with' is not standard English. D 'known about' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-GU-35", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "The sculptor is capable <u>of</u> carving an entire swan from a single block of ice in under an hour.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "for"}, {"letter": "C", "text": "with"}, {"letter": "D", "text": "in"}], "correctLetter": "A", "explanation": "A is correct: the fixed idiom is 'capable of,' so 'of' is already correct. B 'capable for' is not standard English. C 'capable with' is not standard English. D 'capable in' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-GU-36", "concept": "Grammar & Usage", "subtype": "Preposition/Idiom Usage", "passage": "Festival organizers are responsible <u>of</u> coordinating wind permits with the local aviation authority each spring.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "about"}, {"letter": "C", "text": "at"}, {"letter": "D", "text": "for"}], "correctLetter": "D", "explanation": "D is correct: the fixed idiom is 'responsible for,' so 'for' is needed. A 'responsible of' is not standard English. B 'responsible about' is not standard English. C 'responsible at' is not standard English.", "trick": "Read it aloud \u2014 the 'wrong' preposition usually sounds off."}, {"id": "T3-PU-1", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The Golden Gate Bridge<u>, an engineering marvel completed in 1937,</u> spans the strait connecting San Francisco Bay to the Pacific Ocean.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "an engineering marvel completed in 1937,"}, {"letter": "C", "text": ", an engineering marvel completed in 1937"}, {"letter": "D", "text": "; an engineering marvel completed in 1937;"}], "correctLetter": "A", "explanation": "A is correct: the nonessential appositive \"an engineering marvel completed in 1937\" is properly set off with a comma before it and a comma after it, so the gate opens and closes. B is wrong because it drops the opening comma after \"Bridge,\" leaving only one side marked. C is wrong because it drops the closing comma before \"spans,\" again marking only one side. D is wrong because semicolons must connect two independent clauses, and this appositive phrase cannot stand alone as a sentence.", "trick": "If you open a comma gate, you must close it."}, {"id": "T3-PU-2", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The saxophonist Lonnie Marsh<u> beloved for his late-night radio sessions</u> released his final album just months before his death.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", beloved for his late-night radio sessions,"}, {"letter": "C", "text": ", beloved for his late-night radio sessions"}, {"letter": "D", "text": "beloved for his late-night radio sessions,"}], "correctLetter": "B", "explanation": "B is correct: the nonessential phrase describing Marsh needs a comma on both sides, and this choice supplies both. A is wrong because it has no punctuation at all around a phrase that clearly needs to be set off. C is wrong because it opens the gate with a comma after \"Marsh\" but never closes it before \"released.\" D is wrong because it closes the gate before \"released\" but never opens it after \"Marsh.\"", "trick": "If you open a comma gate, you must close it."}, {"id": "T3-PU-3", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The mimic octopus<u>, prized by divers for its uncanny ability to imitate other sea creatures</u> can alter its shape, color, and texture within seconds.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ": prized by divers for its uncanny ability to imitate other sea creatures"}, {"letter": "C", "text": ", prized by divers for its uncanny ability to imitate other sea creatures,"}, {"letter": "D", "text": "prized by divers for its uncanny ability to imitate other sea creatures,"}], "correctLetter": "C", "explanation": "C is correct: it adds a comma after \"octopus\" and another after \"creatures,\" properly bookending the nonessential description. A is wrong because it opens the gate but never closes it before \"can.\" B is wrong because a colon must follow a complete independent clause, and \"The mimic octopus\" alone is not one. D is wrong because it closes the gate before \"can\" but never opens it after \"octopus.\"", "trick": "If you open a comma gate, you must close it."}, {"id": "T3-PU-4", "concept": "Punctuation", "subtype": "Comma: Nonessential Info", "passage": "The Cape Hatteras Lighthouse<u>, moved 2,900 feet inland in 1999 to escape coastal erosion</u> remains the tallest brick lighthouse in the United States.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "moved 2,900 feet inland in 1999 to escape coastal erosion,"}, {"letter": "C", "text": "; moved 2,900 feet inland in 1999 to escape coastal erosion;"}, {"letter": "D", "text": ", moved 2,900 feet inland in 1999 to escape coastal erosion,"}], "correctLetter": "D", "explanation": "D is correct: it places a comma after \"Lighthouse\" and another after \"erosion,\" closing the gate on both sides of the nonessential detail. A is wrong because it opens the gate after \"Lighthouse\" but never closes it before \"remains.\" B is wrong because it closes the gate before \"remains\" but never opens it after \"Lighthouse.\" C is wrong because semicolons require independent clauses on both sides, and this participial phrase cannot stand alone.", "trick": "If you open a comma gate, you must close it."}, {"id": "T3-PU-5", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The startup relocated <u>its</u> headquarters to Austin after outgrowing the original office in Denver.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it's"}, {"letter": "C", "text": "its'"}, {"letter": "D", "text": "it is"}], "correctLetter": "A", "explanation": "A is correct: \"its\" is the possessive form needed before the noun \"headquarters,\" with no apostrophe, just like \"his.\" B is wrong because \"it's\" expands to \"it is,\" and \"relocated it is headquarters\" is nonsensical. C is wrong because \"its'\" is not a real word; \"its\" never takes an apostrophe. D is wrong because spelling out \"it is\" produces the same nonsensical \"relocated it is headquarters.\"", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "T3-PU-6", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "Meteorologists warn that <u>its</u> unlikely the storm will weaken before making landfall tomorrow.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "it's"}, {"letter": "C", "text": "its's"}, {"letter": "D", "text": "it is'"}], "correctLetter": "B", "explanation": "B is correct: \"it's\" expands to \"it is,\" and \"it is unlikely the storm will weaken\" makes complete sense. A is wrong because possessive \"its\" needs a noun to modify, and \"its unlikely\" has none. C is wrong because \"its's\" is not a word. D is wrong because \"it is'\" tacks on a meaningless stray apostrophe after a complete word.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "T3-PU-7", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The coach's motivational text read, \"<u>Your</u> going to crush this marathon if you trust your training.\"", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Yore"}, {"letter": "C", "text": "You're"}, {"letter": "D", "text": "Youre'"}], "correctLetter": "C", "explanation": "C is correct: \"You're\" expands to \"You are,\" and \"You are going to crush this marathon\" is grammatical. A is wrong because possessive \"Your\" needs a noun to modify, and \"Your going\" is nonsensical. B is wrong because \"Yore\" means \"long ago\" and makes no sense in this sentence. D is wrong because \"Youre'\" is a malformed word with a misplaced apostrophe.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "T3-PU-8", "concept": "Punctuation", "subtype": "Apostrophe: Possessive vs. Contraction", "passage": "The detective still didn't know <u>who's</u> fingerprints were on the murder weapon, though she suspected the butler.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "who is"}, {"letter": "C", "text": "whoms"}, {"letter": "D", "text": "whose"}], "correctLetter": "D", "explanation": "D is correct: \"whose\" is the possessive pronoun needed before the noun \"fingerprints.\" A is wrong because \"who's\" expands to \"who is,\" and \"who is fingerprints were on the weapon\" is nonsensical. B is wrong for the same reason spelled out: \"who is fingerprints were\" is ungrammatical. C is wrong because \"whoms\" is not a real word.", "trick": "Say the long form out loud \u2014 if 'it is' doesn't fit, drop the apostrophe."}, {"id": "T3-PU-9", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The new light rail line<u>\u2014which connects six suburbs, crosses the river twice, and terminates downtown\u2014</u> has cut commute times significantly across the metro area.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", which connects six suburbs, crosses the river twice, and terminates downtown,"}, {"letter": "C", "text": "\u2014which connects six suburbs, crosses the river twice, and terminates downtown,"}, {"letter": "D", "text": ", which connects six suburbs, crosses the river twice, and terminates downtown\u2014"}], "correctLetter": "A", "explanation": "A is correct: because the nonessential clause already contains its own internal commas (after \"suburbs\" and \"twice\"), only matching dashes can clearly mark where the aside begins and ends without adding to the pile of commas. B is wrong because replacing the dashes with commas buries the clause's boundaries inside an ambiguous run of commas. C and D are wrong because they mismatch an opening dash with a closing comma or vice versa \u2014 punctuation bookends must match.", "trick": "Punctuation bookends must match."}, {"id": "T3-PU-10", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The chef's recipe book<u>, filled with handwritten notes, faded photographs, and stains from decades of cooking\u2014</u> was donated to the culinary museum after her death.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "\u2014filled with handwritten notes, faded photographs, and stains from decades of cooking\u2014"}, {"letter": "C", "text": ", filled with handwritten notes, faded photographs, and stains from decades of cooking,"}, {"letter": "D", "text": "\u2014filled with handwritten notes, faded photographs, and stains from decades of cooking,"}], "correctLetter": "B", "explanation": "B is correct: matching dashes are needed because the nonessential description already contains its own internal commas, and dashes clearly mark where the aside starts and ends. A is wrong because it mismatches an opening comma with a closing dash. C is wrong because plain commas here would bury the phrase's boundary inside an already comma-filled list. D is wrong because it mismatches an opening dash with a closing comma.", "trick": "Punctuation bookends must match."}, {"id": "T3-PU-11", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The new panda enclosure<u>\u2014the zoo's biggest attraction this year,</u> has drawn record crowds since it opened last spring.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the zoo's biggest attraction this year,"}, {"letter": "C", "text": "\u2014the zoo's biggest attraction this year\u2014"}, {"letter": "D", "text": ", the zoo's biggest attraction this year\u2014"}], "correctLetter": "C", "explanation": "C is correct: matching dashes on both sides of the nonessential aside \"the zoo's biggest attraction this year\" clearly bookend it. A is wrong because it mismatches an opening dash with a closing comma. B is wrong because it has a closing comma but no opening mark at all after \"enclosure.\" D is wrong because it mismatches an opening comma with a closing dash.", "trick": "Punctuation bookends must match."}, {"id": "T3-PU-12", "concept": "Punctuation", "subtype": "Dash/Comma Pairing", "passage": "The witness<u>, visibly nervous throughout the testimony</u> refused to make eye contact with the defense attorney.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "\u2014visibly nervous throughout the testimony,"}, {"letter": "C", "text": "visibly nervous throughout the testimony\u2014"}, {"letter": "D", "text": "\u2014visibly nervous throughout the testimony\u2014"}], "correctLetter": "D", "explanation": "D is correct: matching dashes on both sides cleanly set off the nonessential description \"visibly nervous throughout the testimony.\" A is wrong because it opens with a comma after \"witness\" but never closes before \"refused.\" B is wrong because it mismatches an opening dash with a closing comma. C is wrong because it has a closing dash but no opening mark after \"witness.\"", "trick": "Punctuation bookends must match."}, {"id": "T3-PU-13", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "The factory's assembly line stopped for nearly six hours<u>; workers used the downtime to run safety drills</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", workers used the downtime to run safety drills"}, {"letter": "C", "text": "workers used the downtime to run safety drills"}, {"letter": "D", "text": "; because workers used the downtime to run safety drills"}], "correctLetter": "A", "explanation": "A is correct: both \"The factory's assembly line stopped for nearly six hours\" and \"workers used the downtime to run safety drills\" are independent clauses, so a semicolon correctly joins them. B is wrong because a comma alone cannot join two independent clauses \u2014 that creates a comma splice. C is wrong because fusing the two clauses with no punctuation at all creates a run-on. D is wrong because a semicolon must be followed by an independent clause, and \"because workers used the downtime\" is a dependent clause.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "T3-PU-14", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "The muralist's palette requires just four pigments<u>, cobalt blue, ochre, crimson, and titanium white</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ": cobalt blue, ochre, crimson, and titanium white"}, {"letter": "C", "text": "; cobalt blue, ochre, crimson, and titanium white"}, {"letter": "D", "text": "\u2014cobalt blue: ochre, crimson, and titanium white"}], "correctLetter": "B", "explanation": "B is correct: \"The muralist's palette requires just four pigments\" is a complete independent clause, and a colon properly introduces the list that explains it. A is wrong because a comma cannot properly introduce a list after a complete sentence \u2014 it just creates an ambiguous run of commas. C is wrong because a semicolon must be followed by an independent clause, not a list of items. D is wrong because it randomly splits \"cobalt blue\" from the rest of the list with a nonsensical dash-then-colon combination.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "T3-PU-15", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Our road trip included stops in Nashville, Tennessee<u>, Memphis, Tennessee, and New Orleans, Louisiana</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", Memphis: Tennessee, and New Orleans, Louisiana"}, {"letter": "C", "text": "; Memphis, Tennessee; and New Orleans, Louisiana"}, {"letter": "D", "text": ", Memphis, Tennessee; and New Orleans, Louisiana"}], "correctLetter": "C", "explanation": "C is correct: when list items themselves contain internal commas (each city-state pair), semicolons must separate the items so the boundaries stay clear. A is wrong because using only commas creates an ambiguous pile-up that blurs where each city/state pair starts and ends. B is wrong because it randomly splits \"Memphis\" from its state \"Tennessee\" with a colon. D is wrong because it inconsistently mixes a comma and a semicolon as separators within the same list.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "T3-PU-16", "concept": "Punctuation", "subtype": "Colon & Semicolon Usage", "passage": "Dr. Elena Vasquez finally understood why the readings kept fluctuating<u>, the sensor's calibration had drifted overnight</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "the sensor's calibration had drifted overnight"}, {"letter": "C", "text": "; because the sensor's calibration had drifted overnight"}, {"letter": "D", "text": ": the sensor's calibration had drifted overnight"}], "correctLetter": "D", "explanation": "D is correct: \"Dr. Elena Vasquez finally understood why the readings kept fluctuating\" is a complete independent clause, and a colon properly introduces the explanation that follows. A is wrong because a comma alone cannot join two independent clauses, creating a comma splice. B is wrong because fusing the clauses with no punctuation creates a run-on. C is wrong because a semicolon must be followed by an independent clause, and \"because the sensor's calibration had drifted\" is dependent.", "trick": "Before you use : or ; , check that what comes before it could stand alone as its own sentence."}, {"id": "T3-PU-17", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "Many economists believe<u> that inflation will</u> ease by next quarter.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", that inflation will"}, {"letter": "C", "text": "that, inflation will"}, {"letter": "D", "text": "that inflation, will"}], "correctLetter": "A", "explanation": "A is correct: no punctuation is needed between \"believe\" and the clause it introduces. B is wrong because it inserts an unnecessary comma between \"believe\" and its subordinate clause. C is wrong because it inserts an unnecessary comma that splits \"that\" from the clause it introduces. D is wrong because it inserts an unnecessary comma between the subject \"inflation\" and its verb \"will.\"", "trick": "When in doubt, leave it out."}, {"id": "T3-PU-18", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The steep trail leading to the summit<u>, tested even</u> experienced hikers.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "tested even"}, {"letter": "C", "text": "tested, even"}, {"letter": "D", "text": "; tested even"}], "correctLetter": "B", "explanation": "B is correct: the subject \"The steep trail leading to the summit\" flows directly into its verb \"tested\" with no punctuation needed. A is wrong because it inserts an unnecessary comma between the subject and its verb. C is wrong because it inserts an unnecessary comma between the verb \"tested\" and the adverb \"even.\" D is wrong because a semicolon requires an independent clause on both sides, and neither \"The steep trail leading to the summit\" alone nor \"tested even experienced hikers\" alone forms one on its own here.", "trick": "When in doubt, leave it out."}, {"id": "T3-PU-19", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The mechanic tightened the bolts<u> and, adjusted the belt</u> before test-driving the car.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", and, adjusted the belt"}, {"letter": "C", "text": " and adjusted the belt"}, {"letter": "D", "text": ", and adjusted the belt,"}], "correctLetter": "C", "explanation": "C is correct: \"tightened the bolts and adjusted the belt\" is a simple compound predicate sharing one subject, \"mechanic,\" so no comma is needed. A is wrong because it inserts an unnecessary comma right after \"and.\" B is wrong because it adds two unnecessary commas around \"and.\" D is wrong because it unnecessarily brackets \"and adjusted the belt\" with commas as if it were a nonessential aside, which it is not.", "trick": "When in doubt, leave it out."}, {"id": "T3-PU-20", "concept": "Punctuation", "subtype": "Unnecessary Punctuation", "passage": "The novelist Haruki Tanaka<u> writes best, in the early morning hours</u> before the city wakes.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": " writes, best in the early morning hours"}, {"letter": "C", "text": " writes best in, the early morning hours"}, {"letter": "D", "text": " writes best in the early morning hours"}], "correctLetter": "D", "explanation": "D is correct: the essential phrase \"in the early morning hours\" flows directly from \"writes best\" with no punctuation needed. A is wrong because it inserts an unnecessary comma between \"best\" and the phrase modifying it. B is wrong because it inserts an unnecessary comma between the verb \"writes\" and the adverb \"best.\" C is wrong because it inserts an unnecessary comma between the preposition \"in\" and its object.", "trick": "When in doubt, leave it out."}, {"id": "T3-SS-1", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Air traffic controllers guided the incoming flights around the storm cell<u>, they never lost contact</u> with a single aircraft.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; they never lost contact"}, {"letter": "C", "text": "they never lost contact"}, {"letter": "D", "text": ", and losing contact"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins the two independent clauses \"Air traffic controllers guided the sage": "The glassblower rotated the molten glass steadily on the pipe<u>, the heat kept it pliable</u> enough to shape.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "; the heat kept it pliable"}, {"letter": "C", "text": "the heat kept it pliable"}, {"letter": "D", "text": ", so keeping it pliable"}], "correctLetter": "B", "explanation": "B is correct: a semicolon properly joins the two independent clauses \"The glassblower rotated the molten glass steadily on the pipe\" and \"the heat kept it pliable enough to shape.\" A is a comma splice, joining two independent clauses with only a comma. C removes the punctuation entirely, creating a run-on. D pairs \"so\" with the gerund \"keeping\" instead of a full clause, which is not a grammatical way to join two independent ideas.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "T3-SS-6", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The first violinist practiced the solo passage for hours every night<u>, she wanted every note to sound effortless</u> on stage.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "she wanted every note to sound effortless"}, {"letter": "C", "text": "because she wanted every note to sound effortless"}, {"letter": "D", "text": "; because she wanted every note to sound effortless"}], "correctLetter": "C", "explanation": "C is correct: the subordinating conjunction \"because\" turns the second clause into a dependent clause explaining why she practiced, legally attaching it to the main clause without a comma splice. A is a comma splice (comma alone joining two independent clauses). B removes the punctuation entirely, creating a run-on. D incorrectly places a semicolon before \"because,\" but a semicolon must be followed by an independent clause, and \"because she wanted...\" is dependent.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "T3-SS-7", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "Deciding exactly when to harvest is one of a vineyard owner's hardest calls<u>, for the sugar levels in the grapes can shift dramatically within a single week</u>.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": ", the sugar levels in the grapes can shift dramatically within a single week"}, {"letter": "C", "text": "the sugar levels in the grapes can shift dramatically within a single week"}, {"letter": "D", "text": ", and the sugar levels in the grapes changing dramatically within a single week"}], "correctLetter": "A", "explanation": "A is correct: a comma plus the coordinating conjunction \"for\" (meaning \"because\") properly joins the two independent clauses. B is a comma splice, dropping \"for\" and joining the clauses with only a comma. C removes the punctuation entirely, creating a run-on. D pairs \"and\" with the participle \"changing\" instead of a full verb, leaving the final clause without a working main verb.", "trick": "A comma alone can never glue two complete sentences together."}, {"id": "T3-SS-8", "concept": "Sentence Structure & Formation", "subtype": "Run-on / Comma Splice", "passage": "The tightrope walker had crossed the same canyon a dozen times before<u>, this crossing felt different</u> because of the gusting wind.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "this crossing felt different"}, {"letter": "C", "text": "; but this crossing felt different"}, {"letter": "D", "text": ", but this crossing felt different"}], "correctLe ble?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Which checking that the massive lens was clean and the light rotated properly."}, {"letter": "C", "text": "He checked that the massive lens was clean and the light rotated properly."}, {"letter": "D", "text": "Having checked that the massive lens was clean and the light rotated properly."}], "correctLetter": "C", "explanation": "C is correct: supplying the subject \"He\" and the main verb \"checked\" turns the fragment into a complete, independent sentence. A is a fragment because \"Checking...\" is a participial phrase with no subject or main verb that can stand alone. B combines the relative pronoun \"Which\" with the gerund \"checking,\" which is still not a complete sentence. D uses \"Having checked,\" a participial phrase that also cannot stand alone as a sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-11", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "Hydrothermal vents release scalding, mineral-rich water into the freezing deep sea. <u>Supporting entire ecosystems of tube worms and blind shrimp that never see sunlight.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Entire ecosystems of tube worms and blind shrimp that never see sunlight."}, {"letter": "C", "text": "Which support entire ecosystems of tube worms and blind shrimp that never see sunlight."}, {"letter": "D", "text": "These vents support entire ecosystems of tube worms and blind shrimp that never see sunlight."}], "correctLetter": "D", "explanation": "D is correct: supplying the subject \"These vents\" and the main verb \"support\" makes this a complete, independent sentence. A is a fragment because \"Supporting...\" is a participial phrase with no subject or main verb. B is just a noun phrase with a relative clause attached, still missing a main verb. C begins with the relative pronoun \"Which,\" which needs an independent clause to attach to and cannot stand alone.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-12", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "Members of the quilting guild spent months piecing together a single queen-size quilt for the raffle. <u>They donated the finished piece to the local hospital's children's ward.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Donating the finished piece to the local hospital's children's ward."}, {"letter": "C", "text": "Having donated the finished piece to the local hospital's children's ward."}, {"letter": "D", "text": "The finished piece, which they donated to the local hospital's children's ward."}], "correctLetter": "A", "explanation": "A is correct: \"They donated the finished piece to the local hospital's children's ward\" already has a subject, \"They,\" and a working main verb, \"donated,\" so it stands alone as a complete sentence. B is a fragment because \"Donating...\" is a participial phrase with no subject or main verb. C uses \"Having donated,\" a participial phrase that likewise cannot stand alone. D is a noun phrase with a relative clause attached, still missing a main verb for \"The finished piece.\"", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-13", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "An amateur meteorologist in the small town tracked the hurricane's path using nothing but a laptop and a homemade weather station. <u>Posting updates online every few hours as the storm approached.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "He posted updates online every few hours as the storm approached."}, {"letter": "C", "text": "Updates being posted online every few hours as the storm approached."}, {"letter": "D", "text": "To post updates online every few hours as the storm approached."}], "correctLetter": "B", "explanation": "B is correct: supplying the subject \"He\" and the main verb \"posted\" turns the fragment into a complete sentence. A is a fragment because \"Posting...\" is a participial phrase with no subject or main verb. C uses the participial phrase \"being posted,\" which still lacks a working main verb. D is an infinitive phrase, \"To post...,\" which also cannot stand alone as a sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-14", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The potter centered the lump of clay on the spinning wheel with practiced hands. <u>Pulling the walls upward slowly until a tall vase began to take shape.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "To pull the walls upward slowly until a tall vase began to take shape."}, {"letter": "C", "text": "She pulled the walls upward slowly until a tall vase began to take shape."}, {"letter": "D", "text": "The walls, pulled upward slowly until a tall vase began to take shape."}], "correctLetter": "C", "explanation": "C is correct: supplying the subject \"She\" and the main verb \"pulled\" makes this a complete, independent sentence. A is a fragment because \"Pulling...\" is a participial phrase with no subject or main verb. B is an infinitive phrase, \"To pull...,\" which cannot stand alone. D is a noun phrase with a participial phrase attached, still missing a main verb for \"The walls.\"", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-15", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The long-distance cyclist had already logged over four thousand miles across a dozen states. <u>Pedaling through blistering heat, sudden hailstorms, and one unplanned detour through a cornfield.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Having pedaled through blistering heat, sudden hailstorms, and one unplanned detour through a cornfield."}, {"letter": "C", "text": "A journey through blistering heat, sudden hailstorms, and one unplanned detour through a cornfield."}, {"letter": "D", "text": "She had pedaled through blistering heat, sudden hailstorms, and one unplanned detour through a cornfield."}], "correctLetter": "D", "explanation": "D is correct: supplying the subject \"She\" and the main verb \"had pedaled\" makes this a complete, independent sentence. A is a fragment because \"Pedaling...\" is a participial phrase with no subject or main verb. B uses \"Having pedaled,\" a participial phrase that also cannot stand alone. C is just a noun phrase, \"A journey...,\" still missing a main verb.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-16", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The vacant lot on Fifth Street sat overgrown with weeds for nearly a decade. <u>Neighbors transformed it into a thriving community garden in a single summer.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Transforming it into a thriving community garden in a single summer."}, {"letter": "C", "text": "Neighbors, transforming it into a thriving community garden in a single summer."}, {"letter": "D", "text": "Into a thriving community garden in a single summer, transformed by neighbors."}], "correctLetter": "A", "explanation": "A is correct: \"Neighbors transformed it into a thriving community garden in a single summer\" already has a subject, \"Neighbors,\" and a working main verb, \"transformed,\" so it stands alone as a complete sentence. B is a fragment because \"Transforming...\" is a participial phrase with no main verb. C adds a subject, \"Neighbors,\" but pairs it only with the participial phrase \"transforming...,\" leaving no finite main verb. D strings together prepositional and participial phrases with no subject or main verb at all.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-17", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The puppeteer spent three weeks carving each marionette's face by hand before adding paint. <u>Attaching nearly a dozen strings to control every joint independently.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "She attached nearly a dozen strings to control every joint independently."}, {"letter": "C", "text": "To attach nearly a dozen strings to control every joint independently."}, {"letter": "D", "text": "Nearly a dozen strings attached to control every joint independently."}], "correctLetter": "B", "explanation": "B is correct: supplying the subject \"She\" and the main verb \"attached\" makes this a complete, independent sentence. A is a fragment because \"Attaching...\" is a participial phrase with no subject or main verb. C is an infinitive phrase, \"To attach...,\" which also cannot stand alone. D lacks a helping verb like \"were\" before \"attached,\" leaving it as a noun phrase with a reduced participial phrase rather than a complete sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-18", "concept": "Sentence Structure & Formation", "subtype": "Sentence Fragment", "passage": "The rooftop farm sits atop a former parking garage in the middle of downtown. <u>Supplying fresh greens to six nearby restaurants every week.</u>", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "Having supplied fresh greens to six nearby restaurants every week."}, {"letter": "C", "text": "It supplies fresh greens to six nearby restaurants every week."}, {"letter": "D", "text": "Fresh greens supplied to six nearby restaurants every week."}], "correctLetter": "C", "explanation": "C is correct: supplying the subject \"It\" and the main verb \"supplies\" makes this a complete, independent sentence. A is a fragment because \"Supplying...\" is a participial phrase with no subject or main verb. B uses \"Having supplied,\" a participial phrase that also cannot stand alone. D lacks a helping verb like \"are\" before \"supplied,\" leaving a noun phrase with a reduced participial phrase rather than a complete sentence.", "trick": "Cover up everything before the phrase \u2014 does what's left form a complete sentence by itself?"}, {"id": "T3-SS-19", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Each morning, the librarian shelves returned books, updates the catalog system, and <u>she answers questions</u> from patrons at the front desk.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "answering questions"}, {"letter": "C", "text": "to answer questions"}, {"letter": "D", "text": "answers questions"}], "correctLetter": "D", "explanation": "D is correct: the list already contains the third-person singular present verbs \"shelves\" and \"updates,\" so the third item must match with \"answers.\" A breaks the pattern by switching to a full subject-plus-verb clause, \"she answers questions.\" B switches to the -ing form \"answering,\" which doesn't match. C switches to the infinitive \"to answer,\" which also breaks the parallel list.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "T3-SS-20", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "To prepare for real missions, the dog practices tracking scents across difficult terrain, <u>climbing over rubble piles</u>, and alerting handlers the moment it finds a scent trail.", "question": "Which choice makes the underlined portion most grammatically acceptable?", "choices": [{"letter": "A", "text": "NO CHANGE"}, {"letter": "B", "text": "climbs over rubble piles"}, {"letter": "C", "text": "to climb over rubble piles"}, {"letter": "D", "text": "it climbs over rubble piles"}], "correctLetter": "A", "explanation": "A is correct: the list already uses the -ing forms \"tracking\" and \"alerting,\" and \"climbing over rubble piles\" matches that pattern. B switches to the present-tense verb \"climbs,\" which breaks the parallel list. C switches to the infinitive \"to climb,\" which also doesn't match. D turns the item into a full subject-plus-verb clause, \"it climbs,\" which breaks the parallel structure.", "trick": "List items should all wear the same outfit \u2014 same verb form straight down the list."}, {"id": "T3-SS-21", "concept": "Sentence Structure & Formation", "subtype": "Parallel Structure", "passage": "Before opening for lunch, the food truck owner preps the vegetables, <u>she fires up the grill</u>, and restocks the napkin dispensers.", "questio
