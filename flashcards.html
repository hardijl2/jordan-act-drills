<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan&#x27;s ACT English Flashcards</title>
<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #14344f;
    --green: #1a7f4e;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #d9e0e8;
    --text: #1c2733;
    --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  header { padding: 20px 4px 8px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--navy-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  header .updated { margin: 6px 0 0; color: var(--muted); font-size: 0.78rem; font-style: italic; }

  /* --- Setup screen --- */
  #setup .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,52,79,0.05); }
  #setup h2 { font-size: 1rem; margin: 0 0 12px; color: var(--navy-dark); }
  label.chk { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.95rem; }
  label.chk:last-child { border-bottom: none; }
  label.chk input { width: 18px; height: 18px; flex-shrink: 0; }
  label.chk .cnt { margin-left: auto; color: var(--muted); font-size: 0.82rem; }
  .quick-btns { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .quick-btns button { flex: 1; min-width: 110px; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 9px 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .quick-btns button:active { background: #dbe6f2; }
  .btn-primary { background: var(--navy); color: #fff; border: none; padding: 13px 18px; border-radius: 8px; font-size: 1.02rem; cursor: pointer; width: 100%; font-weight: 600; }
  .btn-primary:active { background: var(--navy-dark); }
  .btn-primary:disabled { background: #a9b7c4; cursor: not-allowed; }
  .shuffle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 0.92rem; }
  .shuffle-row input { width: 18px; height: 18px; }

  /* --- Study screen --- */
  #study { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.85rem; color: var(--muted); }
  .topbar .tag { background: #eaf0f7; color: var(--navy-dark); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-bar .fill { height: 100%; background: var(--navy); transition: width 0.2s; }

  .flip-zone { perspective: 1200px; margin-bottom: 18px; }
  .flip-card { position: relative; width: 100%; min-height: 260px; cursor: pointer; }
  .flip-inner {
    position: relative; width: 100%; min-height: 260px;
    transition: transform 0.45s; transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 2px 10px rgba(20,52,79,0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 22px; text-align: center;
  }
  .flip-face.back { transform: rotateY(180deg); }
  .flip-face .label { position: absolute; top: 14px; left: 16px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; }
  .flip-face .front-text { font-size: 1.35rem; font-weight: 700; color: var(--navy-dark); line-height: 1.4; }
  .flip-face .back-text { font-size: 1rem; line-height: 1.6; color: var(--text); white-space: pre-wrap; text-align: left; max-height: 100%; overflow-y: auto; width: 100%; }
  .flip-face .back-text table { width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: normal; margin: 0; }
  .flip-face .back-text th, .flip-face .back-text td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; line-height: 1.35; }
  .flip-face .back-text th { background: #eaf0f7; color: var(--navy-dark); font-weight: 700; }
  .flip-hint { text-align: center; font-size: 0.82rem; color: var(--muted); margin: -10px 0 18px; }

  .nav-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .nav-row button { flex: 1; background: #eaf0f7; color: var(--navy-dark); border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  .nav-row button:active { background: #dbe6f2; }
  .nav-row button:disabled { opacity: 0.45; cursor: not-allowed; }
  .back-link { text-align: center; margin-top: 18px; }
  .back-link a { color: var(--muted); font-size: 0.85rem; text-decoration: underline; cursor: pointer; }

  #done { display: none; text-align: center; padding: 40px 16px; }
  #done h2 { color: var(--navy-dark); }
  #done p { color: var(--muted); margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jordan&#x27;s ACT English Flashcards</h1>
    <p>Quick-review cards for grammar fundamentals, memory tricks, and commonly confused words.</p>
    <p class="updated">Last updated: August 15, 2026 at 1:26 PM EDT</p>
  </header>

  <div id="setup">
    <div class="card">
      <h2>Choose categories to study</h2>
      <div id="checkboxList"></div>
    </div>
    <div class="quick-btns">
      <button id="selectAllBtn" type="button">Select All</button>
      <button id="selectNoneBtn" type="button">Clear</button>
    </div>
    <div class="shuffle-row">
      <input type="checkbox" id="shuffleChk" checked>
      <label for="shuffleChk">Shuffle card order</label>
    </div>
    <button class="btn-primary" id="startBtn">Start Studying</button>
  </div>

  <div id="study">
    <div class="topbar">
      <span id="counter">1 / 1</span>
      <span class="tag" id="catTag">—</span>
    </div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

    <div class="flip-zone">
      <div class="flip-card" id="flipCard">
        <div class="flip-inner">
          <div class="flip-face front">
            <span class="label">Front</span>
            <div class="front-text" id="frontText"></div>
          </div>
          <div class="flip-face back">
            <span class="label">Back</span>
            <div class="back-text" id="backText"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="flip-hint">Tap the card to flip it</div>

    <div class="nav-row">
      <button id="prevBtn">← Previous</button>
      <button id="nextBtn">Next →</button>
    </div>
    <div class="back-link"><a id="backToSetup">Back to category selection</a></div>
  </div>

  <div id="done">
    <h2>Deck complete 🎉</h2>
    <p id="doneSummary"></p>
    <button class="btn-primary" id="restartBtn">Study Again</button>
  </div>
</div>

<script>
const ALL_CARDS = [{"id": "gb-1", "category": "Grammar Building Blocks", "front": "What is an independent clause?", "back": "A group of words with a subject and a verb that can stand alone as a complete sentence.\n\nExample: \"The rain stopped.\""}, {"id": "gb-2", "category": "Grammar Building Blocks", "front": "What is a dependent clause?", "back": "Has a subject and a verb too, but can't stand alone — it starts with a subordinating conjunction (because, although, when, since, if...) or a relative pronoun (which, that, who) and needs to attach to an independent clause.\n\nExample: \"Because the rain stopped.\""}, {"id": "gb-3", "category": "Grammar Building Blocks", "front": "What is a prepositional phrase?", "back": "Starts with a preposition (in, on, at, by, with, of, from...) and ends with its object; works as an adjective or adverb.\n\nImportant: it never contains the sentence's subject — this is the basis of the subject-verb agreement trick."}, {"id": "gb-4", "category": "Grammar Building Blocks", "front": "What are the 3 ways to connect two independent clauses? Extra credit: what is 1 way not to connect two independent clauses?", "back": "1. Period + capital letter (new sentence): \"The rain stopped. We left.\"\n2. Comma + FANBOYS: \"..., and ...\"\n3. Semicolon: \"...; ...\"\n\nA comma by itself is NOT one of these — that's a comma splice (which is an error)"}, {"id": "gb-5", "category": "Grammar Building Blocks", "front": "What are the 2 ways to connect an independent clause and a dependent clause?", "back": "Dependent clause FIRST → comma after it: \"Although it rained, we left.\"\n\nIndependent clause FIRST → no comma: \"We left although it rained.\""}, {"id": "gb-6", "category": "Grammar Building Blocks", "front": "What does FANBOYS stand for?", "back": "The 7 coordinating conjunctions: For, And, Nor, But, Or, Yet, So.\n\nAny of these can follow a comma to join two independent clauses."}, {"id": "gb-7", "category": "Grammar Building Blocks", "front": "What is a gerund and is it singular or plural?", "back": "A verb form ending in \"-ing\" used as a noun.\n\nExample: \"Running is fun\" — \"Running\" is the gerund, and it's the (singular) subject of the sentence."}, {"id": "gb-8", "category": "Grammar Building Blocks", "front": "What is a dangling modifier and how do you fix it? Give an example.", "back": "A descriptive phrase, usually opening a sentence, that doesn't logically attach to the noun right after it.\n\nExample: \"Walking into the room, the lights were off\" wrongly implies the lights walked in. Fix: \"Walking into the room, I noticed the lights were off.\""}, {"id": "gb-9", "category": "Grammar Building Blocks", "front": "When do you use a colon vs. a semicolon? Give examples.", "back": "Both require a complete independent clause BEFORE them.\n\nColon (:) introduces a list or explanation after that clause. Semicolon (;) joins two closely related independent clauses, or separates items in a list that already has commas.\n\nExample — colon: \"She had one goal: to win the championship.\"\nExample — semicolon: \"The team practiced for months; they were ready for the championship.\""}, {"id": "gb-10", "category": "Grammar Building Blocks", "front": "What are the 6 main uses of a comma?", "back": "1. Items in a series (\"apples, oranges, and bananas\")\n2. Nonessential info — comma on BOTH sides (\"My brother, who lives in Ohio, is visiting.\")\n3. After an introductory word/phrase/clause (\"After the show, we left.\")\n4. Before FANBOYS joining two independent clauses (\"I wanted to go, but I was tired.\")\n5. Between coordinate adjectives (\"a long, difficult exam\")\n6. Direct address, dates, addresses (\"Thanks, Mom, for the ride.\" / \"July 4, 1776, was a big day.\")"}, {"id": "core-1", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Subject-Verb Agreement?", "back": "Find the TRUE subject, crossing out any prepositional phrase or descriptive clause sitting between it and the verb.\n\nTrick: \"Cross out the middleman — words between subject and verb don't count for agreement.\""}, {"id": "core-2", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Pronoun-Antecedent Agreement?", "back": "Trace the pronoun back to the exact noun it replaces (not just the nearest noun) and match number.\n\nTrick: \"Find the noun the pronoun is standing in for, not just whichever noun is closest.\""}, {"id": "core-3", "category": "Core Rules & Tricks", "front": "When do you use a subject pronoun vs. an object pronoun? List examples of both.", "back": "Use subject pronouns (I/he/she/they/who) when the pronoun performs the action, and object pronouns (me/him/her/them/whom) when it receives the action.\n\nExample: \"He gave the book to her\" — \"He\" is the subject pronoun (performs the action), \"her\" is the object pronoun (receives the action).\n\nTrick: \"Say it out loud in the simplest form — your ear usually knows.\""}, {"id": "core-4", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Verb Tense & Form?", "back": "Keep verb tense consistent with the timeline the sentence has already established.\n\nTrick: \"Find the anchor verb nearby and match its timeframe.\"\nTrick 2: \"When did this story actually happen?\" - this should determine which verbs are anchor verbs and which need to be corrected"}, {"id": "core-5", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Comparative/Superlative Form?", "back": "Use the comparative form (-er / more) for exactly two things, superlative (-est / most) for three or more.\n\nTrick: \"Two things = -er, three-plus things = -est.\""}, {"id": "core-6", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Preposition/Idiom Usage?", "back": "Some words pair with a specific, fixed preposition by convention — there's no logical rule, just what's standard.\n\nTrick: \"Read it aloud — the 'wrong' preposition usually sounds off.\""}, {"id": "core-7", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Comma: Nonessential Info?", "back": "Nonessential (extra, could-be-deleted) information needs a comma on BOTH sides, or none at all — never just one.\n\nTrick: \"If you open a comma gate, you must close it.\""}, {"id": "core-8", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Apostrophe: Possessive vs. Contraction?", "back": "\"Its\" = possessive (no apostrophe, like \"his\"); \"it's\" = \"it is\"/\"it has.\" Never use an apostrophe to make a plain noun plural.\n\nTrick: \"Say the long form out loud — if 'it is' doesn't fit, drop the apostrophe.\""}, {"id": "core-9", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Dash/Comma Pairing?", "back": "Punctuation marks that set off a nonessential phrase must match on both ends — two dashes, two commas, or two parentheses, never mixed.\n\nTrick: \"Punctuation bookends must match.\""}, {"id": "core-10", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Colon & Semicolon Usage?", "back": "A colon or semicolon must follow a complete independent clause. A semicolon joins two independent clauses; a colon introduces a list/explanation after a complete sentence.\n\nTrick: \"Before you use : or ; , check that what comes before it could stand alone as its own sentence.\""}, {"id": "core-11", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Unnecessary Punctuation?", "back": "Don't add punctuation just because you'd pause there when speaking — every mark needs a grammatical job.\n\nTrick: \"When in doubt, leave it out.\""}, {"id": "core-12", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Run-on / Comma Splice?", "back": "Find the subject + verb on each side of the punctuation mark. If both sides are complete sentences joined by only a comma (or nothing), it's a run-on — fix with a period, a semicolon, a comma + FANBOYS conjunction, or a subordinating conjunction (when, although, because...).\n\nTrick: \"A comma alone can never glue two complete sentences together.\""}, {"id": "core-13", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Sentence Fragment?", "back": "Check for both a subject AND a working main verb that can stand alone. A clause starting with an -ing word, a \"to + verb,\" or a relative pronoun (which/that/who) with no separate main verb is a fragment.\n\nTrick: \"Cover up everything before the phrase — does what's left form a complete sentence by itself?\""}, {"id": "core-14", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Parallel Structure?", "back": "Every item in a list, series, or comparison must share the same grammatical form (all -ing, all \"to + verb,\" all plain nouns, etc.).\n\nTrick: \"List items should all wear the same outfit — same verb form straight down the list.\""}, {"id": "core-15", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Modifier Placement?", "back": "An introductory or descriptive phrase must be followed immediately by the specific noun it's describing — otherwise it \"dangles\" and attaches to the wrong thing.\n\nTrick: \"Whoever/whatever sits right after the comma must be the one doing the action in the phrase before it.\""}, {"id": "core-16", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Subordination & Clause Structure?", "back": "Identify whether each clause is independent (can stand alone) or dependent (needs another clause).\n\nTrick: \"Ask what job the connector is doing: is it strong enough to legally join two full sentences?\""}, {"id": "core-17", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Word Choice & Precision?", "back": "Ask which word most precisely and literally matches the meaning in context — not which one sounds the most impressive.\n\nTrick: \"Precise beats fancy.\""}, {"id": "core-18", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Style & Tone Consistency?", "back": "Check the formality level the essay has used everywhere else, and reject any choice noticeably more casual OR more elaborate than that baseline.\n\nTrick: \"Match the essay's volume.\""}, {"id": "core-19", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Concision & Redundancy?", "back": "Cut any word or phrase that repeats an idea already stated elsewhere in the sentence.\n\nTrick: \"If you can delete it and the sentence still says the exact same thing, delete it.\""}, {"id": "core-20", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Transitions?", "back": "Identify the actual logical relationship between the two ideas — contrast, cause/effect, addition, or sequence — before picking a transition word.\n\nTrick: \"Name the relationship first, then pick the word that matches it.\""}, {"id": "core-21", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Relevance: Adding/Deleting Sentences?", "back": "Check whether the sentence directly supports the specific topic of THAT paragraph — not just the essay's general subject.\n\nTrick: \"True isn't enough — it has to be relevant to this paragraph's specific job.\""}, {"id": "core-22", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Sentence/Paragraph Placement & Sequence?", "back": "Trace the order the paragraph is already using, and place the new sentence where it keeps that order intact.\n\nTrick: \"Read the sentence before and after your candidate spot — does the new sentence bridge them logically?\""}, {"id": "core-23", "category": "Core Rules & Tricks", "front": "What's the rule (and trick) for Introductions, Conclusions & Purpose?", "back": "Identify the paragraph's (or essay's) main focus first, then choose the option that most directly introduces or wraps up that specific focus.\n\nTrick: \"Ask 'what is this paragraph actually about?' before picking the opening or closing line.\""}, {"id": "hom-1", "category": "Homophones & Confused Words", "front": "What's the difference between \"affect\" and \"effect\"?", "back": "\"Affect\" is (almost always) a verb: to influence something. \"Effect\" is (almost always) a noun: the result. \"The storm will affect travel\" → \"The storm's effect on travel.\""}, {"id": "hom-2", "category": "Homophones & Confused Words", "front": "What's the difference between \"cite,\" \"site,\" and \"sight\"?", "back": "\"Cite\" = to reference/quote as a source. \"Site\" = a location or place. \"Sight\" = the sense of seeing, or something seen."}, {"id": "hom-3", "category": "Homophones & Confused Words", "front": "What's the difference between \"pique,\" \"peek,\" and \"peak\"?", "back": "\"Pique\" = to arouse or provoke (\"piqued my interest\"). \"Peek\" = a quick, brief look. \"Peak\" = the highest point."}, {"id": "hom-4", "category": "Homophones & Confused Words", "front": "What's the difference between \"its\" and \"it's\"?", "back": "\"Its\" = possessive (no apostrophe, like \"his\"). \"It's\" = \"it is\" or \"it has.\" Say the long form out loud — if \"it is\" doesn't fit, drop the apostrophe."}, {"id": "hom-5", "category": "Homophones & Confused Words", "front": "What's the difference between \"their,\" \"there,\" and \"they're\"?", "back": "\"Their\" = possessive (belongs to them). \"There\" = a place, or \"there is/are.\" \"They're\" = \"they are.\""}, {"id": "hom-6", "category": "Homophones & Confused Words", "front": "What's the difference between \"then\" and \"than\"? Use each in a sentence.", "back": "\"Then\" = time/sequence (\"We ate dinner, then watched a movie.\"). \"Than\" = comparison (\"This book is more interesting than that one.\")."}, {"id": "hom-7", "category": "Homophones & Confused Words", "front": "What's the difference between \"who's\" and \"whose\"? What is the trick we can use?", "back": "\"Who's\" = \"who is\" or \"who has.\" \"Whose\" = possessive (\"whose book is this?\"). \n\nTrick: Say the long form out loud — if \"who is\" or \"who has\" fits, use \"who's\" (apostrophe = contraction); otherwise it's the possessive \"whose\" (no apostrophe, like \"his\")."}, {"id": "hom-14", "category": "Homophones & Confused Words", "front": "When do you use who vs. whose vs. whom? Give examples of question and answer pairs.", "back": "who = subject (he/she) note the vowels match\nwhom = object (him/her) note the m's match for the masculine \nwhose = possessive (his/her/their) note the s's match for the masculine\n\nSo if the answer to the question is his or hers then the question must use whose (Whose house is this? It is his.). \nIf the answer to the question is he or she (Who is that over there? It is he. Or another trick is flip it and say 'he is it') then the question must use who. \nIf the answer is 'We send the email to him' then the question must be 'to whom should I send this email')\n\nComplication - for the possessive, while his always works, sometimes we use her (It is her house) and sometimes we use hers (it is hers)"}, {"id": "hom-8", "category": "Homophones & Confused Words", "front": "What's the difference between \"principal\" and \"principle\"?", "back": "\"Principal\" = the head of a school, or main/most important (adjective). \"Principle\" = a fundamental rule or belief."}, {"id": "hom-9", "category": "Homophones & Confused Words", "front": "What's the difference between \"complement\" and \"compliment\"?", "back": "\"Complement\" = something that completes or goes well with another thing. \"Compliment\" = a nice thing said about someone."}, {"id": "hom-10", "category": "Homophones & Confused Words", "front": "What's the difference between \"farther\" and \"further\"?", "back": "\"Farther\" = literal, physical distance (\"farther down the road\"). \"Further\" = figurative extent or degree (\"further discussion\")."}, {"id": "hom-11", "category": "Homophones & Confused Words", "front": "What's the difference between \"fewer\" and \"less\"?", "back": "\"Fewer\" = countable items (\"fewer apples\"). \"Less\" = uncountable amounts (\"less water\")."}, {"id": "hom-12", "category": "Homophones & Confused Words", "front": "What's the difference between \"accept\" and \"except\"?", "back": "\"Accept\" = to agree to receive or take (verb). \"Except\" = excluding, other than (\"everyone except him\")."}, {"id": "hom-13", "category": "Homophones & Confused Words", "front": "What's the difference between \"allusion\" and \"illusion\"?", "back": "\"Allusion\" = an indirect reference to something. \"Illusion\" = a false or misleading impression of reality."}, {"id": "tr-1", "category": "Transitions by Relationship", "front": "Which transition words signal CONTRAST? \n\nWhy would you use them? Give examples.", "back": "however, nevertheless, on the other hand, yet, in contrast, still, although.\n\nUse when the two ideas would surprise or oppose each other.\n\nExample: \"The forecast called for rain; however, the skies stayed clear all day.\""}, {"id": "tr-2", "category": "Transitions by Relationship", "front": "Which transition words signal CAUSE / EFFECT?\n\nWhy would you use them? Give examples.", "back": "therefore, consequently, as a result, thus, so.\n\nUse when the second idea logically follows from — is caused by — the first.\n\nExample: \"She missed the deadline; consequently, her proposal wasn't considered.\""}, {"id": "tr-3", "category": "Transitions by Relationship", "front": "Which transition words signal ADDITION?\n\nWhy would you use them? Give examples.", "back": "moreover, furthermore, in addition, additionally, also.\n\nUse when both ideas support the same point — don't use these if the second idea contrasts.\n\nExample: \"The museum added a new wing; moreover, it extended its weekend hours.\""}, {"id": "tr-4", "category": "Transitions by Relationship", "front": "Which transition words signal SEQUENCE / TIME?\n\nWhy would you use them? Give examples.", "back": "subsequently, meanwhile, first/next/finally, afterward, eventually.\n\nUse when the relationship is about WHEN something happens relative to something else, not why or how it contrasts.\n\nExample: \"The team finished the prototype; subsequently, they began testing it.\""}, {"id": "idm-1", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"capable\"?", "back": "OF — \"capable of leading the team.\""}, {"id": "idm-2", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"comply\"?", "back": "WITH — \"comply with the new regulations.\""}, {"id": "idm-3", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"different\"?", "back": "FROM — \"different from the original plan.\" (Not \"different than\" on the ACT.)"}, {"id": "idm-4", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"in contrast\"?", "back": "TO — \"in contrast to last year's results.\""}, {"id": "idm-5", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"responsible\"?", "back": "FOR — \"responsible for the budget.\""}, {"id": "idm-6", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"consist\"?", "back": "OF — \"the team consists of five members.\""}, {"id": "idm-7", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"insight\"?", "back": "INTO — \"gave insight into the problem.\""}, {"id": "idm-8", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"interested\"?", "back": "IN — \"interested in the results.\""}, {"id": "idm-9", "category": "Idiom/Preposition Pairs", "front": "What preposition follows \"prohibited\" (from doing something)?", "back": "FROM — \"prohibited from entering the building.\""}, {"id": "ne-1", "category": "Nonessential Info Punctuation", "front": "What are the 3 ways to punctuate nonessential information?", "back": "Commas, dashes, or parentheses — but the bookends must match on both ends (comma...comma, dash...dash, paren...paren — never mixed).\n\nDashes become the necessary choice only when the interior phrase itself already contains commas; otherwise commas and parentheses work just as well."}, {"id": "ne-2", "category": "Nonessential Info Punctuation", "front": "What is an appositive and what are the two types?", "back": "A noun phrase that renames or identifies the noun right next to it.\n\nExample: \"My brother, a doctor, lives in Ohio\" — \"a doctor\" is the appositive. There are two types: essential and non-essential. If it's extra/nonessential, set it off with punctuation; if it's essential to knowing which noun you mean, no punctuation at all. \"My brother the doctor lives in Ohio.\" In this case there may be more than one brother and specifying the doctor is essential"}, {"id": "ne-3", "category": "Nonessential Info Punctuation", "front": "What do we do with non-essential appositives (assuming they're not explicitly part of the question)?", "back": "Cross them out!!!"}, {"id": "ne-4", "category": "Nonessential Info Punctuation", "front": "How do we punctuate non-essential appositives?", "back": "most likely commas, but dashes and parenthesis also work"}, {"id": "ne-5", "category": "Nonessential Info Punctuation", "front": "What do we do with prepositional phrases (assuming they're not explicitly part of the question)?", "back": "Cross them out!!!"}, {"id": "sva-1", "category": "SVA Trap Examples", "front": "\"Restoring vintage automobiles from the 1950s ___ patience.\" — requires or require?", "back": "requires.\n\nThe whole gerund phrase \"Restoring vintage automobiles from the 1950s\" is the subject and is always treated as SINGULAR, no matter how many nouns are inside the phrase."}, {"id": "sva-2", "category": "SVA Trap Examples", "front": "\"The barricades, underpasses, and bridge ___ the city millions each year.\" — save or saves?", "back": "save.\n\nThree items joined by \"and\" form a compound subject, which is always PLURAL, no matter how long the list gets."}, {"id": "sva-3", "category": "SVA Trap Examples", "front": "\"The networks that ___ on roots which ___ underground ___ common in this forest.\" — rely/relies, spread/spreads, is/are?", "back": "rely...spread...are.\n\nCheck EACH clause's own subject separately — a relative clause buried inside the sentence has its own subject-verb pair to verify, independent of the main clause."}, {"id": "sva-4", "category": "SVA Trap Examples", "front": "\"The head coach, along with all three of her assistant coaches, ___ scheduled to attend the tournament.\" — is or are?", "back": "is.\n\nPhrases like \"along with,\" \"as well as,\" \"in addition to,\" and \"together with\" are prepositional phrases, not part of the subject — they don't create a compound subject the way \"and\" does. The true subject is still just \"The head coach\" (singular), no matter how many people the along-with phrase adds."}, {"id": "sva-5", "category": "SVA Trap Examples", "front": "\"Neither the assistant coaches nor the head coach ___ willing to change the starting lineup this late in the season.\" — is or are?", "back": "is.\n\nWith neither/nor (and either/or), the verb agrees with whichever subject is CLOSER to it — not with whichever one sounds more natural, and not with whichever is plural. Here \"the head coach\" (singular) sits right before the verb, so the verb is singular, even though \"the assistant coaches\" earlier in the sentence is plural."}, {"id": "sva-6", "category": "SVA Trap Examples", "front": "\"Each of the seniors who applied to highly selective universities this year ___ required to submit at least two letters of recommendation.\" — was or were?", "back": "was.\n\n\"Each,\" \"every,\" \"either,\" \"neither,\" \"anybody,\" \"everybody,\" \"nobody,\" and similar indefinite pronouns are always SINGULAR, no matter how many people or things follow in a prepositional phrase or relative clause after them. \"Of the seniors who applied...\" just describes which \"each\" — it doesn't change the verb."}, {"id": "sva-7", "category": "SVA Trap Examples", "front": "\"Both of the interns who presented at the conference last week ___ offered full-time positions immediately afterward.\" — was or were?", "back": "were.\n\nUnlike \"each\"/\"every\"/\"either\"/\"neither\" (always singular), a handful of indefinite pronouns — \"both,\" \"few,\" \"many,\" \"several\" — are always PLURAL. Same trick as sva-6, opposite answer: know which pronouns fall on which side."}, {"id": "sva-8", "category": "SVA Trap Examples", "front": "\"There ___, tucked away in the back corner of the archive, several first-edition manuscripts and a hand-drawn map dating to the 1700s.\" — was or were?", "back": "were.\n\nIn a \"there is/are\" sentence, \"there\" is NOT the subject — it's just a placeholder. The real subject comes AFTER the verb (here: \"several first-edition manuscripts and a hand-drawn map\"), so the verb has to agree with that, not with \"there\" itself. Trick: mentally flip the sentence around — \"several manuscripts and a map were tucked away...\" — and the correct verb becomes obvious."}, {"id": "sva-9", "category": "SVA Trap Examples", "front": "\"The number of applicants who ___ the minimum GPA requirement for the scholarship ___ grown every year since the program's founding.\" — meet/meets, has/have?", "back": "meet...has.\n\nTwo separate agreement calls in one sentence: (1) \"applicants who meet...\" — the relative clause's own subject is \"applicants\" (plural), so \"meet.\" (2) \"The number...has grown\" — \"The number of X\" is always treated as SINGULAR (it's the number, one thing, that's growing), so \"has.\" Compare to \"A number of applicants have met...\" — with \"A number of,\" the subject really is the applicants (plural)."}, {"id": "sva-10", "category": "SVA Trap Examples", "front": "\"The most memorable part of the entire five-hour tour ___ the hand-painted murals covering every wall of the cathedral's ceiling.\" — was or were?", "back": "was.\n\nThe verb agrees with the actual SUBJECT (\"the most memorable part\" — singular), not with the plural noun sitting on the other side of the verb (\"murals\"). Don't let whatever's closest to the verb decide the answer — trace back to what the sentence is actually about."}, {"id": "sva-11", "category": "SVA Trap Examples", "front": "\"Either the museum's rotating exhibits or its small, easily overlooked collection of Renaissance sculpture ___ likely responsible for last quarter's surge in ticket sales.\" — is or are?", "back": "is.\n\nSame either/or proximity rule as sva-5: the verb agrees with whichever subject sits closest to it. Here that's \"its...collection\" (singular), even though \"the museum's rotating exhibits\" earlier in the sentence is plural. If the order were flipped — \"Either its collection...or the museum's rotating exhibits ___\" — the answer would flip to \"are.\""}, {"id": "sva-12", "category": "SVA Trap Examples", "front": "\"The Canterbury Tales, along with dozens of other medieval manuscripts housed in the same collection, ___ currently being digitized by the university library.\" — is or are?", "back": "is.\n\nTwo traps stacked together: (1) titles of single works — even ones that look plural, like The Canterbury Tales — are treated as ONE singular thing. (2) \"along with...\" is a prepositional phrase, not a second subject joined by \"and\" (same trick as sva-4) — so it doesn't make the subject plural either. Both traps point to the same singular answer."}, {"id": "sva-13", "category": "SVA Trap Examples", "front": "\"Every one of the recommendations that the committee, after nearly six months of deliberation, ultimately ___ to the board for a final vote ___ met with unanimous approval.\" — submitted/submits, was/were?", "back": "submitted...was.\n\nA long sentence, but broken into pieces it's the same two moves as sva-9: (1) inside the relative clause, \"the committee...submitted\" — \"committee\" acts as one singular unit here, and the interrupting \"after nearly six months of deliberation\" doesn't change that. (2) The MAIN clause's real subject is \"Every one\" (not \"recommendations\" and not \"committee\") — and \"every one\" is always singular — so the main verb is \"was,\" not \"were,\" no matter how many plural nouns and how much distance sit in between."}, {"id": "sva-14", "category": "SVA Trap Examples", "front": "Which indefinite pronouns are ALWAYS singular, no matter what noun or phrase follows them?", "back": "everyone, everybody, everything, someone, somebody, something, anyone, anybody, anything, no one, nobody, nothing, each, either, neither, one.\n\nTrick: these often have a plural noun sitting right next to them (\"Everyone in the stands ___\") — don't match that nearby noun. The pronoun itself decides the verb, and it's always singular."}, {"id": "sva-15", "category": "SVA Trap Examples", "front": "Which indefinite pronouns are ALWAYS plural?", "back": "both, few, many, several, others.\n\nTrick: same idea as the always-singular list, just the opposite answer — these never take a singular verb, regardless of what follows them."}, {"id": "sva-16", "category": "SVA Trap Examples", "front": "Which pronouns change number depending on the noun that follows them (\"some/any/none/all/most\")? How do you decide singular or plural?", "back": "some, any, none, all, most, more — sometimes called the \"SANAM\" pronouns.\n\nThese have NO fixed number of their own — look at the noun in the \"of ___\" phrase that follows: if it's plural/countable, the verb is plural; if it's singular/uncountable, the verb is singular.\n\nExample: \"Some of the cake is gone\" (cake = singular/uncountable) vs. \"Some of the cookies are gone\" (cookies = plural).\n\nBiggest myth: \"none\" is NOT always singular just because it sounds like \"not one\" — it follows the same of-phrase rule as the others."}, {"id": "sva-17", "category": "SVA Trap Examples", "front": "\"None of the volunteers who signed up for the overnight shift ___ aware of how cold the warehouse gets after midnight.\" — was or were?", "back": "were.\n\n\"None\" takes its number from the noun after \"of\" — here that's \"volunteers\" (plural), so the verb is plural. Don't fall for the myth that \"none\" always means \"not one\" and is therefore always singular."}, {"id": "sva-18", "category": "SVA Trap Examples", "front": "\"Some of the paperwork required for the merger ___ still missing signatures.\" — is or are?", "back": "is.\n\nSame SANAM rule, opposite result: \"paperwork\" (the noun after \"of\") is uncountable/singular, so \"some\" takes a singular verb here — even though the exact same word \"some\" was plural in the volunteers example."}, {"id": "sva-19", "category": "SVA Trap Examples", "front": "\"All of the advice her mentor gave her before the interview ___ genuinely useful, unlike most generic career tips.\" — was or were?", "back": "was.\n\nSame SANAM rule again: \"advice\" (the noun after \"of\") is uncountable/singular, so \"all\" takes a singular verb here. Compare: \"All of the tips he gave her were genuinely useful\" — \"tips\" is countable/plural, so \"all\" would take \"were\" instead. Same pronoun, the noun after \"of\" decides everything."}, {"id": "sva-20", "category": "SVA Trap Examples", "front": "\"Each of the finalists ___ nervous backstage, even though several of the judges ___ already whispering about who their favorite was.\" — was/were, was/were?", "back": "was...were.\n\nTwo different indefinite pronouns in the same sentence, opposite fixed numbers: \"each\" is always singular (\"was\"), \"several\" is always plural (\"were\") — regardless of what follows either one. Don't let the sentence's length or the second clause's plural verb bleed into your answer for the first clause."}, {"id": "sva-21", "category": "SVA Trap Examples", "front": "Which of these nouns are actually PLURAL, even though they don't end in an obvious \"s\" and often get treated as singular in casual speech: data, media, criteria, phenomena, alumni?", "back": "All five — they're the plural forms of Latin/Greek singular nouns (datum, medium, criterion, phenomenon, alumnus).\n\nOn the ACT, treat them as plural: \"The data are conclusive,\" \"The criteria are clear,\" not \"is.\" (In everyday speech \"data is\" has become common, but the ACT still tests the traditional plural agreement.)"}, {"id": "sva-22", "category": "SVA Trap Examples", "front": "Are \"mathematics,\" \"economics,\" and \"statistics\" singular or plural when they name the SUBJECT itself (not a set of figures)?", "back": "Singular — \"Mathematics is my favorite subject,\" \"Economics was a difficult class.\"\n\nThey look plural (end in -s) but name ONE field of study. Careful: \"statistics\" flips to plural when it means actual data/figures rather than the subject — \"The statistics show a clear trend\" (are, not is)."}, {"id": "dh-1", "category": "Dashes & Hyphens", "front": "When do we use em dashes?", "back": "(1) To set-off non-essential information (on both sides of the clause, exactly like a comma)\n\n(2) To introduce a list or explanation after an independent clause (exactly like a colon)\n\n(3) To create dramatic pause in an otherwise-complete sentence"}, {"id": "dh-2", "category": "Dashes & Hyphens", "front": "When do we use hyphens? And when do we not use hyphens?", "back": "Hyphenate when two or more words (modifiers) work together to modify a noun and are immediately before it. \n\nexamples: \na high-speed chase\na well-known author\n\nBut no hyphen when the adjective comes after the noun:\nThe chase was at high speed.\nThe child is ten years old\n\nAlso no hyphen following -ly words (the -ly word itself signals it's an adverb, not part of a hyphenated compound):\nhighly-trained student (incorrect) → a highly trained student (correct)\na properly-ordered timeline (incorrect) → a properly ordered timeline (correct)\n\nif more than two modifiers work together, hypenate everything:\na ten-year-old child\nbut if they're two separate modifiers, you place a comma inbetween:\na well-trained, highly motivated workforce\n\nFinally, some compound nouns have hyphens like:\nmother-in-law"}, {"id": "dh-3", "category": "Dashes & Hyphens", "front": "Which of these is correct: \n\n(1) a well-written essay\n\n(2) The essay is well written.\n\n(3) a highly trained, well-prepared team\n\n(4) a highly trained team\n\n(5) a ten-page, single-spaced essay\n\n", "back": "THEY ALL ARE"}, {"id": "dh-4", "category": "Dashes & Hyphens", "front": "Which of these is correct: \n\n(1) a fun, college-level course\n\n(2) a fun-college-level course\n\n(3) a highly trained, well prepared, team\n\n(4) a ten-page, single-spaced essay\n\n", "back": "(1) AND (4)"}, {"id": "dh-5", "category": "Dashes & Hyphens", "front": "Which compound types use hyphens?", "back": "Compound Type\tHyphen?\tExample\nAdjective before noun\tYes\twell-known actor\nAdjective after noun\tNo\tThe actor is well known.\nCompound noun\tSometimes\tmother-in-law, ice cream, baseball\nNumbers\tYes\ttwenty-one\nFractions\tYes\tone-third\nPrefixes\tDepends\tex-president, anti-imperial\n-ly adverb + adjective\tNo\thighly trained"}, {"id": "ppt-1", "category": "Participles & Perfect Tenses", "front": "What is a past participle, and how is it different from the simple past tense?", "back": "The past participle is the verb form used together with a helping verb — \"have/has/had\" (perfect tenses) or \"be\" (passive voice). For regular verbs it looks identical to the simple past (-ed), but many common verbs have a different, irregular form.\n\nExample: \"I wrote the essay\" (simple past, no helper needed) vs. \"I have written the essay\" (past participle, needs \"have\").\n\nIrregular examples: broke → broken, went → gone, saw → seen, ate → eaten, did → done, began → begun."}, {"id": "ppt-2", "category": "Participles & Perfect Tenses", "front": "What is a participial phrase, and what's the trap to watch for?", "back": "A phrase that starts with a participle (present participle -ing, or past participle -ed/irregular form) and works as an ADJECTIVE describing a noun — it is never the sentence's main verb.\n\nExample: \"Exhausted by the long hike, the campers set up their tents early.\" — \"Exhausted by the long hike\" describes \"campers.\"\n\nTrap: same rule as any modifier (see gb-8) — it must sit right next to the noun it's describing, or it dangles and attaches to the wrong thing."}, {"id": "ppt-3", "category": "Participles & Perfect Tenses", "front": "Which is correct?\n\n(1) Written in only three weeks, critics praised the novel.\n\n(2) Written in only three weeks, the novel earned wide critical praise.", "back": "(2) is correct.\n\n\"Written in only three weeks\" describes the novel, not the critics — sentence (1) wrongly implies the critics were written in three weeks. This is a dangling participial-phrase trap, the same family as gb-8's dangling modifier."}, {"id": "ppt-4", "category": "Participles & Perfect Tenses", "front": "What's the rule (and trick) for the past perfect tense? How do you form it?", "back": "Form: \"had\" + past participle.\n\nUse it for an action that was already completed BEFORE another past action or point in time — it marks the earlier of two past events (\"a past before the past\").\n\nExample: \"By the time the movie started, we had already eaten dinner.\" — eating happened first, both events are in the past.\n\nTrick: \"Two past events? The earlier one gets 'had.'\""}, {"id": "ppt-5", "category": "Participles & Perfect Tenses", "front": "What's the rule (and trick) for the present perfect tense? How do you form it?", "back": "Form: \"have/has\" + past participle.\n\nUse it for an action that started in the past but connects to NOW — it's still true, still happening, or its effect still matters, or it happened at an unspecified past time.\n\nExamples: \"She has lived in Chicago for ten years\" (still living there). \"I have read that book\" (unspecified past time, relevant now).\n\nTrick: \"One timeline reaching into the present = 'have/has.'\""}, {"id": "ppt-6", "category": "Participles & Perfect Tenses", "front": "What's the trick for telling past perfect apart from present perfect?", "back": "Ask: is there a SECOND, later past event in the sentence that this action needs to happen before?\n\nIf yes — two past events, one clearly earlier — the earlier one is past perfect (\"had + participle\") and the later one is simple past.\n\nIf there's only ONE timeframe being discussed, and it started in the past but still connects to now — that's present perfect (\"have/has + participle\").\n\nTrick: \"Two pasts, pick the older one for 'had.' One timeline reaching into now = 'have/has.'\""}, {"id": "ppt-7", "category": "Participles & Perfect Tenses", "front": "\"By the time Jordan arrived at the theater, the movie ___ already ___.\" — had started or has started?", "back": "had started.\n\nTwo past events are being compared (Jordan's arrival, the movie starting), and the movie starting happened FIRST — the classic past-perfect setup: the earlier of two past actions.\n\nContrast: \"Jordan ___ already seen that movie twice\" — no second past-tense anchor event, just a fact true up to now → has seen (present perfect)."}, {"id": "sps-1", "category": "Sentence Placement & Sequencing", "front": "What clues do you hunt for on a sentence-placement/sequencing question?", "back": "Four things to check, in order:\n\n1. Pronouns & demonstratives (\"it,\" \"this,\" \"these,\" \"such,\" \"that\") — whatever they refer to must already have been introduced in an earlier sentence. If a sentence starts with \"This discovery...\" but nothing before it has mentioned a discovery yet, that sentence can't go first.\n\n2. Transition/sequence words (\"First,\" \"Next,\" \"Then,\" \"Meanwhile,\" \"As a result,\" \"In addition\") — these announce the sentence's relationship to its neighbor. A sentence starting \"As a result\" needs a cause sitting directly before it.\n\n3. Chronological or logical order — dates, ages, steps in a process, cause before effect. Don't place an effect before its cause even if no transition word flags it.\n\n4. New info vs. old info (the \"the\" test) — a noun getting introduced for the first time usually needs \"a/an\" (or a full name); once it's already been mentioned, later sentences refer to it with \"the\" or a pronoun. A sentence that says \"the machine\" before any sentence has introduced \"a machine\" is out of order.\n\nTrick: \"Read the candidate sentence's first few words — do they lean on something that has to already exist earlier in the paragraph?\""}, {"id": "sps-2", "category": "Sentence Placement & Sequencing", "front": "Where does this sentence belong? \"This unexpected result led the team to redesign the entire experiment.\" — right after a sentence that (A) describes the team building their equipment, or (B) describes a surprising outcome from their first trial run?", "back": "(B).\n\n\"This unexpected result\" is a demonstrative pointing backward — it needs a specific surprising result already on the page to point to. Sentence (A) never mentions a result at all, so \"this\" would have nothing to refer to."}, {"id": "sps-3", "category": "Sentence Placement & Sequencing", "front": "A sentence begins \"Consequently, ticket sales rose 40% the following month.\" What MUST the sentence right before it contain?", "back": "A cause — some specific change or event that would plausibly make ticket sales rise.\n\n\"Consequently\" promises a cause-effect link to the sentence right before it, not just \"somewhere earlier in the paragraph.\" If the prior sentence doesn't contain a plausible cause, this isn't the right spot even if the topic is related."}, {"id": "sps-4", "category": "Sentence Placement & Sequencing", "front": "Which comes first: \"Researchers studied the coral reef's recovery after the bleaching event.\" or \"A team of marine biologists spent three years monitoring a coral reef in the South Pacific.\"?", "back": "The second one.\n\nIt introduces the team (\"A team of marine biologists\") and the reef (\"a coral reef\") for the first time with \"a.\" The first sentence uses \"the coral reef's\" and \"the bleaching event\" as if already known — those need to have been introduced already, so it comes after."}];
const CATEGORIES = ["Grammar Building Blocks", "Core Rules & Tricks", "Homophones & Confused Words", "Transitions by Relationship", "Idiom/Preposition Pairs", "Nonessential Info Punctuation", "SVA Trap Examples", "Dashes & Hyphens", "Participles & Perfect Tenses", "Sentence Placement & Sequencing"];

let deck = [];
let idx = 0;
let flipped = false;

function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

// Card backs that are tab-separated rows (one header row + data rows) render
// as a real HTML table instead of raw whitespace, since tabs don't line up
// into columns reliably with a proportional font. Plain-text backs (the vast
// majority of cards) still render as plain wrapped text via textContent.
function isTableBack(text) {
  return typeof text === 'string' && text.includes('\t');
}

function renderBack(text) {
  const backEl = $('backText');
  if (!isTableBack(text)) {
    backEl.innerHTML = '';
    backEl.textContent = text;
    return;
  }
  const rows = text.split('\n').filter(r => r.length > 0).map(r => r.split('\t'));
  const [headerRow, ...dataRows] = rows;
  let html = '<table><thead><tr>';
  headerRow.forEach(cell => { html += `<th>${escapeHtml(cell.trim())}</th>`; });
  html += '</tr></thead><tbody>';
  dataRows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => { html += `<td>${escapeHtml(cell.trim())}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  backEl.innerHTML = html;
}

function renderCheckboxes() {
  const list = $('checkboxList');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = ALL_CARDS.filter(c => c.category === cat).length;
    const label = document.createElement('label');
    label.className = 'chk';
    label.innerHTML = `<input type="checkbox" value="${cat}" checked> <span>${cat}</span> <span class="cnt">${count} cards</span>`;
    list.appendChild(label);
  });
}

function getSelectedCategories() {
  return Array.from(document.querySelectorAll('#checkboxList input:checked')).map(el => el.value);
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startStudying() {
  const selected = getSelectedCategories();
  let pool = ALL_CARDS.filter(c => selected.includes(c.category));
  if ($('shuffleChk').checked) pool = shuffleArray(pool);
  deck = pool;
  idx = 0;
  flipped = false;
  if (deck.length === 0) return;
  $('setup').style.display = 'none';
  $('done').style.display = 'none';
  $('study').style.display = 'block';
  renderCard();
}

function renderCard() {
  const c = deck[idx];
  $('flipCard').classList.remove('flipped');
  flipped = false;
  $('frontText').textContent = c.front;
  renderBack(c.back);
  $('catTag').textContent = c.category;
  $('counter').textContent = `${idx + 1} / ${deck.length}`;
  $('progressFill').style.width = `${((idx + 1) / deck.length) * 100}%`;
  $('prevBtn').disabled = idx === 0;
  $('nextBtn').textContent = idx === deck.length - 1 ? 'Finish' : 'Next →';
}

function goNext() {
  if (idx < deck.length - 1) {
    idx++;
    renderCard();
  } else {
    $('study').style.display = 'none';
    $('doneSummary').textContent = `You went through ${deck.length} card${deck.length === 1 ? '' : 's'}.`;
    $('done').style.display = 'block';
  }
}

function goPrev() {
  if (idx > 0) {
    idx--;
    renderCard();
  }
}

renderCheckboxes();

$('selectAllBtn').addEventListener('click', () => {
  document.querySelectorAll('#checkboxList input').forEach(el => el.checked = true);
});
$('selectNoneBtn').addEventListener('click', () => {
  document.querySelectorAll('#checkboxList input').forEach(el => el.checked = false);
});
$('startBtn').addEventListener('click', startStudying);
$('flipCard').addEventListener('click', () => {
  flipped = !flipped;
  $('flipCard').classList.toggle('flipped', flipped);
});
$('nextBtn').addEventListener('click', goNext);
$('prevBtn').addEventListener('click', goPrev);
$('backToSetup').addEventListener('click', () => {
  $('study').style.display = 'none';
  $('done').style.display = 'none';
  $('setup').style.display = 'block';
});
$('restartBtn').addEventListener('click', () => {
  $('done').style.display = 'none';
  $('setup').style.display = 'block';
});
</script>
</body>
</html>
